      var chip=document.createElement('span'); chip.className='chip';
      var t=document.createElement('span'); t.textContent=(a.texto?'📄 ':'🖼 ')+a.name;
      var x=document.createElement('button'); x.type='button'; x.textContent='✕'; x.title='Quitar';
      x.onclick=function(){ adjuntos.splice(i,1); pintarAdjuntos(); };
      chip.appendChild(t); chip.appendChild(x); c.appendChild(chip);
    });
  }
  async function agregarArchivos(lista){
    for(var i=0;i<lista.length;i++){
      if(adjuntos.length>=4){ toast('Máximo 4 archivos por mensaje'); break; }
      try{
        var a=await aiLeerArchivo(lista[i]);
        if(a) adjuntos.push(a); else toast('"'+lista[i].name+'" venía vacío');
      }catch(e){ toast(e.message||'No pude leer ese archivo'); }
    }
    pintarAdjuntos();
  }

  function enviar(texto){
    var t=String(texto||'').trim();
    if((!t && !adjuntos.length) || busy) return;
    if(!t) t='Revisa estos archivos y dime qué son y qué datos sirven para la ficha.';
    $('asIn').value='';
    var envio=adjuntos.slice(); adjuntos=[]; pintarAdjuntos();
    burbuja('user', t+(envio.length?('\n📎 '+envio.map(function(a){return a.name;}).join(', ')):''));
    msgs.push({role:'user', content:t+(envio.length?('\n(se adjuntaron: '+envio.map(function(a){return a.name;}).join(', ')+')'):'')});
    busy=true;
    var esperando=pensando();
    fetch('/api/ficha-asistente',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ messages: msgs.slice(-14), ficha: fichaResumen(), files: envio })
    }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, status:r.status, j:j}; }); })
      .then(function(res){
        esperando.remove();
        if(!res.ok || res.j.error){
          burbuja('bot', res.j.error || ('No pude responder (error '+res.status+').'), true);
        } else {
          burbuja('bot', res.j.text);
          msgs.push({role:'assistant', content:String(res.j.text||'')});
        }
      })
      .catch(function(){ esperando.remove(); burbuja('bot','No pude conectar con el asesor. Revisa tu conexión.', true); })
      .then(function(){ busy=false; });
  }

  /* Micrófono: se le habla y se manda solo lo que dictó. */
  function escuchar(){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ toast('Este navegador no permite dictar por voz'); return; }
    if(oyendo){ try{ rec.stop(); }catch(e){} return; }
    try{
      rec = new SR();
      rec.lang='es-CL'; rec.interimResults=true; rec.continuous=false;
      var final='';
      rec.onresult=function(ev){
        var parcial='';
        for(var i=ev.resultIndex;i<ev.results.length;i++){
          var tr=ev.results[i][0].transcript;
          if(ev.results[i].isFinal) final+=tr; else parcial+=tr;
        }
        $('asIn').value=(final+' '+parcial).trim();
      };
      rec.onerror=function(){ oyendo=false; $('asMic').classList.remove('on'); toast('No pude escucharte'); };
      rec.onend=function(){
        oyendo=false; $('asMic').classList.remove('on');
        if(final.trim()) enviar(final.trim());
      };
      oyendo=true; $('asMic').classList.add('on'); rec.start();
    }catch(e){ oyendo=false; $('asMic').classList.remove('on'); }
  }

  function abrir(){
    var p=$('asPanel');
    p.classList.toggle('open');
    if(p.classList.contains('open')){
      if(!$('asMsgs').children.length){
        burbuja('bot','¡Hola! 👋 Soy el asesor de New Arriendos. Te ayudo a llenar la ficha, te explico qué significa cada cosa (CIP, avalúo fiscal, contribuciones, dominio vigente…) y te asesoro sobre arriendo o venta. ¿Qué necesitas?');
        pintarSugerencias();
      }
      setTimeout(function(){ $('asIn').focus(); }, 120);
    }
  }

  /* El ícono del asesor tapaba la flecha de "volver arriba". En vez de dejarlo
     fijo en otro rincón —donde tarde o temprano vuelve a estorbar—, se
     arrastra con el dedo a cualquier parte de la pantalla, como los widgets
     del teléfono, y se acuerda de dónde quedó. */
  var MARGEN=8;
  function hacerArrastrable(el, clave){
    var g={activo:false,movio:false,dx:0,dy:0,bloquear:false};
    function colocar(x,y){
      var cx=Math.max(MARGEN, Math.min(window.innerWidth-el.offsetWidth-MARGEN, x));
      var cy=Math.max(MARGEN, Math.min(window.innerHeight-el.offsetHeight-MARGEN, y));
      el.style.left=cx+'px'; el.style.top=cy+'px'; el.style.right='auto'; el.style.bottom='auto';
      return {x:cx,y:cy};
    }
    function guardar(p){ try{ localStorage.setItem(clave, JSON.stringify(p)); }catch(e){} }
    try{
      var p=JSON.parse(localStorage.getItem(clave)||'null');
      if(p && typeof p.x==='number' && typeof p.y==='number') colocar(p.x,p.y);
    }catch(e){}
    function punto(e){ return (e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e; }
    function empezar(e){
      var q=punto(e), r=el.getBoundingClientRect();
      g.activo=true; g.movio=false; g.dx=q.clientX-r.left; g.dy=q.clientY-r.top;
      document.addEventListener('touchmove',mover,{passive:false});
      document.addEventListener('mousemove',mover);
      document.addEventListener('touchend',soltar); document.addEventListener('touchcancel',soltar);
      document.addEventListener('mouseup',soltar);
    }
    function mover(e){
      if(!g.activo) return;
      var q=punto(e), x=q.clientX-g.dx, y=q.clientY-g.dy;
      if(!g.movio){
        var r=el.getBoundingClientRect();
        if(Math.abs(x-r.left)<5 && Math.abs(y-r.top)<5) return; // todavía es un toque
        g.movio=true; el.classList.add('moviendo');
        try{ navigator.vibrate&&navigator.vibrate(12); }catch(_e){}
      }
      if(e.cancelable) e.preventDefault();
      colocar(x,y);
    }
    function soltar(){
      if(!g.activo) return;
      g.activo=false;
      document.removeEventListener('touchmove',mover);
      document.removeEventListener('mousemove',mover);
      document.removeEventListener('touchend',soltar); document.removeEventListener('touchcancel',soltar);
      document.removeEventListener('mouseup',soltar);
      el.classList.remove('moviendo');
      if(g.movio){
        var r=el.getBoundingClientRect();
        guardar({x:r.left,y:r.top});
        // El clic que llega después de arrastrar no debe abrir el panel.
        g.bloquear=true; setTimeout(function(){ g.bloquear=false; },500);
      }
    }
    el.addEventListener('touchstart',empezar,{passive:true});
    el.addEventListener('mousedown',function(e){ if(e.button===0) empezar(e); });
    el.addEventListener('click',function(e){ if(g.bloquear){ g.bloquear=false; e.preventDefault(); e.stopPropagation(); } },true);
    window.addEventListener('resize',function(){
      if(!el.style.left) return;
      var r=el.getBoundingClientRect(); guardar(colocar(r.left,r.top));
    });
  }

  function montar(){
    var fab=$('asFab'); if(!fab) return;
    fab.onclick=abrir;
    hacerArrastrable(fab,'ficha_fab_pos');
    $('asCerrar').onclick=function(){ $('asPanel').classList.remove('open'); };
    $('asSend').onclick=function(){ enviar($('asIn').value); };
    $('asMic').onclick=escuchar;
    $('asClip').addEventListener('change', function(e){
      var fs=Array.prototype.slice.call(e.target.files||[]); e.target.value='';
      if(fs.length) agregarArchivos(fs);
    });
    if(!(window.SpeechRecognition||window.webkitSpeechRecognition)) $('asMic').style.display='none';
    $('asIn').addEventListener('keydown', function(e){
      if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); enviar($('asIn').value); }
    });
  }
  // Si el documento ya terminó de cargar, se monta al tiro.
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', montar);
  else montar();
})();
</script>
