<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha de Levantamiento de Propiedad — Formulario</title>
<style>
  :root{
    --navy:#1F3A5C; --navy-dark:#152A44; --navy-light:#2E4F78;
    --bg:#F4F6F9; --card:#FFFFFF; --border:#DDE3EA; --border-light:#EAEEF3;
    --text:#20293A; --text-muted:#6B7280; --text-faint:#9AA1AB;
    --accent-fill:#E9EFF6; --ok:#2E7D46; --ok-bg:#E8F5EC;
    --danger:#B3261E; --danger-bg:#FBEAE9;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); font-size:14.5px; line-height:1.45;
  }
  #topbar{
    position:sticky; top:0; z-index:50; background:var(--navy); color:#fff;
    padding:10px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  #topbar h1{font-size:15px; margin:0; font-weight:700; letter-spacing:.2px; flex:1 1 auto; min-width:180px;}
  #progressWrap{display:flex; align-items:center; gap:8px; font-size:12px; color:#DCE6F1;}
  #progressBarOuter{width:120px; height:7px; background:rgba(255,255,255,.25); border-radius:4px; overflow:hidden;}
  #progressBarInner{height:100%; width:0%; background:#7FD79A; transition:width .25s ease;}
  #mobileNavWrap{display:none; padding:8px 12px; background:#fff; border-bottom:1px solid var(--border); position:sticky; top:48px; z-index:40;}
  #mobileNavSelect{width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--border); font-size:13.5px; background:#fff;}
  #layout{display:flex; align-items:flex-start; max-width:1180px; margin:0 auto;}
  #sidebar{
    width:270px; flex:0 0 270px; position:sticky; top:52px; align-self:flex-start;
    max-height:calc(100vh - 60px); overflow-y:auto; padding:16px 8px 40px 16px;
  }
  #sidebar a{
    display:block; padding:6px 10px; border-radius:7px; color:var(--text-muted);
    text-decoration:none; font-size:12.8px; margin-bottom:1px; border-left:3px solid transparent;
  }
  #sidebar a:hover{background:var(--accent-fill); color:var(--navy);}
  #sidebar a.active{background:var(--accent-fill); color:var(--navy); font-weight:700; border-left:3px solid var(--navy);}
  #content{flex:1 1 auto; padding:20px 20px 120px 16px; min-width:0;}
  .hero{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px; margin-bottom:18px;}
  .hero h2{margin:0 0 4px; color:var(--navy); font-size:21px;}
  .hero .sub{color:var(--text-muted); font-style:italic; font-size:13px; margin:0 0 10px;}
  .hero .legend{color:var(--text-muted); font-size:12px; margin:0;}
  .instructions{background:var(--accent-fill); border:1px solid #C9D8EA; border-radius:var(--radius); padding:14px 16px; margin-bottom:22px; font-size:12.8px;}
  .instructions b{color:var(--navy);}
  .instructions ul{margin:6px 0 0; padding-left:18px;}
  .instructions li{margin-bottom:3px;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:16px; scroll-margin-top:60px; overflow:hidden;}
  .card-header{background:var(--navy); color:#fff; padding:10px 16px; font-weight:700; font-size:14px; display:flex; align-items:baseline; gap:8px;}
  .card-header .num{opacity:.75; font-weight:700;}
  .card-note{padding:8px 16px 0; font-size:11.8px; color:var(--text-muted); font-style:italic;}
  .card-body{padding:6px 16px 16px;}
  .field{padding:10px 0; border-bottom:1px solid var(--border-light);}
  .field:last-child{border-bottom:none;}
  .field label.flabel{display:block; font-weight:700; font-size:12.6px; color:#33465E; margin-bottom:5px;}
  .field label.flabel .req{color:var(--danger);}
  .field .fnote{font-size:11px; color:var(--text-faint); font-style:italic; margin-top:3px;}
  input[type=text], input[type=date], textarea{
    width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:7px;
    font-size:13.5px; font-family:inherit; color:var(--text); background:#fff;
  }
  input[type=text]:focus, input[type=date]:focus, textarea:focus{
    outline:none; border-color:var(--navy-light); box-shadow:0 0 0 3px rgba(46,79,120,.12);
  }
  textarea{min-height:70px; resize:vertical;}
  textarea.big{min-height:140px;}
  .unit-suffix{font-size:11.5px; color:var(--text-faint); margin-left:4px;}
  .chip{
    display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border:1px solid var(--border);
    border-radius:20px; font-size:12.6px; cursor:pointer; user-select:none; background:#fff; color:var(--text);
  }
  .chip:hover{border-color:var(--navy-light);}
  .chip.on{background:var(--navy); border-color:var(--navy); color:#fff;}
  .choice-group{display:flex; flex-wrap:wrap; gap:7px;}
  .grid-options{display:grid; grid-template-columns:repeat(var(--gcols,3),1fr); gap:6px 10px;}
  @media (max-width:700px){.grid-options{grid-template-columns:repeat(2,1fr);}}
  .grid-check{display:flex; align-items:center; gap:7px; font-size:12.8px; padding:4px 2px;}
  .grid-check input{width:15px; height:15px; accent-color:var(--navy); flex:0 0 auto;}
  .other-row{display:flex; align-items:center; gap:8px; margin-top:8px;}
  .other-row input[type=text]{flex:1 1 auto;}
  table.htable{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.htable th{background:var(--navy); color:#fff; text-align:left; padding:7px 8px; font-size:11.5px;}
  table.htable td{border:1px solid var(--border-light); padding:5px 6px;}
  table.htable input{border:none; width:100%; padding:4px; font-size:12.5px; background:transparent;}
  table.htable input:focus{outline:1px solid var(--navy-light); border-radius:4px;}
  .btn{
    display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px; border:1px solid var(--border);
    background:#fff; color:var(--navy); font-size:12.8px; font-weight:600; cursor:pointer;
  }
  .btn:hover{border-color:var(--navy-light); background:var(--accent-fill);}
  .btn.small{padding:5px 10px; font-size:11.8px;}
  .btn.primary{background:var(--navy); color:#fff; border-color:var(--navy);}
  .btn.primary:hover{background:var(--navy-light);}
  .attach-group-title{font-weight:700; color:var(--navy); font-size:13px; margin:14px 0 8px;}
  .attach-group-title:first-child{margin-top:2px;}
  .attach-row{
    display:flex; gap:12px; align-items:flex-start; padding:10px; border:1px dashed #B9C6D6;
    border-radius:8px; margin-bottom:8px; background:#FBFCFD;
  }
  .attach-row.has-files{border-style:solid; border-color:#BFE0C8; background:#F5FBF6;}
  .attach-label{flex:0 0 190px; font-weight:700; font-size:12.3px; color:#33465E; padding-top:6px;}
  .attach-main{flex:1 1 auto; min-width:0;}
  .file-chip-list{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .file-chip{
    display:flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--border);
    border-radius:7px; padding:4px 6px 4px 4px; font-size:11.3px; max-width:220px;
  }
  .file-chip img{width:26px; height:26px; object-fit:cover; border-radius:4px;}
  .file-chip .fx{width:26px; height:26px; border-radius:4px; background:var(--accent-fill); display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--navy); font-weight:700;}
  .file-chip .fname{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:130px;}
  .file-chip .rm{cursor:pointer; color:var(--danger); font-weight:700; padding:0 3px;}
  .sig-pad-wrap{border:1px solid var(--border); border-radius:8px; overflow:hidden; background:#fff;}
  canvas.sigpad{display:block; width:100%; height:130px; touch-action:none; background:#fff;}
  .sig-actions{margin-top:6px; display:flex; gap:8px;}
  #actionbar{
    position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--border);
    padding:10px 16px; display:flex; gap:8px; flex-wrap:wrap; justify-content:center; z-index:60;
    box-shadow:0 -2px 8px rgba(0,0,0,.06);
  }
  #toast{
    position:fixed; bottom:70px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff;
    padding:9px 16px; border-radius:8px; font-size:13px; z-index:80; opacity:0; pointer-events:none;
    transition:opacity .25s ease; max-width:90vw; text-align:center;
  }
  #toast.show{opacity:1;}
  @media (max-width:900px){
    #sidebar{display:none;}
    #mobileNavWrap{display:block;}
    #content{padding:16px 12px 120px;}
  }

  #searchBtn{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;font-size:18px;width:38px;height:38px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  /* Flecha para volver a la plataforma. Solo se muestra si se llegó desde ella. */
  #backBtn{display:none;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:15px;font-weight:700;height:38px;padding:0 13px;border-radius:8px;cursor:pointer;align-items:center;gap:7px;flex-shrink:0;font-family:inherit;text-decoration:none;}
  #backBtn.on{display:inline-flex;}
  #searchBtn:hover{background:rgba(255,255,255,.15);}
  #ufBar{max-width:940px;margin:0 auto;padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#E9EFF6;border-bottom:1px solid var(--border);}
  .uf-lbl{font-size:12px;font-weight:700;color:var(--navy);} .uf-btn{border:1px solid var(--border);background:#fff;color:var(--navy);border-radius:6px;padding:4px 8px;font-size:11px;font-weight:600;cursor:pointer;}
  .uf-mini{font-size:11px;color:var(--text-muted);} .uf-input{width:90px;border:1px solid var(--border);border-radius:6px;padding:4px 6px;font-size:12px;}
  .money-wrap{display:flex;gap:6px;align-items:stretch;} .money-wrap input{flex:1;min-width:120px;}
  .cur-tog{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;}
  .cur-tog button{border:none;background:#fff;padding:0 10px;font-size:11px;font-weight:700;color:var(--text-muted);cursor:pointer;} .cur-tog button.on{background:var(--navy);color:#fff;}
  .conv-line{margin-top:5px;font-size:12px;color:var(--navy);font-weight:600;display:none;}
  .fx-bar{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap;}
  .fx-btn{border:1px solid var(--border);background:#fff;border-radius:6px;padding:4px 8px;font-size:11px;font-weight:600;color:var(--text-muted);cursor:pointer;display:inline-flex;align-items:center;gap:3px;}
  .fx-btn:hover{border-color:var(--navy-light);color:var(--navy);} .fx-btn.on{background:var(--accent-fill);border-color:var(--navy-light);color:var(--navy);}
  .fx-btn .cnt{background:var(--navy);color:#fff;border-radius:99px;font-size:9px;padding:0 4px;min-width:14px;text-align:center;}
  .fx-panel{margin-top:6px;border:1px solid var(--border-light);border-radius:8px;padding:10px;background:#FAFBFC;}
  .fx-panel textarea{width:100%;min-height:50px;border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-family:inherit;font-size:13px;resize:vertical;}
  .fx-drop{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border:1.5px dashed var(--border);border-radius:8px;background:#FAFBFC;color:var(--text-muted);font-size:12px;cursor:pointer;}
  .fx-drop:hover{border-color:var(--navy);color:var(--navy);background:var(--accent-fill);}
  .attach-inline .file-chip-list{margin-top:6px;}
  .addfield-bar{padding:8px 0 4px;} .addfield-row{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;}
  .addfield-row input{flex:1;min-width:140px;border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:13px;}
  .addfield-row select{border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:13px;}
  .field.flash{background:#FFFDE6;box-shadow:0 0 0 2px #F5D97B inset;border-radius:6px;transition:background .3s;}
  #searchOverlay{position:fixed;inset:0;z-index:100;background:rgba(20,22,26,.55);backdrop-filter:blur(3px);display:none;justify-content:center;align-items:flex-start;padding:50px 12px 20px;}
  #searchOverlay.on{display:flex;}
  .search-box{width:100%;max-width:620px;background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.3);overflow:hidden;display:flex;flex-direction:column;max-height:80vh;}
  .search-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);}
  .sicon{display:flex;align-items:center;} .search-head input{flex:1;border:none;outline:none;font-size:16px;background:transparent;}
  .sclose{border:1px solid var(--border);border-radius:6px;padding:3px 7px;font-size:10px;color:var(--text-muted);font-weight:600;cursor:pointer;}
  .search-results{overflow-y:auto;padding:6px;} .sr-note{padding:20px 14px;text-align:center;color:var(--text-muted);font-size:12.5px;}
  .sr-item{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-radius:8px;cursor:pointer;} .sr-item:hover{background:var(--accent-fill);}
  .sr-lbl{font-size:13px;font-weight:600;color:var(--text);} .sr-sec{font-size:11px;color:var(--text-muted);}
  .sr-val{font-size:11.5px;color:var(--text-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sr-fuzzy{padding:6px 12px;font-size:11.5px;color:#9A6A12;font-weight:600;}


  .card-header-toggle{cursor:pointer;user-select:none;}
  .card-header-toggle:hover{background:var(--navy-light);}
  .card-header .chev{margin-left:auto;display:flex;align-items:center;transition:transform .18s;color:#fff;opacity:.85;}
  .card-header .chev.open{transform:rotate(90deg);}
  /* Justo encima del asesor, no debajo: antes quedaban uno sobre el otro.
     A la izquierda no sirve porque ahí va el menú de secciones. */
  #backTop{position:fixed;right:16px;bottom:calc(146px + env(safe-area-inset-bottom,0px));z-index:95;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--navy);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .2s;}
  #backTop.show{opacity:1;pointer-events:auto;}
  #backTop:hover{background:var(--navy-light);}


  .ai-card .card-header{background:linear-gradient(90deg,var(--navy),#2E4F78);}
  .ai-badge{display:inline-flex;align-items:center;justify-content:center;background:#fff;color:var(--navy);font-weight:800;font-size:10px;border-radius:5px;padding:2px 6px;margin-right:8px;letter-spacing:.5px;}
  .ai-row{display:flex;align-items:center;gap:10px;margin:10px 0;flex-wrap:wrap;}
  .ai-lbl{font-size:12px;font-weight:700;color:var(--navy);min-width:78px;}
  .ai-inp{flex:1;min-width:160px;border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:14px;font-family:inherit;background:#fff;}
  .ai-file{flex:1;min-width:160px;font-size:13px;}
  .ai-hint{font-size:11.5px;color:var(--text-muted);margin:-2px 0 6px 88px;}
  @media(max-width:560px){.ai-hint{margin-left:0;}}
  .ai-btn{margin-top:4px;background:var(--navy);color:#fff;border:none;border-radius:9px;padding:12px 18px;font-size:14px;font-weight:700;cursor:pointer;width:100%;}
  .ai-btn:hover{background:var(--navy-light);} .ai-btn:disabled{opacity:.6;cursor:default;}
  .ai-status{font-size:12.5px;color:var(--text-muted);margin-top:8px;min-height:16px;}
  .ai-err{margin-top:10px;background:var(--red-bg,#FBEAE9);color:var(--red,#B3261E);border:1px solid #F0C9C4;border-radius:8px;padding:10px 12px;font-size:13px;}
  .ai-res{margin-top:12px;border:1px solid var(--border);border-radius:10px;padding:12px;background:#F4F8FC;}
  .ai-res-t{font-weight:700;color:var(--navy);font-size:13.5px;margin-bottom:6px;}
  .ai-res-sum{font-size:12.5px;color:var(--text-muted);margin-bottom:8px;line-height:1.45;}
  .ai-res-it{padding:7px 9px;border-radius:7px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line2);}
  .ai-res-it:hover{background:var(--brand-bg,#E9EFF6);}
  .ai-res-lbl{font-weight:600;color:var(--text);}
  .ai-res-val{color:var(--navy);}
  .ai-res-sec{color:var(--text-muted);font-size:11px;}

  /* ---- Asistente inmobiliario de la ficha (el mismo de la plataforma) ---- */
  /* Se arrastra con el dedo a cualquier parte de la pantalla, así que nunca
     queda tapando otro botón. `touch-action:none` es lo que deja moverlo sin
     que la página se desplace debajo. */
  #asFab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:190;width:58px;height:58px;border:none;border-radius:18px;background:linear-gradient(135deg,#E6C98A,#A07E33);color:#141419;box-shadow:0 14px 34px rgba(34,28,15,.3);cursor:grab;font-size:25px;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;}
  #asFab.moviendo{cursor:grabbing;transform:scale(1.12);box-shadow:0 22px 52px rgba(34,28,15,.42);transition:transform .1s;}
  #asFab .dot{position:absolute;right:5px;top:5px;width:11px;height:11px;border:2px solid #fff;border-radius:50%;background:#2E7D46;}
  #asPanel{position:fixed;right:18px;bottom:calc(144px + env(safe-area-inset-bottom,0px));z-index:189;width:min(400px,calc(100vw - 24px));height:min(600px,calc(100vh - 210px));background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:0 22px 70px rgba(16,24,40,.26);display:none;flex-direction:column;overflow:hidden;}
  #asPanel.open{display:flex;}
  #asHead{padding:14px 15px;background:linear-gradient(135deg,#17171d,#29272a);color:#fff;display:flex;align-items:center;gap:10px;}
  #asHead .av{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#E6C98A,#A07E33);color:#141419;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0;}
  #asHead .t{font-weight:800;font-size:15px;}
  #asHead .s{font-size:11.5px;opacity:.72;margin-top:1px;}
  #asHead .x{margin-left:auto;background:transparent;border:none;color:#fff;opacity:.7;font-size:20px;cursor:pointer;padding:2px 6px;}
  #asMsgs{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg);}
  #asMsgs > *{flex-shrink:0;}
  .as-row{display:flex;}
  .as-row.bot{justify-content:flex-start;}
  .as-row.user{justify-content:flex-end;}
  .as-bub{max-width:86%;padding:10px 13px;border-radius:15px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word;}
  .as-row.bot .as-bub{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:5px;color:var(--text);}
  .as-row.user .as-bub{background:var(--navy);color:#fff;border-bottom-right-radius:5px;}
  .as-bub.err{background:var(--danger-bg);border-color:var(--danger);color:var(--danger);}
  .as-sug{display:flex;flex-wrap:wrap;gap:7px;padding:0 14px 12px;background:var(--bg);}
  .as-sug button{background:var(--card);border:1px solid var(--border);border-radius:999px;padding:7px 12px;font-size:12.5px;cursor:pointer;color:var(--text);}
  .as-sug button:hover{background:var(--accent-fill);}
  #asForm{display:flex;gap:8px;padding:11px;border-top:1px solid var(--border);background:var(--card);align-items:flex-end;}
  #asIn{flex:1;min-height:44px;max-height:110px;resize:none;font-size:16px;padding:11px 12px;border:1px solid var(--border);border-radius:12px;font-family:inherit;}
  #asForm button{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--card);font-size:18px;cursor:pointer;flex-shrink:0;}
  #asForm button.send{background:var(--navy);color:#fff;border-color:var(--navy);}
  #asForm button.on{background:var(--danger);color:#fff;border-color:var(--danger);}
  #asForm .clip{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--card);font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  #asForm .clip:hover{background:var(--accent-fill);}
  #asAdj{display:flex;flex-wrap:wrap;gap:6px;padding:0 11px 8px;background:var(--card);}
  #asAdj:empty{display:none;}
  #asAdj .chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-fill);border:1px solid var(--border);border-radius:999px;padding:5px 10px;font-size:12px;max-width:100%;}
  #asAdj .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px;}

   directo (sin venir de la plataforma) no ve el botón. */
(function(){
  try{
    var ref = document.referrer || "";
    if(!ref) return;
    var origen = new URL(ref).origin;
    if(origen === location.origin) return; // ya está dentro del mismo sitio
    var b = document.getElementById("backBtn");
    if(!b) return;
    b.href = origen + "/";
    b.classList.add("on");
    b.addEventListener("click", function(e){
      if(history.length > 1){ e.preventDefault(); history.back(); }
    });

})();

function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  for(const k in attrs){
    if(attrs[k]==null) continue;
    if(k==='class') e.className = attrs[k];
    else if(k.startsWith('on') && typeof attrs[k]==='function') e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null || c==='') return;
    e.appendChild(typeof c==='string' ? document.createTextNode(c) : c);
  });
  return e;
}

function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{

}

function aiImageToJpeg(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{ let w=img.width,h=img.height; const mx=1400,sc=Math.min(1,mx/Math.max(w,h));
      w=Math.round(w*sc); h=Math.round(h*sc);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
      res({media:'image/jpeg', data:cv.toDataURL('image/jpeg',0.8).split(',')[1]}); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('No se pudo leer la imagen')); };
    img.src=url;
  });
}
function aiFileB64(file){ return fileToDataUrl(file).then(u=>u.split(',')[1]); }

/* ---- Lectura de Word, Excel y texto ----
   La IA lee imágenes y PDF de forma nativa, pero no Word ni Excel: esos son
   archivos ZIP con XML adentro, así que les sacamos el texto aquí mismo y se
   lo mandamos como texto. Se usa DecompressionStream, que ya viene en los
   navegadores modernos: no hace falta ninguna librería. */
const _zdv=(b,o)=>b[o]|(b[o+1]<<8);
const _zdw=(b,o)=>(b[o]|(b[o+1]<<8)|(b[o+2]<<16))+(b[o+3]*16777216);

async function zipEntradas(buffer, quiero){
  const b=new Uint8Array(buffer), out={}, dec=new TextDecoder();
  let eocd=-1;
  for(let i=b.length-22;i>=0 && i>b.length-70000;i--){
    if(b[i]===0x50&&b[i+1]===0x4b&&b[i+2]===0x05&&b[i+3]===0x06){ eocd=i; break; }
  }
  if(eocd<0) return out;
  const total=_zdv(b,eocd+10); let p=_zdw(b,eocd+16);
  for(let n=0;n<total;n++){
    if(b[p]!==0x50||b[p+1]!==0x4b||b[p+2]!==0x01||b[p+3]!==0x02) break;
    const metodo=_zdv(b,p+10), compSize=_zdw(b,p+20);
    const nameLen=_zdv(b,p+28), extraLen=_zdv(b,p+30), comLen=_zdv(b,p+32), local=_zdw(b,p+42);
    const nombre=dec.decode(b.subarray(p+46,p+46+nameLen));
    p+=46+nameLen+extraLen+comLen;
    if(!quiero(nombre)) continue;
    const ini=local+30+_zdv(b,local+26)+_zdv(b,local+28);
    const datos=b.subarray(ini,ini+compSize);
    try{
      if(metodo===0) out[nombre]=dec.decode(datos);
      else if(metodo===8){
        const ds=new DecompressionStream('deflate-raw');
        out[nombre]=await new Response(new Blob([datos]).stream().pipeThrough(ds)).text();
      }
    }catch(e){}
  }
  return out;
}
function _zxml(x){ return String(x||'')
  .replace(/<\/w:p>|<\/a:p>|<\/text:p>/g,'\n').replace(/<[^>]+>/g,' ')
  .replace(/&#(\d+);/g,(m,d)=>String.fromCharCode(+d))
  .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
  .replace(/&quot;/g,'"').replace(/&apos;/g,"'")
  .replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim(); }

async function docxTexto(buf){
  const e=await zipEntradas(buf,n=>/^word\/(document|header\d*|footer\d*)\.xml$/.test(n));
  return Object.keys(e).sort().map(k=>_zxml(e[k])).filter(Boolean).join('\n\n');
}
async function xlsxTexto(buf){
  const e=await zipEntradas(buf,n=>/^xl\/(sharedStrings\.xml|worksheets\/sheet\d+\.xml)$/.test(n));
  const comp=(e['xl/sharedStrings.xml']||'').split(/<si[\s>]/).slice(1).map(s=>_zxml(s.split('</si>')[0]));
  return Object.keys(e).filter(k=>k.indexOf('worksheets/')>=0).sort().map(k=>
    e[k].split(/<row[\s>]/).slice(1).map(fila=>
      fila.split(/<c[\s>]/).slice(1).map(c=>{
        const a=c.split('>')[0];
        // El texto puede ir en línea o apuntando a la tabla compartida.
        if(/t="inlineStr"/.test(a)){ const t=c.match(/<t[^>]*>[\s\S]*?<\/t>/g); return t?t.map(_zxml).join(' '):''; }
        const v=(c.match(/<v>([\s\S]*?)<\/v>/)||[])[1];
        if(v==null) return '';
        return /t="s"/.test(a) ? (comp[+v]||'') : v;
      }).filter(x=>x!=='').join('\t')
    ).filter(Boolean).join('\n')
  ).filter(Boolean).join('\n\n');
}

function aiApply(campos){
  const defById={};
  SCHEMA.sections.forEach(s=>(s.fields||[]).concat(state.customFields[s.num]||[]).forEach(f=>{ defById[f.id]={f:f,sec:s.num}; }));
  const norm=x=>String(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  const filled=[];
  for(const id in campos){
    const d=defById[id]; if(!d) continue; const f=d.f; let v=campos[id];
    if(v==null||String(v).trim()==='') continue;
    if(f.type==='choice'){
      const opt=(f.options||[]).find(o=>norm(o)===norm(v)) || (f.options||[]).find(o=>norm(o).indexOf(norm(v))>=0||norm(v).indexOf(norm(o))>=0);
      if(opt){ state.choices[id]=opt; } else if(f.other){ state.choices[id]='__other__'; state.choiceOther[id]=String(v); } else continue;
    } else if(f.type==='grid'){
      if(!state.grids[id]) state.grids[id]=new Set();
      const vals=Array.isArray(v)?v:String(v).split(/[,;]+/);
      vals.forEach(val=>{ const opt=(f.options||[]).find(o=>norm(o)===norm(val)||norm(o).indexOf(norm(val))>=0); if(opt) state.grids[id].add(opt); });
    } else { state.values[id]=String(v); }
    if(!state.openSecs) state.openSecs={}; state.openSecs[d.sec]=true;
    filled.push({id:id, sec:d.sec, label:f.label, value:Array.isArray(v)?v.join(', '):String(v)});
  }
  return filled;
}

/* Lee un archivo y lo deja listo para la IA. Las fotos y los PDF viajan tal
   cual; de Word, Excel y texto se extrae el contenido aquí mismo. Lo usan el
   lector de documentos y también el chat del asesor. */
async function aiLeerArchivo(f){
  if(/^image\//.test(f.type) || /\.(jpe?g|png|heic|heif|webp|gif)$/i.test(f.name)){
    const im=await aiImageToJpeg(f); return { media:im.media, data:im.data, name:f.name };
  }
  if(/pdf$/i.test(f.type) || /\.pdf$/i.test(f.name)){
    const b=await aiFileB64(f); return { media:'application/pdf', data:b, name:f.name };
  }
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  let txt='';
  if(ext==='docx') txt=await docxTexto(await f.arrayBuffer());
  else if(ext==='xlsx'||ext==='xlsm') txt=await xlsxTexto(await f.arrayBuffer());
  else if(['txt','csv','md','json','xml','html','htm','rtf'].indexOf(ext)>=0 || /^text\//.test(f.type)){
    txt=await f.text();
    if(['rtf','html','htm'].indexOf(ext)>=0) txt=_zxml(txt);
  }
  else if(['doc','xls','ppt','pages','numbers'].indexOf(ext)>=0)
    throw new Error('"'+f.name+'" está en un formato antiguo. Guárdalo como PDF o .docx y vuelve a subirlo.');
  else throw new Error('No sé leer "'+f.name+'". Sirven fotos, PDF, Word, Excel y archivos de texto.');
  return txt.trim() ? { texto:txt.slice(0,120000), name:f.name } : null;
}
function aiBloqueDeArchivo(a){
  if(!a) return null;
  if(a.texto) return { type:'text', text:'--- Contenido de "'+a.name+'" ---\n'+a.texto };
  if(a.media==='application/pdf') return { type:'document', source:{type:'base64',media_type:'application/pdf',data:a.data} };
  return { type:'image', source:{type:'base64',media_type:a.media,data:a.data} };
}

async function aiRun(files, model, statusEl, runBtn){
  if(!files.length){ statusEl.textContent='Selecciona al menos un documento.'; return; }
  localStorage.setItem('ficha_ai_model', model);
  runBtn.disabled=true; runBtn.textContent='Leyendo…'; statusEl.textContent='Enviando documentos a la IA…'; aiState.error='';
  try{
    const content=[];
    for(const f of files){
      const b=aiBloqueDeArchivo(await aiLeerArchivo(f));
      if(b) content.push(b);
    }
    if(!content.length){ throw new Error('No se pudo leer ningún archivo. Sirven fotos, PDF, Word, Excel y texto.'); }
    content.push({type:'text', text:
      'Eres un asistente experto en documentos inmobiliarios chilenos (escrituras, certificados del CBR/SII, cédulas de identidad, '+
      'liquidaciones de sueldo, boletines comerciales Equifax/Dicom, contratos, etc.). Extrae los datos del/los documento(s) y '+
      'mapéalos al catálogo de campos de esta ficha. Devuelve SOLO un JSON válido, sin markdown ni texto extra, con la forma: '+
      '{"campos": {"<id>": "<valor>"}, "resumen": "<breve descripción de lo que encontraste>"}. '+
      'Reglas: usa únicamente los "id" del catálogo; para type "choice" el valor debe COINCIDIR EXACTO con una de sus "opciones"; '+
      'para montos entrega solo el número sin puntos ni símbolos; para fechas usa AAAA-MM-DD; '+
      'omite los campos que no aparezcan en el documento; no inventes datos. Catálogo de campos: '+JSON.stringify(aiCatalog()) });
    /* La ficha puede estar servida desde el sitio principal o desde su propio
       dominio (que redirige al principal). Se prueba primero la ruta /api,
       que es la que atraviesa la redirección, y si no existe se usa la ruta
       por omisión de las funciones de Netlify. */
    const pedirIA=(ruta)=>fetch(ruta,{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({model:model||'claude-sonnet-5', content:content})
    });
    let resp=await pedirIA('/api/leer-documento');
    if(resp.status===404) resp=await pedirIA('/.netlify/functions/leer-documento');
    const rawTxt=await resp.text();
    let data;
    try{ data=JSON.parse(rawTxt); }catch(e){ throw new Error('El servidor no devolvió JSON (código '+resp.status+'). '+(rawTxt||'').slice(0,200)); }
    if(!resp.ok){
      let em='El lector respondió '+resp.status+'.';
      if(data && data.error){ em = (typeof data.error==='string') ? data.error : (data.error.message || JSON.stringify(data.error)); }
      throw new Error(em);
    }
    if(data.error){ throw new Error(typeof data.error==='string'?data.error:JSON.stringify(data.error)); }
    if(data.type==='error' && data.error){ throw new Error(data.error.message||JSON.stringify(data.error)); }
    const txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    let clean=txt.replace(/```json/gi,'').replace(/```/g,'').trim();
    const a=clean.indexOf('{'), z=clean.lastIndexOf('}'); if(a>=0&&z>a) clean=clean.slice(a,z+1);
    const parsed=JSON.parse(clean);
    const filled=aiApply(parsed.campos||{});
    aiState.summary=(parsed.resumen||''); aiState.filled=filled; aiState.error='';
    renderContent(); updateProgress();
    toast('IA: '+filled.length+' campos completados');
    if(filled.length){ const first=filled[0].sec; setTimeout(()=>{ const c=document.getElementById('sec-'+first); if(c) c.scrollIntoView({behavior:'smooth',block:'start'}); },250); }
  }catch(e){
    let msg;
    if(e && e.message) msg=e.message;
    else if(typeof e==='string') msg=e;
    else { try{ msg=JSON.stringify(e); }catch(_){ msg='Error desconocido'; } }
    aiState.error=msg; aiState.filled=[];
    if(runBtn){ runBtn.disabled=false; runBtn.textContent='Leer documentos y rellenar'; }
    renderContent();
  }finally{
    if(runBtn){ runBtn.disabled=false; runBtn.textContent='Leer documentos y rellenar'; }
  }
}

  wrap.appendChild(lbl);
  if(f.type==='text' && isMoney(f)){
    wrap.appendChild(renderMoney(f));
  } else if(f.type==='text' && f.unit==='%' && /multa/i.test(f.id)){
    wrap.appendChild(renderMulta(f));
  } else if(f.type==='text'){
    const row=el('div',{style:'display:flex;align-items:center;'});
    const inp=el('input',{type:'text',placeholder:'Escriba aquí'});
    inp.value=state.values[f.id]||'';
    inp.addEventListener('input',()=>{state.values[f.id]=inp.value; updateProgress();});
    row.appendChild(inp);
    if(f.unit) row.appendChild(el('span',{class:'unit-suffix'}, f.unit));
    wrap.appendChild(row);
  } else if(f.type==='date'){
    const inp=el('input',{type:'date'});
    inp.value=state.values[f.id]||'';
    inp.addEventListener('input',()=>{state.values[f.id]=inp.value; updateProgress();});
    wrap.appendChild(inp);
  } else if(f.type==='textarea'){
    const ta=el('textarea',{class:f.big?'big':''});
    ta.value=state.values[f.id]||'';
    ta.addEventListener('input',()=>{state.values[f.id]=ta.value; updateProgress();});
    wrap.appendChild(ta);
  } else if(f.type==='choice'){
    wrap.appendChild(renderChoice(f));
  } else if(f.type==='grid'){
    wrap.appendChild(renderGrid(f));
  }
  if(f.note) wrap.appendChild(el('div',{class:'fnote'}, f.note));
  attachFieldExtras(wrap, f);
  container.appendChild(wrap);
}

function renderChoice(f){
  const box=el('div');
  const group=el('div',{class:'choice-group'});
  const otherInput=el('input',{type:'text',placeholder:'Especificar…',style:'display:none;margin-top:8px;'});
  function refresh(){
    Array.from(group.children).forEach(chip=>chip.classList.toggle('on', chip.dataset.val===state.choices[f.id]));
    otherInput.style.display=(state.choices[f.id]==='__other__')?'block':'none';
  }
  f.options.forEach(opt=>{
    const chip=el('div',{class:'chip'}, opt); chip.dataset.val=opt;
    chip.addEventListener('click',()=>{ state.choices[f.id]=(state.choices[f.id]===opt)?undefined:opt; refresh(); updateProgress(); });
    group.appendChild(chip);
  });
  if(f.other){
    const chip=el('div',{class:'chip'}, 'Otro'); chip.dataset.val='__other__';
    chip.addEventListener('click',()=>{ state.choices[f.id]=(state.choices[f.id]==='__other__')?undefined:'__other__'; refresh(); updateProgress(); });
    group.appendChild(chip);
  }
  box.appendChild(group);
  otherInput.value=state.choiceOther[f.id]||'';
  otherInput.addEventListener('input',()=>{state.choiceOther[f.id]=otherInput.value;});
  if(f.other) box.appendChild(otherInput);
  refresh();
  return box;
}

function renderGrid(f){
  const box=el('div');
  if(!state.grids[f.id]) state.grids[f.id]=new Set();
  const cols=f.cols || (f.options.length<=8?2:3);
  const grid=el('div',{class:'grid-options'});
  grid.style.setProperty('--gcols',cols);
  f.options.forEach(opt=>{
    const label=el('label',{class:'grid-check'});
    const cb=el('input',{type:'checkbox'});
    cb.checked=state.grids[f.id].has(opt);
    cb.addEventListener('change',()=>{
      if(cb.checked) state.grids[f.id].add(opt); else state.grids[f.id].delete(opt);
      updateProgress();
    });
    label.appendChild(cb); label.appendChild(document.createTextNode(opt));
    grid.appendChild(label);
  });
  box.appendChild(grid);
  if(f.other){
    const row=el('div',{class:'other-row'});
    row.appendChild(el('span',{},'Otro:'));
    const inp=el('input',{type:'text',placeholder:'especificar'});
    inp.value=state.gridOther[f.id]||'';
    inp.addEventListener('input',()=>{state.gridOther[f.id]=inp.value;});
    row.appendChild(inp);
    box.appendChild(row);
  }
  return box;
}

function renderSignatureSection(container, s){

  (s.fields||[]).forEach(f=>renderField(container,f));

  s.signers.forEach((label,idx)=>{

    col.appendChild(el('div',{class:'flabel'}, label));

    padWrap.appendChild(canvas); col.appendChild(padWrap);
    const actions=el('div',{class:'sig-actions'});
    const clearBtn=el('button',{class:'btn small'},'Borrar firma');
    actions.appendChild(clearBtn); col.appendChild(actions);
    sigWrap.appendChild(col);
    setupSignaturePad(canvas,key,clearBtn);

function setupSignaturePad(canvas, key, clearBtn){
  const ctx = canvas.getContext('2d');
  let sized = false;
  function fit(){
    if(sized || !ctx) return;
    const rect = canvas.getBoundingClientRect();
    if(!rect.width || !rect.height) return;
    const ratio = window.devicePixelRatio || 1;
    canvas.width = Math.round(rect.width*ratio);
    canvas.height = Math.round(rect.height*ratio);
    ctx.setTransform(ratio,0,0,ratio,0,0);
    ctx.lineWidth=2; ctx.lineCap='round'; ctx.strokeStyle='#20293A';
    sized = true;
  }
  if(window.ResizeObserver){ new ResizeObserver(fit).observe(canvas); }
  else { setTimeout(fit,60); window.addEventListener('resize', fit); }
  let drawing=false, last=null;
  function pos(e){ const rect=canvas.getBoundingClientRect(); const p=e.touches?e.touches[0]:e; return {x:p.clientX-rect.left, y:p.clientY-rect.top}; }
  function start(e){ drawing=true; last=pos(e); e.preventDefault(); }
  function move(e){
    if(!drawing) return;
    const p=pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last=p; state.signatures[key]=canvas.toDataURL('image/png'); e.preventDefault();
  }
  function end(){ drawing=false; updateProgress(); }
  canvas.addEventListener('mousedown',start);
  canvas.addEventListener('mousemove',move);
  window.addEventListener('mouseup',end);
  canvas.addEventListener('touchstart',start,{passive:false});
  canvas.addEventListener('touchmove',move,{passive:false});
  canvas.addEventListener('touchend',end);
  clearBtn.addEventListener('click',(e)=>{
    e.preventDefault(); ctx.clearRect(0,0,canvas.width,canvas.height); state.signatures[key]=null; updateProgress();
  });
}

/* ===== GUARDAR / CARGAR AVANCE (JSON) ===== */
function serializeState(){
  const grids={};
  for(const k in state.grids) grids[k]=Array.from(state.grids[k]);
  const tables={};
  for(const k in state.values) if(k.startsWith('t_')) tables[k]=state.values[k];
  const values={};
  for(const k in state.values) if(!k.startsWith('t_')) values[k]=state.values[k];
  const fileNames={};
  for(const k in state.files) if(state.files[k].length) fileNames[k]=state.files[k].map(f=>f.name);
  return {
    savedAt:new Date().toISOString(), values, tables, choices:state.choices, choiceOther:state.choiceOther,
    grids, gridOther:state.gridOther, signatures:state.signatures,
    fileNamesReminder:fileNames,
    notes:state.notes, comments:state.comments, customFields:state.customFields,
  };
}
function restoreState(data){
  state.values={}; state.choices=data.choices||{}; state.choiceOther=data.choiceOther||{};
  state.gridOther=data.gridOther||{}; state.grids={};
  Object.assign(state.values, data.values||{});
  Object.assign(state.values, data.tables||{});
  for(const k in (data.grids||{})) state.grids[k]=new Set(data.grids[k]);
  state.signatures = data.signatures || {corredora:null, propietario:null};
  state.notes = data.notes || {};
  state.comments = data.comments || {};
  state.customFields = data.customFields || {};
}
function downloadBlob(blob, filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function niceFileBase(){
  const dir = (state.values['direccion_calle']||'').trim();
  const com = (state.values['comuna']||'').trim();
  const base = [dir,com].filter(Boolean).join('_') || 'propiedad';
  return 'Ficha_'+base.replace(/[^a-zA-Z0-9_\-]+/g,'_').slice(0,60);
}
function saveProgress(){
  const data=serializeState();
  const blob=new Blob([JSON.stringify(data,null,1)], {type:'application/json'});
  downloadBlob(blob, niceFileBase()+'_avance.json');
  toast('Avance guardado. Los archivos adjuntos deben volver a adjuntarse al cargar este archivo.', 4500);
}
function loadProgress(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      restoreState(data);
      renderContent();
      updateProgress();
      toast('Avance cargado. Vuelva a adjuntar los archivos si corresponde.', 4000);
    }catch(err){
      toast('No se pudo leer el archivo de avance: '+err.message, 4000);
    }
  };
  reader.readAsText(file);
}

/* ===== PROGRESO ===== */
function updateProgress(){
  let total=0, filled=0;
  getAllSections().forEach(s=>{
    sectionFields(s).forEach(f=>{
      total++;
      if(fieldIsFilled(f)) filled++;
    });
  });
  const pct = total ? Math.round(filled/total*100) : 0;
  document.getElementById('progressBarInner').style.width=pct+'%';
  document.getElementById('progressLabel').textContent=pct+'%';
}

/* ============================================================
   EXPORTAR WORD (.docx) — OOXML crudo + JSZip, con fotos y firmas incrustadas
   ============================================================ */
const TWIPS_CM = 566.929133858;
const EMU_CM = 360000;
const USABLE_W = 17.4;

function xmlEsc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;'); }
function rXml(text, o){
  o=o||{};
  const props=[];
  if(o.bold) props.push('<w:b/>');
  if(o.italic) props.push('<w:i/>');
  if(o.color) props.push('<w:color w:val="'+o.color+'"/>');
  props.push('<w:sz w:val="'+Math.round((o.size||10)*2)+'"/>');
  const rpr = '<w:rPr>'+props.join('')+'</w:rPr>';
  return '<w:r>'+rpr+'<w:t xml:space="preserve">'+xmlEsc(text)+'</w:t></w:r>';
}
function pXml(innerRuns, o){
  o=o||{};
  const props=[];
  if(o.border) props.push('<w:pBdr><w:top w:val="single" w:sz="6" w:space="4" w:color="333333"/></w:pBdr>');
  if(o.shade) props.push('<w:shd w:val="clear" w:color="auto" w:fill="'+o.shade+'"/>');
  if(o.spaceBefore!=null) props.push('<w:spacing w:before="'+Math.round(o.spaceBefore*20)+'"/>');
  if(o.center) props.push('<w:jc w:val="center"/>');
  const ppr = props.length? '<w:pPr>'+props.join('')+'</w:pPr>' : '';
  return '<w:p>'+ppr+innerRuns+'</w:p>';
}
function checkRun(checked, label){ return rXml((checked?'\u2612':'\u2610')+' '+label+'    ', {size:9.5}); }
function tableXml(colWidthsCm, rowsXml){
  const grid = colWidthsCm.map(w=>'<w:gridCol w:w="'+Math.round(w*TWIPS_CM)+'"/>').join('');
  return '<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/><w:tblBorders>'+
    '<w:top w:val="single" w:sz="4" w:color="C9D2DC"/><w:left w:val="single" w:sz="4" w:color="C9D2DC"/>'+
    '<w:bottom w:val="single" w:sz="4" w:color="C9D2DC"/><w:right w:val="single" w:sz="4" w:color="C9D2DC"/>'+
    '<w:insideH w:val="single" w:sz="4" w:color="C9D2DC"/><w:insideV w:val="single" w:sz="4" w:color="C9D2DC"/>'+
    '</w:tblBorders><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid>'+grid+'</w:tblGrid>'+rowsXml+'</w:tbl>';
}
function trXml(cellsXml){ return '<w:tr>'+cellsXml+'</w:tr>'; }
function tcXml(widthCm, innerXml, opts){
  opts=opts||{};
  const shd = opts.shade ? '<w:shd w:val="clear" w:color="auto" w:fill="'+opts.shade+'"/>' : '';
  return '<w:tc><w:tcPr><w:tcW w:w="'+Math.round(widthCm*TWIPS_CM)+'" w:type="dxa"/>'+shd+'</w:tcPr>'+(innerXml||pXml(''))+'</w:tc>';
}
function formatDateEs(iso){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||''); return m ? (m[3]+'/'+m[2]+'/'+m[1]) : (iso||'—'); }

function sectionHeaderXml(num, title, note){
  let out = pXml(rXml('  '+num+'.  '+title, {bold:true,color:'FFFFFF',size:11.5}), {shade:'1F3A5C'});
  if(note) out += pXml(rXml(note, {italic:true,color:'6B7078',size:8.7}));
  return out;
}
function fieldRowXml(label, required, valueInnerXml){
  const lc = tcXml(5.3, pXml(rXml(label+(required?' *':''), {bold:true,size:9,color:'1F3A5C'})), {shade:'F1F4F8'});
  const vc = tcXml(USABLE_W-5.3, valueInnerXml);
  return trXml(lc+vc);
}
function fieldValueXml(f){
  const v = state.values[f.id];
  if(f.type==='text'){
    let txt = (v && v.trim()) ? v : '—';
    if(f.unit && v && v.trim()) txt += '  ('+f.unit+')';
    return pXml(rXml(txt,{size:9.5}));
  }
  if(f.type==='date') return pXml(rXml(v?formatDateEs(v):'—',{size:9.5}));
  if(f.type==='textarea'){
    const txt=(v&&v.trim())?v:'—';
    return txt.split(/\r?\n/).map(line=>pXml(rXml(line,{size:9.5}))).join('');
  }
  if(f.type==='choice'){
    let runs = f.options.map(opt=>checkRun(state.choices[f.id]===opt, opt)).join('');
    if(f.other) runs += checkRun(state.choices[f.id]==='__other__', 'Otro: '+(state.choiceOther[f.id]||''));
    return pXml(runs);
  }
  return pXml(rXml('—',{size:9.5}));
}
function gridFieldXml(f){
  let out = pXml(rXml(f.label,{bold:true,size:9.3,color:'1F3A5C'}),{spaceBefore:8});
  const cols = f.cols || (f.options.length<=8?2:3);
  const colw = USABLE_W/cols;
  let rows='';
  for(let i=0;i<f.options.length;i+=cols){
    let cells='';
    for(let c=0;c<cols;c++){
      const opt=f.options[i+c];
      const inner = opt ? pXml(checkRun(!!(state.grids[f.id] && state.grids[f.id].has(opt)), opt)) : pXml('');
      cells += tcXml(colw, inner);
    }
    rows += trXml(cells);
  }
  out += tableXml(Array(cols).fill(colw), rows);
  if(f.other) out += pXml(rXml('Otro: '+(state.gridOther[f.id]||'—'), {size:9.3}));
  return out;
}
function fieldsBlockXml(fields){
  let out=''; let rows='';
  function flush(){ if(rows){ out+=tableXml([5.3,USABLE_W-5.3], rows); rows=''; } }
  (fields||[]).forEach(f=>{
    if(f.type==='grid'){ flush(); out+=gridFieldXml(f); }
    else rows += fieldRowXml(f.label, f.required, fieldValueXml(f));
  });
  flush();
  return out;
}
function historyTableXml(s){
  const rowsData = state.values['t_'+s.num] || [];
  const n=s.columns.length, colw=USABLE_W/n;
  let rows = trXml(s.columns.map(c=>tcXml(colw, pXml(rXml(c,{bold:true,color:'FFFFFF',size:8.7})), {shade:'1F3A5C'})).join(''));
  rowsData.forEach(row=>{ rows += trXml(row.map(val=>tcXml(colw, pXml(rXml(val||'—',{size:9})))).join('')); });
  return tableXml(Array(n).fill(colw), rows);
}

/* ---- imagenes incrustadas ---- */
function newImgCtx(){ return {mediaFiles:[], relCounter:10}; }
function computeDisplayEmu(pxW,pxH,maxWcm,maxHcm){
  maxWcm=maxWcm||8; maxHcm=maxHcm||11;
  let wEmu=maxWcm*EMU_CM, hEmu=Math.round(wEmu*(pxH/pxW));
  if(hEmu > maxHcm*EMU_CM){ hEmu=maxHcm*EMU_CM; wEmu=Math.round(hEmu*(pxW/pxH)); }
  return {wEmu,hEmu};
}
async function addImageToCtx(ctx, file, maxWcm, maxHcm){
  try{
    const bmp = await createImageBitmap(file);
    const {wEmu,hEmu} = computeDisplayEmu(bmp.width, bmp.height, maxWcm, maxHcm);
    if(bmp.close) bmp.close();
    const buf = new Uint8Array(await file.arrayBuffer());
    const ext = (file.type==='image/png') ? 'png' : 'jpeg';
    const relId = 'rIdImg'+(ctx.relCounter++);
    const filename = 'image'+ctx.mediaFiles.length+'.'+ext;
    ctx.mediaFiles.push({relId, filename, buf});
    return {relId, wEmu, hEmu};
  }catch(err){ console.warn('No se pudo incrustar imagen', file && file.name, err); return null; }
}
async function addDataUrlImageToCtx(ctx, dataUrl, maxWcm, maxHcm){
  try{
    const res = await fetch(dataUrl); const blob = await res.blob();
    const bmp = await createImageBitmap(blob);
    const {wEmu,hEmu} = computeDisplayEmu(bmp.width, bmp.height, maxWcm, maxHcm);
    if(bmp.close) bmp.close();
    const buf = new Uint8Array(await blob.arrayBuffer());
    const relId = 'rIdImg'+(ctx.relCounter++);
    const filename = 'image'+ctx.mediaFiles.length+'.png';
    ctx.mediaFiles.push({relId, filename, buf});
    return {relId, wEmu, hEmu};
  }catch(err){ console.warn('No se pudo incrustar firma', err); return null; }
}
function drawingRunXml(rel){
  const id = Math.floor(Math.random()*1000000)+1;
  return '<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0">'+
    '<wp:extent cx="'+rel.wEmu+'" cy="'+rel.hEmu+'"/>'+
    '<wp:docPr id="'+id+'" name="Picture'+id+'"/>'+
    '<wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr>'+
    '<a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">'+
    '<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">'+
    '<pic:nvPicPr><pic:cNvPr id="'+id+'" name="img"/><pic:cNvPicPr/></pic:nvPicPr>'+
    '<pic:blipFill><a:blip r:embed="'+rel.relId+'"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>'+
    '<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="'+rel.wEmu+'" cy="'+rel.hEmu+'"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>'+
    '</pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>';
}
async function attachmentSectionXml(s, ctx){
  let out='';
  for(const g of s.groups){
    out += pXml(rXml(g.group,{bold:true,color:'1F3A5C',size:10}),{spaceBefore:10});
    let rows='';
    for(const att of g.attachments){
      const files = state.files[att.id]||[];
      const images = files.filter(f=>f.isImage), others = files.filter(f=>!f.isImage);
      let cellInner='';
      if(!files.length){
        cellInner = pXml(rXml('(sin archivo adjunto)',{italic:true,size:8.5,color:'9AA1AB'}));
      } else {
        for(const img of images){
          const rel = await addImageToCtx(ctx, img.file);
          if(rel) cellInner += pXml(drawingRunXml(rel));
        }
        if(others.length) cellInner += pXml(rXml('Ver en ZIP adjunto: '+others.map(o=>o.name).join(', '),{italic:true,size:8.5,color:'6B7078'}));
      }
      rows += trXml(tcXml(6.5, pXml(rXml(att.label,{bold:true,size:8.8,color:'1F3A5C'})), {shade:'F1F4F8'}) + tcXml(USABLE_W-6.5, cellInner));
    }
    out += tableXml([6.5,USABLE_W-6.5], rows);
  }
  return out;
}
async function signatureSectionXml(s, ctx){
  let out = pXml(rXml(s.declaracion,{italic:true,color:'6B7078',size:9}));
  out += fieldsBlockXml(s.fields);
  const colw = USABLE_W/2;
  let imgCells='', lineCells='';
  for(let i=0;i<s.signers.length;i++){
    const key = i===0?'corredora':'propietario';
    const dataUrl = state.signatures[key];
    let inner = pXml(rXml(' ')) + pXml(rXml(' ')) + pXml(rXml(' '));
    if(dataUrl){
      const rel = await addDataUrlImageToCtx(ctx, dataUrl, 6, 2.3);
      if(rel) inner = pXml(drawingRunXml(rel));
    }
    imgCells += tcXml(colw, inner);
    lineCells += tcXml(colw, pXml(rXml(s.signers[i],{size:9,color:'6B7078'}), {border:true, center:true}));
  }
  out += tableXml([colw,colw], trXml(imgCells)+trXml(lineCells));
  return out;
}
function titleBlockXml(){
  let out = pXml(rXml(SCHEMA.title,{bold:true,size:19,color:'1F3A5C'}), {center:true});
  out += pXml(rXml(SCHEMA.subtitle,{italic:true,size:10.5,color:'6B7078'}), {center:true});
  out += pXml(rXml('Documento generado desde el formulario web el '+new Date().toLocaleDateString('es-CL')+'.',{italic:true,size:8.8,color:'9AA1AB'}));
  return out;
}

/* ---- paquete OOXML minimo ---- */
function contentTypesXml(){
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="xml" ContentType="application/xml"/>'+
    '<Default Extension="png" ContentType="image/png"/>'+
    '<Default Extension="jpeg" ContentType="image/jpeg"/>'+
    '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'+
    '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>'+
    '</Types>';
}
function relsRootXml(){
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>'+
    '</Relationships>';
}
function stylesXml(){
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'+
    '<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:eastAsia="Calibri" w:cs="Calibri"/><w:sz w:val="20"/></w:rPr></w:rPrDefault></w:docDefaults>'+
    '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style>'+
    '</w:styles>';
}
function documentRelsXml(mediaFiles){
  let rels = '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>';
  mediaFiles.forEach(m=>{ rels += '<Relationship Id="'+m.relId+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/'+m.filename+'"/>'; });
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+rels+'</Relationships>';
}
const DOC_XML_NS = 'xmlns:wpc="http://schemas.microsoft.com/office/word/2010/wordprocessingCanvas" xmlns:mc="http://schemas.openxmlformats.org/markup-compatibility/2006" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:m="http://schemas.openxmlformats.org/officeDocument/2006/math" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:wp14="http://schemas.microsoft.com/office/word/2010/wordprocessingDrawing" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:w10="urn:schemas-microsoft-com:office:word" xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:w14="http://schemas.microsoft.com/office/word/2010/wordml" xmlns:wpg="http://schemas.microsoft.com/office/word/2010/wordprocessingGroup" xmlns:wpi="http://schemas.microsoft.com/office/word/2010/wordprocessingInk" xmlns:wne="http://schemas.microsoft.com/office/word/2006/wordml" xmlns:wps="http://schemas.microsoft.com/office/word/2010/wordprocessingShape" mc:Ignorable="w14 wp14"';

async function buildDocxBlob(){
  const ctx = newImgCtx();
  let body = titleBlockXml();
  for(const s of SCHEMA.sections){
    body += sectionHeaderXml(s.num, s.title, s.note);
    if(s.type==='table') body += historyTableXml(s);
    else if(s.type==='signature') body += await signatureSectionXml(s, ctx);
    else if(s.is_attachment_section) body += await attachmentSectionXml(s, ctx);
    else body += fieldsBlockXml(s.fields);
    body += pXml('');
  }
  body += '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="907" w:right="1020" w:bottom="907" w:left="1020" w:header="454" w:footer="454" w:gutter="0"/></w:sectPr>';
  const documentXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document '+DOC_XML_NS+'><w:body>'+body+'</w:body></w:document>';
  const zip = new JSZip();
  zip.file('[Content_Types].xml', contentTypesXml());
  zip.folder('_rels').file('.rels', relsRootXml());
  const word = zip.folder('word');
  word.file('document.xml', documentXml);
  word.file('styles.xml', stylesXml());
  word.folder('_rels').file('document.xml.rels', documentRelsXml(ctx.mediaFiles));
  if(ctx.mediaFiles.length){
    const media = word.folder('media');
    ctx.mediaFiles.forEach(m=>media.file(m.filename, m.buf));
  }
  return zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}
async function buildAndDownloadDocx(){
  toast('Generando Word… puede tardar si hay muchas fotos.', 5000);
  try{
    const blob = await buildDocxBlob();
    downloadBlob(blob, niceFileBase()+'.docx');
    toast('Word descargado correctamente.');
  }catch(err){ console.error(err); toast('Error generando el Word: '+err.message, 5000); }
}

/* ============================================================
   EXPORTAR PDF (jsPDF)
   ============================================================ */
function imgFormatFromDataUrl(durl){ return /^data:image\/png/.test(durl) ? 'PNG' : 'JPEG'; }
function loadImageEl(src){
  return new Promise((resolve,reject)=>{ const img=new Image(); img.onload=()=>resolve(img); img.onerror=reject; img.src=src; });
}
async function addImagePdf(doc, dataUrl, x, y, maxWmm, maxHmm){
  const img = await loadImageEl(dataUrl);
  let w=maxWmm, h=w*(img.height/img.width);
  if(h>maxHmm){ h=maxHmm; w=h*(img.width/img.height); }
  doc.addImage(dataUrl, imgFormatFromDataUrl(dataUrl), x, y, w, h);
  return h;
}
async function buildAndDownloadPdf(){
  if(!window.jspdf){ toast('La librería de PDF no cargó (revise la conexión a internet).', 5000); return; }
  toast('Generando PDF… puede tardar si hay fotos.', 5000);
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'mm', format:'a4'});
    const pageW=210, pageH=297, marginX=15, topStart=18, bottomLimit=18;
    const contentW = pageW - marginX*2;
    let y = topStart;
    function ensure(h){ if(y+h > pageH-bottomLimit){ doc.addPage(); y=topStart; } }
    function title(){
      doc.setFont('helvetica','bold'); doc.setFontSize(17); doc.setTextColor(31,58,92);
      doc.text(SCHEMA.title, pageW/2, y, {align:'center'}); y+=7;
      doc.setFont('helvetica','italic'); doc.setFontSize(10); doc.setTextColor(110,115,120);
      doc.text(SCHEMA.subtitle, pageW/2, y, {align:'center'}); y+=6;
      doc.setFont('helvetica','italic'); doc.setFontSize(8); doc.setTextColor(150,155,160);
      doc.text('Generado el '+new Date().toLocaleDateString('es-CL'), pageW/2, y, {align:'center'}); y+=8;
      doc.setTextColor(20,25,35);
    }
    function band(num,txt){
      ensure(10);
      doc.setFillColor(31,58,92); doc.rect(marginX,y,contentW,7.2,'F');
      doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(10.5);
      doc.text(num+'.  '+txt, marginX+3, y+5); y+=7.2+3; doc.setTextColor(20,25,35);
    }
    function noteTxt(t){
      doc.setFont('helvetica','italic'); doc.setFontSize(8); doc.setTextColor(120,120,120);
      doc.splitTextToSize(t,contentW).forEach(l=>{ ensure(4); doc.text(l,marginX,y); y+=4; });
      y+=1.5; doc.setTextColor(20,25,35);
    }
    function fieldTxt(label, value, required){
      doc.setFont('helvetica','bold'); doc.setFontSize(8.4); doc.setTextColor(40,55,75);
      doc.splitTextToSize(label+(required?' *':''), contentW).forEach(l=>{ ensure(3.8); doc.text(l,marginX,y); y+=3.8; });
      doc.setFont('helvetica','normal'); doc.setFontSize(8.8); doc.setTextColor(20,25,35);
      doc.splitTextToSize(value||'—', contentW-3).forEach(l=>{ ensure(4); doc.text(l,marginX+2,y); y+=4; });
      y+=1.4;
    }
    function flowChecklist(items){
      const lineH = 4.3;
      let cx = marginX;
      ensure(lineH);
      items.forEach(item=>{
        const w = doc.getTextWidth(item);
        if(cx > marginX && cx + w > marginX + contentW){
          y += lineH; cx = marginX; ensure(lineH);
        }
        doc.text(item, cx, y);
        cx += w + 3.5;
      });
      y += lineH + 1.3;
    }
    function choiceTxt(f){
      doc.setFont('helvetica','bold'); doc.setFontSize(8.4); doc.setTextColor(40,55,75);
      ensure(4); doc.text(f.label+(f.required?' *':''), marginX, y); y+=4.2;
      doc.setFont('helvetica','normal'); doc.setFontSize(8.6); doc.setTextColor(20,25,35);
      const items=f.options.map(o=>(state.choices[f.id]===o?'[x] ':'[ ] ')+o);
      if(f.other) items.push((state.choices[f.id]==='__other__'?'[x] ':'[ ] ')+'Otro: '+(state.choiceOther[f.id]||''));
      flowChecklist(items);
    }
    function gridTxt(f){
      doc.setFont('helvetica','bold'); doc.setFontSize(8.6); doc.setTextColor(31,58,92);
      ensure(4.2); doc.text(f.label, marginX, y); y+=4.2;
      doc.setFont('helvetica','normal'); doc.setFontSize(8.6); doc.setTextColor(20,25,35);
      const items=f.options.map(o=>((state.grids[f.id]&&state.grids[f.id].has(o))?'[x] ':'[ ] ')+o);
      flowChecklist(items);
      if(f.other){ ensure(4); doc.text('Otro: '+(state.gridOther[f.id]||'—'), marginX, y); y+=4; }
      y+=1.5;
    }
    function fieldsBlockPdf(fields){
      (fields||[]).forEach(f=>{
        if(f.type==='grid') gridTxt(f);
        else if(f.type==='choice') choiceTxt(f);
        else if(f.type==='date') fieldTxt(f.label, formatDateEs(state.values[f.id]), f.required);
        else fieldTxt(f.label, (state.values[f.id]||'')+((f.unit && state.values[f.id])?(' ('+f.unit+')'):''), f.required);
      });
    }
    function historyTablePdf(s){
      const rowsData = state.values['t_'+s.num] || [];
      const colw = contentW/s.columns.length;
      ensure(6);
      doc.setFont('helvetica','bold'); doc.setFontSize(7.6); doc.setFillColor(31,58,92); doc.setTextColor(255,255,255);
      doc.rect(marginX,y,contentW,5.2,'F');
      s.columns.forEach((c,i)=>doc.text(c, marginX+i*colw+1.5, y+3.6));
      y+=5.2;
      doc.setFont('helvetica','normal'); doc.setFontSize(7.8); doc.setTextColor(20,25,35);
      rowsData.forEach(row=>{
        ensure(5);
        row.forEach((val,i)=>doc.text((val||'—').slice(0,28), marginX+i*colw+1.5, y+3.4));
        doc.setDrawColor(220,225,230); doc.line(marginX,y+5,marginX+contentW,y+5);
        y+=5;
      });
      y+=3;
    }
    async function attachmentsSectionPdf(s){
      for(const g of s.groups){
        ensure(6); doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(31,58,92);
        doc.text(g.group, marginX, y); y+=5;
        for(const att of g.attachments){
          const files = state.files[att.id]||[];
          ensure(5);
          doc.setFont('helvetica','bold'); doc.setFontSize(8.2); doc.setTextColor(40,55,75);
          doc.text(att.label, marginX, y); y+=4.2;
          if(!files.length){
            doc.setFont('helvetica','italic'); doc.setFontSize(8); doc.setTextColor(150,155,160);
            doc.text('(sin archivo adjunto)', marginX+3, y); y+=4.5;
          } else {
            const images=files.filter(f=>f.isImage), others=files.filter(f=>!f.isImage);
            for(const img of images){
              try{
                const durl = img.previewUrl || await fileToDataUrl(img.file);
                ensure(45);
                const h = await addImagePdf(doc, durl, marginX+3, y, 55, 42);
                y += h+3;
              }catch(e){}
            }
            if(others.length){
              doc.setFont('helvetica','italic'); doc.setFontSize(8); doc.setTextColor(110,115,120);
              doc.text('Ver en ZIP: '+others.map(o=>o.name).join(', '), marginX+3, y); y+=4.5;
            }
          }
          doc.setTextColor(20,25,35);
        }
        y+=2;
      }
    }
    async function signatureSectionPdf(s){
      doc.setFont('helvetica','italic'); doc.setFontSize(8.3); doc.setTextColor(110,115,120);
      doc.splitTextToSize(s.declaracion, contentW).forEach(l=>{ ensure(4); doc.text(l,marginX,y); y+=4; });
      y+=2; doc.setTextColor(20,25,35);
      fieldsBlockPdf(s.fields);
      ensure(40);
      const colw=contentW/2, startY=y;
      for(let i=0;i<s.signers.length;i++){
        const key = i===0?'corredora':'propietario';
        const durl = state.signatures[key];
        const cx = marginX + i*colw;
        if(durl){ try{ await addImagePdf(doc, durl, cx+5, startY, colw-10, 22); }catch(e){} }
        doc.setDrawColor(60,60,60);
        doc.line(cx+5, startY+26, cx+colw-5, startY+26);
        doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(110,115,120);
        doc.text(s.signers[i], cx+colw/2, startY+30, {align:'center'});
      }
      y = startY+36; doc.setTextColor(20,25,35);
    }

    title();
    for(const s of SCHEMA.sections){
      band(s.num, s.title);
      if(s.note) noteTxt(s.note);
      if(s.type==='table') historyTablePdf(s);
      else if(s.type==='signature') await signatureSectionPdf(s);
      else if(s.is_attachment_section) await attachmentsSectionPdf(s);
      else fieldsBlockPdf(s.fields);
      y+=2;
    }
    doc.save(niceFileBase()+'.pdf');
    toast('PDF descargado correctamente.');
  }catch(err){ console.error(err); toast('Error generando el PDF: '+err.message, 5000); }
}

/* ============================================================
   EXPORTAR ARCHIVOS ADJUNTOS (.zip)
   ============================================================ */
async function buildAndDownloadZip(){
  try{
    const zip = new JSZip();
    let count = 0;
    for(const key in state.files){
      for(const f of state.files[key]){
        try{
          const buf = await f.file.arrayBuffer();
          zip.file(key+'__'+f.name, buf);
          count++;
        }catch(e){ console.warn('No se pudo leer el archivo para el ZIP:', f.name, e); }
      }
    }
    if(state.signatures.corredora){
      try{ const b=await (await fetch(state.signatures.corredora)).blob(); zip.file('firma_corredora.png', await b.arrayBuffer()); count++; }catch(e){}
    }
    if(state.signatures.propietario){
      try{ const b=await (await fetch(state.signatures.propietario)).blob(); zip.file('firma_propietario.png', await b.arrayBuffer()); count++; }catch(e){}
    }
    if(count===0){ toast('No hay archivos adjuntos ni firmas para descargar todavía.', 3800); return; }
    toast('Empaquetando '+count+' archivo(s)…', 3000);
    const blob = await zip.generateAsync({type:'blob'});
    downloadBlob(blob, niceFileBase()+'_adjuntos.zip');
    toast(count+' archivo(s) descargados en ZIP.');

/* ----- UF en vivo (mindicador.cl) ----- */
const UF = { value: 0, loaded: false };
const moneyRefreshers = [];
function getUF(){ return UF.value; }
function parseNum(x){ if(x==null) return NaN; return parseFloat(String(x).replace(/\./g,'').replace(',', '.').replace(/[^0-9.\-]/g,'')); }
function fmtCLP(n){ return '$'+Math.round(n).toLocaleString('es-CL'); }
function fmtUF(n){ return Number(n).toLocaleString('es-CL',{minimumFractionDigits:2,maximumFractionDigits:2})+' UF'; }
function fetchUF(){
  fetch('https://mindicador.cl/api/uf').then(r=>r.json()).then(j=>{
    const v = j && j.serie && j.serie[0] ? j.serie[0].valor : 0;
    if(v){ UF.value = v; UF.loaded = true; try{ localStorage.setItem('ficha_uf', JSON.stringify({v:v,d:Date.now()})); }catch(e){} }
    updateUFBadge(); moneyRefreshers.forEach(fn=>{ try{ fn(); }catch(e){} });
  }).catch(()=>{ updateUFBadge(); });
}
function updateUFBadge(){
  const bar = document.getElementById('ufBar'); if(!bar) return;
  bar.innerHTML='';
  bar.appendChild(el('span',{class:'uf-lbl'}, UF.value ? ('UF de hoy: '+fmtCLP(UF.value)) : 'UF: cargando…'));
  const ref = el('button',{class:'uf-btn',type:'button'}, 'Actualizar');
  ref.addEventListener('click', fetchUF);
  bar.appendChild(ref);
  bar.appendChild(el('span',{class:'uf-mini'}, 'Ajustar:'));

  bar.appendChild(man);
}

/* ----- Montos con conversión UF <-> CLP en vivo ----- */
const MONEY_UNITS = { UF:1, CLP:1 };
function isMoney(f){ return f.type==='text' && (f.money===true || MONEY_UNITS[f.unit]); }
function moneyCurOf(f){ return state.moneyCur[f.id] || (f.unit==='CLP' ? 'CLP' : 'UF'); }
function moneyText(f){
  const raw = state.values[f.id]; if(raw==null || String(raw).trim()==='') return '—';
  const a = parseNum(raw); if(isNaN(a)) return String(raw);
  const cur = moneyCurOf(f), uf = getUF();
  if(cur==='UF') return fmtUF(a) + (uf ? (' (≈ '+fmtCLP(a*uf)+')') : '');
  return fmtCLP(a) + (uf ? (' (≈ '+fmtUF(a/uf)+')') : '');
}
function renderMoney(f){
  const box = el('div');
  const wrap = el('div',{class:'money-wrap'});
  const inp = el('input',{type:'text',inputmode:'decimal',placeholder:'0'});

  const bUF = el('button',{type:'button'},'UF');
  const bCLP = el('button',{type:'button'},'CLP');
  const conv = el('div',{class:'conv-line'});
  function refresh(){
    bUF.classList.toggle('on', moneyCurOf(f)==='UF');
    bCLP.classList.toggle('on', moneyCurOf(f)==='CLP');
    const a = parseNum(state.values[f.id]), uf = getUF();
    if(!isNaN(a) && String(state.values[f.id]||'').trim()!=='' && uf){
      conv.style.display='block';
      conv.textContent = moneyCurOf(f)==='UF'
        ? ('≈ '+fmtCLP(a*uf)+' CLP   ·   UF '+fmtCLP(uf))
        : ('≈ '+fmtUF(a/uf)+'   ·   UF '+fmtCLP(uf));
    } else if(!uf){ conv.style.display='block'; conv.textContent='(cargando valor UF…)'; }
    else conv.style.display='none';
  }
  inp.addEventListener('input', ()=>{ state.values[f.id]=inp.value; moneyRefreshers.forEach(fn=>{try{fn();}catch(e){}}); updateProgress(); });
  bUF.addEventListener('click', ()=>{ state.moneyCur[f.id]='UF'; refresh(); });
  bCLP.addEventListener('click', ()=>{ state.moneyCur[f.id]='CLP'; refresh(); });
  tog.appendChild(bUF); tog.appendChild(bCLP);

function renderMulta(f){

function renderInlineAttach(f){
  if(!state.files[f.id]) state.files[f.id]=[];
  const box = el('div',{class:'attach-inline'});
  const inputId = 'inl_'+f.id;
  const input = el('input',{type:'file',multiple:'multiple',id:inputId,style:'display:none;'});
  const drop = el('label',{class:'fx-drop',for:inputId},'Adjuntar archivo(s)');

    list.innerHTML='';

      const chip = el('div',{class:'file-chip'});
      if(fobj.isImage && fobj.previewUrl) chip.appendChild(el('img',{src:fobj.previewUrl}));
      else chip.appendChild(el('div',{class:'fx'}, extShort(fobj.name)));

    });

/* ----- Buscador con tolerancia a errores ----- */
function norms(s){ return (s==null?'':String(s)).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }
function levd(a,b){ const m=a.length,n=b.length; if(!m)return n; if(!n)return m; let p=Array.from({length:n+1},(_,i)=>i); for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
function buildSearchIndex(){
  const idx=[];
  getAllSections().forEach(s=>{
    sectionFields(s).forEach(f=>{
      let val='';
      if(f.type==='choice') val = (state.choices[f.id]==='__other__') ? ('Otro: '+(state.choiceOther[f.id]||'')) : (state.choices[f.id]||'');
      else if(f.type==='grid') val = state.grids[f.id] ? Array.from(state.grids[f.id]).join(', ') : '';
      else if(f.type==='attach') val = (state.files[f.id]||[]).map(x=>x.name).join(', ');
      else if(f.type==='text' && isMoney(f)){ const m=moneyText(f); val = m==='—'?'':m; }
      else val = state.values[f.id]||'';
      const files=(state.files[f.id]||[]).map(x=>x.name).join(' ');
      const note=state.notes[f.id]||'', com=state.comments[f.id]||'';
      idx.push({ sec:s.num+'. '+s.title, num:s.num, id:f.id, label:f.label, val:String(val), text:[f.label,val,files,note,com,s.title].join(' ') });
    });
    if(s.is_attachment_section){ (s.groups||[]).forEach(g=>g.attachments.forEach(att=>{ const files=(state.files[att.id]||[]).map(x=>x.name).join(', '); idx.push({ sec:s.num+'. '+s.title, num:s.num, id:att.id, label:att.label, val:files, text:[att.label,files,g.group,s.title].join(' ') }); })); }
  });
  return idx;
}
function doSearch(q){
  const nq=norms(q); if(nq.length<2) return {exact:[],fuzzy:[]};
  const toks=nq.split(/\s+/).filter(t=>t.length>=2);
  const idx=buildSearchIndex(), ex=[], fz=[];
  idx.forEach(e=>{
    const hay=norms(e.text); let score=0,isEx=false,isFz=false;
    if(hay.includes(nq)){ isEx=true; score+=1000-Math.min(hay.indexOf(nq),400); }
    const words=hay.split(/\s+/);
    toks.forEach(t=>{ let best=0,bf=false; words.forEach(w=>{ if(!w)return; if(w===t)best=Math.max(best,300); else if(w.startsWith(t))best=Math.max(best,220); else if(w.includes(t))best=Math.max(best,150); else{ const d=levd(t,w), sim=1-d/Math.max(t.length,w.length); if(sim>=0.66){ const sc=Math.round(140*sim); if(sc>best){ best=sc; bf=true; } } } }); if(best>0){ score+=best; if(bf)isFz=true; else isEx=true; } });
    if(score>0){ if(isEx)ex.push({e,score}); else if(isFz)fz.push({e,score}); }
  });
  ex.sort((a,b)=>b.score-a.score); fz.sort((a,b)=>b.score-a.score);
  return { exact:ex.slice(0,40), fuzzy:fz.slice(0,12) };
}
function ensureSearchOverlay(){
  if(document.getElementById('searchOverlay')) return;
  const ov = el('div',{id:'searchOverlay'});
  const box = el('div',{class:'search-box'});
  const head = el('div',{class:'search-head'});
  const sic=el('span',{class:'sicon'}); sic.innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>'; head.appendChild(sic);
  const inp = el('input',{type:'text',id:'searchInput',placeholder:'Buscar en toda la ficha: campos, valores, notas, adjuntos…'});
  head.appendChild(inp);
  const cl = el('span',{class:'sclose'},'ESC'); cl.addEventListener('click', closeSearch); head.appendChild(cl);
  const res = el('div',{class:'search-results',id:'searchResults'});
  box.appendChild(head); box.appendChild(res); ov.appendChild(box);
  ov.addEventListener('click', e=>{ if(e.target===ov) closeSearch(); });
  inp.addEventListener('input', ()=>renderSearch(inp.value));
  document.body.appendChild(ov);
  renderSearch('');
}
function renderSearch(q){
  const res=document.getElementById('searchResults'); if(!res) return; res.innerHTML='';
  if((q||'').trim().length<2){ res.appendChild(el('div',{class:'sr-note'},'Escribe al menos 2 letras. El buscador tolera errores de tipeo y muestra resultados similares.')); return; }
  const {exact,fuzzy}=doSearch(q);
  if(!exact.length && !fuzzy.length){ res.appendChild(el('div',{class:'sr-note'},'Sin coincidencias para “'+q+'”.')); return; }
  function item(r){
    const it=el('div',{class:'sr-item'});
    it.appendChild(el('div',{class:'sr-lbl'}, r.e.label));
    it.appendChild(el('div',{class:'sr-sec'}, r.e.sec));
    if(r.e.val) it.appendChild(el('div',{class:'sr-val'}, String(r.e.val).slice(0,120)));
    it.addEventListener('click', ()=>{ closeSearch(); goToField(r.e.num, r.e.id); });
    return it;
  }
  exact.forEach(r=>res.appendChild(item(r)));
  if(fuzzy.length){ res.appendChild(el('div',{class:'sr-fuzzy'},'Resultados similares (¿quisiste decir algo parecido?)')); fuzzy.forEach(r=>res.appendChild(item(r))); }
}
function openSearch(){ ensureSearchOverlay(); document.getElementById('searchOverlay').classList.add('on'); const i=document.getElementById('searchInput'); if(i){ i.value=''; renderSearch(''); setTimeout(()=>i.focus(),40); } }
function closeSearch(){ const o=document.getElementById('searchOverlay'); if(o) o.classList.remove('on'); }
function goToField(num,id){
  expandSection(num);
  const target = document.getElementById('fld-'+id) || document.getElementById('sec-'+num);
  if(target){ target.scrollIntoView({behavior:'smooth',block:'center'}); if(target.classList.contains('field')){ target.classList.add('flash'); setTimeout(()=>target.classList.remove('flash'),2600); } }
}
