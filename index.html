  const delInter=(i)=>{ if(!sel) return; patch(sel.id,{interacciones:(sel.interacciones||[]).filter(x=>x.id!==i)}); };
  const addVisita=()=>{ if(!sel) return; const arr=[...(sel.visitas||[]),{id:"v"+Date.now().toString(36),fecha:vFecha,hora:vHora,propId:vProp,estado:"agendada",notas:vNota}]; const idx=CRM_ESTADOS.findIndex(e=>e.id===sel.estado); const extra=(idx<3)?{estado:"visita"}:{}; patch(sel.id,{visitas:arr,...extra}); setVNota(""); notify&&notify("Visita agendada"); };
  const setVisitaEstado=(vid,e)=>{ if(!sel) return; patch(sel.id,{visitas:(sel.visitas||[]).map(v=>v.id===vid?{...v,estado:e}:v)}); };
  const delVisita=(vid)=>{ if(!sel) return; patch(sel.id,{visitas:(sel.visitas||[]).filter(v=>v.id!==vid)}); };
  const addTarea=()=>{ if(!sel||!tTit.trim()) return; patch(sel.id,{tareas:[...(sel.tareas||[]),{id:"t"+Date.now().toString(36),titulo:tTit.trim(),vence:tVen,hecha:false}]}); setTTit(""); };
  const toggleTarea=(tid)=>{ if(!sel) return; patch(sel.id,{tareas:(sel.tareas||[]).map(t=>t.id===tid?{...t,hecha:!t.hecha}:t)}); };
  const delTarea=(tid)=>{ if(!sel) return; patch(sel.id,{tareas:(sel.tareas||[]).filter(t=>t.id!==tid)}); };

  const waLead=(l,texto)=>{ const n=waNum(l.telefono); const base=n?("https://wa.me/"+n):"https://wa.me/"; window.open(base+(texto?("?text="+encodeURIComponent(texto)):""),"_blank","noopener"); };

  const matchQ=(l)=>{ if(!q.trim()) return true; const s=(l.nombre+" "+l.telefono+" "+(l.email||"")+" "+(l.comuna||"")+" "+(l.notas||"")+" "+propName(l.propInteres)).toLowerCase(); return q.toLowerCase().split(/\s+/).every(t=>s.includes(t)); };
  const leadsFiltrados = leads.filter(matchQ).filter(l=>fEstado==="todos"||l.estado===fEstado).filter(l=>fFuente==="todos"||l.fuente===fFuente);
  const visitasTodas = leads.flatMap(l=>(l.visitas||[]).map(v=>({...v,lead:l}))).sort((a,b)=>String(a.fecha+a.hora).localeCompare(String(b.fecha+b.hora)));
  const tareasTodas = leads.flatMap(l=>(l.tareas||[]).map(t=>({...t,lead:l}))).filter(t=>!t.hecha).sort((a,b)=>String(a.vence).localeCompare(String(b.vence)));
  const totalLeads=leads.length;
  const ganados=leads.filter(l=>l.estado==="ganado").length, perdidos=leads.filter(l=>l.estado==="perdido").length;
  const winRate = (ganados+perdidos)>0 ? Math.round(ganados/(ganados+perdidos)*100) : 0;
  const activos = leads.filter(l=>l.estado!=="ganado"&&l.estado!=="perdido").length;
  const porFuente = CRM_FUENTES.map(f=>({f,n:leads.filter(l=>l.fuente===f).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n);
  const maxFuente = porFuente.reduce((m,x)=>Math.max(m,x.n),1);
  const hoyISO=isoInDays(0);

  const TABS=[["embudo","Embudo"],["lista","Leads"],["agenda","Visitas"],["tareas","✓ Seguimientos"],["respuestas","Respuestas rápidas"],["metricas","Métricas"]];

  const Card=({l})=>{ const e=est(l.estado); const ult=(l.interacciones||[])[0]; const prox=(l.visitas||[]).filter(v=>v.estado==="agendada")[0]; const tarea=(l.tareas||[]).filter(t=>!t.hecha)[0];
    return (<div className="crm-card" style={{borderLeftColor:e.color}} onClick={()=>setSelId(l.id)}>
      <div className="nm">{l.nombre}</div>
      <div><span className="crm-chip">{l.fuente}</span> {l.tipoBusqueda==="compra"&&<span className="crm-chip" style={{background:"var(--amber-bg)",color:"var(--amber)"}}>compra</span>}</div>
      <div className="mt">{[propName(l.propInteres)||l.comuna, l.dorms?(l.dorms+"D"):"", l.presupuesto?((l.tipoBusqueda==="compra"&&num(l.presupuesto)<100000)?(l.presupuesto+" UF"):CLP(num(l.presupuesto))):""].filter(Boolean).join(" · ")}</div>
      {prox && <div className="mt">Visita {fmtF(prox.fecha)} {prox.hora}</div>}
      {!prox && tarea && <div className="mt" style={{color: tarea.vence<=hoyISO?"var(--red-d)":"var(--muted)"}}>✓ {tarea.titulo} ({fmtF(tarea.vence)})</div>}
      {!prox && !tarea && ult && <div className="mt" style={{fontStyle:"italic"}}>“{ult.texto.slice(0,60)}{ult.texto.length>60?"…":""}”</div>}
      <div className="crm-mini" style={{justifyContent:"space-between",alignItems:"center"}}>
        <span style={{display:"flex",gap:6}}>
          <button className="btn btn-ghost btn-xs" title="Etapa anterior" onClick={ev=>{ev.stopPropagation();moveEstado(l,-1);}}>◀</button>
          <button className="btn btn-ghost btn-xs" title="Siguiente etapa" onClick={ev=>{ev.stopPropagation();moveEstado(l,1);}}>▶</button>
        </span>
        {l.telefono && <button className="btn btn-ghost btn-xs" title="WhatsApp" onClick={ev=>{ev.stopPropagation();waLead(l,"");}}></button>}
      </div>
    </div>);
  };

  return (<div>
    <div className="help g" style={{marginBottom:12}}>Tu <b>CRM</b>: captura cada prospecto (WhatsApp, Instagram, portales…), muévelo por el <b>embudo</b>, agenda <b>visitas</b>, deja <b>seguimientos</b>, responde al instante con <b>respuestas rápidas</b> y mide tu <b>conversión</b>. Pensado para arrendar y vender más rápido.</div>

    <div className="crm-tabs">
      {TABS.map(([id,lab])=><button key={id} className={"crm-tab"+(view===id?" on":"")} onClick={()=>setView(id)}>{lab}</button>)}
      <div style={{flex:1}}/>
      <button className="btn btn-primary btn-sm" onClick={()=>setNuevoOpen(true)}>+ Nuevo lead</button>
    </div>

    {(view==="embudo"||view==="lista") && <div className="field" style={{maxWidth:420,marginBottom:12}}>
      <input className="input" placeholder="Buscar por nombre, teléfono, comuna, nota…" value={q} onChange={e=>setQ(e.target.value)}/>
    </div>}

    {view==="embudo" && <div className="crm-board">
      {CRM_ESTADOS.map(e=>{ const col=leadsFiltrados.filter(l=>l.estado===e.id); return (
        <div key={e.id} className="crm-col">
          <h4 style={{color:e.color}}>{e.label}<span className="n">{col.length}</span></h4>
          {col.map(l=><Card key={l.id} l={l}/>)}
          {!col.length && <div style={{fontSize:12,color:"var(--faint)",textAlign:"center",padding:"8px 0"}}>—</div>}
        </div>
      ); })}
    </div>}

    {view==="lista" && <div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>
        <select className="input" style={{maxWidth:200}} value={fEstado} onChange={e=>setFEstado(e.target.value)}><option value="todos">Todas las etapas</option>{CRM_ESTADOS.map(e=><option key={e.id} value={e.id}>{e.label}</option>)}</select>
        <select className="input" style={{maxWidth:200}} value={fFuente} onChange={e=>setFFuente(e.target.value)}><option value="todos">Todas las fuentes</option>{CRM_FUENTES.map(f=><option key={f} value={f}>{f}</option>)}</select>
      </div>
      {leadsFiltrados.length? leadsFiltrados.map(l=>{ const e=est(l.estado); return (
        <div key={l.id} className="crm-card" style={{borderLeftColor:e.color,display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}} onClick={()=>setSelId(l.id)}>
          <div style={{minWidth:0}}>
            <div className="nm">{l.nombre} <span className="crm-chip" style={{background:e.color+"22",color:e.color}}>{e.label}</span></div>
            <div className="mt">{[l.fuente, propName(l.propInteres)||l.comuna, l.telefono].filter(Boolean).join(" · ")}</div>
          </div>
          <div style={{display:"flex",gap:6,flexShrink:0}}>
            {l.telefono&&<button className="btn btn-ghost btn-xs" onClick={ev=>{ev.stopPropagation();waLead(l,"");}}></button>}
            {l.telefono&&<a className="btn btn-ghost btn-xs" href={"tel:"+l.telefono} onClick={ev=>ev.stopPropagation()}></a>}
            {l.email&&<a className="btn btn-ghost btn-xs" href={"mailto:"+l.email} onClick={ev=>ev.stopPropagation()}></a>}
          </div>
        </div>
      ); }) : <div className="help">No hay leads con esos filtros. Agrega uno con “+ Nuevo lead”.</div>}
    </div>}

    {view==="agenda" && <div>
      {visitasTodas.length? visitasTodas.map((v,idx)=>{ const e=est(v.lead.estado); const pasada=v.fecha<hoyISO; return (
        <div key={idx} className="crm-card" style={{borderLeftColor:v.estado==="realizada"?"#1f9d57":(v.estado==="cancelada"?"#dc2626":"#0891b2")}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <div onClick={()=>setSelId(v.lead.id)} style={{cursor:"pointer",minWidth:0}}>
              <div className="nm">{fmtF(v.fecha)} · {v.hora} — {v.lead.nombre}</div>
              <div className="mt">{[propName(v.propId)||v.lead.comuna, "Estado: "+v.estado, v.notas].filter(Boolean).join(" · ")}</div>
            </div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {v.lead.telefono&&<button className="btn btn-ghost btn-xs" onClick={()=>waLead(v.lead,"Hola "+(v.lead.nombre||"").split(" ")[0]+", te confirmo tu visita el "+fmtF(v.fecha)+" a las "+v.hora+". ¡Te espero!")}>Confirmar</button>}
              {v.estado==="agendada"&&<button className="btn btn-ghost btn-xs" onClick={()=>{setSelId(v.lead.id);setVisitaEstado(v.id,"realizada");}}>✓ Realizada</button>}
            </div>
          </div>
          {pasada&&v.estado==="agendada"&&<div className="mt" style={{color:"var(--red-d)"}}>Visita vencida sin marcar</div>}
        </div>
      ); }) : <div className="help">No hay visitas agendadas. Abre un lead y agéndale una visita.</div>}
    </div>}

    {view==="tareas" && <div>
      {tareasTodas.length? tareasTodas.map((t,idx)=>{ const vence=t.vence<=hoyISO; return (
        <div key={idx} className="crm-card" style={{borderLeftColor:vence?"#dc2626":"#d97706",display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
          <div onClick={()=>setSelId(t.lead.id)} style={{cursor:"pointer",minWidth:0}}>
            <div className="nm">{t.titulo}</div>
            <div className="mt" style={{color:vence?"var(--red-d)":"var(--muted)"}}>{t.lead.nombre} · vence {fmtF(t.vence)}{vence?" (atrasada)":""}</div>
          </div>
          <button className="btn btn-out btn-xs" onClick={()=>{setSelId(t.lead.id);toggleTarea(t.id);}}>✓ Hecha</button>
        </div>
      ); }) : <div className="help">Sin seguimientos pendientes. Abre un lead para agregar una tarea.</div>}
    </div>}

    {view==="respuestas" && <div>
      <div className="help" style={{marginBottom:10}}>Mensajes listos para responder al instante. Variables: <code>{"{nombre}"}</code>, <code>{"{empresa}"}</code>, <code>{"{propiedad}"}</code>, <code>{"{monto}"}</code>, <code>{"{comuna}"}</code>, <code>{"{dia}"}</code>, <code>{"{hora}"}</code> (se completan al usarlas desde un lead).</div>
      {(qreplies||[]).map(r=>(
        <div key={r.id} className="card" style={{padding:12,marginBottom:10}}>
          <input className="input" value={r.titulo} onChange={e=>setQreplies(qs=>qs.map(x=>x.id===r.id?{...x,titulo:e.target.value}:x))} style={{fontWeight:700,marginBottom:6}}/>
          <textarea className="input" value={r.texto} onChange={e=>setQreplies(qs=>qs.map(x=>x.id===r.id?{...x,texto:e.target.value}:x))} style={{minHeight:70}}/>
          <div style={{display:"flex",gap:8,marginTop:8,flexWrap:"wrap"}}>
            <button className="btn btn-ghost btn-sm" onClick={()=>{ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(r.texto).then(()=>notify&&notify("Copiado")); }}>Copiar</button>
            <button className="btn btn-ghost btn-sm" onClick={()=>window.open("https://wa.me/?text="+encodeURIComponent(r.texto),"_blank","noopener")}>WhatsApp</button>
            <div style={{flex:1}}/>
            <button className="btn btn-ghost btn-sm" style={{color:"var(--red-d)"}} onClick={()=>setQreplies(qs=>qs.filter(x=>x.id!==r.id))}>✕ Eliminar</button>
          </div>
        </div>
      ))}
      <button className="btn btn-out btn-sm" onClick={()=>setQreplies(qs=>[...qs,{id:"qr"+Date.now().toString(36),titulo:"Nueva respuesta",texto:"Escribe aquí tu mensaje para {nombre}."}])}>+ Nueva respuesta</button>
    </div>}

    {view==="metricas" && <div>
      <div className="grid c4" style={{gridTemplateColumns:"repeat(4,1fr)",gap:10}}>
        <div className="stat" style={{borderTopColor:"#1F3A5C"}}><div className="lab">Leads totales</div><div className="val">{totalLeads}</div><div className="sub" style={{color:"var(--muted)"}}>{activos} activos</div></div>
        <div className="stat" style={{borderTopColor:"#0891b2"}}><div className="lab">Visitas próximas</div><div className="val">{visitasTodas.filter(v=>v.estado==="agendada"&&v.fecha>=hoyISO).length}</div><div className="sub" style={{color:"var(--muted)"}}>agendadas</div></div>
        <div className="stat" style={{borderTopColor:"#d97706"}}><div className="lab">✓ Seguimientos</div><div className="val">{tareasTodas.length}</div><div className="sub" style={{color:"var(--muted)"}}>pendientes</div></div>
        <div className="stat" style={{borderTopColor:"#1f9d57"}}><div className="lab">Tasa de cierre</div><div className="val">{winRate}%</div><div className="sub" style={{color:"var(--muted)"}}>{ganados} ganados · {perdidos} perdidos</div></div>
      </div>
      <div className="card" style={{padding:14,marginTop:12}}>
        <div style={{fontWeight:800,marginBottom:10}}>Embudo de conversión</div>
        {CRM_ESTADOS.map(e=>{ const n=leads.filter(l=>l.estado===e.id).length; const pct=totalLeads?Math.round(n/totalLeads*100):0; return (
          <div key={e.id} style={{marginBottom:8}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:3}}><span>{e.label}</span><span style={{color:"var(--muted)"}}>{n}</span></div>
            <div className="crm-bar"><span style={{width:Math.max(pct,n?4:0)+"%",background:e.color}}/></div>
          </div>
        ); })}
      </div>
      {!!porFuente.length && <div className="card" style={{padding:14,marginTop:12}}>
        <div style={{fontWeight:800,marginBottom:10}}>Leads por fuente</div>
        {porFuente.map(x=>(
          <div key={x.f} style={{marginBottom:8}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:3}}><span>{x.f}</span><span style={{color:"var(--muted)"}}>{x.n}</span></div>
            <div className="crm-bar"><span style={{width:Math.round(x.n/maxFuente*100)+"%",background:"#1F3A5C"}}/></div>
          </div>
        ))}
      </div>}
    </div>}

    {/* ---- Modal nuevo lead ---- */}
    {nuevoOpen && <div className="modal-bg" onClick={()=>setNuevoOpen(false)}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><b>+ Nuevo lead</b><button className="btn btn-ghost btn-sm" onClick={()=>setNuevoOpen(false)}>✕</button></div>
        <div className="modal-body">
          <div className="grid c2" style={{gridTemplateColumns:"1fr 1fr",gap:10}}>
            <div className="field"><label className="label">Nombre</label><input className="input" value={nl.nombre} onChange={e=>setNl({...nl,nombre:e.target.value})}/></div>
            <div className="field"><label className="label">Teléfono / WhatsApp</label><input className="input" value={nl.telefono} onChange={e=>setNl({...nl,telefono:e.target.value})}/></div>
            <div className="field"><label className="label">Correo</label><input className="input" value={nl.email} onChange={e=>setNl({...nl,email:e.target.value})}/></div>
            <div className="field"><label className="label">Fuente</label><select className="input" value={nl.fuente} onChange={e=>setNl({...nl,fuente:e.target.value})}>{CRM_FUENTES.map(f=><option key={f}>{f}</option>)}</select></div>
            <div className="field"><label className="label">Busca</label><select className="input" value={nl.tipoBusqueda} onChange={e=>setNl({...nl,tipoBusqueda:e.target.value})}><option value="arriendo">Arriendo</option><option value="compra">Compra</option></select></div>
            <div className="field"><label className="label">Propiedad de interés</label><select className="input" value={nl.propInteres} onChange={e=>setNl({...nl,propInteres:e.target.value})}><option value="">— Sin asignar —</option>{propiedades.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
            <div className="field"><label className="label">Comuna / sector</label><input className="input" value={nl.comuna} onChange={e=>setNl({...nl,comuna:e.target.value})}/></div>
            <div className="field"><label className="label">Presupuesto ({nl.tipoBusqueda==="compra"?"UF o $":"$"}/mes)</label><input className="input" value={nl.presupuesto} onChange={e=>setNl({...nl,presupuesto:e.target.value})}/></div>
            <div className="field"><label className="label">Dormitorios</label><input className="input" value={nl.dorms} onChange={e=>setNl({...nl,dorms:e.target.value})}/></div>
          </div>
          <div className="field" style={{marginTop:10}}><label className="label">Notas</label><textarea className="input" value={nl.notas} onChange={e=>setNl({...nl,notas:e.target.value})} style={{minHeight:70}}/></div>
        </div>
        <div className="modal-foot"><button className="btn btn-primary" onClick={()=>addLead(nl)}>Agregar lead</button><button className="btn btn-ghost" onClick={()=>setNuevoOpen(false)}>Cancelar</button></div>
      </div>
    </div>}

    {/* ---- Modal detalle lead ---- */}
    {sel && <div className="modal-bg" onClick={()=>setSelId(null)}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><b>{sel.nombre}</b> <span className="crm-chip" style={{background:est(sel.estado).color+"22",color:est(sel.estado).color}}>{est(sel.estado).label}</span><div style={{flex:1}}/><button className="btn btn-ghost btn-sm" onClick={()=>setSelId(null)}>✕</button></div>
        <div className="modal-body">
          {/* etapa */}
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
            {CRM_ESTADOS.map(e=><button key={e.id} onClick={()=>patch(sel.id,{estado:e.id})} className="crm-tab" style={sel.estado===e.id?{background:e.color,borderColor:e.color,color:"#fff"}:{}}>{e.label}</button>)}
          </div>
          {/* acciones rápidas */}
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
            {sel.telefono&&<button className="btn btn-out btn-sm" onClick={()=>waLead(sel,"")}>WhatsApp</button>}
            {sel.telefono&&<a className="btn btn-out btn-sm" href={"tel:"+sel.telefono}>Llamar</a>}
            {sel.email&&<a className="btn btn-out btn-sm" href={"mailto:"+sel.email}>Correo</a>}
          </div>
          {/* respuesta rápida */}
          <div className="card" style={{padding:12,marginBottom:14}}>
            <div style={{fontWeight:700,marginBottom:6,fontSize:13.5}}>Enviar respuesta rápida</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <select className="input" style={{flex:1,minWidth:180}} value={qrSel} onChange={e=>setQrSel(e.target.value)}><option value="">Elige un mensaje…</option>{(qreplies||[]).map(r=><option key={r.id} value={r.id}>{r.titulo}</option>)}</select>
              <button className="btn btn-ghost btn-sm" disabled={!qrSel} onClick={()=>{ const r=(qreplies||[]).find(x=>x.id===qrSel); if(r) waLead(sel,tok(r.texto,sel)); }}>Enviar</button>
              <button className="btn btn-ghost btn-sm" disabled={!qrSel} onClick={()=>{ const r=(qreplies||[]).find(x=>x.id===qrSel); if(r&&navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(tok(r.texto,sel)).then(()=>notify&&notify("Copiado")); }}>Copiar</button>
            </div>
          </div>
          {/* datos */}
          <div className="grid c2" style={{gridTemplateColumns:"1fr 1fr",gap:10}}>
            <div className="field"><label className="label">Nombre</label><input className="input" value={sel.nombre} onChange={e=>patch(sel.id,{nombre:e.target.value})}/></div>
            <div className="field"><label className="label">Teléfono / WhatsApp</label><input className="input" value={sel.telefono} onChange={e=>patch(sel.id,{telefono:e.target.value})}/></div>
            <div className="field"><label className="label">Correo</label><input className="input" value={sel.email||""} onChange={e=>patch(sel.id,{email:e.target.value})}/></div>
            <div className="field"><label className="label">Fuente</label><select className="input" value={sel.fuente} onChange={e=>patch(sel.id,{fuente:e.target.value})}>{CRM_FUENTES.map(f=><option key={f}>{f}</option>)}</select></div>
            <div className="field"><label className="label">Busca</label><select className="input" value={sel.tipoBusqueda} onChange={e=>patch(sel.id,{tipoBusqueda:e.target.value})}><option value="arriendo">Arriendo</option><option value="compra">Compra</option></select></div>
            <div className="field"><label className="label">Propiedad de interés</label><select className="input" value={sel.propInteres||""} onChange={e=>patch(sel.id,{propInteres:e.target.value})}><option value="">— Sin asignar —</option>{propiedades.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
            <div className="field"><label className="label">Comuna / sector</label><input className="input" value={sel.comuna||""} onChange={e=>patch(sel.id,{comuna:e.target.value})}/></div>
            <div className="field"><label className="label">Presupuesto</label><input className="input" value={sel.presupuesto||""} onChange={e=>patch(sel.id,{presupuesto:e.target.value})}/></div>
            <div className="field"><label className="label">Dormitorios</label><input className="input" value={sel.dorms||""} onChange={e=>patch(sel.id,{dorms:e.target.value})}/></div>
          </div>
          <div className="field" style={{marginTop:10}}><label className="label">Notas</label><textarea className="input" value={sel.notas||""} onChange={e=>patch(sel.id,{notas:e.target.value})} style={{minHeight:60}}/></div>

          {/* interacciones */}
          <div className="sub-title" style={{marginTop:16}}>Interacciones</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>
            <select className="input" style={{maxWidth:150}} value={iCanal} onChange={e=>setICanal(e.target.value)}>{CRM_CANALES.map(c=><option key={c}>{c}</option>)}</select>
            <input className="input" style={{flex:1,minWidth:180}} placeholder="¿Qué conversaron? (ej: pidió ficha, agendó visita…)" value={iText} onChange={e=>setIText(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addInter();}}/>
            <button className="btn btn-out btn-sm" onClick={addInter}>Registrar</button>
          </div>
          {(sel.interacciones||[]).length? <div className="crm-time">{(sel.interacciones||[]).map(it=>(
            <div key={it.id} className="it"><div style={{fontSize:12,color:"var(--muted)"}}>{fmtF(it.fecha)} · {it.canal} <button className="btn btn-ghost btn-xs" style={{marginLeft:6}} onClick={()=>delInter(it.id)}>✕</button></div><div style={{fontSize:14}}>{it.texto}</div></div>
          ))}</div> : <div className="help" style={{margin:0}}>Aún sin interacciones registradas.</div>}

          {/* visitas */}
          <div className="sub-title" style={{marginTop:16}}>Visitas</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10,alignItems:"flex-end"}}>
            <div className="field" style={{margin:0}}><label className="label">Fecha</label><input className="input" type="date" value={vFecha} onChange={e=>setVFecha(e.target.value)}/></div>
            <div className="field" style={{margin:0}}><label className="label">Hora</label><input className="input" type="time" value={vHora} onChange={e=>setVHora(e.target.value)}/></div>
            <div className="field" style={{margin:0,minWidth:160}}><label className="label">Propiedad</label><select className="input" value={vProp} onChange={e=>setVProp(e.target.value)}><option value="">{sel.comuna||"— Elegir —"}</option>{propiedades.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
            <button className="btn btn-out btn-sm" onClick={addVisita}>Agendar</button>
          </div>
          {(sel.visitas||[]).length? (sel.visitas||[]).map(v=>(
            <div key={v.id} className="crm-card" style={{borderLeftColor:v.estado==="realizada"?"#1f9d57":(v.estado==="cancelada"?"#dc2626":"#0891b2"),cursor:"default"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                <div><b>{fmtF(v.fecha)} · {v.hora}</b> — {propName(v.propId)||sel.comuna||"Visita"} <span className="crm-chip">{v.estado}</span></div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  {sel.telefono&&<button className="btn btn-ghost btn-xs" onClick={()=>waLead(sel,"Hola "+(sel.nombre||"").split(" ")[0]+", te confirmo la visita el "+fmtF(v.fecha)+" a las "+v.hora+". ¡Te espero!")}></button>}
                  {v.estado!=="realizada"&&<button className="btn btn-ghost btn-xs" onClick={()=>setVisitaEstado(v.id,"realizada")}>✓</button>}
                  {v.estado!=="cancelada"&&<button className="btn btn-ghost btn-xs" onClick={()=>setVisitaEstado(v.id,"cancelada")}>✕</button>}
                  <button className="btn btn-ghost btn-xs" onClick={()=>delVisita(v.id)}>✕</button>
                </div>
              </div>
            </div>
          )) : <div className="help" style={{margin:0}}>Sin visitas agendadas.</div>}

          {/* tareas */}
          <div className="sub-title" style={{marginTop:16}}>✓ Seguimientos / tareas</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10,alignItems:"flex-end"}}>
            <input className="input" style={{flex:1,minWidth:180}} placeholder="Tarea (ej: llamar mañana, enviar contrato…)" value={tTit} onChange={e=>setTTit(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addTarea();}}/>
            <div className="field" style={{margin:0}}><label className="label">Vence</label><input className="input" type="date" value={tVen} onChange={e=>setTVen(e.target.value)}/></div>
            <button className="btn btn-out btn-sm" onClick={addTarea}>Agregar</button>
          </div>
          {(sel.tareas||[]).length? (sel.tareas||[]).map(t=>(
            <div key={t.id} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:"1px solid var(--line)"}}>
              <input type="checkbox" checked={!!t.hecha} onChange={()=>toggleTarea(t.id)}/>
              <span style={{flex:1,textDecoration:t.hecha?"line-through":"none",color:t.hecha?"var(--faint)":(t.vence<=hoyISO?"var(--red-d)":"inherit")}}>{t.titulo} <span style={{fontSize:12,color:"var(--muted)"}}>· {fmtF(t.vence)}</span></span>
              <button className="btn btn-ghost btn-xs" onClick={()=>delTarea(t.id)}>✕</button>
            </div>
          )) : <div className="help" style={{margin:0}}>Sin seguimientos pendientes.</div>}
        </div>
        <div className="modal-foot" style={{justifyContent:"space-between"}}>
          <button className="btn btn-ghost" style={{color:"var(--red-d)"}} onClick={()=>{ if(window.confirm("¿Eliminar este lead?")) delLead(sel.id); }}>✕ Eliminar lead</button>
          <button className="btn btn-primary" onClick={()=>setSelId(null)}>Listo</button>
        </div>
      </div>
    </div>}
  </div>);
};

/* ================== AUTENTICACIÓN, ROLES Y PORTAL DEL ARRENDATARIO ================== */
const ROLES_INFO={
  propietario:{label:"Propietario",desc:"Acceso total: propiedades, finanzas, contratos, equipo y configuración."},
  colaborador:{label:"Colaborador",desc:"Opera toda la plataforma (cobros, contratos, informes), sin gestionar el equipo ni la configuración."},
  invitado:{label:"Invitado",desc:"Solo lectura: ve el inicio, las propiedades, el historial y los informes."},
  arrendatario:{label:"Arrendatario",desc:"Entra a un portal propio donde ve su arriendo y puede pagarlo en línea."}
};
async function hashClave(clave,salt){ const data=new TextEncoder().encode(salt+"·"+clave); const buf=await crypto.subtle.digest("SHA-256",data); return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join(""); }
const claveFuerte=(s)=>({ largo:(s||"").length>=8, minus:/[a-z]/.test(s||""), mayus:/[A-Z]/.test(s||""), numero:/[0-9]/.test(s||""), especial:/[^A-Za-z0-9]/.test(s||"") });
const claveOk=(s)=>Object.values(claveFuerte(s)).every(Boolean);
const REQ_TXT={largo:"Mínimo 8 caracteres",minus:"Una letra minúscula",mayus:"Al menos 1 letra mayúscula",numero:"Al menos 1 número",especial:"Un carácter especial (!@#$%…)"};
const PERMISOS_TABS={ invitado:["inicio","props","historial","informes","faq"], colaborador:null, propietario:null };

function AuthScreen({usuarios,setUsuarios,onLogin}){
  const [modo,setModo]=useState(usuarios.length?"login":"registro");
  const [paso,setPaso]=useState(1);
  const [nombre,setNombre]=useState(""); const [email,setEmail]=useState(""); const [clave,setClave]=useState(""); const [clave2,setClave2]=useState("");
  const [codigo,setCodigo]=useState(""); const [codigoDemo,setCodigoDemo]=useState(null); const [modoCodigo,setModoCodigo]=useState("servidor");
  const [err,setErr]=useState(""); const [info,setInfo]=useState(""); const [busy,setBusy]=useState(false);
  const mail=(email||"").trim().toLowerCase();
  const invitacion = usuarios.find(u=>(u.email||"").toLowerCase()===mail);

  const entrar=async()=>{ setErr(""); if(!mail||!clave){setErr("Escribe tu correo y tu contraseña.");return;}
    const u=usuarios.find(x=>(x.email||"").toLowerCase()===mail);
    if(!u){setErr("No existe una cuenta con ese correo. Si te invitaron, usa \u201cCrear cuenta\u201d con el mismo correo de la invitación.");return;}
    if(!u.passHash){setErr("Tu cuenta aún no está activada. Usa \u201cCrear cuenta\u201d para validar tu correo y crear tu contraseña.");return;}
    setBusy(true); const hh=await hashClave(clave,u.salt||""); setBusy(false);
    if(hh!==u.passHash){setErr("Contraseña incorrecta.");return;}
    onLogin(u);
  };
  const enviarCodigo=async()=>{ setErr(""); setInfo("");
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){setErr("Escribe un correo válido.");return;}
    if(usuarios.length && !invitacion){ setErr("Este correo no tiene una invitación. Pide al propietario que te agregue en \u201cEquipo y accesos\u201d y vuelve a intentarlo."); return; }
    if(invitacion && invitacion.passHash){ setErr("Ese correo ya tiene una cuenta activa. Usa \u201cIngresar\u201d."); return; }
    setBusy(true);
    try{
      const r=await fetch("/api/codigo",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"enviar",email:mail})});
      const j=await r.json();
      if(j&&j.ok){ if(j.demo&&j.codigo){ setModoCodigo("demo"); setCodigoDemo(String(j.codigo)); setInfo("Todavía no hay servicio de correo configurado en el servidor (variable RESEND_API_KEY), así que tu código es: "+j.codigo); } else { setModoCodigo("servidor"); setInfo("Te enviamos un código de 6 dígitos a "+mail+". Revisa tu bandeja de entrada y la carpeta de spam."); } setPaso(2); }
      else throw new Error((j&&j.error)||"error");
    }catch(e){ const c=String(Math.floor(100000+Math.random()*900000)); setModoCodigo("demo"); setCodigoDemo(c); setInfo("Sin conexión con el servidor de correo (vista previa local). Usa este código: "+c); setPaso(2); }
    setBusy(false);
  };
  const verificar=async()=>{ setErr("");
    const c=(codigo||"").trim(); if(c.length!==6){setErr("El código tiene 6 dígitos.");return;}
    if(modoCodigo==="demo"){ if(c!==codigoDemo){setErr("Código incorrecto.");return;} setPaso(3); setInfo(""); return; }
    setBusy(true);
    try{ const r=await fetch("/api/codigo",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"verificar",email:mail,codigo:c})}); const j=await r.json(); setBusy(false);
      if(j&&j.ok&&j.valido){ setPaso(3); setInfo(""); } else setErr((j&&j.error)||"Código incorrecto o vencido. Pide uno nuevo.");
    }catch(e){ setBusy(false); setErr("No se pudo verificar el código. Intenta de nuevo."); }
  };
  const crearCuenta=async()=>{ setErr("");
    if(!claveOk(clave)){setErr("La contraseña no cumple todos los requisitos.");return;}
    if(clave!==clave2){setErr("Las contraseñas no coinciden.");return;}
    setBusy(true);
    const salt=String(Date.now())+Math.random().toString(36).slice(2);
    const hh=await hashClave(clave,salt);
    let cuenta;
    if(invitacion){ cuenta={...invitacion, nombre:invitacion.nombre||nombre||mail.split("@")[0], salt, passHash:hh, verificado:true, activadoEl:todayISO()};
      setUsuarios(us=>us.map(u=>u.id===invitacion.id?cuenta:u));
    } else { cuenta={ id:Date.now(), nombre:nombre||mail.split("@")[0], email:mail, rol:"propietario", salt, passHash:hh, verificado:true, creadoEl:todayISO() };
      setUsuarios(us=>[...us,cuenta]); }
    setBusy(false); onLogin(cuenta);
  };
  const reqs=claveFuerte(clave);
  return (<div className="auth-wrap"><div className="auth-card">
    <div className="auth-logo">A</div>
    <h1>ArriendoPro</h1>
    <div className="sub">Administración profesional de propiedades en Chile. Ingresa con tu correo y contraseña, o crea tu cuenta validando tu correo electrónico.</div>
    <div className="auth-tabs">
      <button className={modo==="login"?"on":""} onClick={()=>{setModo("login");setErr("");setInfo("");setPaso(1);}}>Ingresar</button>
      <button className={modo==="registro"?"on":""} onClick={()=>{setModo("registro");setErr("");setInfo("");setPaso(1);}}>Crear cuenta</button>
    </div>
    {err&&<div className="auth-err">{err}</div>}
    {info&&<div className="auth-info">{info}</div>}
    {modo==="login"&&<>
      <div className="field"><label className="label">Correo electrónico</label><input className="input" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="tucorreo@ejemplo.cl" autoComplete="email"/></div>
      <div className="field" style={{marginTop:10}}><label className="label">Contraseña</label><input className="input" type="password" value={clave} onChange={e=>setClave(e.target.value)} onKeyDown={e=>e.key==="Enter"&&entrar()} autoComplete="current-password"/></div>
      <button className="btn btn-red" style={{width:"100%",marginTop:16}} disabled={busy} onClick={entrar}>{busy?"Verificando…":"Ingresar a la plataforma"}</button>
    </>}
    {modo==="registro"&&paso===1&&<>
      {usuarios.length===0&&<div className="auth-info">Bienvenido. Esta será la <b>cuenta del propietario principal</b>, con acceso total. Luego podrás invitar a más propietarios, colaboradores, invitados y arrendatarios desde \u201cEquipo y accesos\u201d.</div>}
      <div className="field"><label className="label">Nombre completo</label><input className="input" value={nombre} onChange={e=>setNombre(e.target.value)} placeholder="Ej: Javier Contreras"/></div>
      <div className="field" style={{marginTop:10}}><label className="label">Correo electrónico</label><input className="input" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="tucorreo@ejemplo.cl"/></div>
      <button className="btn btn-red" style={{width:"100%",marginTop:16}} disabled={busy} onClick={enviarCodigo}>{busy?"Enviando…":"Enviarme el código de verificación"}</button>
    </>}
    {modo==="registro"&&paso===2&&<>
      <div className="field"><label className="label">Código de 6 dígitos enviado a {mail}</label><input className="input cod-input" inputMode="numeric" maxLength={6} value={codigo} onChange={e=>setCodigo(e.target.value.replace(/[^0-9]/g,""))} onKeyDown={e=>e.key==="Enter"&&verificar()}/></div>
      <button className="btn btn-red" style={{width:"100%",marginTop:16}} disabled={busy} onClick={verificar}>{busy?"Verificando…":"Validar mi correo"}</button>
      <button className="btn btn-ghost" style={{width:"100%",marginTop:8}} onClick={enviarCodigo}>Reenviar código</button>
    </>}
    {modo==="registro"&&paso===3&&<>
      <div className="auth-info">Correo validado ✓ — ahora crea una contraseña segura.</div>
      <div className="field"><label className="label">Contraseña</label><input className="input" type="password" value={clave} onChange={e=>setClave(e.target.value)} autoComplete="new-password"/></div>
      <div className="clave-req">{Object.keys(REQ_TXT).map(k=><span key={k} className={reqs[k]?"ok":""}>{reqs[k]?"✓":"○"} {REQ_TXT[k]}</span>)}</div>
      <div className="field"><label className="label">Repite la contraseña</label><input className="input" type="password" value={clave2} onChange={e=>setClave2(e.target.value)} autoComplete="new-password"/></div>
      <button className="btn btn-red" style={{width:"100%",marginTop:16}} disabled={busy||!claveOk(clave)||clave!==clave2} onClick={crearCuenta}>{busy?"Creando cuenta…":"Crear mi cuenta y entrar"}</button>
    </>}
    <div style={{marginTop:18,fontSize:12.5,color:"var(--faint)",lineHeight:1.55}}>Las contraseñas se guardan con hash irreversible (SHA-256 + salt). Los arrendatarios solo ven su propio arriendo.</div>
  </div></div>);
}

function PortalArrendatario({u,propiedades,uf,owner,cuentas,montoCobro,calcMulta,onSalir}){
  const [msg,setMsg]=useState(""); const [pagando,setPagando]=useState(false);
  const p = propiedades.find(x=>String(x.id)===String(u.propiedadId)) || propiedades.find(x=>(x.tenantEmail||"").toLowerCase()===(u.email||"").toLowerCase());
  const aviso=(t)=>{ setMsg(t); setTimeout(()=>setMsg(""),6000); };
  const total = p ? montoCobro(p)+calcMulta(p) : 0;
  const pagar=async()=>{ if(!p) return; setPagando(true);
    try{
      const tx="portal-"+p.id+"-"+Date.now();
      const r=await fetch("/api/khipu/crear-pago",{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({
        transaction_id:tx, amount:Math.round(total), subject:`Arriendo ${MESES_L[new Date().getMonth()]} — ${p.name}`,
        body:p.address||p.name, payer_email:u.email||undefined })});
      const j=await r.json();
      if(!r.ok||!j.payment_url) throw new Error(j.error||"No se pudo generar el pago");
      window.open(j.payment_url,"_blank"); aviso("Se abrió el link de pago Khipu. El pago se confirma automáticamente al conciliar el banco.");
    }catch(e){ aviso("No se pudo generar el pago en línea ("+(e.message||"sin conexión")+"). Puedes transferir con los datos de abajo."); }
    setPagando(false);
  };
  const waAdmin=(owner.whatsapp||owner.phone||"").replace(/[^0-9]/g,"");
  return (<div className="portal">
    <div className="portal-top">
      <div style={{display:"flex",alignItems:"center",gap:11}}><div className="auth-logo" style={{width:40,height:40,fontSize:19,margin:0}}>A</div><div><div style={{fontFamily:"var(--font-head)",fontWeight:700,fontSize:17,color:"var(--ink)"}}>ArriendoPro</div><div style={{fontSize:12,color:"var(--muted)"}}>Portal del arrendatario</div></div></div>
      <button className="btn btn-out btn-sm" onClick={onSalir}>Cerrar sesión</button>
    </div>
    <div className="portal-main">
      {msg&&<div className="auth-info">{msg}</div>}
      <div style={{padding:"6px 2px"}}>
        <div style={{fontFamily:"var(--font-head)",fontSize:25,color:"var(--ink)"}}>Hola, {(u.nombre||"").split(" ")[0]||"arrendatario"}</div>
        <div style={{color:"var(--muted)",fontSize:14.5,marginTop:3}}>Aquí puedes ver el estado de tu arriendo, pagarlo en línea y contactar a la administración.</div>
      </div>
      {!p && <div className="card pad"><div className="sec-title">Sin propiedad asociada</div><div className="help">Tu cuenta aún no está vinculada a una propiedad. Escríbele a la administración para que te asocie desde \u201cEquipo y accesos\u201d.</div></div>}
      {p && <>
      <div className="card pad">
        <div className="sec-title">{p.name}</div>
        <div style={{color:"var(--muted)",fontSize:14}}>{[p.address,p.comuna].filter(Boolean).join(", ")}</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:10}}>
          <span className={"pill "+(ST[p.status]?ST[p.status].c:"grey")}>{ST[p.status]?ST[p.status].t:p.status}</span>
          {p.contractEnd&&<span className="pill grey">Contrato hasta {p.contractEnd}</span>}
          {num(p.rentUF)>0&&<span className="pill blue">{UFf(p.rentUF)} / mes</span>}
        </div>
      </div>
      <div className="card pad">
        <div className="stat" style={{border:"none",padding:0,boxShadow:"none",background:"transparent"}}>
          <div className="lab">Monto a pagar este mes {calcMulta(p)>0?"(incluye multa por atraso de "+CLP(calcMulta(p))+")":""}</div>
          <div className="portal-monto">{CLP(total)}</div>
          <div className="sub" style={{color:"var(--muted)"}}>Día de pago: hasta el {p.dueDay||5} de cada mes {num(p.rentUF)>0?"· Arriendo en UF, se cobra con la UF más alta del período":""}</div>
        </div>
        <div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:16}}>
          <button className="btn btn-red" style={{flex:1,minWidth:200,padding:"14px 18px",fontSize:15.5}} disabled={pagando} onClick={pagar}>{pagando?"Generando pago…":"Pagar mi arriendo en línea"}</button>
          {waAdmin&&<a className="btn btn-out" href={`https://wa.me/${waAdmin}`} target="_blank" rel="noreferrer">WhatsApp administración</a>}
        </div>
        <div className="help" style={{marginTop:12}}>El pago en línea usa <b>Khipu</b> (transferencia bancaria segura). Se abre en una pestaña nueva y el comprobante queda registrado automáticamente.</div>
      </div>
      <div className="card pad">
        <div className="sec-title">Pagar por transferencia</div>
        {(cuentas&&cuentas.length?cuentas:[{banco:owner.bank,tipo:owner.accountType,numero:owner.accountNumber,rut:owner.rut,nombre:owner.name,id:0}]).map((c,i)=>(
          <div key={c.id||i} style={{border:"1px solid var(--line)",borderRadius:10,padding:"11px 13px",marginBottom:8,fontSize:14.5,lineHeight:1.8,background:"var(--panel2)"}}>
            Banco: <b>{c.banco||"—"}</b> · {c.tipo||"Cuenta"} <b>{c.numero||"—"}</b><br/>RUT: <b>{c.rut||"—"}</b> · Titular: <b>{c.nombre||"—"}</b>{owner.email?<><br/>Enviar comprobante a: <b>{owner.email}</b></>:null}
          </div>))}
      </div>
      <div className="card pad">
        <div className="sec-title">Mis últimos pagos</div>
        {(p.histPagos||[]).length===0 && <div style={{color:"var(--muted)",fontSize:14}}>Aún no hay pagos registrados.</div>}
        {(p.histPagos||[]).slice(0,8).map((hp,i)=>(<div key={i} style={{display:"flex",justifyContent:"space-between",gap:10,padding:"9px 2px",borderBottom:"1px solid var(--line2)",fontSize:14.5}}>
          <span style={{color:"var(--muted)"}}>{hp.fecha}</span><span>{hp.concepto||"Arriendo"}</span><b>{CLP(num(hp.monto))}</b></div>))}
      </div>
      <div className="card pad">
        <div className="sec-title">Mi contrato</div>
        <div className="grid" style={{gridTemplateColumns:"1fr 1fr",gap:10,fontSize:14.5}}>
          <div><div className="label">Inicio</div><div style={{fontWeight:700}}>{p.contractStart||"—"}</div></div>
          <div><div className="label">Término</div><div style={{fontWeight:700}}>{p.contractEnd||"Indefinido"}</div></div>
          <div><div className="label">Garantía</div><div style={{fontWeight:700}}>{(p.garantia&&num(p.garantia.monto))?CLP(num(p.garantia.monto)):"—"}</div></div>
          <div><div className="label">Administra</div><div style={{fontWeight:700}}>{owner.name||"—"}</div></div>
        </div>

      propInteres:d.propiedad_id||(previo&&previo.propInteres)||"",
      notas:d.notas||(previo&&previo.notas)||"" };
    const idPrevio=asLeadId2();
    if(idPrevio){
      setLeads(ls=>ls.map(l=>l.id===idPrevio?{...l,...campos,actualizado:Date.now()}:l));
      return { ok:true, actualizado:true, lead_id:idPrevio, mensaje:"Datos actualizados en el CRM." };
    }
    const id="ld"+Date.now().toString(36);
    asLeadRef.current=id; setAsLeadId(id);
    setLeads(ls=>[{ id, ...campos, fuente:"Web", estado:"calificado", valorUF:"",
      creado:Date.now(), actualizado:Date.now(),
      interacciones:[{id:"i"+Date.now().toString(36),fecha:Date.now(),canal:"Otro",texto:"Conversación con el asesor digital de la web."}],
      visitas:[], tareas:[] }, ...ls]);
    asMetrica("leads");
    notify("Nuevo contacto capturado por el asesor: "+campos.nombre);
    return { ok:true, creado:true, lead_id:id, mensaje:"Contacto registrado en el CRM como lead calificado." };
  };

  const asAgendar=(d)=>{
    const id=asLeadId2();
    if(!id) return { error:"Todavía no tengo los datos de la persona. Usa registrar_lead antes de agendar." };
    const prop=d.propiedad_id?props.find(p=>String(p.id)===String(d.propiedad_id)):null;
    const v={ id:"v"+Date.now().toString(36), fecha:d.fecha||isoInDays(1), hora:d.hora||"",
      propId:prop?String(prop.id):"", estado:"agendada", notas:d.notas||"" };
    setLeads(ls=>ls.map(l=>l.id===id?{...l, estado:"visita", actualizado:Date.now(), visitas:[...(l.visitas||[]),v]}:l));
    asMetrica("visitas", prop?String(prop.id):null);
    notify("Visita agendada por el asesor para el "+v.fecha);
    return { ok:true, mensaje:"Visita agendada y registrada en el CRM.", fecha:v.fecha, hora:v.hora||"por confirmar",
      propiedad: prop?prop.name:"por definir" };

  const asDerivar=(motivo)=>{
    const id=asLeadId2();
    const tel=String((owner&&owner.whatsapp)||(owner&&owner.phone)||"").replace(/[^\d]/g,"");
    if(id) setLeads(ls=>ls.map(l=>l.id===id?{...l,
      estado:l.estado==="visita"?l.estado:"contactado", actualizado:Date.now(),
      notas:(l.notas?l.notas+" · ":"")+"Derivado por el asesor: "+motivo,
      interacciones:[...(l.interacciones||[]),{id:"i"+Date.now().toString(36),fecha:Date.now(),canal:"Otro",texto:"Derivado a un asesor humano: "+motivo}]}:l));

    notify("El asesor derivó una conversación a un ejecutivo");

      asesor:(owner&&owner.name)||"Equipo "+asEmpresa(), telefono:(owner&&owner.phone)||"",

  const asEjecutar=(nombre,input)=>{
    const i=input||{};
    try{
      if(nombre==="buscar_propiedades"){
        const r=asBuscar(props,i); asMetrica("busquedas");
        (r.resultados||[]).forEach(f=>asMetrica(null,f.id));
        return r;
      }
      if(nombre==="ver_propiedad"){
        const p=props.find(x=>String(x.id)===String(i.id));
        if(!p) return { error:"No encontré esa propiedad en el catálogo." };
        asMetrica(null,String(p.id));
        return { propiedad: asFicha(p, p.use==="arriendo"?"arriendo":"venta") };
      }
      if(nombre==="propiedades_similares"){ const r=asSimilares(props,i.id,!!i.mas_barata); asMetrica("busquedas"); return r; }
      if(nombre==="comparar_propiedades") return asComparar(props,i.ids);
      if(nombre==="calcular_costos") return asCostos(props,i.id,i.monto_arriendo);
      if(nombre==="registrar_lead") return asGuardarLead(i);
      if(nombre==="agendar_visita") return asAgendar(i);
      if(nombre==="derivar_asesor") return asDerivar(i.motivo||"Solicitud del usuario");
      return { error:"Herramienta desconocida: "+nombre };
    }catch(e){ return { error:"No pude ejecutar esa acción: "+((e&&e.message)||"error") }; }
  };

  /* Bucle de conversación: el modelo puede pedir varias herramientas seguidas
     (buscar, luego comparar, luego registrar) antes de dar su respuesta final. */
  const asEnviar=async(textoUsuario)=>{
    const q=String(textoUsuario||"").trim();
    if(!q||asBusy) return;
    setAsIn(""); setAsBusy(true); asMetrica("consultas");
    setAsChat(c=>[...c,{r:"user",c:q}]);
    let msgs=[...asMsgs,{role:"user",content:q}];
    const l=asLeadActual();
    const contexto=asResumenCatalogo(props,uf,asEmpresa(),asContacto(),
      l?(l.nombre+(l.telefono?" · "+l.telefono:"")+(l.email?" · "+l.email:"")):null);
    try{
      for(let paso=0; paso<6; paso++){
        const r=await fetch("/api/asesor",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({messages:msgs,contexto})});
        const d=await r.json().catch(()=>null);
        if(!r.ok){
          setAsChat(c=>[...c,{r:"ai",c:(d&&d.error)?d.error:("No pude responder (error "+r.status+")."),err:true}]);
          break;
        }
        // Se reenvía tal cual: los resultados de internet vienen cifrados y
        // modificarlos hace fallar la siguiente llamada.
        const bloques=d.content||[];
        msgs=[...msgs,{role:"assistant",content:bloques}];
        const usos=bloques.filter(b=>b.type==="tool_use");
        const textos=bloques.filter(b=>b.type==="text");
        const dicho=textos.map(b=>b.text).join("\n").trim();
        // Al mostrar información sacada de internet hay que citar la fuente.
        const fuentes=[];
        textos.forEach(b=>(b.citations||[]).forEach(ci=>{
          if(ci&&ci.url&&!fuentes.some(f=>f.url===ci.url)) fuentes.push({url:ci.url,titulo:ci.title||ci.url});
        }));
        // Avisamos cuando está mirando internet, para que no parezca congelado.
        bloques.filter(b=>b.type==="server_tool_use"&&b.name==="web_search")
          .map(b=>(b.input&&b.input.query)||"").filter(Boolean)
          .forEach(q=>setAsChat(c=>[...c,{r:"ai",buscando:q}]));
        if(dicho||fuentes.length) setAsChat(c=>[...c,{r:"ai",c:dicho,fuentes:fuentes.length?fuentes:null}]);
        // Una búsqueda larga pausa el turno: se continúa reenviando la respuesta
        // tal cual, sin agregar un mensaje nuevo del usuario.
        if(d.stop_reason==="pause_turn"){ setAsMsgs(msgs); continue; }
        if(!usos.length){ setAsMsgs(msgs); break; }
        const resultados=usos.map(u=>{
          const salida=asEjecutar(u.name,u.input);
          // Lo que se puede mostrar visualmente se dibuja como tarjeta o tabla.
          if(salida&&salida.resultados&&salida.resultados.length) setAsChat(c=>[...c,{r:"ai",fichas:salida.resultados}]);
          else if(salida&&salida.propiedad) setAsChat(c=>[...c,{r:"ai",fichas:[salida.propiedad]}]);
          else if(salida&&salida.comparacion) setAsChat(c=>[...c,{r:"ai",comparacion:salida.comparacion}]);
          else if(salida&&salida.whatsapp!==undefined) setAsChat(c=>[...c,{r:"ai",derivacion:salida}]);
          return { type:"tool_result", tool_use_id:u.id, content:JSON.stringify(salida).slice(0,12000) };
        });
        msgs=[...msgs,{role:"user",content:resultados}];
        setAsMsgs(msgs);
      }
    }catch(e){
      setAsChat(c=>[...c,{r:"ai",c:"No pude conectar con el asesor ("+((e&&e.message)||"error de red")+"). Revisa tu conexión.",err:true}]);
    }
    setAsBusy(false);
  };

  const asReiniciar=()=>{ setAsChat([]); setAsMsgs([]); setAsLeadId(""); asLeadRef.current=""; };
  const asVerPropiedad=(id)=>{ const p=props.find(x=>String(x.id)===String(id)); if(p){ setSel(p); setTab("props"); setFilter("todas"); setAsOpen(false); asMetrica(null,String(id)); } };

  /* ---- Comandos rápidos del asistente: responden al instante con datos locales ---- */

      return `ATRASADOS (${at.length})\n${fmtLista(at)}\n\nPENDIENTES (${pe.length})\n${fmtLista(pe)}`; } },

      const ord=[...rentals].sort((a,b)=>(a.dueDay||5)-(b.dueDay||5)).map(p=>`Día ${p.dueDay||5}: ${p.name} — ${p.tenant} (${CLP(p.rent)})`);
      return `DÍAS DE VENCIMIENTO DE ARRIENDOS\n\n${fmtLista(ord)}`; } },
    { label:"Cobros del mes", desc:"Cobrado vs pendiente", run:()=>{
      const cobrado=rentals.filter(p=>p.status==="pagado").reduce((s,p)=>s+num(p.rent),0);

      const multas=rentals.reduce((s,p)=>s+calcMulta(p),0);
      return `COBROS DE ${MESES_L[new Date().getMonth()].toUpperCase()}\n\n• Cobrado: ${CLP(cobrado)}\n• Por cobrar: ${CLP(porCobrar)}\n• Multas por atraso: ${CLP(multas)}\n• Total esperado: ${CLP(cobrado+porCobrar+multas)}`; } },
    { label:"Comparar propiedades", desc:"Tabla comparativa de rentabilidad", run:()=>{
      if(!props.length) return "No hay propiedades cargadas.";
      const lineas=[...props].sort((a,b)=>utilidadMes(b,uf)-utilidadMes(a,uf)).map(p=>{ const y=num(p.tasacion)>0?(utilidadAnual(p,uf)/num(p.tasacion)*100).toFixed(1)+"%":"s/tasación"; return `${p.name}: ingreso ${CLP(ingresoMes(p,uf))} · egresos ${CLP(egresosMes(p,uf))} · utilidad ${CLP(utilidadMes(p,uf))}/mes · rentabilidad neta ${y}`; });
      return `COMPARATIVA DE PROPIEDADES (mejor a peor)\n\n${fmtLista(lineas)}`; } },
    { label:"Proyección 12 meses", desc:"Flujo estimado del próximo año", run:()=>{
      const lineas=props.map(p=>`${p.name}: ${CLP(utilidadAnual(p,uf))}`);
      return `PROYECCIÓN A 12 MESES (valores de hoy, UF ${CLP(uf)})\n\n• Ingresos por arriendo: ${CLP(ingresos*12)}\n• Dividendos: ${CLP(dividendos*12)}\n• Utilidad neta estimada: ${CLP(utilidadTotal*12)}\n\nPor propiedad:\n${fmtLista(lineas)}\n\nNota: los arriendos en UF se reajustan solos con la UF; esta proyección usa la UF de hoy, por lo que la utilidad real en pesos tiende a ser mayor.`; } },
    { label:"Checklist para arrendar", desc:"Pasos antes de firmar con un arrendatario", run:()=>{
      return "CHECKLIST PROFESIONAL ANTES DE ARRENDAR\n\n1. Solicitar cédula de identidad vigente y verificar RUT.\n2. Informe InfoCheck e informe Equifax (Boletín Comercial / DICOM): score, morosidades y protestos.\n3. Acreditar renta: 3 últimas liquidaciones (dependiente) o carpeta tributaria y boletas (independiente). Regla: la renta líquida debe ser al menos 3 veces el arriendo.\n4. Certificado de cotizaciones AFP (12 meses) para verificar continuidad laboral.\n5. Aval o codeudor solidario con los mismos antecedentes si el perfil es justo.\n6. Contrato profesional (usa el generador en Documentos Legales): renta en UF con la regla del valor más alto, garantía, multas, mantención, restitución y aval.\n7. Firma ante notario o firma electrónica avanzada, e inventario con fotos anexo al contrato.\n8. Garantía de 1 mes (registrarla en la plataforma con fecha y estado).\n9. Cambio de titularidad o registro de lecturas de luz, agua y gas al día de entrega.\n10. Registrar todo en ArriendoPro: arrendatario, contrato, garantía y documentos adjuntos."; } },

      const monto=pr?CLP(montoCobro(pr)):"[monto]"; const ufv=CLP(uf);

  const analizarDocs=async()=>{ if(!aiDocs.length){ notify("Adjunta al menos un archivo",true); return; } setAiDocBusy(true); setAiDocRes(null);
    try{
      const hint=props.map(p=>({id:p.id,nombre:p.name,direccion:[p.address,p.comuna].filter(Boolean).join(", ")}));
      const r=await fetch("/api/asistente",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ mode:"extraer", files:aiDocs.map(f=>({media_type:f.media,data:f.b64,name:f.name})), propiedades:hint })});
      const j=await r.json().catch(()=>({}));
      if(!r.ok||j.error) throw new Error(j.error||("HTTP "+r.status));
      setAiDocRes(j);
      const co=j.datos&&j.datos.coincidenciaId;
      setAiDocDest(co&&props.some(p=>String(p.id)===String(co))?String(co):"nueva");
    }catch(e){ notify("No se pudo analizar el documento: "+(e.message||"error")+". Verifica ANTHROPIC_API_KEY en Netlify.",true); }
    setAiDocBusy(false); };
  const aplicarDatos=()=>{ const d=(aiDocRes&&aiDocRes.datos)||{}; const P=d.propiedad||{}, A=d.arriendo||{}, T=d.arrendatario||{}, G=d.garantia||{};
    const pon=(o,k,v)=>{ if(v!==undefined&&v!==null&&String(v).trim()!==""){ o[k]=v; } };
    const c={};
    pon(c,"name",P.nombre); pon(c,"address",P.direccion); pon(c,"comuna",P.comuna); pon(c,"region",P.region);
    if(P.tipo){ const t=String(P.tipo).toLowerCase(); c.type = t.includes("depart")?"Departamento" : t.includes("casa")?"Casa" : t.includes("parcela")||t.includes("terreno")?"Terreno" : t.includes("local")||t.includes("oficina")||t.includes("bodega")?"Comercial" : "Otro"; if(c.type==="Otro") c.typeOtro=P.tipo; }
    pon(c,"rolSII",P.rolSII); pon(c,"inscripcion",P.inscripcion); pon(c,"surfaceBuilt",P.superficieConstruida); pon(c,"surfaceTerrain",P.superficieTerreno);
    pon(c,"bedrooms",P.dormitorios); pon(c,"bathrooms",P.banos); pon(c,"parking",P.estacionamientos); pon(c,"bodega",P.bodega); pon(c,"constructionYear",P.anoConstruccion); pon(c,"avaluoFiscal",P.avaluoFiscal);
    pon(c,"tenant",T.nombre); pon(c,"tenantRut",T.rut); pon(c,"tenantEmail",T.email); pon(c,"tenantPhone",T.telefono);
    const rUF=num(A.rentaUF), rCLP=num(A.rentaCLP)||(rUF>0?Math.round(rUF*uf):0);
    if(rUF>0){ c.rentUF=rUF; c.adjustment="UF"; } if(rCLP>0) c.rent=rCLP;
    if(num(A.diaPago)>0) c.dueDay=num(A.diaPago); if(num(A.multaPct)>0) c.penalty=num(A.multaPct);
    pon(c,"contractStart",A.fechaInicio); pon(c,"contractEnd",A.fechaTermino);
    const g={}; const gM=num(G.montoCLP)||(num(G.montoUF)>0?Math.round(num(G.montoUF)*uf):0);
    if(gM>0) g.monto=gM; if(G.fecha) g.fechaRecibida=G.fecha;
    const nCampos=Object.keys(c).length+Object.keys(g).length;
    if(!nCampos){ notify("La IA no encontró campos aplicables en el documento",true); return; }
    if(aiDocDest==="nueva"){
      const nueva={...blank, id:Date.now(), use:"arriendo", status:"pendiente", rentedNow:!!c.tenant, gastosExtra:SEED_GASTOS(), ...c, garantia:{...blank.garantia,...g}};
      if(!nueva.name) nueva.name = c.address || ("Propiedad "+todayISO());
      setProps(ps=>[...ps,nueva]); setTab("props");
      notify("Propiedad creada con "+nCampos+" campos leídos del documento");
    } else {
      patchProp(aiDocDest, x=>({ ...x, ...c, garantia:{...(x.garantia||blank.garantia), ...g} }));
      notify(nCampos+" campos ingresados en la propiedad");
    }
    setAiDocRes(null); setAiDocs([]); };

  </style></head><body>
  <div class="band"><div class="brand">ARRIENDOPRO · ADMINISTRACIÓN DE PROPIEDADES</div><h1>${esc(titulo)}</h1><div class="sub">${esc(subtitulo)}</div></div>
  <div class="wrap">${bodyHtml}
  <div class="foot"><span>Preparado por ${esc(owner.name||"la administración")}${owner.email?" · "+esc(owner.email):""}</span><span>ArriendoPro · ${esc(todayISO())}</span></div>
  </div></body></html>`;
  const filaDL=(pares)=>`<table class="dl">${pares.filter(x=>x&&String(x[1]||"").trim()!=="").map(x=>`<tr><td>${esc(x[0])}</td><td><b>${esc(x[1])}</b></td></tr>`).join("")}</table>`;
  const kpiBox=(l,v,cls)=>`<div class="kpi"><div class="l">${esc(l)}</div><div class="v ${cls||""}">${esc(v)}</div></div>`;

  const informePropHTML=(p)=>{
    const soc=socById(p.sociedad)||{}; const uMes=utilidadMes(p,uf); const uAno=utilidadAnual(p,uf);

    const yieldBruto = num(p.tasacion)>0 && p.use==="arriendo" ? (num(p.rent)*12/num(p.tasacion)*100) : null;
    const gastos=(p.gastosExtra||[]); const ingExtra=(p.ingresosExtra||[]);
    const pagos=(p.histPagos||[]).slice(0,14);
    const inc=(p.incidencias||[]);
    const seg=(p.seguros||[]);
    const eq=p.tenantEquifax||{}; const ic=p.tenantInfocheck||{};
    const deudaUF = p.hasMortgage ? divPorPagar(p)*num(p.dividendoUF) : 0;
    return docPro("Informe de propiedad — "+(p.name||""),
      `${[p.address,p.comuna].filter(Boolean).join(", ")||"Sin dirección registrada"} · Generado el ${todayISO()} · 1 UF = ${CLP(uf)}`,
      `<h2>1 · Resumen ejecutivo</h2>
       <div class="kpis">
         ${kpiBox("Arriendo mensual", p.use==="arriendo" ? (num(p.rentUF)>0?UFf(p.rentUF)+" ≈ "+CLP(num(p.rent)):CLP(num(p.rent))) : "Uso personal")}
         ${kpiBox("Utilidad neta / mes", CLP(uMes), uMes>=0?"pos":"neg")}
         ${kpiBox("Utilidad proyectada / año", CLP(uAno), uAno>=0?"pos":"neg")}
         ${kpiBox("Estado de cobro", (ST[p.status]||{}).t||p.status||"—")}
         ${yieldNeto!=null?kpiBox("Rentabilidad neta anual", yieldNeto.toFixed(2).replace(".",",")+" %", yieldNeto>=0?"pos":"neg"):""}
         ${yieldBruto!=null?kpiBox("Rentabilidad bruta anual", yieldBruto.toFixed(2).replace(".",",")+" %"):""}
       </div>
       <div class="nota">Este informe consolida la identificación legal, la situación de arriendo, los antecedentes del arrendatario, el crédito hipotecario, los gastos y la rentabilidad de la propiedad, con los datos registrados en ArriendoPro a la fecha de emisión.</div>
       <h2>2 · Identificación de la propiedad</h2>
       ${filaDL([["Propiedad",p.name],["Sociedad / propietario",soc.name||owner.name],["RUT propietario",soc.rut||owner.rut],["Dirección",[p.address,p.comuna,p.region].filter(Boolean).join(", ")],["Tipo",(p.type==="Otro"?p.typeOtro:p.type)],["Uso",p.use==="arriendo"?"Arriendo":"Uso personal ("+(p.subtype||"")+")"],["Rol de avalúo (SII)",p.rolSII],["Inscripción CBR",p.inscripcion],["Avalúo fiscal",num(p.avaluoFiscal)?CLP(num(p.avaluoFiscal)):""],["Tasación comercial",num(p.tasacion)?CLP(num(p.tasacion)):""],["Año de construcción",p.constructionYear],["Superficie construida",p.surfaceBuilt?p.surfaceBuilt+" m²":""],["Superficie terreno",p.surfaceTerrain?p.surfaceTerrain+" m²":""],["Programa",[p.bedrooms&&p.bedrooms+" dorm.",p.bathrooms&&p.bathrooms+" baños",p.parking&&p.parking+" estac.",p.bodega&&p.bodega+" bodega(s)"].filter(Boolean).join(" · ")],["Piso / orientación",[p.floor,p.orientation].filter(Boolean).join(" · ")],["Estado de conservación",p.condition]])}
       ${p.use==="arriendo"?`<h2>3 · Situación de arriendo</h2>
       ${filaDL([["Arrendatario",p.tenant],["RUT",p.tenantRut],["Contacto",[p.tenantEmail,p.tenantPhone].filter(Boolean).join(" · ")],["Inicio del contrato",p.contractStart],["Término del contrato",p.contractEnd||"Indefinido / renovación tácita"],["Renta pactada",num(p.rentUF)>0?UFf(p.rentUF)+" (se cobra con la UF más alta del período) ≈ "+CLP(num(p.rent)):CLP(num(p.rent))],["Reajuste",p.adjustment],["Día límite de pago",p.dueDay?("Día "+p.dueDay+" de cada mes"):""],["Multa por atraso",num(p.penalty)?num(p.penalty)+"% mensual proporcional":""],["Garantía",(p.garantia&&num(p.garantia.monto))?CLP(num(p.garantia.monto))+" · "+(p.garantia.estado||"")+(p.garantia.fechaRecibida?" · recibida el "+p.garantia.fechaRecibida:""):""],["Estado actual",(ST[p.status]||{}).t]])}
       ${pagos.length?`<h3>Últimos pagos registrados</h3><table><tr><th>Fecha</th><th>Concepto</th><th>Monto</th></tr>${pagos.map(x=>`<tr><td>${esc(x.fecha)}</td><td>${esc(x.concepto||"Arriendo")}</td><td>${esc(CLP(num(x.monto)))}</td></tr>`).join("")}</table>`:""}
       ${(p.vacancias||[]).length?`<h3>Lagunas de arriendo (vacancias)</h3><table><tr><th>Desde</th><th>Hasta</th><th>Días</th><th>Notas</th></tr>${p.vacancias.map(v=>`<tr><td>${esc(v.desde)}</td><td>${esc(v.hasta)}</td><td>${esc(v.dias)}</td><td>${esc(v.notas||"")}</td></tr>`).join("")}</table>`:""}
       <h2>4 · Antecedentes del arrendatario</h2>
       <h3>InfoCheck</h3>${filaDL([["Puntaje",ic.icPuntaje||ic.puntaje],["Capacidad de pago",ic.icCapacidad||ic.capacidadPago],["Renta líquida",ic.icRenta||ic.rentaLiquida],["Deuda directa CMF",ic.icDeudaCMF||ic.deudaCMF],["Fuente de ingresos",ic.icFuente||ic.fuenteIngresos],["Fecha del informe",ic.icFecha||ic.fecha]])||""}
       <h3>Equifax — Boletín Comercial</h3>${filaDL([["Score Equifax",eq.score],["Morosidades vigentes",eq.morosidades],["N° de protestos",eq.protestos],["Deuda impaga informada",eq.deudaImpaga],["Fecha del informe",eq.fecha]])}
       ${!(ic.puntaje||ic.icPuntaje||eq.score)?`<div class="muted">Sin antecedentes registrados. Se recomienda adjuntar los informes InfoCheck y Equifax en la ficha del arrendatario.</div>`:""}`:""}
       <h2>${p.use==="arriendo"?"5":"3"} · Crédito hipotecario</h2>
       ${p.hasMortgage?filaDL([["Banco",p.mortgageBank],["Dividendo mensual",UFf(p.dividendoUF)+" ≈ "+CLP(divCLP(p,uf))],["Cuotas totales",num(p.dividendosTotales)],["Cuotas pagadas",num(p.dividendosPagados)],["Cuotas por pagar",divPorPagar(p)],["Avance",Math.round(num(p.dividendosPagados)/Math.max(1,num(p.dividendosTotales))*100)+" %"],["Deuda estimada",UFf(deudaUF)+" ≈ "+CLP(Math.round(deudaUF*uf))],["Seguros del crédito",p.seguroEnDividendo!==false?"Incluidos en el dividendo mientras el crédito esté vigente":"Contratados por separado"]]):`<div class="muted">La propiedad no registra crédito hipotecario vigente.</div>`}
       <h2>${p.use==="arriendo"?"6":"4"} · Gastos, seguros y contribuciones</h2>
       ${filaDL([["Contribuciones",num(p.contribucionesAnuales)?CLP(num(p.contribucionesAnuales))+" al año ("+CLP(contribMes(p))+"/mes)":""],["Seguro incendio y sismo",seguroMes(p,uf)?CLP(seguroMes(p,uf))+"/mes":""],["Gasto común",num(p.gastoComun)?CLP(num(p.gastoComun))+(p.gcArrendatarioPaga?" (lo paga el arrendatario)":" (lo paga el propietario)"):""]])}
       ${seg.length?`<h3>Pólizas contratadas</h3><table><tr><th>Póliza</th><th>Compañía</th><th>Prima (UF)</th><th>Vigencia</th></tr>${seg.map(x=>`<tr><td>${esc(x.tipo||x.nombre||"Póliza")}</td><td>${esc(x.compania||x.aseguradora||"—")}</td><td>${esc(UFf(num(x.primaUF)))}</td><td>${esc(x.vigencia||x.vencimiento||"—")}</td></tr>`).join("")}</table>`:""}
       ${gastos.length?`<h3>Gastos registrados</h3><table><tr><th>Gasto</th><th>Monto</th><th>Recurrencia</th><th>Equivalente mensual</th></tr>${gastos.map(g=>`<tr><td>${esc(g.nombre||g.concepto||"Gasto")}</td><td>${esc(g.uf?UFf(num(g.monto)):CLP(num(g.monto)))}</td><td>${esc(g.recurrencia||g.frecuencia||"Mensual")}</td><td>${esc(CLP(movMensualCLP(g,uf)))}</td></tr>`).join("")}<tr class="tot"><td colspan="3">Total gastos extra / mes</td><td>${esc(CLP(gastosExtraMes(p,uf)))}</td></tr></table>`:""}
       ${ingExtra.length?`<h3>Ingresos adicionales</h3><table><tr><th>Ingreso</th><th>Monto</th><th>Recurrencia</th><th>Equivalente mensual</th></tr>${ingExtra.map(g=>`<tr><td>${esc(g.nombre||g.concepto||"Ingreso")}</td><td>${esc(g.uf?UFf(num(g.monto)):CLP(num(g.monto)))}</td><td>${esc(g.recurrencia||g.frecuencia||"Mensual")}</td><td>${esc(CLP(movMensualCLP(g,uf)))}</td></tr>`).join("")}</table>`:""}
       <h3>Balance mensual</h3>
       <table><tr><th>Ingresos / mes</th><th>Egresos / mes</th><th>Utilidad / mes</th><th>Utilidad / año</th></tr>
       <tr><td>${esc(CLP(ingresoMes(p,uf)))}</td><td>${esc(CLP(egresosMes(p,uf)))}</td><td><b>${esc(CLP(uMes))}</b></td><td><b>${esc(CLP(uAno))}</b></td></tr></table>
       ${inc.length?`<h2>${p.use==="arriendo"?"7":"5"} · Incidencias</h2><table><tr><th>Fecha</th><th>Categoría</th><th>Detalle</th><th>Prioridad</th><th>Estado</th></tr>${inc.slice(0,15).map(x=>`<tr><td>${esc(x.fecha||"")}</td><td>${esc(x.categoria||"")}</td><td>${esc(x.titulo||x.descripcion||"")}</td><td>${esc(x.prioridad||"")}</td><td>${esc(x.estado||"")}</td></tr>`).join("")}</table>`:""}
       ${p.notas?`<h2>Observaciones</h2><div class="nota">${esc(p.notas)}</div>`:""}`);
  };

  const informeGeneralHTML=()=>{
    const ocupadas=rentals.filter(p=>p.status!=="disponible").length;
    const ocup=rentals.length?Math.round(ocupadas/rentals.length*100):0;
    const egresosTot=props.reduce((s,p)=>s+egresosMes(p,uf),0);
    const morosidad=rentals.filter(p=>p.status==="atrasado").reduce((s,p)=>s+montoCobro(p)+calcMulta(p),0);
    const deudaUF=deudaHipTotalUF; 
    const rows=props.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc((socById(p.sociedad)||{}).name||"")}</td><td>${p.use==="arriendo"?"Arriendo":"Personal"}</td><td>${esc(p.tenant||"—")}</td><td>${esc((ST[p.status]||{}).t||"")}</td><td>${esc(num(p.rentUF)>0?UFf(p.rentUF):"")}</td><td>${esc(CLP(p.use==="arriendo"?num(p.rent):0))}</td><td>${esc(CLP(egresosMes(p,uf)))}</td><td><b>${esc(CLP(utilidadMes(p,uf)))}</b></td></tr>`).join("");
    const tot=`<tr class="tot"><td colspan="6">TOTALES</td><td>${esc(CLP(ingresos))}</td><td>${esc(CLP(egresosTot))}</td><td>${esc(CLP(utilidadTotal))}</td></tr>`;
    const divRows=props.filter(p=>p.hasMortgage).map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.mortgageBank||"")}</td><td>${esc(UFf(p.dividendoUF))}</td><td>${esc(CLP(divCLP(p,uf)))}</td><td>${esc(num(p.dividendosTotales))}</td><td>${esc(num(p.dividendosPagados))}</td><td>${esc(divPorPagar(p))}</td><td>${Math.round(num(p.dividendosPagados)/Math.max(1,num(p.dividendosTotales))*100)}%</td></tr>`).join("");
    const socRows=socs.map(s=>{ const ps=props.filter(p=>p.sociedad===s.id); if(!ps.length) return ""; const ing=ps.filter(p=>p.use==="arriendo").reduce((a,p)=>a+num(p.rent),0); const ut=ps.reduce((a,p)=>a+utilidadMes(p,uf),0); return `<tr><td>${esc(s.name)}</td><td>${esc(s.rut||"")}</td><td>${ps.length}</td><td>${esc(CLP(ing))}</td><td><b>${esc(CLP(ut))}</b></td></tr>`; }).join("");
    const detalle=props.map(p=>`<div class="prop-blk"><h3 style="margin-top:0">${esc(p.name)} <span class="muted" style="font-weight:normal">— ${esc([p.address,p.comuna].filter(Boolean).join(", ")||"sin dirección")}</span></h3>
      <div class="kpis" style="margin:8px 0">${kpiBox("Estado",(ST[p.status]||{}).t||"—")}${kpiBox("Arriendo",p.use==="arriendo"?(num(p.rentUF)>0?UFf(p.rentUF):CLP(num(p.rent))):"Personal")}${kpiBox("Egresos/mes",CLP(egresosMes(p,uf)))}${kpiBox("Utilidad/mes",CLP(utilidadMes(p,uf)),utilidadMes(p,uf)>=0?"pos":"neg")}</div>
      ${filaDL([["Arrendatario",p.tenant],["Contrato",[p.contractStart,p.contractEnd].filter(Boolean).join(" → ")],["Crédito hipotecario",p.hasMortgage?((p.mortgageBank||"")+" · dividendo "+UFf(p.dividendoUF)+" · faltan "+divPorPagar(p)+" cuotas"):"Sin crédito"],["Garantía",(p.garantia&&num(p.garantia.monto))?CLP(num(p.garantia.monto))+" ("+(p.garantia.estado||"")+")":""],["Incidencias abiertas",(p.incidencias||[]).filter(x=>x.estado!=="Resuelta").length||""]])}
    </div>`).join("");
    return docPro("Informe general de cartera",
      `Propietario: ${owner.name||"—"} · Generado el ${todayISO()} · 1 UF = ${CLP(uf)}`,
      `<h2>1 · Resumen ejecutivo</h2>
       <div class="kpis">
         ${kpiBox("Propiedades",props.length+" ("+rentals.length+" en arriendo, "+personals.length+" personales)")}
         ${kpiBox("Ocupación de la cartera",ocup+" %")}
         ${kpiBox("Ingresos por arriendo / mes",CLP(ingresos),"pos")}
         ${kpiBox("Egresos totales / mes",CLP(egresosTot))}
         ${kpiBox("Utilidad neta / mes",CLP(utilidadTotal),utilidadTotal>=0?"pos":"neg")}
         ${kpiBox("Utilidad proyectada / año",CLP(utilidadTotal*12),utilidadTotal>=0?"pos":"neg")}
         ${kpiBox("Patrimonio (tasación)",CLP(patrimonio))}
         ${kpiBox("Deuda hipotecaria",UFf(deudaUF)+" ≈ "+CLP(Math.round(deudaUF*uf)))}
         ${kpiBox("Cobros",paid+" al día · "+pend+" pendientes · "+late+" atrasados")}
         ${kpiBox("Morosidad del mes",CLP(morosidad),morosidad>0?"neg":"pos")}
       </div>
       <div class="nota">Acumulado del año a la fecha (${MESES_L[new Date().getMonth()]}): <b>${esc(CLP(utilidadTotal*mesesTranscurridos()))}</b> de utilidad neta estimada, considerando los valores vigentes de arriendos, dividendos, contribuciones, seguros y gastos registrados.</div>
       <h2>2 · Estado de la cartera</h2>
       <table><tr><th>Propiedad</th><th>Sociedad</th><th>Uso</th><th>Arrendatario</th><th>Estado</th><th>Arriendo UF</th><th>Arriendo CLP</th><th>Egresos/mes</th><th>Utilidad/mes</th></tr>${rows}${tot}</table>
       ${divRows?`<h2>3 · Dividendos hipotecarios y deuda</h2><table><tr><th>Propiedad</th><th>Banco</th><th>Dividendo UF</th><th>Dividendo CLP</th><th>Cuotas</th><th>Pagadas</th><th>Por pagar</th><th>Avance</th></tr>${divRows}</table>`:""}
       ${socRows?`<h2>${divRows?"4":"3"} · Análisis por sociedad propietaria</h2><table><tr><th>Sociedad</th><th>RUT</th><th>Propiedades</th><th>Ingresos/mes</th><th>Utilidad/mes</th></tr>${socRows}</table>`:""}
       <h2 class="pb">Detalle por propiedad</h2>
       ${detalle}`);
  };


  /* ---- Contratos ---- */
  const openContract=(p)=>{ const soc=socById(p.sociedad);
    const existing=(p.contratos&&p.contratos[0])||null;
    setContract(existing ? {...blankContract,...existing} : {...blankContract,
      moneda: p.adjustment==="UF"?"UF":"Pesos",
      monto: p.adjustment==="UF" ? (p.rent?Math.round(num(p.rent)/uf*100)/100:"") : (p.rent||""),
      garantiaEn: p.adjustment==="UF"?"UF":"Pesos",
      garantiaMonto: "",
      fechaInicio: p.contractStart||todayISO(), fechaTermino: p.contractEnd||"",
      cuentaDueno: soc.cuentaNombre });
    setCStep(1); setMContract(p); };
  const setC=(k,v)=>setContract(c=>({...c,[k]:v}));
  const saveContract=()=>{ if(!contract.arrendatarioId){ notify("Selecciona o crea un arrendatario",true); return; }
    const rec={...contract, id:(mContract.contratos&&mContract.contratos[0]?.id)||Date.now(), fecha:todayISO()};
    setProps(ps=>ps.map(x=>x.id===mContract.id?{...x, contratos:[rec], contractStart:rec.fechaInicio, contractEnd:rec.indefinido?"":rec.fechaTermino, tenant:contactNombre(contacts.find(ct=>ct.id===rec.arrendatarioId))||x.tenant}:x));
    if(sel&&sel.id===mContract.id) setSel(s=>({...s, contratos:[rec]}));
    notify("Contrato guardado en la propiedad"); setMContract(null); };
  const descargarContrato=()=>{ if(!contract.arrendatarioId){ notify("Selecciona un arrendatario antes de descargar",true); return; }
    descargarContratoWord(mContract, contract, socById(mContract.sociedad), contacts.find(c=>c.id===contract.arrendatarioId), contacts.find(c=>c.id===contract.avalId), uf);
    notify("Generando contrato en Word…"); };
  const verContratoPDF=()=>{ if(!contract.arrendatarioId){ notify("Selecciona un arrendatario antes de generar el contrato",true); return; }
    abrirContratoPDF(mContract, contract, socById(mContract.sociedad), contacts.find(c=>c.id===contract.arrendatarioId), contacts.find(c=>c.id===contract.avalId), uf); };
  const openCrearContacto=(targetKey)=>{ setContactTarget(targetKey); setNewContact(blankContact); setMContact(true); };
  const guardarContacto=()=>{ if(!newContact.nombre){ notify("Indica al menos el nombre",true); return; }
    const c={...newContact, id:Date.now()}; setContacts(cs=>[...cs,c]); setContract(ct=>({...ct,[contactTarget]:c.id})); setMContact(false); notify("Contacto creado y asignado"); };

  /* ---------- Helper genérico: parchar una propiedad (y mantener "sel" sincronizado) ---------- */
  const patchProp = (id, fn) => { setProps(list=>list.map(x=>x.id===id?fn(x):x)); setSel(s=>s&&s.id===id?fn(s):s); };

  /* ---------- Incidencias ---------- */
  const abrirIncidencia=(p)=>{ setIncForm(blankInc); setMInc(p); };
  const guardarIncidencia=()=>{ if(!incForm.titulo.trim()){ notify("Escribe un título",true); return; }
    patchProp(mInc.id, x=>({...x, incidencias:[{ id:Date.now(), fecha:todayISO(), ...incForm }, ...(x.incidencias||[])]}));
    setMInc(null); notify("Incidencia registrada"); };
  const cambiarEstadoInc=(pid,iid,estado)=> patchProp(pid, x=>({...x, incidencias:(x.incidencias||[]).map(i=>i.id===iid?{...i,estado}:i)}));
  const eliminarInc=(pid,iid)=> patchProp(pid, x=>({...x, incidencias:(x.incidencias||[]).filter(i=>i.id!==iid)}));

  /* ---------- Descarga de archivos (Excel/Word/PDF/CSV) por blob ---------- */
  const leerArchivoB64=(file)=>new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const s=String(r.result||""); const b64=s.split(",")[1]||""; const media=file.type||(/\.pdf$/i.test(file.name)?"application/pdf":"image/jpeg"); res({name:file.name,media,b64,size:file.size}); }; r.onerror=()=>rej(new Error("No se pudo leer "+file.name)); r.readAsDataURL(file); });

    crm:["CRM y leads","Captura cada prospecto, muévelo por el embudo de ventas, agenda visitas, deja seguimientos, responde al instante con plantillas y mide tu conversión. Para arrendar y vender más rápido."],
    incidencias:["Incidencias","Reclamos, reparaciones y eventos asociados a cada propiedad."],
    bitacora:["Bitácora","Registro cronológico de notas, contratos, servicios, antecedentes y mantenciones de cada propiedad."],
    comunicaciones:["Comunicaciones","Plantillas listas para enviar a tus arrendatarios, adaptadas a correo, WhatsApp y SMS."],
    finanzas:["Finanzas y Balance","Dividendos hipotecarios (en UF), contribuciones, seguros, gastos editables (gasto común, internet, luz, agua, asesora del hogar, reparaciones…) y el balance real (utilidad) de cada propiedad."],
    historial:["Historial","Pagos, arrendatarios anteriores, lagunas de arriendo y garantías de cada propiedad. Todo queda guardado."],
    legal:["Documentos Legales","Crea contratos con firma notarial online y verifica antecedentes de arrendatarios."],
    informes:["Informes","Genera e imprime informes para ti, para tu contador o para los dueños."],
    equipo:["Equipo y accesos","Invita a más propietarios, colaboradores, invitados y arrendatarios. Cada uno entra con su correo y contraseña, y los arrendatarios ven un portal para pagar su arriendo."],

    ai:["Asistente","Pregúntale lo que quieras sobre tus propiedades, dividendos, utilidad y cobros."],

  /* ---------------- Panel de compartir (reutilizado en ficha y en modal) ---------------- */
