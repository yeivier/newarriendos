      <div className="help g" style={{marginBottom:12}}>Comparte una <b>ficha de marketing</b> atractiva y autocontenida de la propiedad: portada, características, fotos, recorrido 360°, mapa y contacto directo por WhatsApp. Nunca muestra el nombre, RUT ni contacto del arrendatario o propietario.</div>
      <div className="grid c3" style={{gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:14}}>
        {[["mostrarInfo","Información de la propiedad"],["mostrarValor","Valor de arriendo"],["mostrarDeudas","Gastos comunes"]].map(([k,label])=>{ const on=s[k]; return (
          <div key={k} onClick={()=>setCompartir(p.id,{[k]:!on})} className={"ib-card"+(on?" on":"")} style={{cursor:"pointer"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontWeight:700,fontSize:14}}>{label}</span><span style={{color:on?"var(--green-d)":"var(--faint)"}}>{on?"✓":"—"}</span></div>
          </div>
        ); })}
      </div>
      <div className="field" style={{marginBottom:14}}>
        <label className="label">Descripción de marketing (opcional)</label>
        <textarea value={s.descripcionPublica} onChange={e=>setCompartir(p.id,{descripcionPublica:e.target.value})} placeholder="Describe la propiedad para enamorar a quien vea la ficha… (si la dejas vacía, se genera una automáticamente)" style={{minHeight:80}}/>
      </div>
      {!fotos.length && <div className="help" style={{marginBottom:12}}>Agrega fotos desde <b>Editar</b> para que la ficha muestre una portada y galería, y para que el enlace tenga una vista previa con imagen.</div>}

      <div className="sub-title green">Descargar y compartir al instante</div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:10}}>
        <button className="btn btn-red btn-sm" onClick={()=>descargarFichaMarketingPDF(p)}>Descargar ficha (PDF)</button>
        <button className="btn btn-out btn-sm" onClick={()=>descargarFichaMarketingHTML(p)}>Descargar ficha (HTML)</button>
        <button className="btn btn-out btn-sm" onClick={()=>compartirFichaWhatsApp(p)}>WhatsApp</button>
        <button className="btn btn-out btn-sm" onClick={()=>copiarFichaResumen(p)}>Copiar texto</button>
        <a className="btn btn-out btn-sm" href={mailtoFicha(p)}>Correo</a>
      </div>
      <div className="help" style={{marginBottom:14}}>El botón <b>PDF</b> abre la ficha de marketing lista para imprimir o <b>Guardar como PDF</b>. {!fotos.length && "Agrega fotos desde Editar para que se vea con portada y galería. "}Todo esto funciona al instante, sin publicar nada en internet.</div>

      <div className="sub-title dark">Enlace público en internet (opcional)</div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:10}}>
        <button className="btn btn-out btn-sm" disabled={shareBusy} onClick={()=>publicarFicha(p)}>{shareBusy?"Publicando…":(s.publicId?"Actualizar enlace":"Generar enlace público")}</button>
        {link && <button className="btn btn-out btn-sm" disabled={shareBusy} onClick={()=>compartirWhatsApp(p)}>Compartir enlace por WhatsApp</button>}
      </div>
      {link ? (<>
        <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
          <input className="input" readOnly value={link} style={{flex:1,minWidth:200}} onFocus={e=>e.target.select()}/>
          <button className="btn btn-out btn-sm" onClick={()=>copiarFichaLink(p)}>Copiar enlace</button>
          <a className="btn btn-out btn-sm" href={link} target="_blank" rel="noopener">Ver</a>
        </div>
        <div className="help g" style={{marginTop:12}}>Enlace activo. Se actualiza con la info y las fotos más recientes cada vez que pulsas <b>Actualizar enlace</b>.</div>
      </>) : <div className="help" style={{marginTop:4}}>El enlace público requiere el sitio publicado en Netlify. Si aún no lo tienes activo, usa la <b>ficha en PDF</b> o el botón de <b>WhatsApp</b> de arriba — funcionan igual.</div>}

      <div className="sub-title dark" style={{marginTop:18}}>Publicar en portales inmobiliarios</div>
      <div className="help" style={{marginBottom:10}}>{estaDisponible(p)?<>Esta propiedad está <b>vacante</b>: publícala en los portales para arrendarla más rápido. </>:<>Publica el aviso de esta propiedad en los principales portales. </>}Copia el aviso ya formateado, ábrelo en cada portal y marca dónde quedó publicada para llevar el control.</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
        <button className="btn btn-red btn-sm" onClick={()=>copiarAviso(p)}>Copiar aviso para portales</button>
        <button className="btn btn-out btn-sm" onClick={()=>descargarFichaMarketingPDF(p)}>Descargar ficha (PDF)</button>
      </div>
      <div className="grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(215px,1fr))",gap:10}}>
        {PORTALES.map(pt=>{ const on=!!(p.portales&&p.portales[pt.id]&&p.portales[pt.id].publicado); return (
          <div key={pt.id} className={"ib-card"+(on?" on":"")}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
              <div style={{width:30,height:30,borderRadius:8,background:pt.color,color:pt.tx,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:14,flexShrink:0}}>{pt.name[0]}</div>
              <div style={{flex:1,fontWeight:700,fontSize:14}}>{pt.name}</div>
              {on&&<span className="pill green">Publicada</span>}
            </div>
            {on&&p.portales[pt.id].fecha&&<div style={{fontSize:12,color:"var(--muted)",marginBottom:6}}>Publicada desde {p.portales[pt.id].fecha}</div>}

              <a className="btn btn-out btn-xs" href={pt.url} target="_blank" rel="noopener">Abrir portal ↗</a>
              <button className={"btn btn-xs "+(on?"btn-ghost":"btn-green")} onClick={()=>togglePortal(p.id,pt.id,!on)}>{on?"Quitar":"Marcar publicada"}</button>
            </div>
          </div>); })}

    return (<div className="card pad" style={{marginTop:12}}>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:6}}>
        <button className="btn btn-out btn-sm" onClick={()=>{setEP({...p}); setMEdit(p);}}>Editar</button>
        {p.use==="arriendo" && p.status!=="pagado" && <button className="btn btn-green btn-sm" onClick={()=>{setMPay(p);setPayStep(1);setPayMethod("transfer");}}>Registrar pago</button>}
        {p.use==="arriendo" && <button className="btn btn-out btn-sm" onClick={()=>openRem(p)}>Recordatorio</button>}
        <button className="btn btn-out btn-sm" onClick={()=>{setMVac(p);setVac({desde:"",hasta:"",notas:""});}}>Registrar laguna</button>
        {p.use==="arriendo" && <button className="btn btn-green btn-sm" onClick={()=>openContract(p)}>Crear / editar contrato</button>}
        <button className="btn btn-out btn-sm" onClick={()=>{setMFirma(p);setFirmaStep(1);}}>Contrato online</button>
        <button className="btn btn-out btn-sm" onClick={()=>abrirIncidencia(p)}>Incidencia</button>
        <button className="btn btn-out btn-sm" onClick={()=>abrirBitacora(p)}>Bitácora</button>
        {p.use==="arriendo" && <button className="btn btn-out btn-sm" onClick={()=>{setComProp(p);setTab("comunicaciones");}}>Comunicaciones</button>}

      </div>

      {estaDisponible(p) && <div className="help" style={{marginTop:12,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
        <div><b>Disponible — sin arrendar hace {diasSinArriendo(p)} día(s)</b>{vacanciaAbierta(p)&&vacanciaAbierta(p).desde?` (desde ${vacanciaAbierta(p).desde})`:""}. La laguna se registra automáticamente hasta que la marques como arrendada.</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <button className="btn btn-out btn-sm" onClick={()=>setMShare(p)}>Publicar en portales</button>
          <button className="btn btn-green btn-sm" onClick={()=>{ setNtForm({propId:p.id,tenant:"",tenantRut:"",tenantEmail:"",tenantPhone:"",tenantWhatsapp:"",contractStart:"",contractEnd:"",rentUF:p.rentUF||"",garantiaMonto:""}); setMNewTenant(true); }}>Marcar como arrendada</button>
        </div>
      </div>}

      {/* PORTADA Y GALERÍA DE FOTOS */}
      {!!(p.fotos&&p.fotos.length) && (<div style={{marginTop:12}}>
        <div className="hero-cover" style={{backgroundImage:`url('${p.fotos[0].url}')`,cursor:"pointer"}} onClick={()=>setLightbox({fotos:p.fotos.map(f=>f.url),i:0})}>
          <span className="badge">Portada</span>
          <span className="count">{p.fotos.length} foto{p.fotos.length>1?"s":""}</span>
        </div>
        {p.fotos.length>1 && <div className="gal">
          {p.fotos.slice(1).map((f,i)=>(<button key={i} className="g" style={{backgroundImage:`url('${f.url}')`}} onClick={()=>setLightbox({fotos:p.fotos.map(x=>x.url),i:i+1})}></button>))}
        </div>}
        {!!(p.panoramas&&p.panoramas.length) && <button className="btn btn-red btn-sm" style={{marginTop:10}} onClick={()=>setPanoProp(p)}>Ver recorrido virtual 360°</button>}
      </div>)}

      <NotasBox key={p.id+"-notas"} p={p} onSave={(v)=>patchProp(p.id,x=>({...x,notas:v}))}/>

      <Collapsible icon="🏠" title="Datos de la propiedad" subtitle="Ubicación, características, tasación y antecedentes" defaultOpen={true}>
      <div className="sub-title">Ubicación</div>
      <div className="grid" style={{gridTemplateColumns:"1.3fr 1fr",gap:16}}>
        <div>
          <iframe title={p.name} src={`https://maps.google.com/maps?q=${p.lat},${p.lng}&hl=es&z=16&output=embed`} loading="lazy" style={{width:"100%",height:260,border:"none",borderRadius:12,background:"var(--panel2)"}}></iframe>

        </div>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <Data label="Dirección" value={p.address}/>

          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <a className="btn btn-out btn-sm" href={`https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${p.lat},${p.lng}`} target="_blank" rel="noopener">Street View</a>
            <a className="btn btn-out btn-sm" href={`https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`} target="_blank" rel="noopener">Google Maps</a>
            {!!(p.panoramas&&p.panoramas.length) && <button className="btn btn-out btn-sm" onClick={()=>setPanoProp(p)}>Recorrido 360°</button>}
            {p.virtualTour && <a className="btn btn-out btn-sm" href={p.virtualTour} target="_blank" rel="noopener">Recorrido externo</a>}
          </div>
        </div>
      </div>

      <div className="sub-title">Características</div>
      <div className="grid c4" style={{gridTemplateColumns:"repeat(4,1fr)"}}>
        <Data label="Tipo" value={tipoTxt(p)}/><Data label="Estado" value={p.condition}/><Data label="Año" value={p.constructionYear}/><Data label="Piso" value={p.floor||"—"}/>
        <Data label="m² construidos" value={p.surfaceBuilt?p.surfaceBuilt+" m²":"—"}/><Data label="m² terreno" value={p.surfaceTerrain?p.surfaceTerrain+" m²":"—"}/>
        <Data label="Dormitorios" value={p.bedrooms||"—"}/><Data label="Baños" value={p.bathrooms}/>
        <Data label="Estacionamientos" value={p.parking}/><Data label="Bodegas" value={p.bodega}/><Data label="Orientación" value={p.orientation}/>

      <div className="sub-title">Tasación y antecedentes legales</div>

        <div style={{margin:"10px 2px 0"}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:14,fontWeight:700,marginBottom:6}}>

            <span style={{color:"var(--green-d)"}}>{Math.round((num(p.dividendosPagados)/Math.max(1,num(p.dividendosTotales)))*100)}% pagado</span>

          <div className="bar"><div style={{width:Math.round((num(p.dividendosPagados)/Math.max(1,num(p.dividendosTotales)))*100)+"%",background:"var(--green)"}}></div></div>
        </div>
        <div className="help g" style={{marginTop:12}}>El dividendo está en UF, por eso <b>se reajusta automáticamente</b>: {UFf(p.dividendoUF)} × {CLP(uf)} = <b>{CLP(dCLP)}</b> este mes.</div>
      </> : <div className="help" style={{}}>Esta propiedad <b>no tiene crédito hipotecario</b> registrado. Puedes agregarlo con el botón Editar.</div>}

      </Collapsible>

      <div className="grid c4" style={{gridTemplateColumns:"repeat(4,1fr)"}}>
        <Data label={p.use==="arriendo"?"Ingreso (arriendo)":"Ingreso"} value={CLP(ingresoMes(p))} color="var(--green-d)"/>
        <Data label="− Dividendo" value={CLP(dCLP)} color="var(--red-d)"/>

        <Data label="− Seguro inc.+sismo / 12" value={CLP(seguroMes(p))} color="var(--red-d)"/>
        <Data label="Contribuciones al año" value={CLP(p.contribucionesAnuales)}/>
        <Data label="Seguro al año (UF)" value={<>{UFf(p.seguroUF)} <span style={{fontWeight:600,color:"var(--faint)",fontSize:13}}>({CLP(p.seguroIncendioSismo)})</span></>}/>
        <Data label="Gasto común mensual" value={CLP(p.gastoComun)+(p.gastosComunesOwner?" (lo pago yo)":" (lo paga arrendatario)")}/>
        <Data label="Diferencia arriendo − dividendo" value={CLP(diff)} color={diff>=0?"var(--green-d)":"var(--red-d)"}/>
      </div>
      <div className="card pad" style={{marginTop:12,background:util>=0?"var(--green-bg)":"var(--red-bg)",border:"none"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
          <div>
            <div style={{fontSize:14,fontWeight:700,color:"var(--muted)"}}>UTILIDAD NETA MENSUAL {p.use==="personal"?"(costo de mantención)":""}</div>

          </div>
          <div style={{fontSize:"clamp(22px,6vw,34px)",fontWeight:800,color:util>=0?"var(--green-d)":"var(--red-d)"}}>{CLP(util)}</div>

      </Collapsible>

      {p.use==="arriendo" && <>

          <Data label="Inicio contrato" value={p.contractStart}/><Data label="Término contrato" value={p.contractEnd}/>

  if(sesion && rolActual==="arrendatario") return (<PortalArrendatario u={usuarioActual} propiedades={props} uf={uf} owner={owner} cuentas={cuentas} montoCobro={montoCobro} calcMulta={calcMulta} onSalir={cerrarSesion}/>);

  return (<div className={"app"+(soloLectura?" solo-lectura":"")}>
    {menuOpen && <div className="nav-overlay" onClick={()=>setMenuOpen(false)}></div>}
    <div className={"sidebar"+(menuOpen?" open":"")}>
      <div className="brand"><div className="brand-logo">A</div><div style={{flex:1,minWidth:0}}><h1>ArriendoPro</h1><p>Administración fácil</p></div><button className="drawer-x" onClick={()=>setMenuOpen(false)} aria-label="Cerrar menú">✕</button></div>
      <div className="nav"><div className="nav-item" onClick={()=>{setMBusca(true);setMenuOpen(false);}} style={{marginBottom:4}}><span className="ico">🔍</span>Buscar<span className="kbd" style={{marginLeft:"auto"}}>/</span></div>{NAV_VIS.map(g=>(<React.Fragment key={g.label}>
        <div className="nav-group">{g.label}</div>
        {g.ids.map(id=>{ const n=navItem(id); return n?(<div key={id} className={"nav-item"+(tab===id?" on":"")} onClick={()=>{setTab(id);setSel(null);setMenuOpen(false);}}><span className="ico">{n.ico}</span>{n.label}</div>):null; })}
      </React.Fragment>))}</div>
      <div className="nav-foot"><div className="av">{(usuarioActual.nombre||"U").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase()}</div><div style={{minWidth:0,flex:1}}><div style={{fontWeight:700,color:"var(--side-tx)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{(usuarioActual.nombre||"").split(" ")[0]||usuarioActual.email}</div><div style={{fontSize:12.5,color:"var(--side-mut)"}}>{(ROLES_INFO[rolActual]||{}).label||rolActual}</div></div>{sesion&&<button className="btn btn-out btn-sm" style={{padding:"6px 10px",fontSize:12}} onClick={cerrarSesion}>Salir</button>}</div>
    </div>

    {mBusca && <div className="modal-bg" style={{alignItems:"flex-start",paddingTop:"8vh",zIndex:300}} onClick={cerrarBusca}>
      <div className="cmdk-card" onClick={e=>e.stopPropagation()}>
        <div className="cmdk-top">
          <span style={{fontSize:18}}>🔍</span>
          <input autoFocus value={busca} placeholder="Busca una sección, propiedad, arrendatario, plantilla o campo de la ficha…"
            onChange={e=>{ setBusca(e.target.value); setBusSel(0); }}
            onKeyDown={e=>{ if(e.key==="ArrowDown"){e.preventDefault();setBusSel(x=>Math.min(buscaRes.length-1,x+1));}
              else if(e.key==="ArrowUp"){e.preventDefault();setBusSel(x=>Math.max(0,x-1));}
              else if(e.key==="Enter"){e.preventDefault(); const it=buscaRes[busSel]; if(it&&it.run) it.run(); }
              else if(e.key==="Escape"){ cerrarBusca(); } }}/>
          <span className="kbd">Esc</span>
        </div>
        <div className="cmdk-list">
          {buscaRes.length ? buscaRes.map((it,i)=>{ const grp = i===0 || buscaRes[i-1].cat!==it.cat; return (<React.Fragment key={i}>
            {grp && <div className="cmdk-grp">{it.cat}</div>}
            <div className={"cmdk-item"+(i===busSel?" on":"")} onMouseEnter={()=>setBusSel(i)} onClick={it.run}>
              <span className="ic">{it.ico}</span>
              <span style={{minWidth:0,flex:1}}><span className="tt">{it.title}</span>{it.sub&&<span className="sb">{it.sub}</span>}</span>
            </div>
          </React.Fragment>); }) : <div className="cmdk-empty">Sin resultados para “{busca}”. Prueba con otra palabra (por ejemplo: arriendo, garantía, contrato, dividendo, plantilla…).</div>}
        </div>
        <div className="cmdk-foot"><span><span className="kbd">↑</span> <span className="kbd">↓</span> moverse</span><span><span className="kbd">Enter</span> abrir</span><span><span className="kbd">⌘/Ctrl</span>+<span className="kbd">K</span> o <span className="kbd">/</span> para abrir</span></div>
      </div>
    </div>}

    <div className="main">
      {/* TOPBAR */}
      <div className="topbar"><div className="topbar-row">
        <div style={{display:"flex",alignItems:"center",gap:12,minWidth:0}}>
          <button className="menu-btn" onClick={()=>setMenuOpen(true)} aria-label="Abrir menú"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
          <button className="gs-top" title="Buscar en toda la plataforma" aria-label="Buscar en toda la plataforma" onClick={()=>{ if(window.__gsOpen) window.__gsOpen(); }}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></button>
          <div style={{minWidth:0}}><h2>{HEAD[tab][0]}</h2><div className="desc">{HEAD[tab][1]}</div></div>
        </div>
        <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
          <button className="btn btn-ghost btn-sm btn-busca" onClick={()=>setMBusca(true)}>Buscar <span className="kbd">/</span></button>
          <div className="pill grey">1 UF = {CLP(uf)}</div>
          <button className="btn btn-red" onClick={()=>{setNP({...blank,gastosExtra:SEED_GASTOS()});setMAdd(true);}}>＋ Nueva propiedad</button>
        </div>
      </div></div>
      {soloLectura && <div className="readonly-note">Estás en modo <b>invitado (solo lectura)</b>: puedes revisar la información, pero no crear ni modificar registros.</div>}

      {/* INDICADORES EN VIVO */}
      <div className="indbar">
        <span className="pill grey">UF {CLP(uf)}</span>
        <span className="pill grey">UTM {CLP(utm)}</span>
        <span className="pill grey">UTA {CLP(utm*12)}</span>
        <span className="pill grey">Dólar {CLP(dolar)}</span>
        <span className="pill grey" title="Variación mensual del IPC — fuente: mindicador.cl (Banco Central / INE)">IPC {pctFmt(ipc)}</span>
        <button className="btn btn-ghost btn-sm" onClick={refrescarIndicadores} disabled={indLoading} style={{marginLeft:"auto"}}>{indLoading?"Actualizando…":"Actualizar"}</button>
      </div>

      <div className="content">

        <GuiaSeccion tab={tab}/>

        {/* ============ INICIO ============ */}
        {tab==="inicio" && <>
          <Collapsible icon="👋" title="¿Qué quieres hacer hoy?" subtitle="Accesos directos — toca para abrir" defaultOpen={false}>
            <div className="help g" style={{marginBottom:16}}>Toca un botón para ir directo a lo que necesitas.</div>
            <div className="qa-grid">
              <button className="qa" onClick={()=>setTab("props")}><span className="qico">🏘️</span><span><span className="qt">Mis propiedades</span><span className="qd">Ver la ficha de cada una</span></span></button>
              <button className="qa" onClick={()=>{ if(props.length===1){abrirFicha(props[0]);} else {setTab("props"); notify("Abre una propiedad y toca Ficha completa");} }}><span className="qico">📄</span><span><span className="qt">Ficha completa</span><span className="qd">Rellenar, previsualizar, exportar y compartir</span></span></button>
              <button className="qa" onClick={abrirLevantamiento}><span className="qico">📝</span><span><span className="qt">Ficha de Levantamiento</span><span className="qd">Formulario completo para levantar una propiedad</span></span></button>
              <button className="qa" onClick={()=>setTab("crm")}><span className="qico">🤝</span><span><span className="qt">CRM y leads</span><span className="qd">Prospectos, visitas, seguimiento y conversión</span></span></button>
              <button className="qa" onClick={()=>setTab("cobros")}><span className="qico">💰</span><span><span className="qt">Cobrar arriendos</span><span className="qd">Registrar pagos y recordatorios</span></span></button>
              <button className="qa" onClick={()=>setTab("arrendatarios")}><span className="qico">👥</span><span><span className="qt">Arrendatarios y contactos</span><span className="qd">Datos, contactos y contratos</span></span></button>
              <button className="qa" onClick={()=>setTab("finanzas")}><span className="qico">📊</span><span><span className="qt">Finanzas y balance</span><span className="qd">Gastos, ingresos y balance de cada propiedad</span></span></button>
              <button className="qa" onClick={()=>setTab("incidencias")}><span className="qico">🛠️</span><span><span className="qt">Incidencias</span><span className="qd">Reparaciones y reclamos</span></span></button>
              <button className="qa" onClick={()=>setTab("informes")}><span className="qico">📈</span><span><span className="qt">Informes</span><span className="qd">Descargar Word, Excel o PDF</span></span></button>
            </div>
            <div className="help" style={{marginTop:10}}>La <b>Ficha completa</b> de cada propiedad reúne toda su información (legal, física, valores, arriendo, arrendatario, crédito, gastos, servicios y contactos). Puedes <b>rellenarla, agregar fotos y archivos, previsualizarla</b> y <b>compartirla o exportarla</b> en PDF, Word, Excel o HTML, o por WhatsApp, correo y SMS.</div>
          </Collapsible>

          <Collapsible icon="⚡" title="Resumen rápido" subtitle="Ingresos, dividendos, utilidad y patrimonio" defaultOpen={false}>
            <div className="grid c4" style={{gridTemplateColumns:"repeat(4,1fr)"}}>
              <div className="stat" style={{borderTopColor:"var(--green)"}}><div className="lab">Ingresos por arriendo</div><div className="val">{CLP(ingresos)}</div><div className="sub" style={{color:"var(--green-d)"}}>{rentals.length} en arriendo</div></div>
              <div className="stat" style={{borderTopColor:"var(--red)"}}><div className="lab">Dividendos / mes</div><div className="val">{CLP(dividendos)}</div><div className="sub" style={{color:"var(--red-d)"}}>{props.filter(p=>p.hasMortgage).length} con crédito</div></div>
              <div className="stat" style={{borderTopColor:utilidadTotal>=0?"var(--green)":"var(--red)"}}><div className="lab">Utilidad neta / mes</div><div className="val" style={{color:utilidadTotal>=0?"var(--green-d)":"var(--red-d)"}}>{CLP(utilidadTotal)}</div><div className="sub" style={{color:"var(--muted)"}}>arriendo − todos los gastos</div></div>
              <div className="stat" style={{borderTopColor:"#37404f"}}><div className="lab">Patrimonio</div><div className="val">{CLP(patrimonio)}</div><div className="sub" style={{color:"var(--muted)"}}>{props.length} inmuebles</div></div>
            </div>
            <div style={{marginTop:14,display:"flex",flexDirection:"column",gap:8}}>
              <div className="help" style={{margin:0}}><b>Ingresos por arriendo:</b> la suma de todos los arriendos mensuales que cobras hoy (en pesos, según la UF más alta del mes).</div>
              <div className="help" style={{margin:0}}><b>Dividendos / mes:</b> lo que pagas cada mes a los bancos por las propiedades que tienen crédito hipotecario.</div>
              <div className="help" style={{margin:0}}><b>Utilidad neta / mes:</b> lo que realmente te queda: los arriendos menos todos los gastos (dividendos, contribuciones, gasto común, seguros, etc.).</div>
              <div className="help" style={{margin:0}}><b>Patrimonio:</b> el valor total de tus propiedades, según la tasación comercial que cargaste en cada una.</div>
            </div>
          </Collapsible>

          <Collapsible icon="💰" title="Estado de cobros" subtitle="Cuántas propiedades están al día, pendientes o atrasadas" defaultOpen={false}>
            {[{l:"Al día",n:paid,c:"var(--green)"},{l:"Pendiente",n:pend,c:"var(--amber)"},{l:"Atrasado",n:late,c:"var(--red)"}].map(s=>(
              <div key={s.l} style={{marginBottom:14}}><div style={{display:"flex",justifyContent:"space-between",fontSize:15,fontWeight:700,marginBottom:6}}><span style={{color:"#445"}}>{s.l}</span><span style={{color:s.c}}>{s.n} propiedad{s.n!==1?"es":""}</span></div><div className="bar"><div style={{width:(rentals.length?(s.n/rentals.length*100):0)+"%",background:s.c}}></div></div></div>
            ))}
            <div className="help" style={{marginTop:6}}>Tienes <b>{rentals.length}</b> propiedades en arriendo y <b>{personals.length}</b> de uso personal. <b>Al día</b> = ya pagaron el mes · <b>Pendiente</b> = aún no pagan · <b>Atrasado</b> = pasó la fecha de pago.</div>
          </Collapsible>

          <Collapsible icon="🏢" title="Mis sociedades" subtitle={SOCIEDADES.length+" sociedad(es) propietaria(s)"} defaultOpen={false}>
            <div className="help" style={{marginBottom:10}}>Las empresas o personas dueñas de tus propiedades. Aquí ves un resumen; toca “Ver sociedades” para gestionarlas.</div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {SOCIEDADES.map(s=>{ const list=bySoc(s.id); const arr=list.filter(p=>p.use==="arriendo"); const util=arr.reduce((a,p)=>a+utilidadMes(p,uf),0);
                return (<div key={s.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8,padding:"10px 12px",background:"var(--panel2)",borderRadius:10,borderLeft:"5px solid "+s.color}}>
                  <div><div style={{fontWeight:800}}>{s.name}</div><div style={{fontSize:13,color:"var(--muted)"}}>{list.length} propiedad(es) · {arr.length} en arriendo</div></div>
                  <div style={{textAlign:"right"}}><div style={{fontWeight:800,color:util>=0?"var(--green-d)":"var(--red-d)"}}>{CLP(util)}</div><div style={{fontSize:12,color:"var(--faint)"}}>utilidad / mes</div></div>
                </div>); })}
            </div>
            <button className="btn btn-out" style={{marginTop:12}} onClick={()=>setTab("sociedades")}>Ver y gestionar sociedades →</button>
          </Collapsible>

          {(()=>{ const allBit=[]; props.forEach(p=>(p.bitacora||[]).forEach(b=>allBit.push({...b, pid:p.id, pname:p.name}))); allBit.sort((a,b)=>String(b.fecha||"").localeCompare(String(a.fecha||"")));
            return (<Collapsible icon="📓" title="Bitácora" subtitle={allBit.length+" anotación(es) en todas las propiedades"} defaultOpen={false}>
              <div className="help" style={{marginBottom:10}}>Las últimas anotaciones de todas tus propiedades (contratos, servicios, antecedentes, mantenciones, etc.).</div>
              {allBit.length===0 ? <div style={{color:"var(--muted)"}}>Aún no hay anotaciones. Agrégalas desde la pestaña Bitácora o desde cada propiedad.</div> :
                <div style={{display:"flex",flexDirection:"column",gap:8}}>{allBit.slice(0,12).map(b=>(
                  <div key={b.pid+"-"+b.id} style={{borderLeft:"3px solid var(--red)",paddingLeft:12}}>
                    <div style={{fontWeight:700}}>{b.titulo||b.tipo||"Anotación"} <span style={{fontWeight:500,color:"var(--faint)",fontSize:12}}>· {b.fecha}</span></div>
                    <div style={{fontSize:13,color:"var(--muted)"}}>{b.pname}{b.texto?" — "+b.texto:""}</div>
                  </div>))}</div>}
              <button className="btn btn-out" style={{marginTop:12}} onClick={()=>setTab("bitacora")}>Ver bitácora completa →</button>
            </Collapsible>); })()}

          <Collapsible icon="🏦" title="Resumen de dividendos" defaultOpen={false}>
            <Data label="Dividendos totales por pagar (todas)" value={props.reduce((s,p)=>s+divPorPagar(p),0)+" cuotas"} color="var(--red-d)" big/>
            <div style={{height:10}}></div>
            <Data label="Deuda hipotecaria restante (aprox.)" value={UFf(deudaHipTotalUF)+" ≈ "+CLP(deudaHipTotalUF*uf)}/>
            <button className="btn btn-out" style={{marginTop:14}} onClick={()=>setTab("finanzas")}>Ver dividendos, gastos y utilidades →</button>
          </Collapsible>

          <Collapsible icon="🏘️" title="Tus propiedades" subtitle={props.length+" inmueble(s) — toca para verlas"} defaultOpen={false}>
            <div style={{textAlign:"right",marginBottom:10}}><button className="btn btn-ghost" onClick={()=>setTab("props")}>Ver todas →</button></div>
            <div className="grid" style={{gridTemplateColumns:"1fr 1fr",gap:12}}>
              {props.map(p=>(<div key={p.id} className="prop" onClick={()=>{setSel(p);setTab("props");setFilter("todas");}}>
                <span className="dot" style={{background:dotColor(p.status)}}></span>
                <div style={{flex:1}}><div style={{fontWeight:700}}>{p.name} {p.use==="personal" && <span className="pill blue">Uso personal</span>}</div><div style={{fontSize:14,color:"var(--muted)",marginTop:2}}>{p.use==="arriendo"?p.tenant+" · ":""}{p.comuna}</div></div>
                <div style={{textAlign:"right"}}><div style={{fontWeight:800}}>{p.use==="arriendo"?CLP(p.rent):"—"}</div>{p.use==="arriendo"&&<div style={{fontSize:12,color:"var(--faint)",fontWeight:600}}>{UFf(p.rentUF)}</div>}{p.use==="arriendo"?<Pill s={p.status}/>:<span className="pill blue">{p.subtype}</span>}</div>
                <button className="btn btn-ghost btn-sm" title="Abrir ficha completa" onClick={e=>{e.stopPropagation();abrirFicha(p);}}></button>
              </div>))}
            </div>
          </Collapsible>
        </>}

        {/* ============ SOCIEDADES ============ */}
        {tab==="sociedades" && <>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10,marginBottom:4}}>
            <div className="help" style={{margin:0,flex:1,minWidth:240}}>Tus propiedades están repartidas en <b>{socs.length} sociedad{socs.length!==1?"es":""}</b>. Aquí las ves ordenadas por cada una. Crea, edita o elimina las sociedades propietarias. Haz clic en una propiedad para abrir su ficha o crear su contrato.</div>
            <button className="btn btn-red" onClick={openNewSoc}>＋ Nueva sociedad</button>
          </div>
          {socs.length===0 && <div className="card pad" style={{textAlign:"center",color:"var(--muted)"}}>Aún no tienes sociedades. Crea la primera con <b>＋ Nueva sociedad</b>.</div>}
          {SOCIEDADES.map(s=>{ const list=bySoc(s.id); const arr=list.filter(p=>p.use==="arriendo");
            const ing=arr.reduce((a,p)=>a+num(p.rent),0); const util=arr.reduce((a,p)=>a+utilidadMes(p,uf),0); const pat=list.reduce((a,p)=>a+num(p.tasacion),0);
            return (<Collapsible key={s.id} accent={s.color} icon="🏢" title={s.name} subtitle={"RUT "+s.rut+" · Rep. "+s.rep+" · "+list.length+" propiedad"+(list.length!==1?"es":"")} defaultOpen={false}>
              <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginBottom:12,flexWrap:"wrap"}}>
                <button className="btn btn-out btn-sm" onClick={()=>openEditSoc(s)}>Editar sociedad</button>
                <button className="btn btn-out btn-sm" style={{color:"var(--red-d)",borderColor:"var(--red-soft)"}} onClick={()=>setMSocDel(s)}>✕ Eliminar</button>
              </div>
              <div className="grid c4" style={{gridTemplateColumns:"repeat(4,1fr)",marginBottom:14}}>
                <Data label="En arriendo" value={arr.length+" de "+list.length}/>
                <Data label="Ingresos / mes" value={CLP(ing)} color="var(--green-d)"/>
                <Data label="Utilidad / mes" value={CLP(util)} color={util>=0?"var(--green-d)":"var(--red-d)"}/>
                <Data label="Patrimonio (tasación)" value={CLP(pat)}/>
              </div>
              <div className="grid" style={{gridTemplateColumns:"1fr 1fr",gap:12}}>
                {list.map(p=>(<div key={p.id} className="prop" onClick={()=>{setSel(p);setSocFilter(s.id);setFilter("todas");setTab("props");}}>
                  <span className="dot" style={{background:dotColor(p.status)}}></span>
                  <div style={{flex:1}}><div style={{fontWeight:700}}>{p.name} {p.use==="personal" && <span className="pill blue">Uso personal</span>}</div><div style={{fontSize:14,color:"var(--muted)",marginTop:2}}>{p.use==="arriendo"?p.tenant+" · ":""}{p.comuna}</div></div>
                  <div style={{textAlign:"right"}}><div style={{fontWeight:800}}>{p.use==="arriendo"?CLP(p.rent):"—"}</div>{p.use==="arriendo"&&<div style={{fontSize:12,color:"var(--faint)",fontWeight:600}}>{UFf(p.rentUF)}</div>}{p.use==="arriendo"?<Pill s={p.status}/>:<span className="pill blue">{p.subtype}</span>}</div>
                </div>))}
                {list.length===0 && <div className="help">Esta sociedad aún no tiene propiedades. Agrégalas con <b>＋ Nueva propiedad</b>.</div>}
              </div>
            </Collapsible>);
          })}
        </>}

        {/* ============ PROPIEDADES ============ */}
        {tab==="props" && <>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
            <div className="seg">
              <button className={filter==="todas"?"on":""} onClick={()=>setFilter("todas")}>Todas ({props.length})</button>
              <button className={filter==="arriendo"?"on":""} onClick={()=>setFilter("arriendo")}>En arriendo ({rentals.length})</button>
              <button className={filter==="personal"?"on":""} onClick={()=>setFilter("personal")}>Uso personal ({personals.length})</button>
            </div>
            <div className="seg">
              <button className={socFilter==="todas"?"on":""} onClick={()=>setSocFilter("todas")}>Todas las sociedades</button>
              {SOCIEDADES.map(s=><button key={s.id} className={socFilter===s.id?"on":""} onClick={()=>setSocFilter(s.id)}>{s.name.replace(/ SPA$/,"")} ({bySoc(s.id).length})</button>)}
            </div>
          </div>
          <div className="help">Haz clic en cualquier propiedad para abrir su <b>ficha completa</b>: ubicación, dividendo, gastos, utilidad, garantía e historial.</div>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {view.map(p=>{ const on=sel&&sel.id===p.id; const util=utilidadMes(p,uf);
              return (<div key={p.id}>
                <div className={"prop"+(on?" on":"")} onClick={()=>setSel(on?null:p)}>
                  <span className="dot" style={{background:dotColor(p.status),boxShadow:`0 0 0 4px ${dotColor(p.status)}22`}}></span>
                  {!!(p.fotos&&p.fotos.length) && <div className="cover-thumb" style={{backgroundImage:`url('${p.fotos[0].url}')`}}></div>}
                  <div style={{flex:1}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                      <span style={{fontSize:17,fontWeight:800}}>{p.name}</span>
                      <span className="pill" style={{background:socById(p.sociedad).color+"1a",color:socById(p.sociedad).color}}>{socById(p.sociedad).name.replace(/ SPA$/,"")}</span>
                      {p.use==="personal" ? <span className="pill blue">{p.subtype}</span> : <span className="pill grey">{tipoTxt(p)}</span>}
                      {p.hasMortgage && <span className="pill red">Dividendo {UFf(p.dividendoUF)}</span>}
                    </div>
                    <div style={{fontSize:14,color:"var(--muted)",marginTop:4}}>{p.address}, {p.comuna}{p.use==="arriendo"?" · "+p.tenant:""}</div>
                  </div>
                  <div style={{textAlign:"right"}}>

                  </div>
                  {p.use==="arriendo" && <Pill s={p.status}/>}

            })}
          </div>
        </>}

        {/* ============ ARRENDATARIOS ============ */}
        {tab==="arrendatarios" && (()=>{ const ufm=ufMaxMes();
          const con=rentals.filter(p=>p.tenant&&p.tenant.trim()), sin=rentals.filter(p=>!p.tenant||!p.tenant.trim());

          const eqf=(p,k,type)=>(<input className="input" type={type||"text"} value={(p.tenantEquifax&&p.tenantEquifax[k])||""} onChange={e=>patchProp(p.id,x=>({...x,tenantEquifax:{...(x.tenantEquifax||{}),[k]:e.target.value}}))} style={{padding:"7px 9px"}}/>);

            <div className="stat" style={{borderTopColor:"var(--green)"}}><div className="lab">Arriendo total (UF fija)</div><div className="val" style={{color:"var(--green-d)"}}>{UFf(rentals.reduce((s,p)=>s+num(p.rentUF),0))}</div></div>
          </div>
          <div className="help g">Aquí tienes a <b>todos tus arrendatarios</b> en un solo lugar. Puedes editar sus datos de contacto, las fechas de contrato y el arriendo en UF directamente; los cambios se guardan solos. El <b>monto en pesos</b> se calcula con la UF más alta del mes (regla anti-atrasos).</div>
          <div style={{margin:"2px 0",display:"flex",gap:8,flexWrap:"wrap"}}>
            <button className="btn btn-red" onClick={()=>{ setNtForm({propId:"",tenant:"",tenantRut:"",tenantEmail:"",tenantPhone:"",tenantWhatsapp:"",contractStart:"",contractEnd:"",rentUF:"",garantiaMonto:""}); setMNewTenant(true); }}>+ Agregar nuevo arrendatario</button>

            return (<Collapsible key={p.id} accent="var(--blue)" icon="👤" title={p.tenant} subtitle={""+p.name+(p.comuna?" · "+p.comuna:"")+" · "+CLP(cobro)+"/mes"} defaultOpen={false}>
            <div style={{display:"flex",justifyContent:"flex-end",alignItems:"center",flexWrap:"wrap",gap:6,marginBottom:10}}>
              <span className={"pill "+(ST[p.status]?ST[p.status].c:"")}>{ST[p.status]?ST[p.status].t:p.status}</span>
              {porVencer&&<span className="pill amber">Contrato vence en {venc} día(s)</span>}
            </div>
            <div className="grid" style={{gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
              <div className="field"><label className="label">Nombre arrendatario</label>{fld(p,"tenant",p.tenant)}</div>
              <div className="field"><label className="label">RUT</label>{fld(p,"tenantRut",p.tenantRut)}</div>
              <div className="field"><label className="label">Correo</label>{fld(p,"tenantEmail",p.tenantEmail,"email")}</div>
              <div className="field"><label className="label">Teléfono</label>{fld(p,"tenantPhone",p.tenantPhone)}</div>
              <div className="field"><label className="label">WhatsApp</label>{fld(p,"tenantWhatsapp",p.tenantWhatsapp)}</div>
              <div className="field"><label className="label">Arriendo (UF fija)</label><input className="input" type="number" min="0" step="any" value={p.rentUF==null?"":p.rentUF} onChange={e=>patchProp(p.id,x=>({...x,rentUF:e.target.value,rent:Math.round(num(e.target.value)*uf)}))} style={{fontWeight:700,padding:"7px 9px"}}/></div>
              <div className="field"><label className="label">Inicio contrato</label>{fld(p,"contractStart",p.contractStart,"date")}</div>
              <div className="field"><label className="label">Término contrato</label>{fld(p,"contractEnd",p.contractEnd,"date")}</div>
              <div className="field"><label className="label">Monto a cobrar hoy (UF más alta)</label><div className="input" style={{background:"var(--panel2)",fontWeight:800,color:"var(--green-d)"}}>{CLP(cobro)}</div></div>
            </div>
            <div className="sub-title green" style={{marginTop:10}}>Antecedentes (InfoCheck)</div>

          {!!sin.length&&<div className="card pad"><div className="sec-title">Propiedades disponibles (sin arrendatario)</div>
            <div className="help" style={{marginBottom:10}}>Estas propiedades están en arriendo pero hoy <b>no tienen arrendatario</b>. La <b>laguna</b> (tiempo sin arrendar) se cuenta sola; cuando se arrienden, marca “Cargar arrendatario” y se cierra automáticamente.</div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>{sin.map(p=>{ const dv=diasSinArriendo(p); const va=vacanciaAbierta(p);

              <div><b>{p.name}</b><span style={{color:"var(--muted)",fontSize:13}}>{p.comuna?` · ${p.comuna}`:""}</span>
                <div style={{fontSize:13,marginTop:3}}>{va? <span className="pill amber">Sin arrendar hace {dv} día(s){va.desde?` · desde ${va.desde}`:""}</span> : <span className="pill grey">Sin arrendatario cargado</span>}</div>

              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                <button className="btn btn-green btn-sm" onClick={()=>{ setNtForm({propId:p.id,tenant:"",tenantRut:"",tenantEmail:"",tenantPhone:"",tenantWhatsapp:"",contractStart:"",contractEnd:"",rentUF:p.rentUF||"",garantiaMonto:""}); setMNewTenant(true); }}>Marcar como arrendada</button>
                <button className="btn btn-out btn-sm" onClick={()=>{setEP({...p});setMEdit(p);}}>Editar propiedad</button>
              </div>
            </div>); })}</div>
          </div>}
          <div className="card pad">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8,marginBottom:6}}>
              <div className="sec-title" style={{margin:0}}>Contactos y arrendatarios anteriores</div>
              <button className="btn btn-red btn-sm" onClick={nuevoContactoGeneral}>+ Agregar contacto</button>
            </div>
            <div className="help" style={{marginBottom:10}}>Aquí queda guardada la información <b>completa</b> de tus contactos: arrendatarios actuales y anteriores, avales, proveedores, etc. Útil si quieres <b>volver a contactar</b> a un arrendatario pasado. Cuando cambias de arrendatario, el anterior se guarda solo aquí. Toca una tarjeta para ver todo.</div>
            {contacts.length===0 ? <div style={{color:"var(--muted)"}}>Aún no tienes contactos guardados. Agrega uno con “+ Agregar contacto”.</div> :
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {contacts.map(c=>{ const nom=contactNombre(c)||c.nombre||"(sin nombre)"; const wa=(c.telefono||"").replace(/[^0-9]/g,""); const ic=c.infocheck||{};
                  return (<Collapsible key={c.id} icon={c.esEmpresa?"":""} title={nom} subtitle={(c.tipo||"contacto")+(c.rut?(" · "+c.rut):"")} defaultOpen={false}>
                    <div className="grid c2" style={{gridTemplateColumns:"1fr 1fr",gap:8}}>
                      <Data label="Tipo" value={c.tipo||"—"}/>
                      <Data label="RUT" value={c.rut||"—"}/>
                      <Data label="Correo" value={c.email||"—"}/>
                      <Data label="Teléfono" value={c.telefono||"—"}/>
                      <Data label="Profesión" value={c.profesion||"—"}/>
                      <Data label="Nacionalidad" value={c.nacionalidad||"—"}/>
                      <Data label="Arrendó (UF)" value={c.arriendoUF?UFf(num(c.arriendoUF)):"—"}/>
                      <Data label="Periodo" value={(c.desde||"—")+" → "+(c.hasta||"—")}/>
                    </div>
                    {(ic.puntaje||ic.capacidadPago||ic.rentaLiquida||ic.deudaCMF)&&<>
                      <div className="sub-title green" style={{marginTop:8}}>InfoCheck</div>
                      <div className="grid c4" style={{gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
                        <Data label="Puntaje" value={ic.puntaje||"—"}/>
                        <Data label="Capacidad de pago" value={ic.capacidadPago?CLP(num(ic.capacidadPago)):"—"}/>
                        <Data label="Renta líquida" value={ic.rentaLiquida?CLP(num(ic.rentaLiquida)):"—"}/>
                        <Data label="Deuda CMF" value={ic.deudaCMF?CLP(num(ic.deudaCMF)):"—"}/>
                      </div>
                    </>}
                    {c.notas&&<div className="help" style={{marginTop:8}}>{c.notas}</div>}
                    <AdjuntosView items={c.archivos}/>
                    <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:12}}>
                      <button className="btn btn-out btn-sm" onClick={()=>editarContacto(c)}>Editar</button>
                      {wa&&<a className="btn btn-out btn-sm" href={"https://wa.me/"+wa} target="_blank" rel="noreferrer">WhatsApp</a>}
                      {c.email&&<a className="btn btn-out btn-sm" href={"mailto:"+c.email}>Correo</a>}
                      <button className="btn btn-out btn-sm" style={{color:"var(--red-d)",borderColor:"var(--red-soft)"}} onClick={()=>eliminarContacto(c.id)}>✕ Eliminar</button>
                    </div>
                  </Collapsible>); })}
              </div>}
          </div>
        </>); })()}

        {/* ============ COBROS ============ */}
        {tab==="cobros" && (()=>{ const ufm=ufMaxMes();
          const cobroUF=(p)=> num(p.rentUF)>0 ? Math.round(num(p.rentUF)*ufm.valor) : num(p.rent);
          const cobrables=rentals.filter(p=>p.tenant&&p.tenant.trim()&&p.status!=="disponible");
          return (<>
          <div className="grid c3" style={{gridTemplateColumns:"repeat(3,1fr)"}}>
            <div className="stat" style={{borderTopColor:"var(--green)"}}><div className="lab">Cobrado este mes</div><div className="val" style={{color:"var(--green-d)"}}>{CLP(cobrables.filter(p=>p.status==="pagado").reduce((s,p)=>s+cobroUF(p),0))}</div></div>
            <div className="stat" style={{borderTopColor:"var(--amber)"}}><div className="lab">Pendiente de cobro</div><div className="val" style={{color:"var(--amber)"}}>{CLP(cobrables.filter(p=>p.status!=="pagado").reduce((s,p)=>s+cobroUF(p),0))}</div></div>
            <div className="stat" style={{borderTopColor:"var(--red)"}}><div className="lab">Multas por atraso</div><div className="val" style={{color:"var(--red-d)"}}>{CLP(rentals.reduce((s,p)=>s+calcMulta(p),0))}</div></div>
          </div>
          <div className="card pad" style={{borderLeft:"5px solid var(--green)"}}>
            <div className="sec-title">Regla de cobro en UF (valor más alto del mes)</div>
            <div className="help g" style={{marginBottom:0}}>El arriendo en <b>UF es fijo y nunca cambia</b>; solo cambia su conversión a pesos según el día. Para que nadie pague con una UF más baja (o la use al atrasarse), el monto a cobrar se calcula con la <b>UF más alta entre el día 1 del mes y la fecha de pago</b>. Hoy ({todayISO()}) la UF más alta del período {ufm.ini} → {ufm.fin} es <b>{CLP(ufm.valor)}</b> (del {ufm.fecha}). Si un arriendo está atrasado, al registrar el pago se usa la UF más alta hasta ese día. {(!ufSerie||!ufSerie.length)&&<span style={{color:"var(--amber)"}}> · La serie diaria de UF se carga al publicar el sitio (mindicador.cl); mientras tanto se usa la UF actual.</span>}</div>
          </div>
          <div className="card pad"><div className="sec-title">Arriendos del mes</div>
            <div className="help" style={{marginBottom:10}}>El <b>arriendo en UF</b> es fijo (edítalo en cada propiedad). El <b>monto a cobrar</b> se calcula con la UF más alta del mes y se recalcula solo.</div>
            <div style={{overflowX:"auto"}}><table><thead><tr><th>Propiedad</th><th>Arrendatario</th><th>Arriendo (UF fija)</th><th>UF aplicada</th><th>Monto a cobrar</th><th>Multa</th><th>Total</th><th>Estado</th><th>Acción</th></tr></thead><tbody>
              {cobrables.map(p=>{ const m=calcMulta(p); const cobro=cobroUF(p); return (<tr key={p.id}>
                <td style={{fontWeight:700}}>{p.name}</td><td>{p.tenant}<div style={{fontSize:13,color:"var(--muted)"}}>{p.tenantEmail}</div></td>
                <td><input className="input" type="number" min="0" step="any" style={{width:90,fontWeight:700,padding:"6px 8px"}} value={p.rentUF} onChange={e=>patchProp(p.id,x=>{ const v=num(e.target.value); return {...x, rentUF:e.target.value, rent:Math.round(v*uf)}; })}/><div style={{fontSize:12,color:"var(--faint)",fontWeight:600,marginTop:2}}>UF · valor fijo</div></td>
                <td style={{fontSize:13}}><b>{CLP(num(p.rentUF)>0?ufm.valor:uf)}</b><div style={{fontSize:11,color:"var(--faint)"}}>{num(p.rentUF)>0?`más alta · ${ufm.fecha}`:"UF actual"}</div></td>
                <td style={{fontWeight:800,color:"var(--ink)"}}>{CLP(cobro)}</td>
                <td style={{color:m>0?"var(--red-d)":"var(--faint)"}}>{m>0?CLP(m):"—"}</td>
                <td style={{fontWeight:800,color:"var(--green-d)"}}>{CLP(cobro+m)}</td><td>
                  <select value={p.status} onChange={e=>patchProp(p.id,x=>({...x,status:e.target.value}))} style={{padding:"4px 6px"}}>

                  </select></td>
                <td><div style={{display:"flex",gap:6}}>{p.status!=="pagado" && <button className="btn btn-green btn-sm" onClick={()=>{setMPay(p);setPayStep(1);setPayMethod("transfer");}}>Cobrar</button>}<button className="btn btn-out btn-sm" onClick={()=>openRem(p)}></button></div></td>
              </tr>); })}
            </tbody></table></div>
          </div>
          <div className="card pad"><div className="sec-title">Datos para transferencia (se incluyen en los recordatorios)</div>
            <div className="help" style={{marginBottom:14}}>Agrega <b>todas tus cuentas de banco</b>. Puedes editarlas o eliminarlas; quedan guardadas en la plataforma y se ofrecen al enviar recordatorios y en las plantillas.</div>
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              {cuentas.map((c,idx)=>(<div key={c.id} className="card pad" style={{background:"var(--panel2)",border:"1px solid var(--line)"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                  <div style={{fontWeight:800}}>Cuenta {idx+1}{c.alias?` · ${c.alias}`:""}</div>
                  <button className="btn btn-ghost btn-sm" title="Eliminar cuenta" onClick={()=>delCuenta(c.id)} disabled={cuentas.length<=1} style={{opacity:cuentas.length<=1?0.4:1}}>✕</button>
                </div>
                <div className="grid c3" style={{gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
                  <div className="field"><label className="label">Banco</label><input className="input" value={c.banco} onChange={e=>updCuenta(c.id,"banco",e.target.value)}/></div>

        {/* ============ DIVIDENDOS Y GASTOS ============ */}
        {tab==="finanzas" && <>
          <div className="help g">Aquí ves, por cada propiedad, cuánto pagas de <b>dividendo</b> (reajustado por UF), cuánto de <b>contribuciones</b> y <b>seguro</b>, y si al final del mes <b>ganas o pierdes</b>.</div>

          {/* ====== DASHBOARD FINANCIERO ====== */}
          {(()=>{
            const ingMes=rentals.reduce((s,p)=>s+ingresoMes(p,uf),0);
            const divMes=rentals.reduce((s,p)=>s+divCLP(p,uf),0);
            const contMes=rentals.reduce((s,p)=>s+contribMes(p),0);
            const segMes=rentals.reduce((s,p)=>s+seguroMes(p,uf),0);
            const gastMes=rentals.reduce((s,p)=>s+gastosExtraMes(p,uf),0);
            const egrMes=divMes+contMes+segMes+gastMes;
            const utMes=utilidadTotal;
            const margen=ingMes>0?utMes/ingMes*100:0;
            const yNeto=patrimonio>0?utMes*12/patrimonio*100:0;
            const yBruto=patrimonio>0?ingMes*12/patrimonio*100:0;
            const totalArr=rentals.length; const ocupadas=rentals.filter(p=>!estaDisponible(p)).length;
            const ocupacion=totalArr?ocupadas/totalArr*100:0;
            const deudaCLP=deudaHipTotalUF*uf;
            const esperado=rentals.reduce((s,p)=>s+montoCobro(p),0);
            const cobrado=rentals.filter(p=>p.status==="pagado").reduce((s,p)=>s+montoCobro(p),0);
            const morosidad=rentals.filter(p=>p.status==="atrasado").reduce((s,p)=>s+montoCobro(p),0);
            const cobradoPct=esperado>0?cobrado/esperado*100:0;

          <Collapsible icon="📈" title="Reajuste de arriendo — IPC y UF (contratos en pesos)" defaultOpen={false}>

              <div className="field"><label className="label">Variación UF del período (%)</label><input className="input" type="number" step="any" value={ufVarAnual} onChange={e=>setUfVarAnual(num(e.target.value))}/></div>
              <div className="field"><label className="label">Período de reajuste (meses)</label><input className="input" type="number" value={reajPeriodo} onChange={e=>setReajPeriodo(parseInt(num(e.target.value))||12)}/></div>
            </div>
            {(()=>{ const list=reajustables(); return list.length? (
              <div style={{overflowX:"auto"}}><table><thead><tr><th>Propiedad</th><th>Índice</th><th>Arriendo actual</th><th>Desde último reajuste</th><th>Nuevo arriendo propuesto</th><th>Variación</th><th>Acción</th></tr></thead><tbody>
                {list.map(p=>{ const info=reajusteInfo(p); return (<tr key={p.id}>

                  <td><button className={"btn btn-sm "+(info.due?"btn-green":"btn-out")} onClick={()=>applyReajuste(p.id)}>Aplicar</button></td>
                </tr>); })}
              </tbody></table></div>
            ) : <div className="help" style={{marginBottom:0}}>No hay contratos en pesos. Los arriendos en <b>UF</b> se reajustan automáticamente con el valor de la UF.</div>; })()}

          <Collapsible icon="📅" title="Utilidad de la propiedad por año" defaultOpen={false}>

            {(()=>{ const anioActual=new Date().getFullYear();
              const anios=[]; for(let y=anioActual-4;y<=anioActual+1;y++) anios.push(y);
              const esActual = yearUtil===anioActual; const meses = esActual ? mesesTranscurridos() : (yearUtil<anioActual?12:0);

                  {props.map(p=>{ const real=ingresosRealesAnio(p,yearUtil); const ingAnual=ingresoMes(p)*12; const gastoAnual=egresosMes(p,uf)*12; const proy=utilidadAnual(p,uf); const acum=utilidadMes(p,uf)*meses; totReal+=real; totGasto+=gastoAnual; totProy+=proy; const abierto=expUtil===p.id; const gMes=egresosMes(p,uf); const iMes=ingresoMes(p,uf); return (<React.Fragment key={p.id}>
                    <tr style={{cursor:"pointer"}} onClick={()=>setExpUtil(abierto?null:p.id)}>

                    <td style={{color:"var(--green-d)",fontWeight:700}}>{real>0?CLP(real):"—"}</td>

                    <td style={{fontWeight:800,color:proy>=0?"var(--green-d)":"var(--red-d)"}}>{CLP(proy)}</td>
                    {esActual&&<td style={{fontWeight:700,color:acum>=0?"var(--green-d)":"var(--red-d)"}}>{CLP(acum)}</td>}
                  </tr>
                  {abierto && <tr><td colSpan={esActual?6:5} style={{background:"var(--panel2)",padding:"10px 12px"}}>

              sec("Dividendos hipotecarios y deuda",divHead,divRows)+
              sec("Contribuciones y seguros",segHead,segRows)); };
          const buildCSV=(h,r,tot)=>{ const all=[h,...r]; if(tot) all.push(tot); return "\ufeff"+all.map(row=>row.map(c=>`"${String(c==null?"":c).replace(/"/g,'""')}"`).join(";")).join("\r\n"); };
          const xlsTable=(h,r,tot)=>htmlDoc("Informe","<table><tr>"+h.map(c=>"<th>"+esc(c)+"</th>").join("")+"</tr>"+r.map(row=>"<tr>"+row.map(c=>"<td>"+esc(c)+"</td>").join("")+"</tr>").join("")+(tot?"<tr>"+tot.map(c=>"<td>"+esc(c)+"</td>").join("")+"</tr>":"")+"</table>");
          return (<>
          <div className="help">Genera informes profesionales y descárgalos en <b>Word</b>, <b>Excel</b>, <b>CSV</b> o <b>PDF</b>. El informe incluye estado de cartera (ingresos, gastos y utilidad), dividendos y deuda, y contribuciones y seguros.</div>

              <button className="btn btn-red" onClick={()=>descargarBlob("informe_arriendopro_"+todayISO()+".doc",buildHtml(),"application/msword")}>Descargar Word</button>

          <div className="card pad"><div className="sec-title">Informes individuales</div>

              {[
                ["","Estado de cartera","Ingresos, gastos y utilidad",carteraHead,carteraRows,carteraTot,"cartera"],

                  </div>
                </div>))}
            </div>
          </div>
        </>); })()}

        <button className="btn btn-out btn-sm" onClick={()=>descargarFichaCompletaExcel(mFicha,fForm)}>Excel</button>

        {(()=>{ const usadas=props.filter(p=>(p.sociedad||"")===mSocDel.id).length; return usadas>0

    </div></div>}

    {mInc && <div className="modal-bg" onClick={()=>setMInc(null)}><div className="modal" style={{width:560}} onClick={e=>e.stopPropagation()}>

        </div>

      return (<div className="modal-bg" onClick={()=>setMIncShare(null)}><div className="modal" style={{width:560}} onClick={e=>e.stopPropagation()}>

          <div className="help g" style={{marginBottom:12}}>Comparte la incidencia con toda su información por el medio que prefieras, o descárgala como documento.</div>

            <button className="btn btn-out btn-sm" onClick={()=>copiarTexto(txt)}>Copiar texto</button>

            <a className="btn btn-out btn-sm" href={`mailto:?subject=${asunto}&body=${enc}`}>Correo</a>
            <a className="btn btn-out btn-sm" href={`sms:?&body=${enc}`}>SMS</a>
            <button className="btn btn-out btn-sm" onClick={()=>descargarBlob("incidencia_"+slug(x.titulo)+".doc",incHtml(p,x),"application/msword")}>Word</button>
            <button className="btn btn-out btn-sm" onClick={()=>descargarBlob("incidencia_"+slug(x.titulo)+".xls",htmlDoc("Incidencia","<table>"+incCSV(p,x).split("\r\n").map(r=>"<tr>"+r.split(";").map(c=>"<td>"+esc(c.replace(/^"|"$/g,"").replace(/""/g,'"'))+"</td>").join("")+"</tr>").join("")+"</table>"),"application/vnd.ms-excel")}>Excel</button>
            <button className="btn btn-out btn-sm" onClick={()=>descargarBlob("incidencia_"+slug(x.titulo)+".csv","\ufeff"+incCSV(p,x),"text/csv;charset=utf-8")}>CSV</button>
          </div>
          {!!(x.adjuntos&&x.adjuntos.length)&&<div style={{marginTop:14}}><div className="label" style={{marginBottom:6}}>Archivos adjuntos (enlaces)</div><AdjuntosView items={x.adjuntos}/></div>}
        </div>
        <div className="modal-foot"><button className="btn btn-out" style={{flex:1}} onClick={()=>setMIncShare(null)}>Cerrar</button></div>
      </div></div>); })()}

    {/* COMPARTIR — modal */}
    {mShare && (()=>{ const sp=props.find(x=>x.id===mShare.id)||mShare; return (
      <div className="modal-bg" onClick={()=>setMShare(null)}><div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><h3>Compartir — {sp.name}</h3><p>Genera una ficha pública atractiva y compártela por enlace, WhatsApp o PDF.</p></div>
        <div className="modal-body"><SharePanel p={sp}/></div>
        <div className="modal-foot"><button className="btn btn-out" style={{flex:1}} onClick={()=>setMShare(null)}>Cerrar</button></div>
      </div></div>
    ); })()}

    {lightbox && (()=>{ const fs=lightbox.fotos||[]; const i=lightbox.i||0; const go=(d)=>setLightbox(lb=>({...lb,i:(lb.i+d+fs.length)%fs.length}));
      return (<div className="lbx" onClick={()=>setLightbox(null)}>
        <span className="x" onClick={(e)=>{e.stopPropagation();setLightbox(null);}}>×</span>

    {mPay && <div className="modal-bg" onClick={()=>{setMPay(null);setPayStep(1);}}><div className="modal" style={{width:560}} onClick={e=>e.stopPropagation()}>

      <div className="modal-body">
        {payStep===1 && <>
          <div style={{color:"var(--muted)",marginBottom:14}}>Elige el método de pago:</div>
          {[["transfer","","Transferencia bancaria",(cuentas[0]?cuentas[0].banco+" · "+cuentas[0].numero:owner.bank+" · "+owner.accountNumber)],["khipu","","Pagar con Khipu","Transferencia automática · se confirma sola"],["debit","","Tarjeta de débito","Redcompra, Visa Débito"],["credit","","Tarjeta de crédito","Visa, Mastercard, Amex"],["prepago","","Tarjeta prepago","CuentaRUT, Mach"]].map(m=>(
            <div key={m[0]} onClick={()=>setPayMethod(m[0])} style={{display:"flex",alignItems:"center",gap:14,padding:14,border:`2px solid ${payMethod===m[0]?"var(--green)":"var(--line)"}`,background:payMethod===m[0]?"var(--green-bg)":"#fff",borderRadius:12,cursor:"pointer",marginBottom:10}}>

              <div style={{width:20,height:20,borderRadius:"50%",border:`2px solid ${payMethod===m[0]?"var(--green)":"#bcc4d1"}`,background:payMethod===m[0]?"var(--green)":"#fff",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12}}>{payMethod===m[0]?"✓":""}</div>
            </div>))}
          {payMethod==="khipu" && <div className="help" style={{marginBottom:8}}>Se generará un cobro real en Khipu y se abrirá el link de pago. En cuanto el banco concilia la transferencia, el arriendo se marca <b>pagado</b> automáticamente.</div>}

          <div className="field"><label className="label">Número de tarjeta</label><input className="input" placeholder="0000 0000 0000 0000" maxLength={19} value={card.n} onChange={e=>{let v=e.target.value.replace(/\D/g,"").slice(0,16).replace(/(.{4})/g,"$1 ").trim();setCard(c=>({...c,n:v}));}}/></div>

            <div className="field"><label className="label">CVV</label><input className="input" type="password" placeholder="000" maxLength={4} value={card.cv} onChange={e=>setCard(c=>({...c,cv:e.target.value.replace(/\D/g,"").slice(0,4)}))}/></div>

        </>}
        {payStep===3 && <div style={{textAlign:"center",padding:30}}><div style={{fontSize:46,marginBottom:12}}>⏳</div><div style={{fontWeight:700,fontSize:17}}>Procesando con {gw.name}…</div></div>}

    {mRem && <div className="modal-bg" onClick={()=>setMRem(null)}><div className="modal" style={{width:560}} onClick={e=>e.stopPropagation()}>
