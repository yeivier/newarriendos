const fechaLarga = (iso)=>{ if(!iso) return "_____________"; const m=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"]; const d=new Date(iso+"T00:00:00"); if(isNaN(d)) return iso; return `${d.getDate()} de ${m[d.getMonth()]} de ${d.getFullYear()}`; };

function contratoHTML(p, c, soc, arr, aval, uf, modo){
  const esc=(s)=> String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  const garTxt = c.existeGarantia ? (c.garantiaEn==="UF" ? `${num(c.garantiaMonto||c.monto)} Unidades de Fomento` : CLP(num(c.garantiaMonto||c.monto))) : "";
  const multaTxt = c.incluyeMultas ? (c.tipoMulta==="%" ? `un ${num(c.multaDiaria)}% de la renta mensual vigente` : (esUF?`${num(c.multaDiaria)} UF`:CLP(num(c.multaDiaria)))) : "";
  const arrNombre = contactNombre(arr) || "_____________";
  const arrRut = (arr&&arr.rut) || "_____________";
  const arrDom = arr ? ([arr.direccion, arr.numero, arr.departamento, arr.comuna].filter(Boolean).join(" ")||"_____________") : "_____________";
  const arrNac = (arr&&arr.nacionalidad)||"chilena";
  const arrProf = (arr&&arr.profesion)||"_____________";
  const arrCivil = (arr&&arr.estadoCivil)||"";
  const arrMail = (arr&&arr.email)||"_____________";
  const arrFono = (arr&&arr.telefono)||"_____________";
  const avalNombre = aval ? contactNombre(aval) : "";
  const avalRut = (aval&&aval.rut)||"_____________";
  const avalDom = aval ? ([aval.direccion,aval.numero,aval.departamento,aval.comuna].filter(Boolean).join(" ")||"_____________") : "";
  const ciudad = p.comuna || "La Serena";
  const destinoComercial = /comercial|oficina|industrial|galp|local|bodega|estacion/i.test(p.type||"");

  const programa=[p.bedrooms&&p.bedrooms+" dormitorios",p.bathrooms&&p.bathrooms+" baños",p.parking&&p.parking+" estacionamiento(s)",p.bodega&&p.bodega+" bodega(s)"].filter(Boolean).join(", ");
  let n=0; const ORD=["PRIMERO","SEGUNDO","TERCERO","CUARTO","QUINTO","SEXTO","SÉPTIMO","OCTAVO","NOVENO","DÉCIMO","UNDÉCIMO","DUODÉCIMO","DÉCIMO TERCERO","DÉCIMO CUARTO","DÉCIMO QUINTO","DÉCIMO SEXTO","DÉCIMO SÉPTIMO","DÉCIMO OCTAVO","DÉCIMO NOVENO","VIGÉSIMO","VIGÉSIMO PRIMERO"];
  const cl=(t,b)=>{ const o=ORD[n++]||("CLÁUSULA "+(n)); return `<p style="text-align:justify;margin:0 0 11pt 0;"><b>${o}${t?" — "+t:""}:</b> ${b}</p>`; };

  const rentaClausula = esUF
    ? `La renta mensual de arrendamiento será la suma de <b>${esc(montoTxt)}</b>${montoRefCLP}. La renta se pagará por mensualidades anticipadas, en su equivalente en pesos chilenos, considerando para su conversión <b>el valor más alto que registre la Unidad de Fomento entre el día primero del mes que se paga y el día del pago efectivo</b>; en consecuencia, el pago nunca podrá efectuarse por un valor de UF inferior al vigente al día primero del mes correspondiente. Si por cualquier causa la variación de la Unidad de Fomento resultare negativa, se aplicará el valor de la Unidad de Fomento utilizado en el último pago efectuado.`
    : `La renta mensual de arrendamiento será la suma de <b>${esc(montoTxt)}</b>, pagadera por mensualidades anticipadas. La renta se reajustará cada doce meses, en la misma proporción en que haya variado el Índice de Precios al Consumidor (IPC) determinado por el Instituto Nacional de Estadísticas, o el índice que lo reemplace, en el período correspondiente.`;

  const body = `
    <p style="text-align:center;font-size:15pt;margin:0 0 4pt 0;"><b>CONTRATO DE ARRENDAMIENTO</b></p>

    <p style="text-align:justify;margin:0 0 11pt 0;">En ${esc(ciudad)}, República de Chile, a ${esc(fechaLarga(c.fechaInicio))}, entre: <b>${V(soc.name)}</b>, Rol Único Tributario N° ${V(soc.rut)}, representada, según se acreditará, por don/doña <b>${V(soc.rep)}</b>, ${esc(soc.repProfesion||"_____________")}, de nacionalidad ${esc(soc.repNac||"chilena")}, cédula nacional de identidad N° ${V(soc.repRut)}, ambos domiciliados para estos efectos en ${V(soc.direccion)}, correo electrónico ${V(soc.email)}, en adelante e indistintamente <b>"EL ARRENDADOR"</b> o <b>"la parte arrendadora"</b>, por una parte; y por la otra, don/doña <b>${esc(arrNombre)}</b>, de nacionalidad ${esc(arrNac)}, ${esc(arrProf)}${arrCivil?", "+esc(arrCivil):""}, cédula nacional de identidad / Rol Único Tributario N° ${esc(arrRut)}, domiciliado(a) en ${esc(arrDom)}, correo electrónico ${esc(arrMail)}, teléfono ${esc(arrFono)}, en adelante <b>"EL ARRENDATARIO"</b>${avalNombre?`; comparece además don/doña <b>${esc(avalNombre)}</b>, cédula nacional de identidad N° ${esc(avalRut)}, domiciliado(a) en ${esc(avalDom)}, quien concurre en calidad de <b>aval, fiador y codeudor solidario</b>`:""}; todos los comparecientes mayores de edad, quienes acreditan sus identidades con las cédulas citadas y exponen que han convenido el siguiente contrato de arrendamiento, que se regirá por la Ley N° 18.101 sobre arrendamiento de predios urbanos —modificada por la Ley N° 21.461—, por el Código Civil y por las cláusulas siguientes:</p>

    ${cl("OBJETO Y DOMINIO", `${V(soc.name)} es dueña del inmueble ubicado en <b>${V(p.address)}</b>, comuna de ${V(p.comuna)}${p.region?", "+esc(p.region):""}${programa?`, que consta de ${esc(programa)}`:""}${p.surfaceBuilt?`, con una superficie edificada aproximada de ${esc(p.surfaceBuilt)} m²`:""}${p.surfaceTerrain?` y ${esc(p.surfaceTerrain)} m² de terreno`:""}. El dominio consta de la inscripción ${p.inscripcion?esc(p.inscripcion):"de fojas ____ N° ____ del Registro de Propiedad del año ____"} del Conservador de Bienes Raíces respectivo${p.rolSII?`, rol de avalúo fiscal N° ${esc(p.rolSII)}`:""}.`)}
    ${cl("ARRENDAMIENTO Y DESTINO", `Por el presente instrumento, EL ARRENDADOR da en arrendamiento a EL ARRENDATARIO, quien acepta para sí, el inmueble individualizado en la cláusula anterior. El inmueble será destinado a un uso ${destino}, quedando prohibido cambiar dicho destino sin autorización previa, expresa y escrita del ARRENDADOR.`)}
    ${cl("PLAZO Y RENOVACIÓN", `El presente contrato rige a contar del ${esc(fechaLarga(c.fechaInicio))}, fecha en que se efectúa la entrega material del inmueble y de sus llaves${c.indefinido?", y su vigencia es de carácter indefinido":`, y su vigencia se extiende hasta el ${esc(fechaLarga(c.fechaTermino))}`}. ${c.renovacionAuto?`Vencido el plazo, el contrato se renovará tácita, automática y sucesivamente por períodos iguales y en las mismas condiciones, salvo que cualquiera de las partes comunique a la otra su voluntad de no perseverar, mediante carta certificada dirigida al domicilio de la contraparte o correo electrónico a las casillas señaladas en la comparecencia, con a lo menos ${esc(c.diasAviso)} días corridos de anticipación al vencimiento del período respectivo.`:`Cualquiera de las partes podrá poner término al contrato a su vencimiento, dando aviso escrito —carta certificada o correo electrónico a las casillas indicadas en la comparecencia— con a lo menos ${esc(c.diasAviso)} días corridos de anticipación. Tratándose del desahucio del arrendador, se estará además a los plazos y formas del artículo 3° de la Ley N° 18.101.`}`)}
    ${cl("RENTA DE ARRENDAMIENTO", rentaClausula)}
    ${cl("FORMA Y OPORTUNIDAD DE PAGO", `La renta se pagará dentro de los primeros ${esc(c.diaLimitePago)} días${c.ultimoDiaMes?" y, a más tardar, el último día":""} de cada mes, mediante transferencia electrónica a la cuenta de EL ARRENDADOR: titular ${V(c.cuentaDueno||soc.cuentaNombre)}, RUT ${V(soc.cuentaRut)}, ${esc(soc.cuentaTipo||"Cuenta Corriente")} N° ${V(soc.cuentaNumero)} del ${V(soc.banco)}, remitiendo el comprobante al correo ${V(soc.email)}. El pago efectuado por un medio distinto solo se entenderá válido una vez acreditado fehacientemente su abono. La mera tolerancia en el atraso no constituirá modificación del presente contrato ni novación de la obligación.`)}
    ${cl("MORA Y MULTA", `${c.incluyeMultas?`El simple retardo en el pago de la renta más allá del plazo señalado constituirá en mora a EL ARRENDATARIO sin necesidad de requerimiento alguno, devengándose una multa equivalente a ${esc(multaTxt)} por cada mes o fracción de atraso, calculada proporcionalmente por día, sin perjuicio del derecho del ARRENDADOR a solicitar la terminación del contrato y la restitución del inmueble conforme al procedimiento de la Ley N° 18.101, modificada por la Ley N° 21.461.`:`El simple retardo en el pago de la renta constituirá en mora a EL ARRENDATARIO sin necesidad de requerimiento, sin perjuicio del derecho del ARRENDADOR a solicitar la terminación del contrato y la restitución del inmueble conforme a la Ley N° 18.101, modificada por la Ley N° 21.461.`} La no oportuna ni íntegra solución de la renta y de las cuentas de servicios faculta igualmente al ARRENDADOR para ejercer las acciones de cobro correspondientes.`)}
    ${c.existeGarantia?cl("GARANTÍA", `A la firma del presente contrato, EL ARRENDATARIO entrega a EL ARRENDADOR, a título de garantía, la suma de <b>${esc(garTxt)}</b>, destinada a caucionar la conservación del inmueble y su restitución en el mismo estado en que se recibe, el pago de los deterioros y perjuicios que se ocasionen, las cuentas de servicios y gastos comunes pendientes y, en general, el fiel cumplimiento de todas las obligaciones de este contrato. La garantía <b>no podrá imputarse al pago de rentas</b>, ni aun a la última. EL ARRENDADOR restituirá la garantía, o su saldo si procedieren descuentos debidamente documentados, dentro de los <b>sesenta días corridos</b> siguientes a la restitución material del inmueble, una vez verificado su estado y acreditado el pago íntegro de los servicios, gastos comunes y rentas.`):""}
    ${cl("ESTADO DE ENTREGA E INVENTARIO", `EL ARRENDATARIO declara recibir el inmueble en buen estado de conservación, aseo y funcionamiento, con sus cuentas de luz eléctrica, agua potable y gas —según corresponda— pagadas al día, y con las llaves de todas sus dependencias, según consta en el <b>inventario y acta de entrega</b> que, firmado por las partes, se agrega como <b>Anexo A</b> y forma parte integrante de este contrato. EL ARRENDATARIO no ha pagado suma alguna por concepto de derecho de llaves ni podrá exigir pago alguno por dicho concepto al término del contrato.`)}
    ${cl("MANTENCIÓN Y REPARACIONES", `Serán de cargo exclusivo de EL ARRENDATARIO las <b>reparaciones locativas</b> a que se refiere el artículo 1940 del Código Civil, esto es, las derivadas del uso ordinario del inmueble (tales como descalabros de paredes o cercas, roturas de vidrios, mantención de artefactos, llaves, cerraduras y grifería), así como los desperfectos ocasionados por su hecho o culpa o el de sus dependientes o visitas. Serán de cargo del ARRENDADOR las reparaciones estructurales o necesarias no imputables al arrendatario, quien deberá dar aviso escrito de ellas tan pronto las advierta. EL ARRENDATARIO no podrá ejecutar obras, mejoras ni modificaciones —incluidas alteraciones a instalaciones eléctricas, sanitarias o desagües— sin autorización previa y escrita del ARRENDADOR; las mejoras autorizadas quedarán a beneficio del inmueble sin derecho a indemnización ni reembolso, salvo pacto escrito en contrario, y deberán contar con los permisos municipales que correspondan.`)}
    ${cl("SERVICIOS, GASTOS COMUNES Y CONTRIBUCIONES", `Serán de cargo de EL ARRENDATARIO los consumos de electricidad, agua potable, gas, telefonía e internet, así como ${p.gcArrendatarioPaga?"los gastos comunes ordinarios del inmueble":"los gastos comunes ordinarios, si los hubiere y así se hubiese convenido"}, debiendo mantener dichos pagos al día y exhibir los comprobantes al ARRENDADOR cuando éste lo solicite. Las contribuciones de bienes raíces serán de cargo exclusivo del ARRENDADOR. La suspensión de suministros por no pago será de exclusiva responsabilidad del ARRENDATARIO, incluidos los costos de reposición.`)}
    ${cl("PROHIBICIONES", `Queda expresamente prohibido a EL ARRENDATARIO, y su contravención constituirá incumplimiento grave que faculta al ARRENDADOR para poner término inmediato al contrato: a) ceder, transferir o traspasar a cualquier título el presente contrato, o subarrendar total o parcialmente el inmueble, sin autorización previa y escrita del ARRENDADOR; b) destinar el inmueble a un objeto distinto del convenido; c) causar o permitir ruidos u olores molestos, o desarrollar actividades molestas, insalubres, peligrosas o ilícitas; d) almacenar materiales explosivos, inflamables, corrosivos o de mal olor; e) mantener el inmueble en mal estado de aseo o conservación; f) atrasarse en el pago de los servicios y gastos comunes de su cargo; g) ejecutar obras o modificaciones sin autorización escrita.`)}
    ${cl("VISITAS E INSPECCIÓN", `EL ARRENDATARIO otorgará al ARRENDADOR o a quien éste designe las facilidades necesarias para inspeccionar el estado del inmueble, previa coordinación con una anticipación razonable y en horario hábil. Asimismo, durante los últimos ${destinoComercial?"tres":"dos"} meses de vigencia del contrato, o comunicada la intención de venderlo, permitirá su visita por terceros interesados, previa coordinación.`)}
    ${cl("RESPONSABILIDAD Y SEGUROS", `Los bienes que EL ARRENDATARIO mantenga o introduzca en el inmueble quedarán bajo su exclusivo riesgo y cuidado, siendo de su cargo los seguros que estime contratar sobre ellos. EL ARRENDADOR no responderá por robos o hurtos, ni por daños provenientes de incendio, inundaciones, filtraciones, roturas de cañerías, humedad, calor, casos fortuitos o hechos de terceros, salvo que provengan de su hecho o culpa. Se recomienda al ARRENDADOR mantener seguro de incendio y sismo sobre la estructura del inmueble.`)}
    ${cl("TERMINACIÓN ANTICIPADA", `El incumplimiento de cualquiera de las obligaciones del presente contrato faculta a la parte cumplidora para ponerle término anticipado. En especial, el no pago oportuno de la renta o de los servicios y gastos comunes autoriza al ARRENDADOR para demandar la terminación del contrato, la restitución del inmueble y el pago de lo adeudado, conforme al procedimiento de la Ley N° 18.101 y al <b>procedimiento monitorio de cobro de rentas y restitución</b> incorporado por la Ley N° 21.461 ("Devuélveme mi casa"). Si EL ARRENDATARIO restituyere el inmueble antes del vencimiento del plazo sin causa imputable al ARRENDADOR, deberá dar aviso escrito con a lo menos 30 días corridos de anticipación y pagar la renta hasta la restitución efectiva, sin perjuicio de lo dispuesto en el artículo 6° de la Ley N° 18.101.`)}
    ${cl("RESTITUCIÓN", `Al término del contrato, cualquiera sea su causa, EL ARRENDATARIO restituirá el inmueble completamente desocupado, en el mismo buen estado en que lo recibió —habida cuenta del desgaste por uso legítimo y ordinario—, entregando la totalidad de las llaves y los comprobantes que acrediten el pago íntegro de los servicios y gastos comunes de su cargo hasta el día de la restitución. La restitución se entenderá efectuada solo con la entrega material del inmueble y de las llaves al ARRENDADOR o a quien lo represente.`)}

    ${cl("DOMICILIO Y COMPETENCIA", `Para todos los efectos legales derivados del presente contrato, las partes fijan su domicilio en la ciudad y comuna de ${esc(ciudad)} y se someten a la competencia de sus Tribunales Ordinarios de Justicia.`)}
    ${cl("EJEMPLARES Y FIRMA", `El presente contrato se otorga y firma en dos ejemplares del mismo tenor y fecha, quedando uno en poder de cada parte. Las partes podrán suscribirlo con firma autógrafa —autorizando sus firmas ante Notario Público, lo que se recomienda para efectos del mérito ejecutivo— o mediante firma electrónica de conformidad con la Ley N° 19.799.`)}
    ${cl("PERSONERÍA", `La personería de don/doña ${V(soc.rep)} para representar a ${V(soc.name)} consta en escritura pública de fecha ____________, otorgada en la Notaría de ____________, la que no se inserta por ser conocida de las partes.`)}
    <br/><br/>
    <table style="width:100%;margin-top:34pt;border-collapse:collapse;"><tr>
      <td style="text-align:center;width:50%;padding:0 10pt;">_____________________________<br/><b>${esc(soc.name||"EL ARRENDADOR")}</b><br/>p.p. ${esc(soc.rep||"")}<br/>RUT ${esc(soc.rut||"____________")}<br/><b>EL ARRENDADOR</b></td>

    </tr>${avalNombre?`<tr><td colspan="2" style="text-align:center;padding-top:34pt;">_____________________________<br/><b>${esc(avalNombre)}</b><br/>RUT ${esc(avalRut)}<br/><b>AVAL, FIADOR Y CODEUDOR SOLIDARIO</b></td></tr>`:""}</table>

  const head = modo==="print"

    : `<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]--><style>@page{size:21cm 29.7cm;margin:2.5cm 2.5cm;} body{font-family:'Times New Roman',serif;font-size:12pt;line-height:1.5;color:#000;}</style>`;
  return `<!DOCTYPE html><html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>Contrato de Arrendamiento</title>${head}</head><body>${body}</body></html>`;

function descargarContratoWord(p, c, soc, arr, aval, uf){
  const html = contratoHTML(p, c, soc, arr, aval, uf, "word");
  const arrNombre = contactNombre(arr) || "arrendatario";
  const blob = new Blob(["\ufeff"+html], { type:"application/msword" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `Contrato ${arrNombre} - ${p.name}.doc`.replace(/[\\/:*?"<>|]/g,"-");
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

function abrirContratoPDF(p, c, soc, arr, aval, uf){
  const w=window.open("","_blank");
  if(!w){ if(window.__notify) window.__notify("Permite ventanas emergentes para ver el contrato",true); return; }
  w.document.write(contratoHTML(p,c,soc,arr,aval,uf,"print")); w.document.close();
  setTimeout(()=>{ try{ w.focus(); w.print(); }catch(e){} },700);
}

/* ---------- Fotos y recorrido 360°: edición dentro del formulario ---------- */
function MediaSection({ d, set }){
  const fotos = d.fotos||[], panoramas = d.panoramas||[];
  const [busy,setBusy]=useState(false);
  const note = (m,e)=> window.__notify && window.__notify(m,e);
  const addFiles = async (files, kind)=>{
    if(!files || !files.length) return;
    setBusy(true);
    try{
      const added=[];
      for(const file of Array.from(files)){
        if(!/^image\//.test(file.type)){ continue; }
        const opt = await optimizeImage(file, kind==="pano"?4096:1600, kind==="pano"?0.82:0.8);
        if(!opt){ continue; }
        try{ const url = await uploadMedia(opt, kind); added.push({url, name:file.name.replace(/\.[^.]+$/,"")}); }
        catch(err){ note("No se pudo subir "+file.name, true); }
      }
      if(added.length){
        if(kind==="pano") set(p=>({...p, panoramas:[...(p.panoramas||[]), ...added]}));
        else set(p=>({...p, fotos:[...(p.fotos||[]), ...added]}));
        note((kind==="pano"?"":"")+added.length+(kind==="pano"?" panorámica(s) subida(s)":" foto(s) subida(s)"));
      }
    } finally { setBusy(false); }
  };
  const remFoto=(i)=> set(p=>({...p, fotos:(p.fotos||[]).filter((_,j)=>j!==i)}));
  const moveFotoFirst=(i)=> set(p=>{ const a=[...(p.fotos||[])]; const [x]=a.splice(i,1); a.unshift(x); return {...p, fotos:a}; });
  const remPano=(i)=> set(p=>({...p, panoramas:(p.panoramas||[]).filter((_,j)=>j!==i)}));
  const renPano=(i,name)=> set(p=>({...p, panoramas:(p.panoramas||[]).map((x,j)=>j===i?{...x,name}:x)}));
  return (<>
    <div className="sub-title dark">⑧ Fotos y recorrido virtual 360°</div>
    <div className="help" style={{marginBottom:12}}>Sube todas las fotos que quieras: el navegador las optimiza y se guardan en la plataforma (no en el dispositivo), por lo que quedan disponibles desde cualquier teléfono o computador y viajan con el enlace al compartir. La <b>primera foto</b> es la portada.</div>
    <label className="btn btn-out btn-sm" style={{marginBottom:10,opacity:busy?0.6:1,pointerEvents:busy?"none":"auto"}}>
      {busy?"Subiendo…":"Agregar fotos"}
      <input type="file" accept="image/*" multiple style={{display:"none"}} onChange={e=>{ addFiles(e.target.files,"foto"); e.target.value=""; }}/>
    </label>
    {!!fotos.length && <div className="media-grid">
      {fotos.map((f,i)=>(<div key={i} className={"media-thumb"+(i===0?" cover":"")} style={{backgroundImage:`url('${f.url}')`}}>
        {i===0 && <span className="cover-tag">Portada</span>}
        <div className="media-acts">
          {i!==0 && <button title="Usar como portada" onClick={()=>moveFotoFirst(i)}></button>}
          <button title="Quitar" onClick={()=>remFoto(i)}>✕</button>
        </div>
      </div>))}
    </div>}

    <div style={{marginTop:16}}>
      <div style={{fontWeight:800,fontSize:14.5,marginBottom:4}}>Recorrido virtual 360° (tipo Matterport)</div>
      <div className="help" style={{marginBottom:10}}>Sube fotos <b>panorámicas equirectangulares</b> (cámara 360° o la app del teléfono), una por ambiente. Quien reciba la ficha podrá mirar en todas las direcciones, como si estuviera dentro de la propiedad.</div>
      <label className="btn btn-out btn-sm" style={{marginBottom:10,opacity:busy?0.6:1,pointerEvents:busy?"none":"auto"}}>
        {busy?"Subiendo…":"Agregar panorámica 360°"}
        <input type="file" accept="image/*" multiple style={{display:"none"}} onChange={e=>{ addFiles(e.target.files,"pano"); e.target.value=""; }}/>
      </label>
      {!!panoramas.length && <div className="grid" style={{gap:8}}>
        {panoramas.map((pn,i)=>(<div key={i} style={{display:"flex",alignItems:"center",gap:10,background:"var(--panel2)",border:"1px solid var(--line)",borderRadius:10,padding:"8px 10px"}}>
          <div style={{width:64,height:40,borderRadius:6,background:`#101012 center/cover no-repeat url('${pn.url}')`,flexShrink:0}}></div>
          <input className="input" style={{flex:1,padding:"7px 10px"}} value={pn.name||""} placeholder={"Ambiente "+(i+1)} onChange={e=>renPano(i,e.target.value)}/>
          <button className="btn btn-out btn-sm" onClick={()=>remPano(i)}>✕</button>
        </div>))}
      </div>}
    </div>

    <div className="field" style={{marginTop:14}}>
      <Inp f={{k:"virtualTour",label:"O pega un enlace de recorrido externo (Matterport, Kuula, etc.)",ph:"https://kuula.co/..."}} value={d.virtualTour} onChange={(k,v)=>set(p=>({...p,[k]:v}))}/>
    </div>
  </>);
}

/* ---------- Visor de recorrido virtual 360° (pannellum) ---------- */
function PanoViewer({ panoramas }){
  const [i,setI]=useState(0);
  const ref=useRef(null), viewerRef=useRef(null);
  useEffect(()=>{
    let alive=true;
    loadPannellum().then(()=>{
      if(!alive||!ref.current||!window.pannellum||!panoramas[i]) return;
      if(viewerRef.current){ try{viewerRef.current.destroy();}catch(e){} viewerRef.current=null; }
      viewerRef.current=window.pannellum.viewer(ref.current,{ type:"equirectangular", panorama:panoramas[i].url, autoLoad:true, autoRotate:-2, showControls:true });
    }).catch(()=>{});
    return ()=>{ alive=false; if(viewerRef.current){ try{viewerRef.current.destroy();}catch(e){} viewerRef.current=null; } };
  },[i,panoramas]);
  if(!panoramas || !panoramas.length) return null;
  return (<div>
    {panoramas.length>1 && <div className="pano-tabs">{panoramas.map((p,j)=>(<button key={j} className={j===i?"on":""} onClick={()=>setI(j)}>{p.name||("Ambiente "+(j+1))}</button>))}</div>}
    <div className="pano-box" ref={ref}></div>
    <div className="help" style={{marginTop:10}}>Arrastra para mirar en todas las direcciones y salta entre ambientes con los botones, como si estuvieras dentro de la propiedad.</div>
  </div>);
}

/* ---------- Comunicaciones: plantillas editables + adjuntos ---------- */
function ComunicacionesPanel({ p, owner, gw, cuentas, plantillas, onSave, onAdd, onDelete }){
  const _seeds = seedPlantillas();
  /* Las plantillas guardadas de versiones anteriores venían sin ícono y se
     veían como un cuadrado blanco. Se les devuelve el de origen, y a las
     propias se les pone uno según de qué tratan. */
  const list = (plantillas && plantillas.length ? plantillas : _seeds).map(t=>{
    if(!t) return t;
    const s = t.builtin ? _seeds.find(x=>x.id===t.id) : null;
    const falta = !t.cuerpoWA || !t.cuerpoCorreo || !t.ico;
    if(!falta) return t;
    return {...t,
      cuerpoWA: t.cuerpoWA || (s&&s.cuerpoWA) || t.cuerpo,
      cuerpoCorreo: t.cuerpoCorreo || (s&&s.cuerpoCorreo) || t.cuerpo,
      ico: t.ico || (s&&s.ico) || icoSugerido(t.label)};
  });
  const [selId,setSelId]=useState(list[0]?.id||"");
  const sel = list.find(t=>t.id===selId) || list[0];
  const [canal,setCanal]=useState("correo");
  // Borrador editable de la plantilla seleccionada (se sincroniza al cambiar de plantilla).
  const [draft,setDraft]=useState(sel||{});
  const lastId=useRef(selId);
  useEffect(()=>{ if(sel && sel.id!==lastId.current){ setDraft(sel); lastId.current=sel.id; } },[selId]);
  useEffect(()=>{ if(sel) setDraft(d=>d.id===sel.id?d:sel); },[plantillas]);
  if(!sel) return <div className="help">Crea tu primera plantilla.</div>;

  const dirty = JSON.stringify(draft)!==JSON.stringify(sel);
  const note = (m,e)=> window.__notify && window.__notify(m,e);
  const asuntoR = aplicarPlantilla(draft.asunto, p, owner, gw, cuentas);
  const cuerpoR = aplicarPlantilla(draft.cuerpo, p, owner, gw, cuentas);
  const waR = aplicarPlantilla(draft.cuerpoWA||draft.cuerpo, p, owner, gw, cuentas);
  const correoR = aplicarPlantilla(draft.cuerpoCorreo||draft.cuerpo, p, owner, gw, cuentas);
  // Renderiza el formato de WhatsApp (*negrita* e _itálica_) en la vista previa.
  const renderWA = (txt)=> String(txt||"").split("\n").map((line,i)=>{
    const out=[]; const re=/(\*[^*\n]+\*|_[^_\n]+_)/g; let last=0,m,k=0;
    while((m=re.exec(line))){ if(m.index>last) out.push(line.slice(last,m.index)); const tok=m[0]; if(tok[0]==="*") out.push(<strong key={k++}>{tok.slice(1,-1)}</strong>); else out.push(<em key={k++}>{tok.slice(1,-1)}</em>); last=m.index+tok.length; }
    if(last<line.length) out.push(line.slice(last));
    return <div key={i}>{out.length?out:"\u00A0"}</div>;
  });
  const guardar = ()=>{ onSave({...draft}); lastId.current=draft.id; note("Plantilla guardada"); };
  const restaurar = ()=>{ const base=seedPlantillas().find(t=>t.id===draft.id); if(base){ setDraft({...base,adjuntos:draft.adjuntos||[]}); onSave({...base,adjuntos:draft.adjuntos||[]}); note("↩ Plantilla restaurada"); } };
  const nueva = ()=>{ const id="tpl"+Date.now().toString(36); const t={id,label:"Nueva plantilla",ico:"✉️",builtin:false,adjuntos:[],asunto:"Asunto — {propiedad}",cuerpo:"Hola {nombre}, escribe aquí tu mensaje para {propiedad}.",cuerpoWA:"✉️ *ArriendoPro*\n━━━━━━━━━━━━━\n¡Hola {nombre}! 👋\n\nEscribe aquí tu mensaje para {propiedad}.\n━━━━━━━━━━━━━\n_Equipo ArriendoPro_\n📱 {whatsapp_admin}",cuerpoCorreo:"Hola {nombre}:\n\nEscribe aquí tu mensaje para {propiedad}.\n\nSaludos cordiales,\nEquipo ArriendoPro"}; onAdd(t); setSelId(id); setDraft(t); lastId.current=id; };
  const eliminar = ()=>{ if(!confirm("¿Eliminar esta plantilla?")) return; const rest=list.filter(t=>t.id!==draft.id); onDelete(draft.id); const next=rest[0]; if(next){ setSelId(next.id); setDraft(next); lastId.current=next.id; } note("✕ Plantilla eliminada"); };
  const copiar = ()=>{
    const txt = canal==="correo" ? `Asunto: ${asuntoR}\n\n${correoR}` : (canal==="whatsapp" ? waR : cuerpoR);
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(()=>note("Plantilla copiada")).catch(()=>{});
  };
  const insertarVar = (v)=> setDraft(d=>({...d, cuerpo:(d.cuerpo||"")+ (d.cuerpo&&!/\s$/.test(d.cuerpo)?" ":"") + v}));
  const hora = new Date().toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});

  return (<div>
    <div className="grid" style={{gridTemplateColumns:"260px 1fr",gap:16}}>
      <div>
        <div className="tpl-list">
          {list.map(t=>(<div key={t.id} className={"tpl-item"+(selId===t.id?" on":"")} onClick={()=>setSelId(t.id)}>
            <div className="ic">{t.ico||icoSugerido(t.label)}</div>
            <div style={{fontWeight:700,fontSize:14.5,flex:1}}>{t.label}{!t.builtin&&<span className="pill blue" style={{marginLeft:6,fontSize:11}}>propia</span>}</div>
          </div>))}
        </div>
        <button className="btn btn-out btn-sm" style={{marginTop:10,width:"100%"}} onClick={nueva}>＋ Nueva plantilla</button>
      </div>

      <div>
        {/* Editor de la plantilla */}
        <div className="card pad" style={{background:"var(--panel2)",border:"1px solid var(--line)",marginBottom:14}}>
          <div className="grid c2" style={{gridTemplateColumns:"90px 1fr",gap:10}}>
            <div className="field"><label className="label">Ícono</label><input className="input" value={draft.ico||""} maxLength={2} placeholder={icoSugerido(draft.label)} onChange={e=>setDraft(d=>({...d,ico:e.target.value}))}/></div>
            <div className="field"><label className="label">Nombre de la plantilla</label><input className="input" value={draft.label||""} onChange={e=>setDraft(d=>({...d,label:e.target.value}))}/></div>
          </div>
          {/* Elegir el ícono con un toque, sin pelear con el teclado de emojis. */}
          <div style={{marginTop:8}}>
            <div style={{fontSize:12.5,color:"var(--muted)",marginBottom:6}}>O elige uno:</div>
            <div className="ico-elige">
              {TPL_ICONOS.map(ic=>(<button key={ic} type="button" className={"ico-op"+(draft.ico===ic?" on":"")}
                title={"Usar "+ic} onClick={()=>setDraft(d=>({...d,ico:ic}))}>{ic}</button>))}
            </div>
          </div>
          <div className="field" style={{marginTop:10}}><label className="label">Asunto (correo)</label><input className="input" value={draft.asunto||""} onChange={e=>setDraft(d=>({...d,asunto:e.target.value}))}/></div>
          <div className="field" style={{marginTop:10}}><label className="label">Texto para WhatsApp <span style={{fontWeight:400,color:"var(--faint)"}}>(usa *negrita* y _itálica_)</span></label><textarea value={draft.cuerpoWA||""} onChange={e=>setDraft(d=>({...d,cuerpoWA:e.target.value}))} placeholder="Si lo dejas vacío, se usa el texto base." style={{minHeight:150}}/></div>
          <div className="field" style={{marginTop:10}}><label className="label">Texto para correo</label><textarea value={draft.cuerpoCorreo||""} onChange={e=>setDraft(d=>({...d,cuerpoCorreo:e.target.value}))} placeholder="Si lo dejas vacío, se usa el texto base." style={{minHeight:150}}/></div>
          <div className="field" style={{marginTop:10}}><label className="label">Texto base (SMS y respaldo)</label><textarea value={draft.cuerpo||""} onChange={e=>setDraft(d=>({...d,cuerpo:e.target.value}))} style={{minHeight:90}}/></div>
          <div style={{marginTop:8}}>
            <div style={{fontSize:12.5,color:"var(--muted)",marginBottom:6}}>Inserta una variable en el <b>texto base</b> (también puedes escribirlas a mano en los textos de WhatsApp y correo). Se reemplazan solas al previsualizar:</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>{TPL_VARS.map(v=><button key={v} className="btn btn-ghost btn-sm" onClick={()=>insertarVar(v)}>{v}</button>)}</div>
          </div>
          <AdjuntosEditor items={draft.adjuntos} onChange={listA=>setDraft(d=>({...d,adjuntos:listA}))}/>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:12}}>
            <button className="btn btn-green btn-sm" disabled={!dirty} onClick={guardar}>{dirty?"Guardar cambios":"✓ Guardado"}</button>
            {draft.builtin && <button className="btn btn-out btn-sm" onClick={restaurar}>↩ Restaurar original</button>}
            <button className="btn btn-out btn-sm" style={{color:"var(--red-d)",borderColor:"var(--red-soft)"}} onClick={eliminar}>✕ Eliminar plantilla</button>
          </div>
        </div>

        {/* Vista previa con variables aplicadas */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div className="seg-chan">{CANALES_COBRO.map(c=>(<button key={c.id} className={canal===c.id?"on":""} onClick={()=>setCanal(c.id)}>{c.ico} {c.label}</button>))}</div>
          <button className="btn btn-out btn-sm" onClick={copiar}>Copiar</button>
        </div>
        {canal==="correo" && (<div className="mail-prev">
          <div className="hd"><div className="lg">A</div><div><div className="bn">ArriendoPro</div><div className="tg">Administración de propiedades</div></div></div>
          <div className="meta"><b>Para:</b> {p.tenant||"arrendatario"} {p.tenantEmail?`‹${p.tenantEmail}›`:""}<br/><b>Asunto:</b> {asuntoR}</div>
          <div className="bd">{correoR.split("\n").map((par,i)=><p key={i} style={{margin:"0 0 10px"}}>{par||" "}</p>)}
            {!!(draft.adjuntos||[]).length && <div style={{marginTop:8}}><AdjuntosView items={draft.adjuntos}/></div>}
          </div>
          <div className="ft"><span className="dot"></span> ArriendoPro · Administración de propiedades{owner&&owner.email?(" · "+owner.email):""}</div>
        </div>)}
        {canal==="whatsapp" && (<div className="wa-wrap"><div className="wa-bubble">{renderWA(waR)}<div style={{textAlign:"right",fontSize:11,color:"#6b7d63",marginTop:4}}>{hora} ✓✓</div></div>{!!(draft.adjuntos||[]).length && <div style={{marginTop:8}}><AdjuntosView items={draft.adjuntos}/></div>}</div>)}
        {canal==="sms" && (<div className="sms-wrap"><div className="sms-bubble">{cuerpoR}</div><div style={{fontSize:12,color:"var(--muted)",marginTop:8}}>{cuerpoR.length} caracteres · {Math.ceil(cuerpoR.length/160)} SMS</div></div>)}
      </div>
    </div>
    <div className="help" style={{marginTop:14}}>Las plantillas, su texto y los archivos adjuntos quedan <b>guardados en la plataforma</b>, disponibles desde cualquier dispositivo. El envío real por correo, WhatsApp o SMS requiere conectar un servicio de mensajería desde el backend.</div>
  </div>);
}

/* ---------- Adjuntos (videos, PDF, fotos, Word, etc.) en incidencias y bitácora ---------- */
function AdjuntosEditor({ items, onChange }){
  const list = items||[];
  const [busy,setBusy]=useState(false);
  const note = (m,e)=> window.__notify && window.__notify(m,e);
  const add = async (files)=>{
    if(!files || !files.length) return; setBusy(true);
    const added=[];
    for(const file of Array.from(files)){
      try{ const r=await uploadArchivo(file); added.push({ url:r.url, name:r.name||file.name, contentType:r.contentType||file.type, size:file.size }); }
      catch(err){ note(err.message||("No se pudo subir "+file.name), true); }
    }
    if(added.length){ onChange([...(list), ...added]); note(""+added.length+" archivo(s) adjuntado(s)"); }
    setBusy(false);
  };
  return (<div className="field" style={{marginTop:12}}>
    <label className="label">Adjuntos (fotos, videos, PDF, Word, Excel…)</label>
    <label className="btn btn-out btn-sm" style={{opacity:busy?0.6:1,pointerEvents:busy?"none":"auto"}}>
      {busy?"Subiendo…":"Adjuntar archivos"}
      <input type="file" multiple style={{display:"none"}} onChange={e=>{ add(e.target.files); e.target.value=""; }}/>
    </label>
    <div className="help" style={{marginTop:6}}>Se guardan en la plataforma (no en el dispositivo). Máximo 4 MB por archivo.</div>
    {!!list.length && <div style={{display:"flex",flexDirection:"column",gap:6,marginTop:10}}>
      {list.map((a,i)=>(<div key={i} style={{display:"flex",alignItems:"center",gap:8,border:"1px solid var(--line2)",borderRadius:8,padding:"6px 10px"}}>
        <span style={{fontSize:18}}>{fileIcon(a.contentType)}</span>
        <a href={a.url} target="_blank" rel="noopener" style={{flex:1,color:"var(--ink)",textDecoration:"none",fontWeight:600,fontSize:14,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.name}</a>
        <button className="btn btn-ghost btn-sm" title="Quitar" onClick={()=>onChange(list.filter((_,j)=>j!==i))}>✕</button>
      </div>))}
    </div>}
  </div>);
}
function AdjuntosView({ items }){
  const list = items||[]; if(!list.length) return null;
  return (<div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:6}}>
    {list.map((a,i)=>(<a key={i} href={a.url} target="_blank" rel="noopener" className="pill grey" style={{textDecoration:"none",display:"inline-flex",alignItems:"center",gap:5,maxWidth:220,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{fileIcon(a.contentType)} {a.name}</a>))}
  </div>);
}

/* ---------- Editor de movimientos (gastos e ingresos) ----------
   Cada movimiento admite: monto en CLP o UF, periodicidad (cada 1/2/3/4/6 meses,
   anual o fecha exacta), mes/año, nota, archivos adjuntos de todo tipo y subítems
   (cada subítem con su propia nota y adjuntos). Todo es editable. */
function MovItem({ m, onChange, onDelete, uf, tipo }){
  const [open,setOpen]=useState(false);
  const set=(k,v)=>onChange({...m,[k]:v});
  const moneda=m.moneda||"CLP";
  const subs=m.subitems||[]; const adj=m.adjuntos||[];
  const mensual=movMensualCLP(m,uf);
  const addSub=()=>onChange({...m, subitems:[...subs,{ id:"s"+Date.now().toString(36)+Math.random().toString(36).slice(2,5), concepto:"", monto:"", montoUF:"", moneda:"CLP", nota:"", adjuntos:[] }]});
  const updSub=(sid,k,v)=>onChange({...m, subitems:subs.map(s=>s.id===sid?{...s,[k]:v}:s)});
  const delSub=(sid)=>onChange({...m, subitems:subs.filter(s=>s.id!==sid)});
  const color = tipo==="ingreso" ? "var(--green-d)" : "var(--red-d)";
  return (<div style={{border:"1px solid var(--line2)",borderRadius:10,padding:"8px 10px",background:"var(--card)"}}>
    <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
      <input className="input" style={{flex:"2 1 130px",minWidth:110}} placeholder={tipo==="ingreso"?"Concepto (ej: estacionamiento)":"Concepto"} value={m.concepto||""} onChange={e=>set("concepto",e.target.value)}/>
      <input className="input" style={{flex:"1 1 80px",minWidth:70}} type="number" min="0" step="any" placeholder="0" value={moneda==="UF"?(m.montoUF??""):(m.monto??"")} onChange={e=>set(moneda==="UF"?"montoUF":"monto",e.target.value)}/>
      <select value={moneda} onChange={e=>set("moneda",e.target.value)} title="Moneda"><option value="CLP">CLP $</option><option value="UF">UF</option></select>
      <select value={m.periodo||"mes"} onChange={e=>set("periodo",e.target.value)} title="Periodicidad">{PERIODOS.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}</select>
      <button className={"btn btn-sm "+(open?"btn-red":"btn-out")} title="Más opciones (fecha, nota, archivos, subítems)" onClick={()=>setOpen(o=>!o)}>{(adj.length+subs.length)>0?` ${adj.length+subs.length}`:""}</button>
      <button className="btn btn-ghost btn-sm" title="Eliminar" onClick={onDelete}>✕</button>
    </div>
    <div style={{fontSize:12,color:"var(--faint)",fontWeight:600,marginTop:4}}>
      {moneda==="UF" && <span>≈ {CLP(movMontoCLP({...m,subitems:[]},uf))} · </span>}
      {m.periodo==="unica" ? <span>Movimiento único{m.fecha?` · ${m.fecha}`:""} (no se prorratea al mes)</span> : <span style={{color}}>Equivale a {CLP(mensual)}/mes</span>}
    </div>
    {open && <div style={{marginTop:10,borderTop:"1px dashed var(--line)",paddingTop:10}}>
      <div className="grid" style={{gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
        <div className="field"><label className="label" style={{fontSize:12}}>{m.periodo==="unica"?"Fecha exacta":"Fecha / vencimiento"}</label><input className="input" type="date" value={m.fecha||""} onChange={e=>set("fecha",e.target.value)}/></div>
        <div className="field"><label className="label" style={{fontSize:12}}>Mes</label><select value={m.mes??""} onChange={e=>set("mes",e.target.value===""?"":parseInt(e.target.value))}><option value="">—</option>{MESES_L.map((mn,i)=><option key={i} value={i}>{mn}</option>)}</select></div>
        <div className="field"><label className="label" style={{fontSize:12}}>Año</label><input className="input" type="number" placeholder="2026" value={m.anio??""} onChange={e=>set("anio",e.target.value)}/></div>
      </div>
      <div className="field" style={{marginTop:8}}><label className="label" style={{fontSize:12}}>Nota / comentario</label><textarea value={m.nota||""} onChange={e=>set("nota",e.target.value)} style={{minHeight:54}} placeholder="Observaciones, referencia de la boleta, etc."/></div>
      <AdjuntosEditor items={adj} onChange={list=>set("adjuntos",list)}/>
      <div style={{marginTop:10,background:"var(--panel2)",border:"1px solid var(--line)",borderRadius:8,padding:10}}>
        <div style={{fontWeight:800,fontSize:13,marginBottom:6}}>Subítems {subs.length>0?`(${subs.length})`:""}</div>
        {subs.length===0 && <div style={{color:"var(--muted)",fontSize:13,marginBottom:6}}>Divide este movimiento en partes (ej: Div. · Gas. · Útil.). Cada subítem admite nota y archivos.</div>}
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {subs.map(s=>{ const sm=s.moneda||"CLP"; return (<div key={s.id} style={{border:"1px solid var(--line2)",borderRadius:8,padding:8,background:"var(--card)"}}>
            <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
              <input className="input" style={{flex:"2 1 110px",minWidth:90}} placeholder="Concepto del subítem" value={s.concepto||""} onChange={e=>updSub(s.id,"concepto",e.target.value)}/>
              <input className="input" style={{flex:"1 1 70px",minWidth:60}} type="number" min="0" step="any" placeholder="0" value={sm==="UF"?(s.montoUF??""):(s.monto??"")} onChange={e=>updSub(s.id,sm==="UF"?"montoUF":"monto",e.target.value)}/>
              <select value={sm} onChange={e=>updSub(s.id,"moneda",e.target.value)}><option value="CLP">CLP $</option><option value="UF">UF</option></select>
              <button className="btn btn-ghost btn-sm" title="Eliminar subítem" onClick={()=>delSub(s.id)}>✕</button>
            </div>
            <input className="input" style={{marginTop:6}} placeholder="Nota del subítem" value={s.nota||""} onChange={e=>updSub(s.id,"nota",e.target.value)}/>
            <AdjuntosEditor items={s.adjuntos||[]} onChange={list=>updSub(s.id,"adjuntos",list)}/>
          </div>); })}
        </div>
        <button className="btn btn-out btn-sm" style={{marginTop:8}} onClick={addSub}>＋ Agregar subítem</button>
      </div>
    </div>}
  </div>);
}
function MovList({ items, onChange, uf, tipo }){
  const list=items||[];
  const add=()=>onChange([...list,{ id:(tipo==="ingreso"?"i":"g")+Date.now().toString(36)+Math.random().toString(36).slice(2,6), concepto:"", monto:"", montoUF:"", moneda:"CLP", periodo:"mes", fecha:"", mes:"", anio:"", nota:"", adjuntos:[], subitems:[] }]);
  return (<div style={{display:"flex",flexDirection:"column",gap:8}}>
    {list.length===0 && <div style={{color:"var(--muted)",fontSize:14}}>Sin {tipo==="ingreso"?"ingresos":"gastos"}. Agrega uno abajo.</div>}
    {list.map(m=><MovItem key={m.id} m={m} uf={uf} tipo={tipo} onChange={nm=>onChange(list.map(x=>x.id===m.id?nm:x))} onDelete={()=>onChange(list.filter(x=>x.id!==m.id))}/>)}
    <button className="btn btn-out btn-sm" style={{alignSelf:"flex-start"}} onClick={add}>＋ Agregar {tipo==="ingreso"?"ingreso":"gasto"}</button>
  </div>);
}

/* ---------- Seguros y contribuciones (editables, con boletas/pólizas adjuntas) ---------- */
function SegurosBox({ p, uf, onChange }){

  const credito=creditoVigente(p);

      <div><div style={{fontWeight:700}}>El seguro va incluido en el dividendo</div><div style={{fontSize:12,color:"var(--muted)"}}>Mientras pagas el crédito, no se cobra seguro aparte.</div></div>
    </label>}

    {pagado && <div className="help" style={{marginBottom:10,borderLeftColor:"var(--amber)"}}>Crédito pagado: el seguro que venía incluido en el dividendo <b>dejó de existir</b>. Contrata uno por tu cuenta y agrégalo abajo para que quede registrado y se considere en los gastos.</div>}
    {!p.hasMortgage && <div className="help" style={{marginBottom:10}}>Propiedad sin crédito. Si es <b>antigua puede no tener seguro</b>; de todas formas puedes agregar uno si una aseguradora te lo ofrece más adelante.</div>}

      {list.map(s=>{ const sm=s.moneda||"UF"; return (<div key={s.id} style={{border:"1px solid var(--line2)",borderRadius:10,padding:10,background:"var(--card)",opacity:s.activo===false?0.6:1}}>

          <div className="field"><label className="label" style={{fontSize:12}}>Tipo / cobertura</label><input className="input" value={s.tipo||""} onChange={e=>upd(s.id,"tipo",e.target.value)} placeholder="Incendio y sismo"/></div>
        </div>
        <div className="grid" style={{gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginTop:8}}>

function RecepPresupuestosBox({ p, uf, onChange, quien }){
  const list=p.recepPresupuestos||[];
  const upd=(id,k,v)=>onChange({ recepPresupuestos:list.map(x=>x.id===id?{...x,[k]:v}:x)});
  const add=()=>onChange({ recepPresupuestos:[...list,{ id:"rp"+Date.now().toString(36)+Math.random().toString(36).slice(2,5), contratista:"", trabajo:"", monto:"", moneda:"CLP", fecha:todayISO(), estado:"Por revisar", nota:"", adjuntos:[], decididoPor:"", decididoEl:"" }]});
  const del=(id)=>onChange({ recepPresupuestos:list.filter(x=>x.id!==id)});
  const montoCLP=(x)=> x.moneda==="UF" ? Math.round(num(x.monto)*uf) : num(x.monto);
  // Aprobar/Rechazar deja constancia de quién decidió y cuándo (no un select
  // mudo que cualquiera mueve sin dejar rastro). Volver a "Por revisar" borra
  // esa constancia porque la decisión anterior queda sin efecto.
  const decidir=(id,estado)=>onChange({ recepPresupuestos:list.map(x=>x.id===id
    ? {...x, estado, decididoPor: estado==="Por revisar"?"":(quien||""), decididoEl: estado==="Por revisar"?"":todayISO()}
    : x) });
  const aprobado=list.filter(x=>x.estado==="Aprobado").reduce((s,x)=>s+montoCLP(x),0);
  const porRevisar=list.filter(x=>x.estado==="Por revisar").length;
  // La comparación es el punto de esta lista: se ordena sola de más barato a
  // más caro (los sin monto al final) y se marca el más barato, para que ver
  // cuál conviene no obligue a hacer la cuenta a mano.
  const conMonto=list.filter(x=>montoCLP(x)>0);
  const masBarato=conMonto.length>1 ? conMonto.reduce((a,b)=>montoCLP(b)<montoCLP(a)?b:a) : null;
  const ordenados=[...list].sort((a,b)=>{
    const ma=montoCLP(a), mb=montoCLP(b);
    if(ma>0 && mb>0) return ma-mb;
    return (mb>0?1:0)-(ma>0?1:0);
  });
  return (<div>
    <div className="help" style={{marginBottom:10}}>Registra aquí cada <b>presupuesto</b> que te envíen los contratistas. Se ordenan solos del más barato al más caro para comparar de un vistazo, y adjunta el PDF que te mandaron.</div>
    {list.length>0 && <div style={{display:"flex",justifyContent:"space-between",gap:10,flexWrap:"wrap",background:"var(--panel2)",border:"1px solid var(--line2)",borderRadius:10,padding:"9px 13px",marginBottom:14,fontSize:13,color:"var(--muted)"}}>
      <span>{porRevisar ? (porRevisar+" por revisar") : "Ninguno pendiente de revisar"}</span>
      <span>Total aprobado: <b style={{color:"var(--text)",fontVariantNumeric:"tabular-nums"}}>{CLP(aprobado)}</b></span>
    </div>}
    {list.length===0 && <div style={{color:"var(--muted)",fontSize:14,marginBottom:8}}>Sin presupuestos cargados todavía.</div>}
    <div style={{display:"flex",flexDirection:"column",gap:10}}>
      {ordenados.map(x=>{
        const cheapest = masBarato && x.id===masBarato.id;
        const diff = (!cheapest && masBarato && montoCLP(x)>0) ? montoCLP(x)-montoCLP(masBarato) : 0;
        return (<div key={x.id} style={{border:"1px solid "+(cheapest?"var(--green-soft)":"var(--line2)"),borderRadius:10,padding:12,background:cheapest?"var(--green-bg)":"var(--card)"}}>
        <div style={{display:"flex",gap:8,alignItems:"flex-start",flexWrap:"wrap"}}>
          <input className="input" style={{flex:"1.3 1 150px",minWidth:120,fontWeight:800}} placeholder="Contratista / proveedor" value={x.contratista||""} onChange={ev=>upd(x.id,"contratista",ev.target.value)}/>
          <div style={{textAlign:"right"}}>
            <div style={{display:"flex",gap:6,alignItems:"center",justifyContent:"flex-end"}}>
              <input className="input" style={{width:100,textAlign:"right",fontWeight:800,fontVariantNumeric:"tabular-nums"}} type="number" min="0" step="any" placeholder="0" value={x.monto??""} onChange={ev=>upd(x.id,"monto",ev.target.value)}/>
              <select value={x.moneda||"CLP"} onChange={ev=>upd(x.id,"moneda",ev.target.value)} title="Moneda" style={{width:78}}><option value="CLP">CLP $</option><option value="UF">UF</option></select>
            </div>
            {x.moneda==="UF" && num(x.monto)>0 && <div style={{fontSize:11.5,color:"var(--faint)",marginTop:2}}>≈ {CLP(montoCLP(x))}</div>}
          </div>
        </div>
        <input className="input" style={{marginTop:6}} placeholder="Trabajo / ítem cotizado" value={x.trabajo||""} onChange={ev=>upd(x.id,"trabajo",ev.target.value)}/>
        {(cheapest || diff>0) && <div style={{fontSize:12.5,fontWeight:700,marginTop:7,color:cheapest?"var(--green-d)":"var(--faint)"}}>
          {cheapest ? "🏆 El más barato de este grupo" : ("＋"+CLP(diff)+" más caro que "+(masBarato.contratista||"el más barato"))}
        </div>}
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",marginTop:10,paddingTop:10,borderTop:"1px dashed var(--line2)"}}>
          <input className="input" style={{width:150}} type="date" value={x.fecha||""} onChange={ev=>upd(x.id,"fecha",ev.target.value)}/>
          {x.estado==="Por revisar" ? (<>
            <button className="btn btn-green btn-sm" onClick={()=>decidir(x.id,"Aprobado")}>✓ Aprobar</button>
            <button className="btn btn-danger btn-sm" onClick={()=>decidir(x.id,"Rechazado")}>✕ Rechazar</button>
          </>) : (<>
            <span className={"pill "+(x.estado==="Aprobado"?"green":"red")}>{x.estado==="Aprobado"?"✓ Aprobado":"✕ Rechazado"}</span>
            <span style={{fontSize:12,color:"var(--faint)"}}>{x.decididoPor?("por "+x.decididoPor):""}{x.decididoEl?(" · "+x.decididoEl):""}</span>
            <button className="btn btn-ghost btn-sm" onClick={()=>decidir(x.id,"Por revisar")}>↺ Volver a revisar</button>
          </>)}
          <div style={{flex:1}}/>
          <button className="btn btn-ghost btn-sm" title="Eliminar" onClick={()=>del(x.id)}>✕ Quitar</button>
        </div>
        <input className="input" style={{marginTop:8}} placeholder="Nota (plazo, forma de pago, garantía, etc.)" value={x.nota||""} onChange={ev=>upd(x.id,"nota",ev.target.value)}/>
        <AdjuntosEditor items={x.adjuntos||[]} onChange={l=>upd(x.id,"adjuntos",l)}/>
      </div>); })}
    </div>
    <button className="btn btn-out btn-sm" style={{marginTop:10}} onClick={add}>＋ Agregar presupuesto</button>
  </div>);

/* ---------- Sección desplegable (acordeón) — para ordenar y no aglomerar ---------- */
/* Acciones que propone la IA cuando el documento no encaja en los campos de una
   propiedad. Evita el callejón sin salida: en vez de "no encontré nada",
   explica qué hacer y lo ejecuta. */
const ACC_ICO={gasto:"💸",bitacora:"📓",incidencia:"🛠️",ninguna:"ℹ️",actualizar_propiedad:"✏️",crear_propiedad:"🏠",recep_presupuesto:"🧾",recep_doc:"🏛️"};
const ACC_TXT={gasto:"Registrar como gasto",bitacora:"Anotar en la bitácora",incidencia:"Crear incidencia",ninguna:"",actualizar_propiedad:"Corregir la ficha de la propiedad",crear_propiedad:"Crear una propiedad nueva",recep_presupuesto:"Guardar como presupuesto — Recepción municipal",recep_doc:"Guardar en el checklist — Recepción municipal"};

/* Selección múltiple: la IA puede proponer varias acciones y conviene poder
   hacerlas todas de una, no una por una. Vienen marcadas por defecto porque se
   proponen justamente porque sirven; el usuario desmarca lo que no quiera. */
function Sugerencias({ res, props, onEjecutar }){
  const lista=(res&&res.datos&&res.datos.sugerencias)||[];
  const ejecutable=(s)=>!!(s&&s.accion&&s.accion!=="ninguna");
  const todas=()=>new Set(lista.map((s,i)=>ejecutable(s)?i:-1).filter(i=>i>=0));
  const [sel,setSel]=React.useState(todas);
  // Al analizar un documento nuevo se vuelve a marcar todo.
  React.useEffect(()=>{ setSel(todas()); },[res]);
  if(!lista.length) return null;
  const nombreProp=(id)=>{ const p=props.find(x=>String(x.id)===String(id)); return p?p.name:null; };
  const alternar=(i)=>setSel(p=>{ const n=new Set(p); n.has(i)?n.delete(i):n.add(i); return n; });
  const elegidas=lista.filter((s,i)=>sel.has(i)&&ejecutable(s));
  const hayVarias=lista.filter(ejecutable).length>1;
  return (<div className="sug-wrap">
    <div className="sug-cab">
      <span className="sug-t">¿Qué hacemos con este documento?</span>
      {hayVarias&&<button className="sug-todas" onClick={()=>setSel(sel.size?new Set():todas())}>
        {sel.size?"Desmarcar todo":"Marcar todo"}</button>}
    </div>
    {lista.map((s,i)=>{
      const prop=nombreProp(s.propiedadId), ok=ejecutable(s), marcada=sel.has(i);
      return (<label key={i} className={"sug"+(ok?" sug-sel":"")+(marcada?" on":"")}>
        {ok&&<input type="checkbox" className="sug-check" checked={marcada} onChange={()=>alternar(i)}/>}
        <div className="sug-ico">{ACC_ICO[s.accion]||"ℹ️"}</div>
        <div className="sug-body">
          <div className="sug-titulo">{s.titulo||ACC_TXT[s.accion]||"Sugerencia"}</div>
          {ok&&<div className="sug-accion">{ACC_TXT[s.accion]}</div>}
          {s.porque&&<div className="sug-porque">{s.porque}</div>}
          <div className="sug-meta">
            {prop&&<span>🏠 {prop}</span>}
            {s.contratista&&<span>👷 {s.contratista}</span>}
            {num(s.monto)>0&&<span>{s.moneda==="UF"?UFf(num(s.monto)):CLP(num(s.monto))}{s.periodo&&s.periodo!=="una vez"?" / "+s.periodo:""}</span>}
          </div>
          {!ok&&<div className="sug-nada">No hay nada que guardar en la plataforma.</div>}
        </div>
      </label>);
    })}
    {lista.some(ejecutable)&&<button className="sug-btn" disabled={!elegidas.length}
      onClick={()=>onEjecutar(elegidas)}>
      {elegidas.length<=1 ? "Hacerlo" : ("Hacer las "+elegidas.length+" acciones marcadas")}
    </button>}
  </div>);
}

/* Lo que el asesor propone cambiar en la plataforma. Nada se guarda hasta que
   el usuario marca lo que quiere y lo aplica. */
function PropuestasIA({ items, props, onAplicar }){
  const lista=items||[];
  const todas=()=>new Set(lista.map((_c,i)=>i));
  const [sel,setSel]=React.useState(todas);
  const [hecho,setHecho]=React.useState(false);
  React.useEffect(()=>{ setSel(todas()); setHecho(false); },[items]);
  if(!lista.length) return null;
  const nombreProp=(id)=>{ const p=(props||[]).find(x=>String(x.id)===String(id)); return p?p.name:null; };
  const alternar=(i)=>setSel(p=>{ const n=new Set(p); n.has(i)?n.delete(i):n.add(i); return n; });
  const elegidos=lista.filter((_c,i)=>sel.has(i));
  return (<div className="sug-wrap">
    <div className="sug-cab">
      <span className="sug-t">Cambios que puedo hacer en la plataforma</span>
      {lista.length>1&&<button className="sug-todas" onClick={()=>setSel(sel.size?new Set():todas())}>
        {sel.size?"Desmarcar todo":"Marcar todo"}</button>}
    </div>
    {lista.map((c,i)=>{
      const prop=nombreProp(c.propiedad_id), marcada=sel.has(i);
      const campos=Object.keys(c.campos||{});
      return (<label key={i} className={"sug sug-sel"+(marcada?" on":"")}>
        <input type="checkbox" className="sug-check" checked={marcada} onChange={()=>alternar(i)} disabled={hecho}/>
        <div className="sug-ico">{ACC_ICO[c.accion]||"✨"}</div>
        <div className="sug-body">
          <div className="sug-titulo">{c.titulo||ACC_TXT[c.accion]||"Cambio"}</div>
          <div className="sug-accion">{ACC_TXT[c.accion]||c.accion}</div>
          {c.detalle&&<div className="sug-porque">{c.detalle}</div>}
          {c.porque&&<div className="sug-porque">{c.porque}</div>}
          <div className="sug-meta">
            {prop&&<span>🏠 {prop}</span>}
            {num(c.monto)>0&&<span>{CLP(num(c.monto))}{c.periodo&&c.periodo!=="una vez"?" / "+c.periodo:""}</span>}
            {!!campos.length&&<span>{campos.length} campo(s): {campos.slice(0,5).join(", ")}</span>}
          </div>
        </div>
      </label>);
    })}
    {hecho
      ? <div className="sug-nada" style={{textAlign:"center",padding:"8px 0"}}>✓ Aplicado</div>
      : <button className="sug-btn" disabled={!elegidos.length} onClick={()=>{ onAplicar(elegidos); setHecho(true); }}>
          {elegidos.length<=1 ? "Aplicar este cambio" : ("Aplicar los "+elegidos.length+" cambios marcados")}
        </button>}
  </div>);
}

/* ---- Arrastrar para reordenar --------------------------------------------
   Se mantiene presionada una ficha y, sin soltar, se arrastra con el dedo (o
   con el mouse) hasta donde debe quedar, igual que al mover las aplicaciones
   en el teléfono. El estado del gesto vive fuera de React porque hay un solo
   arrastre a la vez y la cantidad de fichas cambia (no puede ser un hook).

   Devuelve los manejadores para la ficha número `indice` de la lista `ids`.
   `alSoltar(nuevosIds)` recibe el orden final. */
const _ar = { activo:false, reclamado:false, clave:null, ids:null, desde:-1, sobre:-1, t:null, y0:0, alSoltar:null };
/* Mientras se arrastra, el gesto se sigue desde el documento y no desde la
   ficha: así el dedo puede salirse de ella sin que se pierda el movimiento, y
   —sobre todo— el `preventDefault` sí surte efecto (React escucha los toques
   de forma pasiva, así que desde sus manejadores la página se desplazaría
   igual). */
const _arSeguir = (e)=>{
  if(!_ar.activo) return;
  const p=(e.touches&&e.touches[0])||e;
  if(e.cancelable) e.preventDefault(); // ya arrastrando: la página no debe desplazarse
  const bajo=_arDebajo(p.clientX,p.clientY);
  document.querySelectorAll(".ord-wrap.hueco").forEach(el=>el.classList.remove("hueco"));
  if(bajo && bajo.i!==_ar.desde){ _ar.sobre=bajo.i; bajo.el.classList.add("hueco"); }
};
const _arSoltar = ()=>{
  if(!_ar.activo){ _arLimpiar(); return; }
  const { ids:lista, desde, sobre, alSoltar:fn } = _ar;
  _arLimpiar();
  if(fn && lista && sobre>=0 && sobre!==desde) fn(moverEn(lista, lista[desde], sobre));
};
const _arEscuchar = (poner)=>{
  const f = poner ? document.addEventListener.bind(document) : document.removeEventListener.bind(document);
  f("touchmove",_arSeguir,{passive:false});
  f("mousemove",_arSeguir);
  f("touchend",_arSoltar); f("touchcancel",_arSoltar); f("mouseup",_arSoltar);
};
const _arLimpiar = ()=>{
  if(_ar.t){ clearTimeout(_ar.t); _ar.t=null; }
  if(_ar.activo){
    _arEscuchar(false);
    /* Tras arrastrar, el toque no debe abrir la ficha. En el teléfono a veces
       no llega ningún clic después de soltar, así que la marca se borra sola:
       si no, se comería el siguiente toque de verdad. */
    setTimeout(()=>{ _pl.sup=false; },700);
  }
  document.querySelectorAll(".ord-wrap.arrastrando,.ord-wrap.hueco").forEach(el=>el.classList.remove("arrastrando","hueco"));
  _ar.activo=false; _ar.reclamado=false; _ar.clave=null; _ar.ids=null; _ar.desde=-1; _ar.sobre=-1; _ar.alSoltar=null;
};
/* Sobre qué ficha está el dedo ahora mismo. Se mira también la posición
   horizontal porque en el inicio las propiedades van en dos columnas: si solo
   se mirara la altura, dos fichas distintas darían lo mismo. */
const _arDebajo = (x,y)=>{
  const cajas=[...document.querySelectorAll('.ord-wrap[data-ord-clave="'+_ar.clave+'"]')];
  let soloAltura=null;
  for(let i=0;i<cajas.length;i++){
    const r=cajas[i].getBoundingClientRect();
    if(y>=r.top && y<=r.bottom){
      if(x>=r.left && x<=r.right) return { i, el:cajas[i], r };
      if(!soloAltura) soloAltura={ i, el:cajas[i], r };
    }
  }
  return soloAltura;
};

/* ---- Botón flotante que se puede llevar a cualquier parte ----------------
   El ícono del asesor tapaba la flecha de "volver arriba". En vez de moverlo
   a otro rincón fijo —donde tarde o temprano vuelve a estorbar—, se arrastra
   con el dedo a donde uno quiera, como los widgets del teléfono. La posición
   queda guardada, así que al volver a entrar sigue donde se dejó.

   El clic normal del botón se mantiene (así sigue funcionando con teclado);
   lo único que se hace es tragarse el clic que llega justo después de un
   arrastre, para que moverlo no abra el panel. Devuelve una función para
   soltar los escuchas. */
const FLOTA_MARGEN = 8;
const flotanteArrastrable = (el, clave)=>{
  if(!el) return ()=>{};
  const g = { activo:false, movio:false, dx:0, dy:0, bloquear:false };

  const limites = ()=>({ w: window.innerWidth, h: window.innerHeight, ew: el.offsetWidth, eh: el.offsetHeight });
  const colocar = (x,y)=>{
    const L = limites();
    const cx = Math.max(FLOTA_MARGEN, Math.min(L.w - L.ew - FLOTA_MARGEN, x));
    const cy = Math.max(FLOTA_MARGEN, Math.min(L.h - L.eh - FLOTA_MARGEN, y));
    el.style.left = cx+"px"; el.style.top = cy+"px";
    el.style.right = "auto"; el.style.bottom = "auto";
    return { x:cx, y:cy };
  };
  const guardar = (p)=>{ try{ localStorage.setItem(clave, JSON.stringify(p)); }catch(_e){} };

  // Posición guardada de la última vez (si todavía cabe en esta pantalla).
  try{
    const p = JSON.parse(localStorage.getItem(clave)||"null");
    if(p && typeof p.x==="number" && typeof p.y==="number") colocar(p.x,p.y);
  }catch(_e){}

  const punto = (e)=> (e.touches&&e.touches[0]) || (e.changedTouches&&e.changedTouches[0]) || e;
  const empezar = (e)=>{
    const p = punto(e);
    const r = el.getBoundingClientRect();
    g.activo = true; g.movio = false; g.dx = p.clientX - r.left; g.dy = p.clientY - r.top;
    document.addEventListener("touchmove", mover, {passive:false});
    document.addEventListener("mousemove", mover);
    document.addEventListener("touchend", soltar); document.addEventListener("touchcancel", soltar);
    document.addEventListener("mouseup", soltar);
  };
  const mover = (e)=>{
    if(!g.activo) return;
    const p = punto(e);
    const x = p.clientX - g.dx, y = p.clientY - g.dy;
    if(!g.movio){
      const r = el.getBoundingClientRect();
      if(Math.abs(x-r.left)<5 && Math.abs(y-r.top)<5) return; // todavía es un toque
      g.movio = true; el.classList.add("moviendo");
      try{ navigator.vibrate&&navigator.vibrate(12); }catch(_e){}
    }
    if(e.cancelable) e.preventDefault();
    colocar(x,y);
  };
  const soltar = ()=>{
    if(!g.activo) return;
    g.activo = false;
    document.removeEventListener("touchmove", mover);
    document.removeEventListener("mousemove", mover);
    document.removeEventListener("touchend", soltar); document.removeEventListener("touchcancel", soltar);
    document.removeEventListener("mouseup", soltar);
    el.classList.remove("moviendo");
    if(g.movio){
      const r = el.getBoundingClientRect();
      guardar({x:r.left, y:r.top});
      // El clic que viene después de arrastrar no debe abrir el panel.
      g.bloquear = true; setTimeout(()=>{ g.bloquear=false; }, 500);
    }
  };
  const tragarClic = (e)=>{ if(g.bloquear){ g.bloquear=false; e.preventDefault(); e.stopPropagation(); } };
  // Si gira el teléfono o cambia el tamaño, el botón no debe quedar fuera.
  const reencajar = ()=>{
    if(!el.style.left) return;
    const r = el.getBoundingClientRect();
    guardar(colocar(r.left, r.top));
  };

  const alMouse = (e)=>{ if(e.button===0) empezar(e); };
  el.addEventListener("touchstart", empezar, {passive:true});
  el.addEventListener("mousedown", alMouse);
  el.addEventListener("click", tragarClic, true);
  window.addEventListener("resize", reencajar);
  return ()=>{
    soltar();
    el.removeEventListener("touchstart", empezar);
    el.removeEventListener("mousedown", alMouse);
    el.removeEventListener("click", tragarClic, true);
    window.removeEventListener("resize", reencajar);
  };
};

const arrastrable = (clave, ids, indice, alSoltar)=>{
  const empezar=(e)=>{
    if(_plEditando(e.target)) return;
    // Hay fichas dentro de otras fichas (una propiedad dentro de la tarjeta
    // "Tus propiedades"): manda la de más adentro, que es la que recibe el
    // gesto primero.
    if(_ar.reclamado && (_ar.t || _ar.activo)) return;
    _ar.reclamado=true;
    const p=(e.touches&&e.touches[0])||e;
    _ar.y0=p.clientY; _ar.clave=clave; _ar.ids=ids.slice(); _ar.desde=indice; _ar.sobre=indice; _ar.alSoltar=alSoltar;
    if(_ar.t) clearTimeout(_ar.t);
    _ar.t=setTimeout(()=>{
      _ar.t=null; _ar.activo=true; _pl.sup=true;
      _arEscuchar(true);
      try{ navigator.vibrate&&navigator.vibrate(18); }catch(_e){}
      const caja=document.querySelectorAll('.ord-wrap[data-ord-clave="'+clave+'"]')[indice];
      if(caja) caja.classList.add("arrastrando");
    },420);
  };
  /* Antes de que arranque el arrastre: si el dedo se desplaza, era scroll. */
  const mover=(e)=>{
    if(_ar.activo) return;
    const p=(e.touches&&e.touches[0])||e;
    if(_ar.t && Math.abs(p.clientY-_ar.y0)>12){ clearTimeout(_ar.t); _ar.t=null; _ar.reclamado=false; }
  };
  return {
    onTouchStart:empezar, onTouchMove:mover, onTouchEnd:_arSoltar, onTouchCancel:_arSoltar,
    onMouseDown:(e)=>{ if(e.button===0) empezar(e); },
    onMouseMove:mover, onMouseUp:_arSoltar, onMouseLeave:()=>{ if(!_ar.activo) _arLimpiar(); },
  };
};

/* ---- Reordenar fichas: cuadro con posiciones (el respaldo) ----------------
   El arrastre de arriba es la forma principal. Además queda el cuadro con la
   lista de posiciones, que se abre desde el asa ⠿ o con clic derecho en el
   computador. `_pl.sup` marca que hubo un gesto largo, para que el toque que
   viene después no abra la ficha. */
const _pl={t:null,sup:false,x:0,y:0};
const _plEditando=(el)=>{ const t=((el&&el.tagName)||"").toLowerCase();
  return t==="input"||t==="textarea"||t==="select"||(el&&el.isContentEditable); };
const ordenarPor=(items, orden, idDe)=>{
  if(!Array.isArray(orden)||!orden.length) return items;
  const pos=(x)=>{ const i=orden.indexOf(idDe(x)); return i<0?9999:i; };
  return [...items].sort((a,b)=>pos(a)-pos(b));
};
const moverEn=(ids, id, destino)=>{
  const l=ids.filter(x=>x!==id);
  l.splice(Math.max(0,Math.min(l.length,destino)),0,id);
  return l;
};

function MoverFicha({ titulo, items, idSel, onOrden, onCerrar, onReiniciar }){
  const ids=items.map(x=>x.id);
  const i=ids.indexOf(idSel);
  const mover=(d)=>onOrden(moverEn(ids,idSel,d));
  return (<div className="modal-bg" onClick={onCerrar}><div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:520}}>
    <div className="modal-head"><h3>Mover “{titulo}”</h3><p>Elige dónde quieres que aparezca. También puedes tocar otra ficha de la lista para dejarla justo en ese lugar.</p></div>
    <div className="modal-body">
      <div className="mov-btns">
        <button className="btn btn-out btn-sm" disabled={i<=0} onClick={()=>mover(i-1)}>↑ Subir</button>
        <button className="btn btn-out btn-sm" disabled={i<0||i>=ids.length-1} onClick={()=>mover(i+1)}>↓ Bajar</button>
        <button className="btn btn-out btn-sm" disabled={i<=0} onClick={()=>mover(0)}>⤒ Al principio</button>
        <button className="btn btn-out btn-sm" disabled={i>=ids.length-1} onClick={()=>mover(ids.length-1)}>⤓ Al final</button>
      </div>
      <div className="mov-lista">
        {items.map((x,k)=>(<button key={x.id} type="button" className={"mov-it"+(x.id===idSel?" act":"")}
          onClick={()=>{ if(x.id!==idSel) mover(k); }}>
          <span className="n">{k+1}</span><span style={{flex:1}}>{x.titulo}</span>
          {x.id===idSel&&<span style={{fontSize:12,color:"var(--muted)",fontWeight:600}}>esta</span>}
        </button>))}
      </div>
      {onReiniciar&&<button className="btn btn-ghost btn-sm" style={{marginTop:12}} onClick={onReiniciar}>Volver al orden original</button>}
    </div>
    <div className="modal-foot"><button className="btn btn-red" style={{flex:1}} onClick={onCerrar}>Listo</button></div>
  </div></div>);
}

function Collapsible({ title, icon, subtitle, children, defaultOpen, flush, accent }){
  // Todas las secciones parten cerradas: el usuario las despliega una a una.
  const [open,setOpen]=React.useState(false);
  const style = accent ? {borderLeft:"5px solid "+accent} : undefined;
  return (<div className={"collapse"+(open?" open":"")+(flush?" flush":"")} style={style}>
    <button type="button" className="chead" onClick={()=>setOpen(o=>!o)} aria-expanded={open}>
      {icon&&<span className="cico">{icon}</span>}
      <span className="ctxt"><span className="ctitle">{title}</span>{subtitle&&<span className="csub">{subtitle}</span>}</span>
      <span className="chev">▼</span>
    </button>
    {open && <div className="cbody">{children}</div>}
  </div>);
}

    {q:"¿Qué es la garantía y cómo se liquida?", a:"La garantía es la plata que el arrendatario deja al firmar el contrato —en Chile casi siempre un mes de arriendo— y que queda guardada por si al final del arriendo hay algo pendiente. No es un pago adelantado del último mes: es un respaldo. Cuando el arrendatario se va, se revisa la propiedad y se hace la liquidación de garantía, que es simplemente la cuenta final: de la garantía recibida se descuenta lo que corresponda y el resto se le devuelve. Se descuentan los arriendos impagos, las cuentas de luz, agua, gas o gasto común que hayan quedado debiendo, y los daños que no sean por el uso normal (un vidrio roto, una puerta forzada, una pared con un hoyo). NO se descuenta el desgaste normal por haber vivido ahí: pintura gastada, sellos de baño amarillos, alfombra usada. En la plataforma vas a Mis propiedades → abre la propiedad → Liquidación de garantía: escribes un descuento por cada cosa, con su monto, y ella calcula sola el saldo a devolver. Después generas el documento: lo puedes ver y guardar en PDF, descargar en Word para editarlo, mandarlo por WhatsApp o copiar el texto. Conviene que ambas partes lo firmen y que la devolución se haga por transferencia una vez entregada la propiedad. Si los descuentos superan la garantía, el saldo sale negativo: esa diferencia queda como deuda del arrendatario."},

    {q:"¿Qué significa la comisión de administración y qué porcentaje pongo?", a:"Es tu pago por administrar la propiedad: cobrar el arriendo, atender al arrendatario, coordinar reparaciones, llevar las cuentas. Se calcula como un porcentaje del arriendo efectivamente cobrado, no del arriendo pactado: si el arrendatario no paga, no hay comisión ese mes. Ejemplo: arriendo cobrado $600.000 con una comisión del 8% = $48.000. En Chile lo habitual está entre 5% y 10%; los departamentos de arriendo residencial suelen ir cerca del 8%, y a mayor cantidad de propiedades del mismo dueño se suele bajar el porcentaje. Importante: si las propiedades son tuyas y tú mismo las administras, no te cobras comisión a ti mismo — deja el campo en 0 y la columna queda en cero."},

const asExplicar=(termino)=>{
  const q=String(termino||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  if(!q) return { encontrado:false };
  const palabras=q.split(/[^a-z0-9]+/).filter(w=>w.length>2);
  let mejor=null, mejorN=0;
  GLOSARIO.forEach(g=>{
    const base=(g.k+" "+g.t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    let n=0; palabras.forEach(w=>{ if(base.indexOf(w)>=0) n++; });
    if(base.indexOf(q)>=0) n+=3;
    if(n>mejorN){ mejorN=n; mejor=g; }
  });
  return mejor ? { encontrado:true, termino:mejor.t, explicacion:mejor.d }
               : { encontrado:false, nota:"No está en el glosario de la plataforma: explícalo tú con lo que sabes de Chile y avisa que es tu conocimiento general." };
};
