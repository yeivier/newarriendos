<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ArriendoPro — Administración de Propiedades</title>
<!-- PWA / instalación como aplicación en el celular -->
<meta name="theme-color" content="#101012" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="ArriendoPro" />
<meta name="application-name" content="ArriendoPro" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<!-- Sin fuentes de Google: la tipografía es la del sistema (San Francisco en
     iPhone/Mac vía -apple-system), así que no hay nada que descargar. -->
<style>
  :root{
    /* Blanco y negro puro, sobre grises de sistema iOS. Una sola tinta
       accionable (#101012): botón principal, pestaña activa, lo confirmado.
       Nada de acentos de color — lo que requiere atención se marca con
       contorno, chip sólido o punto, nunca un color extra. */
    --bg:#F2F2F7; --card:#FFFFFF; --panel2:#F2F2F7; --line:#E5E5EA; --line2:#E5E5EA;
    --text:#101012; --muted:rgba(16,16,18,.6); --faint:rgba(16,16,18,.4);
    --ink:#101012;
    --brand:#101012; --brand-d:#101012; --brand-bg:#E5E5EA; --brand-soft:rgba(16,16,18,.24);
    --gold:#101012;
    --green:#101012; --green-d:#101012; --green-bg:#E5E5EA; --green-soft:rgba(16,16,18,.24);
    --red:#101012; --red-d:#101012; --red-bg:#E5E5EA; --red-soft:rgba(16,16,18,.24);
    --amber:#101012; --amber-bg:#E5E5EA;
    --blue:#101012; /* alias: algunos "accent" quedaban sin definir antes de este cambio */
    /* Barra lateral: blanca, misma tinta */
    --side:#FFFFFF; --side-tx:#101012; --side-mut:rgba(16,16,18,.55);
    --shadow:0 1px 2px rgba(16,16,18,.05);
    --radius:14px;
    --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display',system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-head:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{font-family:var(--font);color:var(--text);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased;max-width:100%}
  #root{min-height:100vh;min-height:100dvh}
  img,svg,video{max-width:100%}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-thumb{background:rgba(16,16,18,.25);border-radius:6px;border:3px solid var(--bg)}
  a{color:inherit;text-decoration:none}

  /* Layout */
  .app{display:flex;min-height:100vh}
  /* 100dvh, no 100vh: en el celular 100vh incluye la zona que tapa la barra del
     navegador, así que el final del menú (Asistente, Preguntas frecuentes)
     quedaba fuera de la pantalla y no se podía tocar. */
  .sidebar{width:250px;background:var(--side);color:var(--side-tx);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;flex-shrink:0;border-right:1px solid var(--line)}
  .brand{padding:18px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
  /* El logo va sobre fondo negro (así viene el .png, con la montaña blanca).
     `object-fit:cover` corta lo justo si el contenedor es cuadrado, sin
     deformar la marca. */
  .brand-logo{width:42px;height:42px;border-radius:11px;background:#000;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
  .brand-logo img{width:100%;height:100%;object-fit:cover;display:block}
  .brand h1{font-size:18px;font-weight:800;color:var(--ink);letter-spacing:-.2px}
  .brand p{font-size:12.5px;color:var(--muted)}
  .drawer-x{display:none;background:transparent;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px;margin-left:auto}
  .nav{padding:11px 9px;flex:1;overflow:auto;display:flex;flex-direction:column;gap:3px}
  .nav-group{font-family:var(--font-mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--side-mut);padding:14px 11px 5px}
  .nav-group:first-child{padding-top:3px}
  .nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:9px;cursor:pointer;font-size:14.5px;font-weight:600;color:var(--side-tx);transition:.12s}
  .nav-item .ico{font-size:18px;width:24px;text-align:center;flex-shrink:0;opacity:.95}
  .nav-item:hover{background:var(--panel2);color:var(--ink)}
  .nav-item.on{background:var(--brand-bg);color:var(--ink);font-weight:800;box-shadow:inset 3px 0 0 var(--ink)}
  .nav-foot{border-top:1px solid var(--line);padding:13px;display:flex;align-items:center;gap:10px}
  .nav-foot .av{width:37px;height:37px;border-radius:10px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
  .nav-overlay{position:fixed;inset:0;background:rgba(16,16,18,.5);z-index:55}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{background:var(--card);border-bottom:1px solid var(--line);padding:13px 26px;position:sticky;top:0;z-index:20}
  .menu-btn{display:none;background:var(--card);border:2px solid var(--line);border-radius:10px;width:44px;height:44px;font-size:20px;cursor:pointer;color:var(--ink);align-items:center;justify-content:center;flex-shrink:0}
  .topbar h2{font-family:var(--font-head);font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-.3px}
  .topbar .desc{font-size:13.5px;color:var(--muted);margin-top:2px;max-width:760px;line-height:1.45}
  .topbar-row{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
  .content{padding:20px 26px;display:flex;flex-direction:column;gap:14px;max-width:1240px;margin:0 auto;width:100%}

  /* Tarjetas */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pad{padding:18px}
  .grid{display:grid;gap:14px}
  .sec-title{font-family:var(--font-head);font-size:17.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:9px;margin-bottom:4px}
  .sub-title{font-family:var(--font-mono);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#fff;background:var(--ink);padding:8px 13px;border-radius:8px;display:inline-flex;align-items:center;gap:8px;margin:16px 0 11px}
  .sub-title.green{background:var(--ink);color:#fff}
  .sub-title.dark{background:var(--ink);color:#fff}
  .help{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:12px 15px;font-size:14px;color:var(--muted);line-height:1.6}
  .help.g{border:1px solid var(--ink)}

  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:17px;border-top:1px solid var(--line);box-shadow:var(--shadow)}
  .stat .lab{font-family:var(--font-mono);font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:7px}
  .stat .val{font-family:var(--font-head);font-size:26px;font-weight:700;color:var(--ink);margin:6px 0 2px;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
  .stat .sub{font-size:12.5px;font-weight:600;color:var(--muted)}

  /* Los estados no se distinguen por matiz: relleno negro sólido = requiere
     atención / decisión tomada que urge ver; contorno negro = confirmado /
     positivo; gris liso = neutro. La palabra dentro del chip hace el resto. */
  .pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:30px;font-family:var(--font-mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  .pill.green{background:#fff;color:var(--text);border:1px solid var(--text)}
  .pill.red{background:var(--text);color:#fff;border:1px solid var(--text)}
  .pill.amber{background:var(--text);color:#fff;border:1px solid var(--text)}
  .pill.grey{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
  .pill.blue{background:var(--panel2);color:var(--text);border:1px solid var(--line)}

  .btn{cursor:pointer;border:none;border-radius:10px;font-family:inherit;font-weight:700;font-size:14.5px;padding:10px 16px;transition:.12s;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:43px}
  .btn:hover{filter:brightness(.96)}
  .btn:active{transform:translateY(1px)}
  .btn-red{background:var(--ink);color:#fff}
  .btn-red:hover{background:#2C2C2E;filter:none}
  .btn-green{background:var(--ink);color:#fff}
  .btn-green:hover{background:#2C2C2E;filter:none}
  .btn-out{background:var(--card);border:1px solid var(--line);color:var(--text)}
  .btn-out:hover{border-color:var(--text);filter:none;background:var(--panel2)}
  .btn-ghost{background:transparent;color:var(--text);font-weight:800;padding:7px 6px;min-height:0}
  .btn-sm{padding:8px 13px;font-size:13.5px;border-radius:8px;min-height:0}
  .btn-danger{background:var(--card);color:var(--text);border:1px solid var(--text)}
  .btn-danger:hover{background:var(--panel2);filter:none}

  .field{display:flex;flex-direction:column;gap:6px}
  .label{font-size:13px;font-weight:700;color:var(--text)}
  .input,select,textarea{width:100%;font-family:inherit;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;outline:none;transition:.12s;min-height:43px}
  .input:focus,select:focus,textarea:focus{border-color:var(--text);box-shadow:0 0 0 3px var(--panel2)}
  textarea{resize:vertical;min-height:106px;line-height:1.55}
  .check{display:flex;align-items:center;gap:11px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;font-weight:600;font-size:14.5px}
  .check input{width:20px;height:20px;accent-color:var(--text)}

  .databox{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .databox .dl{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
  .databox .dv{font-size:15.5px;font-weight:700;color:var(--ink);word-break:break-word}
  .databox.big .dv{font-size:20px}

  .prop{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:13px;cursor:pointer;background:var(--card);transition:.12s;flex-wrap:wrap}
  .prop:hover{border-color:var(--text);background:var(--panel2);box-shadow:var(--shadow)}
  /* La propiedad abierta se nota: contorno y barra negra al costado, además
     de la flecha girada — nunca un color. */
  .prop.on{border-color:var(--ink);background:var(--brand-bg);box-shadow:inset 4px 0 0 var(--ink),var(--shadow)}
  .prop .chev-prop{margin-left:auto;flex-shrink:0;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:13px;transition:transform .18s,background .12s}
  .prop.on .chev-prop{transform:rotate(180deg);background:var(--ink);color:#fff;border-color:var(--ink)}
  /* El detalle desplegado se ve enganchado a su propiedad. */
  .prop-abierta{border-left:4px solid var(--ink);border-radius:0 12px 12px 0;margin-left:6px}
  .dot{width:13px;height:13px;border-radius:50%;flex-shrink:0}

  table{width:100%;border-collapse:collapse}
  th{text-align:left;padding:11px 11px;font-family:var(--font-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid var(--line);font-weight:700}
  td{padding:12px 11px;font-size:14.5px;border-bottom:1px solid var(--line2)}
  tr:last-child td{border-bottom:none}

  .bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
  .bar>div{height:100%;border-radius:6px;transition:width .6s;background:var(--ink)}

  /* Secciones desplegables (tarjetas que se abren) */
  .collapse{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
  .collapse + .collapse{margin-top:12px}
  .collapse>.chead{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 18px;background:var(--card);border:none;cursor:pointer;font-family:inherit}
  .collapse>.chead:hover{background:var(--panel2)}
  .collapse>.chead .cico{font-size:20px;width:30px;text-align:center;flex-shrink:0}
  .collapse>.chead .ctxt{flex:1;min-width:0}
  .collapse>.chead .ctitle{display:block;font-family:var(--font-head);font-size:16.5px;font-weight:700;color:var(--ink);line-height:1.25}
  .collapse>.chead .csub{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
  .collapse>.chead .chev{margin-left:auto;font-size:13px;color:var(--text);background:var(--panel2);width:29px;height:29px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:.18s;flex-shrink:0}
  .collapse.open>.chead .chev{transform:rotate(180deg);background:var(--ink);color:#fff}
  .collapse>.cbody{padding:2px 18px 18px;border-top:1px solid var(--line2)}
  .collapse.flush>.cbody{padding-left:0;padding-right:0}

  .modal-bg{position:fixed;inset:0;background:rgba(16,16,18,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:200;padding:18px}
  .modal{background:var(--card);border-radius:16px;width:640px;max-width:97vw;max-height:92vh;overflow:auto;box-shadow:0 24px 70px rgba(16,16,18,.3)}
  .modal-head{padding:20px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
  /* Flecha para volver: una sola, flotante, sirve para cualquier ventana que
     esté abierta. En el teléfono el botón "Cancelar" queda al final de un
     formulario largo y no se alcanza. */
  .volver-flot{position:fixed;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));z-index:260;display:inline-flex;align-items:center;gap:7px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 15px;font-weight:800;font-size:14.5px;cursor:pointer;box-shadow:0 8px 26px rgba(16,16,18,.24)}
  .volver-flot:hover{border-color:var(--text)}
  /* Flecha de la barra superior, para devolverse entre secciones. */
  .volver-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:17px;font-weight:800;padding:0}
  .volver-btn:hover{border-color:var(--text);background:var(--panel2)}
  /* Aviso de guardado automático. */
  .guardado{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:5px 11px;white-space:nowrap}
  .guardado.ok{color:var(--text);border-color:var(--text);background:#fff}
  .guardado.mal{color:#fff;border-color:var(--text);background:var(--text)}
  .modal-head h3{font-family:var(--font-head);font-size:20px;font-weight:700;color:var(--ink)}
  .modal-head p{font-size:13.5px;color:var(--muted);margin-top:3px}
  .modal-body{padding:20px 24px}
  .modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:11px;position:sticky;bottom:0;background:var(--card)}
  .cmdk-card{background:var(--card);border-radius:16px;width:680px;max-width:96vw;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 26px 80px rgba(16,16,18,.4)}
  .cmdk-top{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .cmdk-top input{flex:1;border:none;outline:none;font-size:16px;background:transparent;color:var(--ink)}
  .cmdk-list{overflow:auto;padding:6px 6px 8px}
  .cmdk-grp{font-family:var(--font-mono);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:11px 12px 4px}
  .cmdk-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;cursor:pointer}
  .cmdk-item .ic{font-size:18px;width:24px;text-align:center;flex-shrink:0}
  .cmdk-item .tt{font-weight:650;font-size:14.5px;color:var(--ink);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cmdk-item .sb{font-size:12.5px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cmdk-item.on,.cmdk-item:hover{background:var(--panel2)}
  .cmdk-empty{padding:28px 16px;text-align:center;color:var(--muted)}
  .cmdk-foot{border-top:1px solid var(--line);padding:9px 14px;font-size:12px;color:var(--faint);display:flex;gap:16px;flex-wrap:wrap}
  .kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;font-family:var(--font-mono);font-size:11px;color:var(--muted);background:var(--panel2);font-weight:700;line-height:18px}
  .btn-busca{display:inline-flex;align-items:center;gap:7px;color:var(--muted)}
  /* CRM */
  .btn-xs{padding:3px 8px;font-size:12px;border-radius:8px;line-height:1.1}
  .crm-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  .crm-tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--muted)}
  .crm-tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .crm-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:12px;align-items:start}
  .crm-col{background:var(--panel2);border-radius:12px;padding:10px;min-height:70px}
  .crm-col h4{font-size:12.5px;font-weight:800;margin:0 0 8px;display:flex;align-items:center;justify-content:space-between}
  .crm-col h4 .n{background:var(--card);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted)}
  .crm-card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:10px;padding:9px 11px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 3px rgba(16,16,18,.04)}
  .crm-card .nm{font-weight:700;font-size:14px}
  .crm-card .mt{font-size:12px;color:var(--muted);margin-top:2px}
  .crm-chip{display:inline-block;font-family:var(--font-mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:999px;padding:1px 7px;background:var(--panel2);color:var(--text);margin-top:4px}
  .crm-mini{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .crm-bar{height:9px;border-radius:6px;background:var(--line);overflow:hidden}
  .crm-bar>span{display:block;height:100%;background:var(--ink)}
  .crm-time{border-left:2px solid var(--line);padding-left:12px;margin-left:4px}
  .crm-time .it{position:relative;margin-bottom:10px}
  .crm-time .it::before{content:"";position:absolute;left:-17px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--ink)}

  .notif{position:fixed;top:20px;right:20px;z-index:400;background:var(--ink);border:1px solid var(--ink);border-left:5px solid var(--ink);border-radius:11px;padding:14px 18px;font-size:14.5px;font-weight:700;box-shadow:0 12px 40px rgba(16,16,18,.18);max-width:380px;color:#fff}
  .notif.err{background:#fff;color:var(--text);border-color:var(--ink)}

  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px;flex-wrap:wrap}
  .seg button{border:none;background:transparent;font-family:inherit;font-size:14px;font-weight:700;padding:9px 15px;border-radius:8px;cursor:pointer;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(16,16,18,.12)}

  .integ{display:flex;gap:15px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--radius);padding:18px;background:var(--card)}
  .integ .lg{width:54px;height:54px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;font-weight:800;color:#fff}
  .feat{display:flex;gap:9px;align-items:flex-start;font-size:14px;color:var(--text);padding:5px 0}
  .feat .ck{color:var(--text);font-weight:800;flex-shrink:0}

  .chat-msg{padding:13px 16px;border-radius:13px;max-width:84%;font-size:14.5px;line-height:1.6;white-space:pre-wrap}

  /* Asistente de contrato */
  .stepper{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:20px}
  .step{display:flex;align-items:center;gap:9px;flex:1;min-width:148px}
  .step .num{width:30px;height:30px;border-radius:50%;background:#C7C7CC;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
  .step.on .num{background:var(--ink)}
  .step.done .num{background:#fff;border:2px solid var(--ink);color:var(--ink)}
  .step .tl{font-size:13.5px;font-weight:700;color:var(--muted)}
  .step.on .tl,.step.done .tl{color:var(--ink)}
  .step .ln{flex:1;height:2px;background:var(--line);min-width:18px}
  .contact-card{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:13px;padding:15px;cursor:pointer;background:var(--card)}
  .contact-card:hover{border-color:var(--ink)}
  .contact-card.on{border-color:var(--ink);background:var(--brand-bg)}
  .summary{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:18px}
  .summary .row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line2);font-size:14.5px}
  .summary .row:last-child{border-bottom:none}
  .rg{display:flex;gap:9px;flex-wrap:wrap}
  .rg label{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:11px 16px;font-size:14.5px}
  .rg label.on{border-color:var(--ink);background:var(--brand-bg)}

  /* Acciones rápidas en Inicio */
  .qa-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
  .qa{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:13px;padding:15px 17px;background:var(--card);cursor:pointer;transition:.12s;text-align:left;font-family:inherit;box-shadow:var(--shadow)}
  .qa:hover{border-color:var(--ink);background:var(--panel2);transform:translateY(-1px)}
  .qa .qico{width:46px;height:46px;border-radius:12px;background:var(--panel2);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0}
  .qa .qt{font-size:15.5px;font-weight:800;color:var(--ink)}
  .qa .qd{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:1px}

  /* ============ RESPONSIVO: tablet / celular (≤900px) ============ */
  @media(max-width:900px){
    .sidebar{position:fixed;left:0;top:0;height:100vh;height:100dvh;width:284px;transform:translateX(-100%);transition:transform .25s ease;z-index:60;box-shadow:0 0 50px rgba(0,0,0,.45);display:flex}
    /* El pie del menú (usuario y salir) no debe comerse el espacio de scroll. */
    .sidebar .nav{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:14px}
    .sidebar .nav-foot{flex-shrink:0;padding-bottom:calc(13px + env(safe-area-inset-bottom,0px))}
    .sidebar.open{transform:translateX(0)}
    .drawer-x{display:inline-flex}
    .menu-btn{display:inline-flex}
    .content{padding:14px 12px;gap:12px}
    .topbar{padding:11px 13px}
    .topbar h2{font-size:18px}
    .topbar .desc{font-size:12.5px}
    .topbar-row{gap:9px}
    /* Muchas tarjetas fijan gridTemplateColumns en línea (4 y 3 columnas, o
       anchos en píxeles). En tablet las bajamos a 2 columnas; el !important es
       necesario para ganarle al estilo en línea, y minmax(0,...) permite que
       las columnas se encojan en vez de desbordarse y cortar el contenido. */
    .grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
    .grid>*{min-width:0}
    .pad{padding:15px}
    .stat{padding:14px}
    .stat .val{font-size:22px;margin:5px 0 2px}
    .stat .lab{font-size:12px}
    .sec-title{font-size:15.5px}
    .sub-title{font-size:12.5px;padding:7px 11px;margin:13px 0 10px}
    .help{font-size:13.5px;padding:11px 13px}
    .btn{font-size:14px;padding:10px 15px;gap:7px;min-height:43px}
    .btn-sm{font-size:13px;padding:8px 12px;min-height:0}
    .pill{font-size:11.5px;padding:4px 10px}
    .databox{padding:11px 12px}
    .databox .dv{font-size:14.5px}
    .databox.big .dv{font-size:18px}
    .collapse>.chead{padding:14px 14px;gap:11px}
    .collapse>.chead .cico{font-size:19px;width:27px}
    .collapse>.chead .ctitle{font-size:15.5px}
    .collapse>.cbody{padding:2px 14px 15px}
    .modal-head,.modal-body,.modal-foot{padding-left:17px;padding-right:17px}
    .modal-head{padding-top:16px;padding-bottom:13px}
    .modal-head h3{font-size:18px}
    .modal-body{padding-top:14px;padding-bottom:14px}
    .modal-foot{padding-top:13px;padding-bottom:13px;gap:8px}
    th{padding:9px 8px;font-size:11px}
    td{padding:10px 8px;font-size:14px}
    .prop{padding:13px 14px;gap:11px}
    .integ{padding:15px;gap:12px}
    .integ .lg{width:48px;height:48px;font-size:23px;border-radius:12px}
    .field{gap:5px}
    .label{font-size:13px}
    .input,select,textarea{font-size:16px;padding:10px 12px;min-height:44px}
    .qa{padding:14px}
    .qa .qico{width:42px;height:42px;font-size:21px}
    iframe{height:200px !important}
  }

  /* ============ RESPONSIVO: celular (≤560px) ============ */
  @media(max-width:560px){
    body{font-size:15px}
    /* En el celular todo va en una sola columna para que nada quede cortado. */
    .grid{grid-template-columns:minmax(0,1fr) !important}
    .content{padding:11px 10px;gap:11px}
    .topbar{padding:10px 12px}
    .topbar h2{font-size:17px}
    .topbar .desc{display:none}
    .card{border-radius:13px}
    .pad{padding:14px}
    .stat{padding:14px;border-top-width:4px}
    .stat .val{font-size:21px}
    .sec-title{font-size:15px}
    .sub-title{font-size:12px;padding:6px 10px}
    .btn{font-size:14px;padding:10px 14px;min-height:43px}
    .btn-sm{font-size:13px;padding:8px 12px;min-height:0}
    .modal{border-radius:15px}
    .modal-head h3{font-size:17px}
    .collapse>.chead{padding:13px 13px;gap:10px}
    .collapse>.chead .cico{font-size:18px;width:25px}
    .collapse>.chead .ctitle{font-size:14.5px}
    .collapse>.chead .csub{font-size:12.5px}
    .collapse>.chead .chev{width:27px;height:27px}
    .collapse>.cbody{padding:2px 13px 14px}
    .prop{padding:12px 13px;gap:10px;border-radius:12px}
    .dot{width:12px;height:12px}
    table{font-size:13.5px}
    .bar{height:9px}
    .stepper{gap:4px}
    .step{min-width:0}
    .step .tl{display:none}
    .qa-grid{grid-template-columns:1fr}
  }

  /* ============ Instalada como app (PWA) + notch / áreas seguras ============ */
  @supports (padding:max(0px)){
    @media(max-width:900px){
      .topbar{padding-left:max(13px,env(safe-area-inset-left));padding-right:max(13px,env(safe-area-inset-right));padding-top:max(11px,env(safe-area-inset-top))}
      .content{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));padding-bottom:max(16px,env(safe-area-inset-bottom))}
      .indbar{padding-left:max(13px,env(safe-area-inset-left));padding-right:max(13px,env(safe-area-inset-right))}
      .sidebar{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
    }
  }
  /* En modo aplicación (standalone) evitamos el resaltado azul al tocar y el rebote horizontal */
  @media all and (display-mode:standalone){
    body{overscroll-behavior-x:none}
    a,button,.nav-item,.qa,.collapse>.chead{-webkit-tap-highlight-color:transparent}
  }

  /* ---- Indicadores en vivo ---- */
  .indbar{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:9px 26px;background:var(--card);border-bottom:1px solid var(--line)}
  .indbar .pill{white-space:nowrap;cursor:default;font-size:11px;padding:5px 11px;background:var(--panel2);color:var(--muted);border-color:var(--line)}
  /* De dónde sale cada indicador y a qué hora se actualizó. */
  /* Ojo: bloque normal, NO flex. Con flex, cada <b> y cada <a> se convertía en
     una columna y el texto salía apilado, cortado y sin poder desplazarse. */
  .indfuente{padding:2px 26px 9px;background:var(--card);border-bottom:1px solid var(--line);font-size:11.5px;line-height:1.5;color:var(--faint)}
  .indfuente a{color:var(--muted);text-decoration:underline}
  .indfuente b{color:var(--muted);font-weight:700}
  .indfuente .viva{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink);margin-right:6px;vertical-align:middle;animation:latido 2s ease-in-out infinite}
  @keyframes latido{0%,100%{opacity:1}50%{opacity:.25}}
  @media(max-width:900px){ .indfuente{padding:2px 16px 8px} }
  /* El botón de actualizar tiene que decir en qué va: girando mientras trabaja
     y con un visto por unos segundos al terminar. */
  .ind-btn{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:700}
  .ind-btn.cargando{color:var(--ink);border-color:var(--text)}
  .ind-spin{display:inline-block;width:11px;height:11px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;vertical-align:-1px;animation:girar .7s linear infinite}
  @keyframes girar{to{transform:rotate(360deg)}}
  .indbar .pill.editable{cursor:pointer}
  @media(max-width:900px){ .indbar{padding:8px 13px;gap:6px} .indbar .pill{font-size:10.5px;padding:4px 10px} }

  /* ---- Plantillas de comunicación ---- */
  .tpl-list{display:flex;flex-direction:column;gap:6px}
  .tpl-item{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px 13px;cursor:pointer;background:var(--card);text-align:left}
  .tpl-item:hover{border-color:var(--text)}
  .tpl-item.on{border-color:var(--ink);background:var(--brand-bg)}
  .tpl-item .ic{width:34px;height:34px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
  .tpl-item.on .ic{background:var(--ink);color:#fff}
  /* Explicaciones en palabras simples (liquidaciones, glosario). */
  .expl-lista{display:flex;flex-direction:column;gap:10px}
  .expl-lista>div{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:11px;padding:11px 14px;font-size:14.5px;line-height:1.55;color:var(--ink)}
  .ico-elige{display:flex;flex-wrap:wrap;gap:6px}
  .ico-op{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .ico-op:hover{border-color:var(--text)}
  .ico-op.on{border-color:var(--ink);background:var(--brand-bg);box-shadow:0 0 0 2px var(--brand-soft)}
  .seg-chan{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:4px;gap:4px}
  .seg-chan button{border:none;background:transparent;font-family:inherit;font-size:14px;font-weight:700;padding:8px 15px;border-radius:8px;cursor:pointer;color:var(--muted)}
  .seg-chan button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(16,16,18,.12)}
  .mail-prev{border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(16,16,18,.10);background:var(--card)}
  .mail-prev .hd{background:linear-gradient(135deg,#152A44,#1F3A5C);color:#fff;padding:18px 20px;display:flex;align-items:center;gap:12px}
  .mail-prev .hd .lg{background:var(--card);color:#152A44;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
  .mail-prev .hd .bn{font-weight:800;font-size:17px;line-height:1.1}
  .mail-prev .hd .tg{opacity:.85;font-size:12px;margin-top:2px}
  .mail-prev .meta{padding:12px 20px;border-bottom:1px solid var(--line2);background:var(--panel2);font-size:13.5px;color:var(--muted)}
  .mail-prev .bd{padding:22px 22px 6px;font-size:15px;line-height:1.75;color:#3A3D44;white-space:pre-wrap}
  .mail-prev .ft{padding:14px 22px 20px;font-size:12px;color:var(--faint);border-top:1px solid var(--line2);margin-top:10px;display:flex;align-items:center;gap:8px}
  .mail-prev .ft .dot{width:6px;height:6px;border-radius:50%;background:#1F3A5C;display:inline-block}
  .wa-wrap{border-radius:16px;padding:22px 16px;background:#ECE5DD;background-image:radial-gradient(rgba(0,0,0,.025) 1px,transparent 1px);background-size:18px 18px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
  .wa-bubble{max-width:90%;margin-left:auto;border-radius:14px 14px 4px 14px;padding:12px 14px;background:#dcf8c6;font-size:14.5px;white-space:pre-wrap;line-height:1.55;box-shadow:0 2px 6px rgba(0,0,0,.12);position:relative}
  .sms-wrap{border-radius:16px;padding:18px;background:var(--panel2)}
  .sms-bubble{max-width:80%;border-radius:18px 18px 18px 5px;padding:12px 14px;background:var(--card);border:1px solid var(--line);font-size:14.5px;white-space:pre-wrap;line-height:1.55;box-shadow:0 2px 6px rgba(0,0,0,.06)}
  .ib-card{border:1px solid var(--line);border-radius:13px;padding:14px 16px;background:var(--card)}
  .ib-card.on{border-color:var(--brand)}

  /* Fotos, portada, galería y recorrido 360° */
  .media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:4px}
  .media-thumb{position:relative;aspect-ratio:4/3;border-radius:12px;background:var(--line) center/cover no-repeat;border:1px solid var(--line);overflow:hidden}
  .media-thumb.cover{border:3px solid var(--ink);grid-column:span 2}
  .cover-tag{position:absolute;top:7px;left:7px;background:var(--ink);color:#fff;font-family:var(--font-mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:20px}
  .media-acts{position:absolute;bottom:6px;right:6px;display:flex;gap:5px;opacity:0;transition:.15s}
  .media-thumb:hover .media-acts{opacity:1}
  .media-acts button{border:none;background:rgba(16,16,18,.82);color:#fff;border-radius:8px;width:31px;height:31px;cursor:pointer;font-size:14px}
  .cover-thumb{width:62px;height:62px;border-radius:12px;background:var(--line) center/cover no-repeat;flex-shrink:0;border:1px solid var(--line)}
  .hero-cover{position:relative;border-radius:var(--radius);overflow:hidden;height:280px;background:var(--ink) center/cover no-repeat;margin-bottom:12px;display:flex;align-items:flex-end}
  .hero-cover::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(16,16,18,.55),transparent 55%)}
  .hero-cover .badge{position:absolute;top:12px;left:12px;background:var(--ink);color:#fff;font-family:var(--font-mono);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:5px 11px;border-radius:20px;z-index:2}
  .hero-cover .count{position:absolute;top:12px;right:12px;background:rgba(16,16,18,.7);color:#fff;font-size:12px;font-weight:700;padding:5px 11px;border-radius:20px;z-index:2}
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
  .gal .g{aspect-ratio:4/3;border-radius:10px;background:var(--line) center/cover no-repeat;cursor:pointer;border:none;transition:.15s}
  .gal .g:hover{filter:brightness(1.06);transform:scale(1.02)}
  .lbx{position:fixed;inset:0;background:rgba(16,16,18,.93);display:flex;align-items:center;justify-content:center;z-index:300;flex-direction:column}
  .lbx img{max-width:92vw;max-height:80vh;border-radius:10px}
  .lbx .x{position:absolute;top:16px;right:22px;color:#fff;font-size:36px;cursor:pointer}
  .lbx .arr{position:fixed;top:0;bottom:0;width:42%;cursor:pointer}
  .lbx .arr.l{left:0}.lbx .arr.r{right:0}
  .pano-box{width:100%;height:60vh;min-height:360px;border-radius:14px;overflow:hidden;background:var(--ink)}
  .pano-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .pano-tabs button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}
  .pano-tabs button.on{border-color:var(--ink);color:#fff;background:var(--ink)}

  @media(max-width:560px){
    .tpl-item{padding:10px 11px}
    .tpl-item .ic{width:30px;height:30px;font-size:15px}
    .mail-prev .bd{padding:15px}
    .wa-wrap,.sms-wrap{padding:14px}
    .media-thumb.cover{grid-column:span 1}
  }

  .gs-top{width:40px;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--ink);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(16,16,18,.35);flex-shrink:0;padding:0}
  .gs-top:hover{background:#2C2C2E;}
  @media(max-width:760px){.gs-top{width:38px;height:38px;}}
  #gSearchOv{position:fixed;inset:0;z-index:1000;background:rgba(16,16,18,.55);backdrop-filter:blur(3px);display:none;justify-content:center;align-items:flex-start;padding:50px 12px 20px;}
  #gSearchOv.on{display:flex;}
  .gs-box{width:100%;max-width:620px;background:var(--card);border-radius:14px;box-shadow:0 20px 50px rgba(16,16,18,.3);overflow:hidden;display:flex;flex-direction:column;max-height:80vh;font-family:var(--font);}
  .gs-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);}
  .gs-head input{flex:1;border:none;outline:none;font-size:16px;background:transparent;font-family:inherit;color:var(--text);}
  .gs-esc{border:1px solid var(--line);border-radius:6px;padding:3px 7px;font-family:var(--font-mono);font-size:10px;color:var(--muted);font-weight:600;cursor:pointer;}
  .gs-res{overflow-y:auto;padding:6px;}
  .gs-note{padding:20px 14px;text-align:center;color:var(--muted);font-size:12.5px;}
  .gs-item{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-radius:8px;}
  .gs-item:hover{background:var(--panel2);}
  .gs-lbl{font-size:13px;font-weight:600;color:var(--text);}
  .gs-sec{font-size:11px;color:var(--muted);}
  .gs-val{font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .gs-fuzzy{padding:6px 12px;font-size:11.5px;color:var(--text);font-weight:600;}

  /* ====== Acceso, equipo, portal del arrendatario y lector IA ====== */
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:22px}
  .auth-card{width:100%;max-width:450px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 26px}
  .auth-logo{width:54px;height:54px;border-radius:14px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:25px;font-family:var(--font-head);margin-bottom:14px}
  .auth-card h1{font-family:var(--font-head);font-size:24px;color:var(--ink);margin-bottom:5px}
  .auth-card .sub{color:var(--muted);font-size:14px;margin-bottom:18px;line-height:1.55}
  .auth-tabs{display:flex;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:4px;margin-bottom:18px}
  .auth-tabs button{flex:1;border:none;background:transparent;color:var(--muted);font-weight:700;font-size:14px;padding:9px;border-radius:8px;cursor:pointer;font-family:inherit}
  .auth-tabs button.on{background:var(--ink);color:#fff}
  .auth-err{background:var(--panel2);border:1px solid var(--ink);color:var(--text);border-radius:9px;padding:10px 13px;font-size:13.5px;margin-bottom:12px;line-height:1.5}
  .auth-info{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px 13px;font-size:13.5px;margin-bottom:12px;line-height:1.55}
  .clave-req{display:flex;flex-direction:column;gap:5px;margin:10px 0 14px;font-size:13px}
  .clave-req span{display:flex;align-items:center;gap:8px;color:var(--faint)}
  .clave-req span.ok{color:var(--text)}
  .cod-input{letter-spacing:9px;text-align:center;font-size:22px;font-weight:800}
  .rol-pill{display:inline-flex;font-family:var(--font-mono);padding:3px 10px;border-radius:30px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
  .rol-propietario{background:var(--ink);color:#fff}
  .rol-colaborador{background:#fff;border:1px solid var(--ink);color:var(--ink)}
  .rol-invitado{background:var(--panel2);color:var(--muted)}
  .rol-arrendatario{background:var(--panel2);color:var(--text)}
  .portal{min-height:100vh;background:var(--bg);color:var(--text)}
  .portal-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
  .portal-main{max-width:780px;margin:0 auto;padding:20px 16px 70px;display:flex;flex-direction:column;gap:14px;width:100%}
  .portal-monto{font-family:var(--font-head);font-size:38px;color:var(--ink);line-height:1.15;font-variant-numeric:tabular-nums}
  .readonly-note{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--text);color:var(--text);border-radius:9px;padding:9px 14px;font-size:13.5px;margin:10px 26px 0}
  .menu-btn svg{display:block}
  .ai-doc-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:var(--panel2)}
  .eq-user{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:13px 15px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}

  .app.solo-lectura .btn-red,.app.solo-lectura .btn-danger{display:none!important}

  /* ===== Chatbot IA flotante ===== */
  /* Se puede arrastrar con el dedo a cualquier parte de la pantalla, así que
     nunca queda tapando otro botón. `touch-action:none` es lo que permite
     moverlo sin que la página se desplace debajo. */
  .ai-fab{position:fixed;right:22px;bottom:22px;z-index:180;width:60px;height:60px;border:none;border-radius:19px;background:var(--ink);color:#fff;box-shadow:0 16px 40px rgba(16,16,18,.28);cursor:grab;font-size:27px;display:flex;align-items:center;justify-content:center;transition:.18s;touch-action:none;user-select:none;-webkit-user-select:none}
  .ai-fab:hover{transform:translateY(-2px) scale(1.02)}
  .ai-fab.moviendo{cursor:grabbing;transform:scale(1.12);box-shadow:0 22px 52px rgba(16,16,18,.42);transition:transform .1s}
  .ai-fab .ai-dot{position:absolute;right:5px;top:5px;width:12px;height:12px;border:2px solid #fff;border-radius:50%;background:#fff}

  /* Botón para volver al inicio de la página sin arrastrar con el dedo. */
  /* Alertas: la urgencia se lee por el peso de la línea, no por el color —
     sólida y gruesa = alta, discontinua = media, gris = baja. */
  .alerta{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;border-radius:12px;background:var(--panel2);border-left:5px solid var(--line)}
  .alerta.alta{border-left:5px solid var(--text)}
  .alerta.media{border-left:5px dashed var(--text)}
  .alerta.baja{border-left:5px solid var(--line)}
  .alerta .al-ico{font-size:19px;line-height:1.2;flex-shrink:0}
  .alerta .al-t{font-weight:800;font-size:14.5px;color:var(--ink)}
  .alerta .al-d{font-size:13.5px;color:var(--muted);margin-top:2px;line-height:1.45}

  /* Pantalla de la clave */
  .puerta{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
  .puerta-caja{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);text-align:center}
  .puerta-caja h2{font-family:var(--font-head);font-size:23px;font-weight:800;color:var(--ink);margin-bottom:6px}
  .puerta-caja p{font-size:14.5px;color:var(--muted);line-height:1.5;margin-bottom:18px}
  .puerta-caja .brand-logo{margin-left:auto;margin-right:auto}
  .puerta-err{margin-top:10px;font-size:13.5px;font-weight:700;color:#fff;background:var(--ink);border-radius:9px;padding:9px 11px}
  .puerta-nota{margin-top:14px;font-size:12.5px;color:var(--faint);line-height:1.5}

  .subir-fab{position:fixed;left:22px;bottom:22px;z-index:178;width:52px;height:52px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);box-shadow:0 10px 28px rgba(16,16,18,.18);cursor:pointer;font-size:21px;display:flex;align-items:center;justify-content:center;transition:.18s}
  .subir-fab:hover{transform:translateY(-2px)}
  /* Fichas reordenables: se mantienen presionadas para moverlas. */
  .ord-wrap{position:relative;touch-action:pan-y}
  .ord-wrap.movible{outline:2px dashed var(--text);outline-offset:3px;border-radius:16px}
  /* Mientras se arrastra, la ficha se levanta y el hueco de destino se marca. */
  .ord-wrap.arrastrando{opacity:.92;transform:scale(1.03);box-shadow:0 18px 42px rgba(16,16,18,.26);border-radius:16px;position:relative;z-index:40;transition:transform .12s;touch-action:none;user-select:none;-webkit-user-select:none}
  .ord-wrap.hueco{outline:2px dashed var(--ink);outline-offset:3px;border-radius:16px;background:var(--brand-bg)}
  /* Asa visible: se arrastra desde cualquier parte, pero esto lo hace evidente
     y, al tocarla, abre el cuadro con las posiciones. */
  .ord-asa{position:absolute;right:6px;top:6px;z-index:3;width:26px;height:26px;border-radius:8px;background:var(--panel2);color:var(--faint);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:grab;opacity:.55}
  .ord-wrap:hover .ord-asa{opacity:1}
  /* Asa dentro de una fila de propiedad: va en línea, no encima del contenido. */
  .asa-fila{flex-shrink:0;width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--faint);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:grab;line-height:1}
  .asa-fila:active{cursor:grabbing}
  .prop.ord-wrap.arrastrando{border-color:var(--ink)}
  .ord-num{position:absolute;left:-9px;top:-9px;z-index:3;background:var(--ink);color:#fff;border-radius:9px;min-width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;box-shadow:0 3px 10px rgba(16,16,18,.2)}
  .mov-lista{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .mov-it{display:flex;align-items:center;gap:10px;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;text-align:left;font-size:14.5px;font-weight:600;color:var(--ink);width:100%}
  .mov-it.act{border-color:var(--ink);background:var(--brand-bg)}
  .mov-it .n{width:24px;height:24px;border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--muted);flex-shrink:0}
  .mov-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .ai-float{position:fixed;right:22px;bottom:94px;z-index:179;width:min(410px,calc(100vw - 24px));height:min(650px,calc(100vh - 125px));background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 80px rgba(16,16,18,.24);display:flex;flex-direction:column;overflow:hidden;transform-origin:bottom right;animation:aiPop .18s ease-out}
  @keyframes aiPop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
  .ai-float-head{padding:15px 16px;background:var(--card);color:var(--text);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
  .ai-avatar{width:40px;height:40px;border-radius:12px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;flex-shrink:0}
  .ai-float-head .title{font-weight:800;font-size:15.5px}.ai-float-head .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
  .ai-close{margin-left:auto;border:none;background:var(--panel2);color:var(--text);width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:18px}
  .ai-quick{display:flex;gap:7px;padding:10px 12px;border-bottom:1px solid var(--line2);overflow-x:auto;background:var(--panel2)}
  .ai-quick button{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 10px;font:700 11.5px var(--font);cursor:pointer;color:var(--muted)}
  .ai-quick button:hover{border-color:var(--text);color:var(--text)}
  .ai-messages{flex:1;overflow:auto;padding:15px 13px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
  /* Ningún mensaje debe encogerse: el chat scrollea, no comprime su contenido. */
  .ai-messages>*{flex-shrink:0}
  .ai-empty{margin:auto;text-align:center;padding:20px;color:var(--muted)}
  .ai-empty .big{font-size:34px;margin-bottom:7px}.ai-empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:5px}
  .ai-row{display:flex}.ai-row.user{justify-content:flex-end}
  .ai-bubble{max-width:88%;border-radius:15px;padding:10px 12px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .ai-row.user .ai-bubble{background:var(--ink);color:#fff;border-bottom-right-radius:5px}
  .ai-row.bot .ai-bubble{background:#fff;color:var(--text);border:1px solid var(--line2);border-bottom-left-radius:5px}
  .ai-compose{padding:11px;border-top:1px solid var(--line);background:var(--card)}
  .ai-compose-row{display:flex;align-items:flex-end;gap:7px}
  /* 16px es obligatorio: por debajo de eso iOS hace zoom automático al tocar el
     campo y deja toda la página ampliada, sin volver atrás sola. */
  .ai-compose textarea{min-height:44px;max-height:110px;resize:none;padding:10px 11px;font-size:16px}
  .ai-send{width:44px;height:44px;min-height:44px;padding:0;border-radius:12px;flex-shrink:0}
  /* Micrófono: se le habla al asesor y él ejecuta lo que se le pidió. */
  .ai-mic{width:44px;height:44px;min-height:44px;padding:0;border-radius:12px;flex-shrink:0;border:1px solid var(--line);background:var(--card);font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
  .ai-mic:hover{background:var(--panel2)}
  .ai-mic.on{background:var(--ink);color:#fff;border-color:var(--ink);animation:micLatido 1.1s ease-in-out infinite}
  @keyframes micLatido{0%,100%{box-shadow:0 0 0 0 rgba(16,16,18,.45)}50%{box-shadow:0 0 0 8px rgba(16,16,18,0)}}
  .ai-clip{width:40px;height:44px;display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;flex-shrink:0;border-radius:11px;background:var(--panel2);border:1px solid var(--line)}
  .ai-clip:hover{background:var(--brand-bg);border-color:var(--text)}
  .ai-adj{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
  .ai-disclaimer{font-size:10.5px;color:var(--faint);text-align:center;margin-top:6px}

  /* ---- Asesor inmobiliario: tarjetas, comparación y estados ---- */
  .ai-online{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink);margin-right:6px;vertical-align:middle}
  .ai-bubble.err{background:#fff;border:1px solid var(--ink);color:var(--text)}
  .ai-empty .ai-ejemplos{display:flex;flex-direction:column;gap:6px;margin-top:14px}
  .ai-empty .ai-ejemplos button{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 11px;font:600 12.5px var(--font);color:var(--muted);cursor:pointer;text-align:left;line-height:1.4}
  .ai-empty .ai-ejemplos button:hover{border-color:var(--text);color:var(--text);background:var(--panel2)}

  /* Tarjetas de propiedad: se desplazan en horizontal dentro del chat. */
  /* flex-shrink:0 es imprescindible. Al tener overflow, esta fila deja de
     respetar su altura mínima dentro del chat (que es un flex en columna) y se
     va aplastando a medida que crecen los mensajes, hasta que las tarjetas
     desaparecen. */
  .ai-cards{display:flex;gap:10px;overflow-x:auto;padding:2px 1px 6px;scroll-snap-type:x mandatory;flex-shrink:0}
  .pcard{flex:0 0 205px;scroll-snap-align:start;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);box-shadow:0 3px 12px rgba(16,16,18,.07);display:flex;flex-direction:column}
  .pcard-img{height:112px;background:var(--panel2) center/cover no-repeat;position:relative;display:flex;align-items:center;justify-content:center}
  .pcard-ph{font-size:34px;opacity:.35}
  .pcard-tag{position:absolute;left:8px;top:8px;font-family:var(--font-mono);font-size:10px;font-weight:700;text-transform:uppercase;padding:3px 8px;border-radius:20px;letter-spacing:.04em}
  .pcard-tag.ok{background:var(--ink);color:#fff;border:1px solid var(--ink)}
  .pcard-tag.busy{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
  .pcard-body{padding:11px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
  .pcard-price{font-size:16.5px;font-weight:800;color:var(--ink);line-height:1.2}
  .pcard-price small{font-size:11.5px;font-weight:600;color:var(--muted)}
  .pcard-name{font-size:12.5px;font-weight:700;color:var(--text);line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .pcard-loc{font-size:11.5px;color:var(--muted)}
  .pcard-specs{display:flex;flex-wrap:wrap;gap:7px;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:3px}
  .pcard-libre{font-size:11px;color:var(--text);font-weight:700;margin-top:2px}
  .pcard-gc{font-size:11px;color:var(--faint);font-weight:600}
  .pcard-btn{margin-top:9px;border:none;border-radius:9px;background:var(--ink);color:#fff;font:800 12.5px var(--font);padding:9px;cursor:pointer;width:100%}
  .pcard-btn:hover{background:#2C2C2E}

  .ai-compare{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--card)}
  .ai-compare table{width:100%;border-collapse:collapse;font-size:12px}
  .ai-compare th,.ai-compare td{padding:7px 9px;border-bottom:1px solid var(--line2);text-align:left}
  .ai-compare th{background:var(--panel2);font-size:11px;font-weight:800;color:var(--ink)}
  .ai-compare td:first-child{color:var(--muted);font-weight:700;white-space:nowrap}
  .ai-compare-btns{display:flex;gap:6px;padding:9px;flex-wrap:wrap}
  .ai-compare-btns button{flex:1;min-width:110px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px;font:700 11.5px var(--font);cursor:pointer;color:var(--ink)}
  .ai-compare-btns button:hover{border-color:var(--text);background:var(--brand-bg)}

  .ai-derivar{border:1px solid var(--line);background:var(--panel2);border-radius:13px;padding:13px 14px}
  .ai-derivar-t{font-weight:800;color:var(--ink);font-size:13.5px}
  .ai-derivar-d{font-size:12.5px;color:var(--muted);margin-top:3px}
  /* Este botón sí lleva el verde real de WhatsApp: abre la app externa, no es
     un color de la interfaz. */
  .ai-derivar-wa{display:inline-block;margin-top:9px;background:#25D366;color:#fff;font:800 12.5px var(--font);padding:9px 14px;border-radius:9px}

  /* ---- Lector de documentos con IA dentro del formulario ---- */
  .lector-ia{border:1px solid var(--line);background:var(--panel2);border-radius:13px;padding:14px 15px;margin-bottom:18px}
  .lector-t{font-weight:800;font-size:15px;color:var(--ink)}
  .lector-d{font-size:13px;color:var(--muted);margin:5px 0 11px;line-height:1.5}
  .lector-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .lector-files{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .lector-chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 6px 5px 11px;font-size:12px;font-weight:600;max-width:100%}
  .lector-chip button{border:none;background:var(--panel2);color:var(--muted);width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:14px;line-height:1;flex-shrink:0}
  .lector-chip button:hover{background:var(--ink);color:#fff}
  .lector-res{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 13px}
  .lector-resumen{font-size:13px;color:var(--text);line-height:1.55;white-space:pre-wrap}
  .lector-orden{min-height:44px;max-height:120px;resize:none;margin-bottom:10px;font-size:16px}

  /* Acciones propuestas por la IA cuando el documento no encaja en el formulario */
  .sug-wrap{margin-top:13px;border-top:1px solid var(--line2);padding-top:12px}
  .sug-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
  .sug-t{font-family:var(--font-mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink)}
  .sug-todas{border:none;background:transparent;color:var(--text);font:800 12px var(--font);cursor:pointer;padding:2px 0;white-space:nowrap}
  .sug{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:var(--card)}
  .sug + .sug{margin-top:8px}
  .sug-sel{cursor:pointer}
  .sug-sel.on{border-color:var(--ink);background:var(--brand-bg)}
  .sug-check{width:20px;height:20px;margin:2px 0 0;flex-shrink:0;accent-color:var(--text)}
  .sug-accion{font-family:var(--font-mono);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text);margin-top:2px}
  .sug-ico{font-size:20px;flex-shrink:0;line-height:1.2}
  .sug-body{flex:1;min-width:0}
  .sug-titulo{font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.35}
  .sug-porque{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
  .sug-meta{display:flex;flex-wrap:wrap;gap:9px;margin-top:6px;font-size:12px;color:var(--text);font-weight:700}
  .sug-btn{margin-top:11px;border:none;border-radius:9px;background:var(--ink);color:#fff;font:800 13.5px var(--font);padding:12px 14px;cursor:pointer;width:100%}
  .sug-btn:hover:not(:disabled){background:#2C2C2E}
  .sug-btn:disabled{opacity:.45;cursor:default}
  .sug-nada{margin-top:7px;font-size:12.5px;color:var(--faint)}

  /* Aviso mientras consulta internet, y fuentes citadas bajo la respuesta. */
  .ai-buscando{font-size:11.5px;color:var(--muted);background:var(--panel2);border:1px dashed var(--line);border-radius:9px;padding:7px 10px;align-self:flex-start}
  .ai-buscando i{color:var(--text);font-style:normal;font-weight:700}
  .ai-fuentes{margin-top:9px;padding-top:8px;border-top:1px solid var(--line2);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .ai-fuentes span{font-family:var(--font-mono);font-size:10px;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .ai-fuentes a{font-size:11.5px;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:3px 9px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ai-fuentes a:hover{background:var(--ink);color:#fff}

  /* Puntos animados mientras el asesor piensa. */
  .ai-typing{display:flex;gap:4px;align-items:center;padding:13px 14px}
  .ai-typing span{width:7px;height:7px;border-radius:50%;background:var(--faint);animation:aiDot 1.1s infinite}
  .ai-typing span:nth-child(2){animation-delay:.15s}
  .ai-typing span:nth-child(3){animation-delay:.3s}
  @keyframes aiDot{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  /* En el celular usamos 100dvh (alto real visible): con 100vh el panel queda
     tapado por la barra del navegador y el campo de escribir no se alcanza.
     El env(safe-area-inset-bottom) lo sube sobre la barra de gestos al usarla
     como aplicación instalada. */
  @media(max-width:560px){
    .ai-fab{right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:56px;height:56px}
    .ai-float{right:8px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:calc(100vw - 16px);height:calc(100dvh - 90px - env(safe-area-inset-bottom,0px));border-radius:17px}
  }

  /* ============================ INTERFAZ MÓVIL ============================

<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ---------- Almacenamiento seguro (localStorage con respaldo en memoria) ---------- */
const mem = {};
const store = {
  get(k, fb){ try{ const v = localStorage.getItem(k); return v!=null ? JSON.parse(v) : (k in mem ? mem[k] : fb);}catch{ return (k in mem)?mem[k]:fb; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{ mem[k]=v; } }
};

/* ---------- Acceso a la plataforma ----------
   Los datos viven en el servidor y ya no son públicos: cada llamada viaja con
   el token de la sesión. Si el servidor responde 401, se cierra la sesión y
   vuelve a aparecer la pantalla de la clave. */
let TOKEN = (()=>{ try{ return localStorage.getItem("ap_token")||""; }catch(_e){ return ""; } })();
const guardarToken = (t)=>{ TOKEN=t||""; try{ t?localStorage.setItem("ap_token",t):localStorage.removeItem("ap_token"); }catch(_e){} };
const api = async (url, opts)=>{
  const o=opts||{};
  const r=await fetch(url,{...o, headers:{...(o.headers||{}), ...(TOKEN?{Authorization:"Bearer "+TOKEN}:{})}});
  if(r.status===401){ guardarToken(""); if(window.__sinAcceso) window.__sinAcceso(); }
  return r;
};
const apiJSON = (url, cuerpo, metodo)=>api(url,{method:metodo||"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(cuerpo||{})});

/* ---------- Helpers ---------- */
/* Fecha corta legible (18 mar). La usan el CRM, los cobros y los indicadores,
   así que vive aquí y no dentro de un componente. */
const fmtF=(v)=>{ if(!v&&v!==0) return ""; let d; if(typeof v==="number") d=new Date(v); else d=new Date(String(v).length<=10?(v+"T00:00:00"):v); if(isNaN(d)) return String(v); return d.toLocaleDateString("es-CL",{day:"2-digit",month:"short"}); };
const CLP = (n)=> new Intl.NumberFormat("es-CL",{style:"currency",currency:"CLP",maximumFractionDigits:0}).format(Math.round(n||0));
const pctFmt = (n)=> (n>0?"+":"")+(n||0).toLocaleString("es-CL",{minimumFractionDigits:1,maximumFractionDigits:2})+"%";
const UFf = (n)=> `${(n||0).toLocaleString("es-CL",{minimumFractionDigits:2,maximumFractionDigits:2})} UF`;
const num = (v)=> { const n = parseFloat(String(v).replace(/[^\d.-]/g,"")); return isNaN(n)?0:n; };
const todayISO = ()=> new Date().toISOString().slice(0,10);
const daysBetween = (a,b)=> Math.round((new Date(b)-new Date(a))/86400000);

const ST = { pagado:{c:"green",t:"Al día"}, pendiente:{c:"amber",t:"Pendiente"}, atrasado:{c:"red",t:"Atrasado"}, disponible:{c:"grey",t:"Disponible (sin arrendar)"} };
// Etiqueta de tipo de propiedad: si es "Otro", muestra el texto especificado.
function tipoTxt(p){ return p && p.type==="Otro" ? ((p.typeOtro&&p.typeOtro.trim())||"Otro") : (p?p.type:""); }
// Sin color: la urgencia se lee por lo oscuro del punto (al día = casi
// invisible, pendiente = gris medio, atrasado = negro pleno).
const dotColor = (s)=> s==="pagado"?"#E5E5EA":s==="pendiente"?"#8E8E93":"#101012";

/* Cálculos financieros (transparentes y verificables) */
const divCLP = (p,uf)=> p.hasMortgage ? Math.round((num(p.dividendoUF))*uf) : 0;
const divPorPagar = (p)=> p.hasMortgage ? Math.max(0,num(p.dividendosTotales)-num(p.dividendosPagados)) : 0;
const contribMes = (p)=> Math.round(num(p.contribucionesAnuales)/12);
const gastoComunOwner = (p)=> p.gastosComunesOwner ? num(p.gastoComun) : 0;

// ---- Periodicidad de gastos e ingresos ----
// El usuario define cada cuánto se repite un movimiento. Para la utilidad MENSUAL
// se convierte todo a su equivalente por mes. "única" (fecha exacta, una sola vez)
// no es recurrente: no se prorratea en la utilidad mensual proyectada.
const PERIODOS = [
  {v:"mes",l:"Cada mes"},{v:"bimestral",l:"Cada 2 meses"},{v:"trimestral",l:"Cada 3 meses"},
  {v:"cuatrimestral",l:"Cada 4 meses"},{v:"semestral",l:"Cada 6 meses"},{v:"año",l:"Cada año"},
  {v:"unica",l:"Fecha exacta (una vez)"}
];
const factorMensual = (periodo)=> ({mes:1, bimestral:1/2, trimestral:1/3, cuatrimestral:1/4, semestral:1/6, "año":1/12, anual:1/12, unica:0})[periodo] ?? 1;
// Valor en CLP de un movimiento (incluye sus subítems), respetando si está en UF o CLP.
const movMontoCLP = (m,uf)=>{
  const base = String(m.moneda)==="UF" ? num(m.montoUF!=null&&m.montoUF!==""?m.montoUF:m.monto)*uf : num(m.monto);
  const subs = (m.subitems||[]).reduce((s,si)=> s + (String(si.moneda)==="UF" ? num(si.montoUF!=null&&si.montoUF!==""?si.montoUF:si.monto)*uf : num(si.monto)), 0);
  return base + subs;
};
const movMensualCLP = (m,uf)=> movMontoCLP(m,uf) * factorMensual(m.periodo||"mes");

// ---- Seguros ----
// El seguro va incluido en el dividendo mientras el crédito está vigente; al
// terminar de pagar el crédito hay que contratar uno aparte. Las propiedades
// antiguas pueden no tener seguro. Todo es editable (lista de pólizas contratadas).
const creditoVigente = (p)=> !!p.hasMortgage && num(p.dividendosPagados) < num(p.dividendosTotales);
const seguroEnDividendo = (p)=> creditoVigente(p) && p.seguroEnDividendo!==false;
const segurosLista = (p)=> (p.seguros||[]).filter(s=>s && s.activo!==false);
const seguroContratadoMes = (p,uf)=> segurosLista(p).reduce((s,sg)=> s + movMensualCLP(sg,uf), 0);
// Costo de seguro que se descuenta de la utilidad (no se duplica si va en el dividendo).
const seguroMes = (p,uf)=>{
  uf = uf||window.__UF__||0;
  if(seguroEnDividendo(p)) return 0;                 // incluido en el dividendo
  const lista = p.seguros||[];
  if(lista.length) return Math.round(seguroContratadoMes(p,uf)); // pólizas contratadas
  return Math.round(num(p.seguroIncendioSismo)/12);  // campo simple (compatibilidad)
};
// Gastos editables por propiedad. Cada ítem puede ser CLP o UF, con su periodicidad y subítems.
const gastosExtraMes = (p,uf)=>{ uf=uf||window.__UF__||0; return (p.gastosExtra||[]).reduce((s,g)=> s + movMensualCLP(g,uf), 0); };
const egresosMes = (p,uf)=> divCLP(p,uf)+contribMes(p)+seguroMes(p,uf)+gastosExtraMes(p,uf);
// Ingresos editables por propiedad además del arriendo. Cada ítem puede ser CLP o UF.
const ingresosExtraMes = (p,uf)=>{ uf=uf||window.__UF__||0; return (p.ingresosExtra||[]).reduce((s,g)=> s + movMensualCLP(g,uf), 0); };
const ingresoMes = (p,uf)=> (p.use==="arriendo" ? num(p.rent) : 0) + ingresosExtraMes(p,uf);
const utilidadMes = (p,uf)=> ingresoMes(p,uf)-egresosMes(p,uf);
const utilidadAnual = (p,uf)=> utilidadMes(p,uf)*12;
const diffArrDiv = (p,uf)=> ingresoMes(p)-divCLP(p,uf);
// Meses transcurridos del año actual (1..12), para la utilidad acumulada a la fecha.
const mesesTranscurridos = ()=> new Date().getMonth()+1;
// Ingresos realmente cobrados en un año, según el historial de pagos guardado.
const ingresosRealesAnio = (p,anio)=> (p.histPagos||[]).filter(h=>String(h.fecha||"").slice(0,4)===String(anio)).reduce((s,h)=>s+num(h.monto),0);

  try{ if(store.get("ap_trinidad_seed_v1", false)) return list; }catch(e){}
  const arr = Array.isArray(list)? list.slice() : [];
  const ids = new Set(arr.map(p=>String(p.id)));
  const names = new Set(arr.map(p=>(p.name||"").toLowerCase().trim()));
  TRINIDAD_SEED.forEach(s=>{ if(!ids.has(String(s.id)) && !names.has(s.name.toLowerCase().trim())) arr.push({...s}); });
  return arr;
}

/* Consulta para Google Maps. Las propiedades nuevas no traen coordenadas, y
   pedirle el mapa con "q=," hace que Google caiga en un lugar cualquiera: por
   eso, sin coordenadas, se busca por la dirección escrita. */
const dirTexto = (p)=>[p.address,p.comuna,p.region,"Chile"].filter(Boolean).join(", ");
const tieneCoords = (p)=>{ const a=parseFloat(p.lat), b=parseFloat(p.lng); return !isNaN(a)&&!isNaN(b)&&(a||b); };
/* Las coordenadas solo valen si se calcularon con la dirección que está
   escrita hoy. Si la dirección cambió (la corrigió el usuario o la IA), las
   coordenadas viejas quedan obsoletas y no se usan. */
const coordsFrescas = (p)=>tieneCoords(p) && (!p.address || String(p.geoDir||"")===dirTexto(p));
/* Manda la dirección escrita: es lo que el usuario ve y corrige, y el buscador
   de Google la resuelve mejor que unas coordenadas aproximadas. Las
   coordenadas solo se usan cuando no hay dirección. */
const mapaConsulta = (p)=>{
  const dir=dirTexto(p);
  if(String(p.address||"").trim()) return encodeURIComponent(dir);
  const lat=parseFloat(p.lat), lng=parseFloat(p.lng);
  if(!isNaN(lat)&&!isNaN(lng)&&(lat||lng)) return lat+","+lng;
  return encodeURIComponent("Chile");
};
/* Street View de Google solo abre con coordenadas, así que se usan las que
   correspondan a la dirección escrita. */
const panoURL = (p)=>coordsFrescas(p)
  ? ("https://www.google.com/maps/@?api=1&map_action=pano&viewpoint="+p.lat+","+p.lng)
  : "";
/* Acepta que peguen un enlace de Google Maps o unas coordenadas sueltas: es la
   forma más exacta de fijar el punto cuando el buscador no da con la casa. */
const parsearCoords = (txt)=>{
  const s=String(txt||"");
  const m = s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)
        || s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)
        || s.match(/(?:q|query|viewpoint|ll|cbll)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/)
        || s.match(/^\s*(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)\s*$/);
  if(!m) return null;
  const lat=parseFloat(m[1]), lng=parseFloat(m[2]);
  return (isNaN(lat)||isNaN(lng)) ? null : { lat, lng };
};

/* Convierte la dirección escrita en coordenadas.
   Street View de Google solo se puede abrir con coordenadas: con una dirección
   de texto abre un mapa normal, nunca la vista de calle. Por eso, sin
   coordenadas, no basta con arreglar el enlace: hay que ubicar la propiedad.
   Se usa el geocodificador de OpenStreetMap, que es abierto y no pide clave. */
const geocodificar = async (dir)=>{
  const q=String(dir||"").trim();
  if(!q) return null;
  const url="https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=cl&q="+encodeURIComponent(q);
  const r=await fetch(url,{headers:{Accept:"application/json"}});
  if(!r.ok) throw new Error("HTTP "+r.status);
  const j=await r.json();
  if(!Array.isArray(j)||!j.length) return null;
  const lat=parseFloat(j[0].lat), lng=parseFloat(j[0].lon);
  return (isNaN(lat)||isNaN(lng)) ? null : { lat, lng };
};

/* Busca la dirección completa y, si no aparece, reintenta sin el número: en
   pueblos chicos muchas veces solo está mapeada la calle. */
const ubicarDireccion = async (p)=>{
  const cola=[p.comuna,p.region,"Chile"].filter(Boolean).join(", ");
  const calle=String(p.address||"").trim();
  const intentos=[];
  if(calle) intentos.push([calle,cola].filter(Boolean).join(", "));
  if(calle&&/\d/.test(calle)) intentos.push([calle.replace(/\s*\d.*$/,"").trim(),cola].filter(Boolean).join(", "));
  if(cola) intentos.push(cola);
  for(const q of intentos){
    const r=await geocodificar(q);
    if(r) return r;
  }
  return null;
};

/* ============ Lectura universal de archivos para la IA ============
   La IA lee imágenes y PDF de forma nativa. Word, Excel y planillas no: son
   archivos ZIP con XML adentro, así que les extraemos el texto aquí, en el
   navegador, y se lo mandamos como texto. Así el usuario sube "cualquier
   cosa" y funciona igual.
   El descomprimido usa DecompressionStream, que ya viene en los navegadores
   modernos; no hace falta ninguna librería externa. */

const _dv=(b,o)=>b[o]|(b[o+1]<<8);
const _dw=(b,o)=>(b[o]|(b[o+1]<<8)|(b[o+2]<<16))+(b[o+3]*16777216);

/* Recorre las entradas de un ZIP y devuelve {nombre: texto} de las que pidamos.
   Se lee el directorio central (al final del archivo) y no las cabeceras
   locales: Word y Excel escriben en streaming y ahí el tamaño puede venir en
   cero, con lo que la entrada se perdería. */
const zipLeerEntradas = async (buffer, quiero)=>{
  const b=new Uint8Array(buffer), out={}, dec=new TextDecoder();
  // Fin del directorio central: PK\5\6, buscándolo desde el final.
  let eocd=-1;
  for(let i=b.length-22;i>=0 && i>b.length-70000;i--){
    if(b[i]===0x50&&b[i+1]===0x4b&&b[i+2]===0x05&&b[i+3]===0x06){ eocd=i; break; }
  }
  if(eocd<0) return out;
  const total=_dv(b,eocd+10);
  let p=_dw(b,eocd+16);
  for(let n=0;n<total;n++){
    if(b[p]!==0x50||b[p+1]!==0x4b||b[p+2]!==0x01||b[p+3]!==0x02) break;
    const metodo=_dv(b,p+10), compSize=_dw(b,p+20);
    const nameLen=_dv(b,p+28), extraLen=_dv(b,p+30), comLen=_dv(b,p+32);
    const local=_dw(b,p+42);
    const nombre=dec.decode(b.subarray(p+46,p+46+nameLen));
    p+=46+nameLen+extraLen+comLen;
    if(!quiero(nombre)) continue;
    // El tamaño de los campos variables se relee en la cabecera local.
    const ini=local+30+_dv(b,local+26)+_dv(b,local+28);
    const datos=b.subarray(ini,ini+compSize);
    try{
      if(metodo===0) out[nombre]=dec.decode(datos);
      else if(metodo===8){
        const ds=new DecompressionStream("deflate-raw");
        out[nombre]=await new Response(new Blob([datos]).stream().pipeThrough(ds)).text();
      }
    }catch(e){ /* entrada ilegible: se ignora y seguimos con las demás */ }
  }
  return out;
};

const _xmlATexto=(xml)=>String(xml||"")
  .replace(/<\/w:p>|<\/a:p>|<\/text:p>/g,"\n")   // fin de párrafo en Word
  .replace(/<[^>]+>/g," ")                        // fuera las etiquetas
  .replace(/&#(\d+);/g,(m,d)=>String.fromCharCode(+d))
  .replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&")
  .replace(/&quot;/g,'"').replace(/&apos;/g,"'")
  .replace(/[ \t]+/g," ").replace(/\n{3,}/g,"\n\n").trim();

const docxATexto = async (buffer)=>{
  const e=await zipLeerEntradas(buffer,n=>/^word\/(document|header\d*|footer\d*)\.xml$/.test(n));
  return Object.keys(e).sort().map(k=>_xmlATexto(e[k])).filter(Boolean).join("\n\n");
};

const xlsxATexto = async (buffer)=>{
  const e=await zipLeerEntradas(buffer,n=>/^xl\/(sharedStrings\.xml|worksheets\/sheet\d+\.xml)$/.test(n));
  // Las celdas de texto guardan un índice a la tabla compartida de cadenas.
  const compartidas=(e["xl/sharedStrings.xml"]||"").split(/<si[\s>]/).slice(1)
    .map(s=>_xmlATexto(s.split("</si>")[0]));
  const hojas=Object.keys(e).filter(k=>k.indexOf("worksheets/")>=0).sort();
  return hojas.map(k=>{
    const filas=e[k].split(/<row[\s>]/).slice(1);
    return filas.map(fila=>{
      const celdas=fila.split(/<c[\s>]/).slice(1);
      return celdas.map(c=>{
        const attrs=c.split(">")[0];
        // Hay dos maneras válidas de guardar texto y conviven según el programa
        // que generó la planilla: en línea, o apuntando a la tabla compartida.
        if(/t="inlineStr"/.test(attrs)){
          const t=c.match(/<t[^>]*>[\s\S]*?<\/t>/g);
          return t ? t.map(x=>_xmlATexto(x)).join(" ") : "";
        }
        const v=(c.match(/<v>([\s\S]*?)<\/v>/)||[])[1];
        if(v==null) return "";
        return /t="s"/.test(attrs) ? (compartidas[+v]||"") : v;
      }).filter(x=>x!=="").join("\t");
    }).filter(Boolean).join("\n");
  }).filter(Boolean).join("\n\n");
};

/* Devuelve el archivo listo para la IA: como adjunto nativo (imagen/PDF) o
   como texto ya extraído. */
const leerArchivoParaIA = async (file)=>{
  const nombre=file.name||"archivo";
  const ext=(nombre.split(".").pop()||"").toLowerCase();
  const tipo=String(file.type||"");
  const esImagen=tipo.indexOf("image/")===0 || ["jpg","jpeg","png","gif","webp","bmp","heic","heif","avif"].indexOf(ext)>=0;
  const esPdf=tipo==="application/pdf"||ext==="pdf";

  if(esImagen||esPdf){
    const dataUrl=await readFileDataURL(file);
    let media=tipo;
    if(esPdf) media="application/pdf";
    // La IA solo acepta estos formatos de imagen; el resto lo declaramos como
    // JPEG, que es lo que entrega iOS al subir una foto desde la galería.
    else if(["image/jpeg","image/png","image/gif","image/webp"].indexOf(media)<0) media="image/jpeg";
    return { name:nombre, media, b64:String(dataUrl).split(",")[1]||"", size:file.size };
  }

  let texto="";
  if(ext==="docx") texto=await docxATexto(await file.arrayBuffer());
  else if(ext==="xlsx"||ext==="xlsm") texto=await xlsxATexto(await file.arrayBuffer());
  else if(["txt","csv","md","json","xml","html","htm","rtf"].indexOf(ext)>=0 || tipo.indexOf("text/")===0){
    texto=await file.text();
    if(ext==="rtf"||ext==="html"||ext==="htm") texto=_xmlATexto(texto);
  }
  else if(["doc","xls","ppt","pages","numbers"].indexOf(ext)>=0){
    throw new Error("“"+nombre+"” está en un formato antiguo que no se puede leer. Ábrelo y guárdalo como PDF o .docx y vuelve a subirlo.");
  }
  else throw new Error("No sé leer “"+nombre+"”. Sirven fotos, PDF, Word, Excel y archivos de texto.");

  if(!texto.trim()) throw new Error("“"+nombre+"” no tiene texto que se pueda leer. Si es un escaneo, súbelo como PDF o foto.");
  return { name:nombre, texto:texto.slice(0,120000), size:file.size };
};
function optimizeImage(file, maxDim, quality){
  return new Promise(async (resolve)=>{
    try{
      const dataUrl = await readFileDataURL(file);
      const img = new Image();
      img.onload = ()=>{ try{
        let w=img.naturalWidth, h=img.naturalHeight;
        if(Math.max(w,h)>maxDim){ const s=maxDim/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
        const c=document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        resolve(c.toDataURL("image/jpeg",quality));
      }catch(e){ resolve(dataUrl); } };
      img.onerror=()=>resolve(dataUrl);
      img.src=dataUrl;
    }catch(e){ resolve(null); }
  });
}

// Reemplaza las variables de una plantilla con los datos reales de la propiedad.
function aplicarPlantilla(texto, p, owner, gw, cuentas){
  if(!texto) return "";
  const primer = (p.tenant||"arrendatario(a)").split(" ")[0] || "arrendatario(a)";
  const periodo = new Date().toLocaleDateString("es-CL",{month:"long",year:"numeric"});
  const banco = (cuentas&&cuentas.length) ? cuentas.map(c=>cuentaLinea(c)).join(" / ")
    : `${owner.bank||"—"}, ${owner.accountType||""} ${owner.accountNumber||""}, RUT ${owner.rut||""}`;
  const map = {
    "{nombre}":primer, "{propiedad}":p.name||"", "{direccion}":p.address||p.name||"", "{comuna}":p.comuna||"",
    "{monto}":CLP(num(p.rent)), "{periodo}":periodo, "{vence}":`día ${p.dueDay||5}`, "{banco}":banco,
    "{pasarela}":(gw&&gw.name)||"la pasarela", "{email_admin}":owner.email||"—",
    "{whatsapp_admin}":waRemitente(owner),
  };
  return String(texto).replace(/\{[a-z_]+\}/g, k=> map[k]!=null ? map[k] : k);
}

function Inp({f, value, onChange}){
  if(f.type==="select") return (

      <select value={value??""} onChange={e=>onChange(f.k, e.target.value)}>{f.opts.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}</select>
    </div>);
  return (
    <div className="field"><label className="label">{f.label}</label>
      <input className="input" type={f.t||"text"} step={f.step} placeholder={f.ph} value={value??""} onChange={e=>onChange(f.k, e.target.value)} />
    </div>);
}

      <Inp f={{k:"telefono",label:"Teléfono"}} value={d.telefono} onChange={ch}/>
    </div>
    <div className="sub-title">④ Datos bancarios (para recibir pagos)</div>
    <div className="grid c2" style={{gridTemplateColumns:"1fr 1fr",gap:12}}>
      <Inp f={{k:"banco",label:"Banco"}} value={d.banco} onChange={ch}/>
      <Inp f={{k:"cuentaTipo",label:"Tipo de cuenta",type:"select",opts:[{v:"Cuenta Corriente",l:"Cuenta Corriente"},{v:"Cuenta Vista",l:"Cuenta Vista"},{v:"Cuenta de Ahorro",l:"Cuenta de Ahorro"},{v:"CuentaRUT",l:"CuentaRUT"}]}} value={d.cuentaTipo} onChange={ch}/>
      <Inp f={{k:"cuentaNumero",label:"N° de cuenta"}} value={d.cuentaNumero} onChange={ch}/>
      <Inp f={{k:"cuentaRut",label:"RUT del titular"}} value={d.cuentaRut} onChange={ch}/>
      <Inp f={{k:"cuentaNombre",label:"Nombre del titular"}} value={d.cuentaNombre} onChange={ch}/>
    </div>
  </>);
}
