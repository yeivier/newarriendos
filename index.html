                  <option value={24}>Cada 24 meses</option>
                </select>
              </div>
            </div>
            <div className="help" style={{marginTop:6}}>Hoy se está cobrando con <b>{reglaUFTexto(null)}</b>. Si un pago se atrasa, se usa la <b>UF más alta desde el día del vencimiento</b>. Conviene que esta regla sea la misma que aparece escrita en tus contratos.</div>
            <div className="card pad" style={{marginTop:12,background:"var(--panel2)",border:"none"}}>
              <div style={{fontSize:13,fontWeight:700,color:"var(--muted)",marginBottom:8}}>CÓMO ESTÁ CADA PROPIEDAD</div>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {rentals.map(p=>{ const r=reajusteInfo(p,ownerEdit); const c=ufParaCobro(p);
                  return (<div key={p.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                    <div style={{minWidth:170,flex:1}}>
                      <div style={{fontWeight:700}}>{p.name}</div>
                      <div style={{fontSize:13,color:"var(--muted)"}}>
                        {UFf(num(p.rentUF))} · reajuste por <b>{r.modo}</b>
                        {r.modo==="UF"
                          ? <> · automático: hoy se cobra <b>{CLP(montoCobro(p))}</b> con {c.etiqueta} ({CLP(c.valor)} del {fmtF(c.fecha)})</>
                          : (r.vence?(r.toca?" · le tocaba el "+r.vence:" · próxima revisión "+r.proximo):" · falta la fecha de inicio del contrato")}
                      </div>
                    </div>
                    {r.toca && r.modo!=="UF" && <button className="btn btn-out btn-sm" disabled={reajBusy===String(p.id)} onClick={()=>aplicarReajuste(p)}>{reajBusy===String(p.id)?"Calculando…":"Aplicar ahora"}</button>}
                  </div>);
                })}
                {rentals.length===0 && <div className="help" style={{margin:0}}>Todavía no tienes propiedades en arriendo.</div>}
              </div>
            </div>
          </Collapsible>
          <Collapsible icon="📐" title="Valor de la UF" defaultOpen={false}>
            <div className="help" style={{marginBottom:12}}>Se actualiza solo desde <b>mindicador.cl</b>. Si no carga, puedes escribirlo a mano. Este valor reajusta automáticamente todos los dividendos en UF.</div>
            <div style={{display:"flex",gap:10,alignItems:"flex-end",flexWrap:"wrap"}}>
              <div className="field" style={{maxWidth:240}}><label className="label">1 UF = (CLP)</label><input className="input" type="number" value={uf} onChange={e=>{setUf(parseInt(num(e.target.value))||uf);setUfManual(true);}}/></div>
              {ufManual && <span className="pill amber">Valor editado manualmente</span>}
            </div>
          </Collapsible>
          <Collapsible icon="📉" title="Otros indicadores" defaultOpen={false}>
            <div className="help" style={{marginBottom:12}}>UTM, Dólar e IPC se actualizan solos desde <b>mindicador.cl</b> (datos de Banco Central / INE). UTA se calcula como UTM × 12. El IPC corresponde a la variación mensual del Índice de Precios al Consumidor.</div>
            <div className="grid c4" style={{gridTemplateColumns:"repeat(4,1fr)",gap:12}}>
              <Data label="UTM" value={CLP(utm)}/>
              <Data label="UTA (UTM × 12)" value={CLP(utm*12)}/>
              <Data label="Dólar observado" value={CLP(dolar)}/>
              <Data label="IPC (var. mensual)" value={pctFmt(ipc)}/>
            </div>
            <button className="btn btn-out btn-sm" style={{marginTop:14}} onClick={refrescarIndicadores} disabled={indLoading}>{indLoading?"Actualizando…":"Actualizar UF, UTM, Dólar e IPC"}</button>
          </Collapsible>
          <Collapsible icon="💳" title="Plataforma de pago con tarjeta" defaultOpen={false}>
            <div className="grid c2" style={{gridTemplateColumns:"1fr 1fr"}}>
              {gateways.map(g=>{ const on=ownerEdit.gateway===g.id; return (<div key={g.id} onClick={()=>setOwnerEdit(o=>({...o,gateway:g.id}))} style={{border:`2px solid ${on?"var(--green)":"var(--line)"}`,background:on?"var(--green-bg)":"#fff",borderRadius:14,padding:16,cursor:"pointer"}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}><span style={{fontSize:17,fontWeight:800,flex:1}}>{g.name}</span>{g.rec&&<span className="pill green">Recomendado</span>}<div style={{width:20,height:20,borderRadius:"50%",border:`2px solid ${on?"var(--green)":"var(--line)"}`,background:on?"var(--green)":"#fff",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12}}>{on?"✓":""}</div></div>
                <div style={{fontSize:14,color:"var(--muted)"}}>{g.methods}</div><div style={{fontSize:14,color:"var(--amber)",fontWeight:700,marginTop:6}}>Comisión: {g.fee}</div>
              </div>); })}
            </div>
          </Collapsible>
          <Collapsible icon="🏦" title="Khipu — transferencia bancaria automatizada" defaultOpen={false}>
            <div className="help" style={{marginBottom:12}}>Khipu deposita directo en tu cuenta bancaria. Tu clave de cuenta de cobro <b>nunca se guarda en esta app</b> (ni en el navegador ni en este historial): vive solo como variable de entorno en Netlify, igual que la clave del asistente IA.</div>
            <ol style={{margin:"0 0 14px 20px",fontSize:14.5,lineHeight:1.9}}>
              <li>Crea o abre tu cuenta de cobro en <b>khipu.com</b> y genera una API Key (sección "Para integrar Khipu a tu sitio web").</li>
              <li>En Netlify: <b>Site settings → Environment variables</b> → agrega <code>KHIPU_API_KEY</code> con esa clave, y vuelve a desplegar el sitio.</li>
              <li>Activa "Khipu" como pasarela en cada propiedad, dentro de su sección <b>Cobro automático y vouchers</b>.</li>
            </ol>
            <button className="btn btn-out btn-sm" onClick={probarKhipu} disabled={khipuTestLoading}>{khipuTestLoading?"Probando…":"Probar conexión"}</button>
            {khipuTest && <div style={{marginTop:10}}><span className={"pill "+(khipuTest.ok?"green":"red")}>{khipuTest.ok?"✓ Conectado correctamente":"✕ "+khipuTest.msg}</span></div>}
            <div className="help g" style={{marginTop:12}}>Los pagos se confirman solos: Khipu avisa por webhook en cuanto el banco concilia el depósito, y el voucher pasa a "Pagado" sin que tengas que hacer nada (la app revisa esto automáticamente cada cierto tiempo mientras la tengas abierta).</div>
          </Collapsible>
          <button className="btn btn-green" style={{alignSelf:"flex-start",padding:"14px 30px"}} onClick={()=>{setOwner(ownerEdit);notify("✓ Configuración guardada");}}>Guardar cambios</button>
        </>}

        {/* ============ ASISTENTE ============ */}
        {tab==="ai" && <>
          {/* Lo que el asesor inmobiliario ha atendido: se registra solo. */}

            <div className="help" style={{marginBottom:12}}>Esto lo registra la plataforma sola cada vez que alguien conversa con el <b>asesor inmobiliario</b> (el botón ✦ de abajo a la derecha).</div>
            <div className="grid c4" style={{gridTemplateColumns:"repeat(4,1fr)"}}>
              <div className="stat" style={{borderTopColor:"var(--gold)"}}><div className="lab">Conversaciones</div><div className="val">{asMet.consultas||0}</div></div>
              <div className="stat" style={{borderTopColor:"var(--line)"}}><div className="lab">Búsquedas</div><div className="val">{asMet.busquedas||0}</div></div>
              <div className="stat" style={{borderTopColor:"var(--green)"}}><div className="lab">Contactos capturados</div><div className="val">{asMet.leads||0}</div><div className="sub">quedan en el CRM</div></div>
              <div className="stat" style={{borderTopColor:"var(--red)"}}><div className="lab">Visitas agendadas</div><div className="val">{asMet.visitas||0}</div></div>
            </div>
            {(()=>{ const vistas=Object.entries(asMet.propiedades||{}).sort((a,b)=>b[1]-a[1]).slice(0,8);
              if(!vistas.length) return <div className="help" style={{marginTop:12}}>Todavía nadie ha mirado propiedades con el asesor.</div>;
              const max=vistas[0][1]||1;
              return (<div style={{marginTop:16}}>
                <div className="sub-title">Propiedades más consultadas</div>
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  {vistas.map(([id,n])=>{ const p=props.find(x=>String(x.id)===String(id));
                    return (<div key={id}>
                      <div style={{display:"flex",justifyContent:"space-between",fontSize:14,fontWeight:600,marginBottom:4}}>
                        <span>{p?p.name:"Propiedad "+id}</span><span style={{color:"var(--muted)"}}>{n} vez{n!==1?"es":""}</span>
                      </div>
                      <div className="bar"><div style={{width:Math.round(n/max*100)+"%",background:"var(--gold)"}}></div></div>
                    </div>);
                  })}
                </div>
                <div className="help" style={{marginTop:10}}>Lo más consultado es lo que conviene tener con mejores fotos, mejor descripción y precio revisado.</div>
              </div>);
            })()}
            <div style={{marginTop:14,display:"flex",gap:8,flexWrap:"wrap"}}>
              <button className="btn btn-out btn-sm" onClick={()=>setTab("crm")}>Ver los contactos en el CRM →</button>
              <button className="btn btn-ghost btn-sm" onClick={()=>{ if(window.confirm("¿Borro los contadores del asesor?")) setAsMet({consultas:0,busquedas:0,leads:0,visitas:0,derivaciones:0,propiedades:{}}); }}>Reiniciar contadores</button>
            </div>
          </Collapsible>
          <div className="help">Pregúntale al asistente sobre tu cartera, o usa un <b>comando rápido</b> para ver la información al instante (sin esperar respuesta).</div>
          <div className="card pad" style={{marginBottom:14}}>
            <div className="sec-title" style={{marginBottom:10}}>Comandos rápidos</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
              {quickCmds.map(c=><button key={c.label} className="btn btn-out btn-sm" title={c.desc} onClick={()=>runQuickCmd(c)}>{c.label}</button>)}
            </div>
          </div>
          <div className="card pad" style={{marginBottom:14}}>
            <div className="sec-title">Lector de documentos con IA</div>

            <textarea className="input lector-orden" value={aiOrden} onChange={e=>setAiOrden(e.target.value)}
              placeholder="Escríbele con o sin archivo. Ej: “¿cuál es el valor de la UF hoy?”, “¿cuándo se pagan las contribuciones?”, “anótalo en la bitácora de la casa de Ñuñoa”." />
            <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
              <label className="btn btn-out" style={{cursor:"pointer"}}>Elegir archivos<input type="file" accept="image/*,.pdf,.docx,.xlsx,.xlsm,.txt,.csv,.md,.json,.xml,.html,.rtf" multiple style={{display:"none"}} onChange={async e=>{ const fs=[...e.target.files]; e.target.value=""; const ok=[]; for(const f of fs){ try{ ok.push(await leerArchivoParaIA(f)); }catch(err){ notify(err.message,true); } } if(ok.length) setAiDocs(d=>[...d,...ok]); }}/></label>
              <button className="btn btn-red" disabled={aiDocBusy||(!aiDocs.length&&!String(aiOrden||"").trim())} onClick={analizarDocs}>
                {aiDocBusy?(aiDocPaso||"Leyendo con IA…"):(aiDocs.length?"Analizar y completar":"Preguntar a la IA")}</button>
              {aiDocs.length>0&&<button className="btn btn-out btn-sm" onClick={()=>{setAiDocs([]);setAiDocRes(null);}}>Limpiar</button>}
            </div>
            {aiDocs.length>0&&<div style={{display:"flex",flexDirection:"column",gap:6,marginTop:10}}>{aiDocs.map((f,i)=><div key={i} className="ai-doc-row"><span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.name}</span><button className="btn btn-out btn-sm" onClick={()=>setAiDocs(d=>d.filter((_,j)=>j!==i))}>Quitar</button></div>)}</div>}
            {aiDocRes&&<div style={{marginTop:12}}>
              <div className="auth-info" style={{whiteSpace:"pre-wrap"}}>{aiDocRes.text||"Documento leído."}</div>
              {/* El bloque de "ingresar datos" solo tiene sentido si el
                  documento realmente trae campos de propiedad. */}
              {aiDocRes.datos&&datosACampos().nCampos>0&&<>
              <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center",margin:"10px 0"}}>
                <span className="label" style={{margin:0}}>Ingresar en:</span>
                <select className="input" style={{maxWidth:300,width:"auto"}} value={aiDocDest} onChange={e=>setAiDocDest(e.target.value)}>
                  <option value="nueva">Crear propiedad nueva</option>
                  {props.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
                </select>
                <button className="btn btn-red" onClick={aplicarDatos}>Ingresar datos a la plataforma</button>
              </div>
              <div style={{fontSize:13,color:"var(--muted)"}}>Se rellenan solo los campos que la IA encontró en el documento; lo que ya existe no se borra.</div>
              </>}
              <Sugerencias res={aiDocRes} props={props} onEjecutar={ejecutarSugerencias}/>
            </div>}
          </div>
          <div className="card pad" style={{marginBottom:14}}>
            <div className="sec-title">Informes desde el asistente</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <button className="btn btn-out btn-sm" onClick={()=>abrirImprimir(informeGeneralHTML())}>Informe general (PDF)</button>

            </div>
          </div>

            <div ref={chatRef} style={{flex:1,display:"flex",flexDirection:"column",gap:12,overflowY:"auto",maxHeight:400,marginBottom:14}}>
              {ai.length===0 && <div style={{textAlign:"center",padding:30}}>
                <div style={{fontSize:40,marginBottom:10}}></div>
                <div style={{color:"var(--muted)",marginBottom:16,fontSize:16}}>Usa un comando rápido arriba, o escribe tu pregunta:</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:8,justifyContent:"center"}}>
                  {["¿Qué propiedad da más utilidad?","¿Cuánto debo de dividendos en total?","¿Cuál NO cubre sus gastos?","Redacta un recordatorio de pago"].map(q=><button key={q} className="btn btn-out btn-sm" onClick={()=>setAiIn(q)}>{q}</button>)}
                </div></div>}
              {ai.map((m,i)=>(<div key={i} style={{display:"flex",justifyContent:m.r==="user"?"flex-end":"flex-start"}}><div className="chat-msg" style={{background:m.r==="user"?"var(--red)":"#f1f4f8",color:m.r==="user"?"#fff":"var(--text)",whiteSpace:"pre-wrap"}}>{m.c}</div></div>))}
              {aiLoad && <div style={{display:"flex"}}><div className="chat-msg" style={{background:"var(--panel2)",color:"var(--muted)"}}>Analizando…</div></div>}
            </div>
            {aiAdj.length>0&&<div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}>{aiAdj.map((f,i)=><span key={i} className="pill grey" style={{display:"inline-flex",gap:6,alignItems:"center"}}>{f.name}<span style={{cursor:"pointer",fontWeight:800}} onClick={()=>setAiAdj(a=>a.filter((_,j)=>j!==i))}>✕</span></span>)}</div>}
            <div style={{display:"flex",gap:10}}>
              <label className="btn btn-out" style={{cursor:"pointer",padding:"10px 13px"}} title="Adjuntar foto o PDF">＋<input type="file" accept="image/*,.pdf,application/pdf" multiple style={{display:"none"}} onChange={async e=>{ const fs=[...e.target.files]; e.target.value=""; try{ const ls=await Promise.all(fs.map(leerArchivoB64)); setAiAdj(a=>[...a,...ls]); }catch(err){ notify(err.message,true); } }}/></label>
              <input className="input" value={aiIn} onChange={e=>setAiIn(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sendAi()} placeholder="Escribe tu consulta o adjunta un archivo…"/>
              <button className="btn btn-red" onClick={sendAi} disabled={aiLoad}>Enviar</button>
            </div>
          </div>
        </>}

        {/* ============ PREGUNTAS FRECUENTES ============ */}
        {tab==="faq" && <>
          <div className="help">Aquí respondemos las dudas más comunes sobre la plataforma. Toca cualquier pregunta para ver la respuesta.</div>
          {FAQ.map(g=>(<div key={g.cat}>
            <div className="sub-title dark" style={{marginTop:6}}>{g.cat}</div>
            {g.items.map((it,i)=>(<Collapsible key={i} icon="❓" title={it.q} defaultOpen={false}>
              <div style={{fontSize:15,lineHeight:1.75,color:"var(--text)"}}>{it.a}</div>
            </Collapsible>))}
          </div>))}
          <div className="help g" style={{marginTop:6}}>¿No encuentras tu duda? Usa el <b>Asistente</b> () y escríbele tu pregunta en palabras simples.</div>
        </>}

      </div>
    </div>

    {/* ============ MODALES ============ */}
    {mAdd && <div className="modal-bg" onClick={()=>setMAdd(false)}><div className="modal" onClick={e=>e.stopPropagation()}>
      <div className="modal-head"><h3>Nueva propiedad</h3><p>Sube los documentos y deja que la IA complete el formulario, o llénalo a mano.</p></div>

        {lectorIA({
          titulo:"Completar con IA desde tus archivos",
          ayuda:<>Sube el <b>contrato, la escritura, el certificado de dominio, una liquidación o incluso una foto o pantallazo</b>. La IA los lee y rellena los campos de abajo. Sirven fotos, PDF, Word, Excel y archivos de texto.</>,

        <PropForm d={nP} set={setNP}/>
      </div>
      <div className="modal-foot"><button className="btn btn-red" style={{flex:1}} onClick={addProp}>Agregar y guardar</button><button className="btn btn-out" onClick={()=>setMAdd(false)}>Cancelar</button></div>
    </div></div>}

    {mEdit && eP && <div className="modal-bg" onClick={()=>setMEdit(null)}><div className="modal" onClick={e=>e.stopPropagation()}>
      <div className="modal-head"><h3>Editar — {mEdit.name}</h3><p>Modifica ficha, arrendatario, crédito o gastos.</p></div>
      <div className="modal-body">
        {lectorIA({
          titulo:"Corregir o completar con IA",
          ayuda:<>Sube la <b>escritura, el certificado de dominio, el contrato o una foto</b> y la IA corrige lo que esté mal y completa lo que falte. Solo toca los campos que encuentre; el resto queda igual.</>,
          onAplicar:rellenarFormEdicion})}
        <PropForm d={eP} set={setEP}/>
      </div>
      <div className="modal-foot"><button className="btn btn-green" style={{flex:1}} onClick={saveEdit}>Guardar cambios</button><button className="btn btn-out" style={{color:"var(--red-d)",borderColor:"var(--red-soft)"}} onClick={()=>{setMEdit(null);setMDel(eP);}}>✕ Eliminar</button><button className="btn btn-out" onClick={()=>setMEdit(null)}>Cancelar</button></div>
    </div></div>}

    {mNewTenant && <div className="modal-bg" onClick={()=>setMNewTenant(null)}><div className="modal" onClick={e=>e.stopPropagation()}>
      <div className="modal-head"><h3>+ Agregar nuevo arrendatario</h3><p>Elige la propiedad y carga los datos. Se actualiza solo en Arrendatarios, Cobros y la ficha.</p></div>

        {props.length===0 ? <div className="help">Primero agrega una propiedad con <b>＋ Nueva propiedad</b>.</div> : <>
        <div className="field" style={{marginBottom:12}}>
          <label className="label">¿A qué propiedad va este arrendatario? *</label>
          <select value={ntForm.propId} onChange={e=>setNtForm(f=>({...f,propId:e.target.value}))}>
            <option value="">— Elige una propiedad —</option>
            {props.map(p=>(<option key={p.id} value={p.id}>{p.name}{p.comuna?" · "+p.comuna:""}{p.tenant&&p.tenant.trim()?" (reemplaza a "+p.tenant+")":""}{p.use==="personal"?" (pasará a arriendo)":""}</option>))}
          </select>
        </div>
        {(()=>{ const sp=props.find(x=>x.id===ntForm.propId); return sp&&sp.tenant&&sp.tenant.trim()? <div className="help" style={{marginBottom:12}}>Esta propiedad ya tiene a <b>{sp.tenant}</b>. Al guardar, se moverá al <b>historial</b> y el nuevo arrendatario quedará como vigente.</div>:null; })()}
        <div className="sub-title green">Datos del arrendatario</div>
        <div className="grid c2" style={{gridTemplateColumns:"1fr 1fr"}}>
          <div className="field"><label className="label">Nombre completo *</label><input className="input" value={ntForm.tenant} onChange={e=>setNtForm(f=>({...f,tenant:e.target.value}))} placeholder="Nombre y apellido"/></div>
          <div className="field"><label className="label">RUT</label><input className="input" value={ntForm.tenantRut} onChange={e=>setNtForm(f=>({...f,tenantRut:e.target.value}))} placeholder="12.345.678-9"/></div>
          <div className="field"><label className="label">Correo</label><input className="input" type="email" value={ntForm.tenantEmail} onChange={e=>setNtForm(f=>({...f,tenantEmail:e.target.value}))} placeholder="correo@ejemplo.cl"/></div>
          <div className="field"><label className="label">Teléfono</label><input className="input" value={ntForm.tenantPhone} onChange={e=>setNtForm(f=>({...f,tenantPhone:e.target.value}))} placeholder="+56912345678"/></div>
          <div className="field"><label className="label">WhatsApp</label><input className="input" value={ntForm.tenantWhatsapp} onChange={e=>setNtForm(f=>({...f,tenantWhatsapp:e.target.value}))} placeholder="+56912345678"/></div>
        </div>
        <div className="sub-title green">Contrato y arriendo</div>
        <div className="help" style={{marginBottom:10}}>El arriendo se guarda <b>en UF</b> y se reajusta solo. {ntForm.rentUF!=="" && <>Hoy ≈ <b>{CLP(num(ntForm.rentUF)*uf)}/mes</b>.</>}</div>
        <div className="grid c2" style={{gridTemplateColumns:"1fr 1fr"}}>
          <div className="field"><label className="label">Arriendo mensual (UF)</label><input className="input" type="number" min="0" step="any" value={ntForm.rentUF} onChange={e=>setNtForm(f=>({...f,rentUF:e.target.value}))} placeholder="16.5"/></div>
          <div className="field"><label className="label">Garantía (CLP)</label><input className="input" type="number" value={ntForm.garantiaMonto} onChange={e=>setNtForm(f=>({...f,garantiaMonto:e.target.value}))} placeholder="650000"/></div>
          <div className="field"><label className="label">Inicio del contrato</label><input className="input" type="date" value={ntForm.contractStart} onChange={e=>setNtForm(f=>({...f,contractStart:e.target.value}))}/></div>
          <div className="field"><label className="label">Término del contrato</label><input className="input" type="date" value={ntForm.contractEnd} onChange={e=>setNtForm(f=>({...f,contractEnd:e.target.value}))}/></div>
        </div>
        </>}
      </div>
      <div className="modal-foot"><button className="btn btn-green" style={{flex:1}} disabled={props.length===0} onClick={guardarNuevoArrendatario}>Guardar arrendatario</button><button className="btn btn-out" onClick={()=>setMNewTenant(null)}>Cancelar</button></div>
    </div></div>}

    {cEdit && <div className="modal-bg" onClick={()=>setCEdit(null)}><div className="modal" style={{width:720}} onClick={e=>e.stopPropagation()}>
      <div className="modal-head"><h3>{contacts.some(x=>x.id===cEdit.id)?"Editar contacto":"Nuevo contacto"}</h3><p>Guarda toda la información de contacto de un arrendatario (actual o pasado), aval, proveedor, etc.</p></div>
      <div className="modal-body">
        <div className="seg" style={{marginBottom:12}}>
          <button className={!cEdit.esEmpresa?"on":""} onClick={()=>setCEdit(c=>({...c,esEmpresa:false}))}>Persona</button>
          <button className={cEdit.esEmpresa?"on":""} onClick={()=>setCEdit(c=>({...c,esEmpresa:true}))}>Empresa</button>
        </div>
        <div className="grid c2" style={{gridTemplateColumns:"1fr 1fr"}}>
          <div className="field"><label className="label">{cEdit.esEmpresa?"Razón social *":"Nombre(s) *"}</label><input className="input" value={cEdit.nombre} onChange={e=>setCEdit(c=>({...c,nombre:e.target.value}))}/></div>
          {!cEdit.esEmpresa && <div className="field"><label className="label">Primer apellido</label><input className="input" value={cEdit.primerApellido} onChange={e=>setCEdit(c=>({...c,primerApellido:e.target.value}))}/></div>}
          {!cEdit.esEmpresa && <div className="field"><label className="label">Segundo apellido</label><input className="input" value={cEdit.segundoApellido} onChange={e=>setCEdit(c=>({...c,segundoApellido:e.target.value}))}/></div>}
          <div className="field"><label className="label">RUT</label><input className="input" value={cEdit.rut} onChange={e=>setCEdit(c=>({...c,rut:e.target.value}))} placeholder="12.345.678-9"/></div>
          <div className="field"><label className="label">Correo</label><input className="input" type="email" value={cEdit.email} onChange={e=>setCEdit(c=>({...c,email:e.target.value}))}/></div>
          <div className="field"><label className="label">Teléfono / WhatsApp</label><input className="input" value={cEdit.telefono} onChange={e=>setCEdit(c=>({...c,telefono:e.target.value}))} placeholder="+56912345678"/></div>
          <div className="field"><label className="label">Tipo de contacto</label><select value={cEdit.tipo} onChange={e=>setCEdit(c=>({...c,tipo:e.target.value}))}>{["arrendatario","arrendatario anterior","aval / codeudor","proveedor","otro"].map(t=><option key={t} value={t}>{t}</option>)}</select></div>
          <div className="field"><label className="label">Propiedad asociada</label><select value={cEdit.propId||""} onChange={e=>setCEdit(c=>({...c,propId:e.target.value}))}><option value="">— Ninguna —</option>{props.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
        </div>
        {!cEdit.esEmpresa && <div className="grid c2" style={{gridTemplateColumns:"1fr 1fr"}}>
          <div className="field"><label className="label">Profesión u ocupación</label><input className="input" value={cEdit.profesion} onChange={e=>setCEdit(c=>({...c,profesion:e.target.value}))}/></div>
          <div className="field"><label className="label">Nacionalidad</label><input className="input" value={cEdit.nacionalidad} onChange={e=>setCEdit(c=>({...c,nacionalidad:e.target.value}))}/></div>
        </div>}
        <div className="sub-title green">Periodo de arriendo (si fue arrendatario)</div>
        <div className="grid c2" style={{gridTemplateColumns:"repeat(3,1fr)"}}>
          <div className="field"><label className="label">Desde</label><input className="input" type="date" value={cEdit.desde} onChange={e=>setCEdit(c=>({...c,desde:e.target.value}))}/></div>
          <div className="field"><label className="label">Hasta</label><input className="input" type="date" value={cEdit.hasta} onChange={e=>setCEdit(c=>({...c,hasta:e.target.value}))}/></div>
          <div className="field"><label className="label">Arriendo (UF)</label><input className="input" type="number" min="0" step="any" value={cEdit.arriendoUF} onChange={e=>setCEdit(c=>({...c,arriendoUF:e.target.value}))}/></div>
        </div>
        <div className="sub-title green">Antecedentes (InfoCheck)</div>
        <div className="grid c2" style={{gridTemplateColumns:"repeat(3,1fr)"}}>
          <div className="field"><label className="label">Puntaje InfoCheck</label><input className="input" type="number" value={(cEdit.infocheck||{}).puntaje||""} onChange={e=>setCEdit(c=>({...c,infocheck:{...(c.infocheck||{}),puntaje:e.target.value}}))}/></div>
          <div className="field"><label className="label">Capacidad de pago (CLP)</label><input className="input" type="number" value={(cEdit.infocheck||{}).capacidadPago||""} onChange={e=>setCEdit(c=>({...c,infocheck:{...(c.infocheck||{}),capacidadPago:e.target.value}}))}/></div>
          <div className="field"><label className="label">Renta líquida (CLP)</label><input className="input" type="number" value={(cEdit.infocheck||{}).rentaLiquida||""} onChange={e=>setCEdit(c=>({...c,infocheck:{...(c.infocheck||{}),rentaLiquida:e.target.value}}))}/></div>
          <div className="field"><label className="label">Deuda directa CMF (CLP)</label><input className="input" type="number" value={(cEdit.infocheck||{}).deudaCMF||""} onChange={e=>setCEdit(c=>({...c,infocheck:{...(c.infocheck||{}),deudaCMF:e.target.value}}))}/></div>
          <div className="field"><label className="label">Fuente de ingresos</label><input className="input" value={(cEdit.infocheck||{}).fuenteIngresos||""} onChange={e=>setCEdit(c=>({...c,infocheck:{...(c.infocheck||{}),fuenteIngresos:e.target.value}}))}/></div>
          <div className="field"><label className="label">Fecha del informe</label><input className="input" type="date" value={(cEdit.infocheck||{}).fecha||""} onChange={e=>setCEdit(c=>({...c,infocheck:{...(c.infocheck||{}),fecha:e.target.value}}))}/></div>
        </div>
        <div className="sub-title green" style={{marginTop:12}}>Informe Equifax (Boletín Comercial / DICOM)</div>
        <div className="grid c3" style={{gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
          {[["score","Score Equifax","number"],["morosidades","Morosidades vigentes (CLP)","number"],["protestos","N° de protestos","number"],["deudaImpaga","Deuda impaga informada (CLP)","number"],["fecha","Fecha del informe","date"]].map(f=>(
            <div key={f[0]} className="field"><label className="label">{f[1]}</label><input className="input" type={f[2]||"text"} value={(cEdit.equifax||{})[f[0]]||""} onChange={e=>setCEdit(c=>({...c,equifax:{...(c.equifax||{}),[f[0]]:e.target.value}}))}/></div>))}
        </div>
        <div className="field" style={{marginTop:8}}><label className="label">Notas</label><textarea className="input" rows="2" value={cEdit.notas} onChange={e=>setCEdit(c=>({...c,notas:e.target.value}))} placeholder="Ej: buen pagador, dejó la propiedad en buen estado, motivo de término…"></textarea></div>
        <AdjuntosEditor items={cEdit.archivos||[]} onChange={list=>setCEdit(c=>({...c,archivos:list}))}/>
      </div>
      <div className="modal-foot"><button className="btn btn-green" style={{flex:1}} onClick={guardarContactoGral}>Guardar contacto</button>{contacts.some(x=>x.id===cEdit.id)&&<button className="btn btn-out" style={{color:"var(--red-d)",borderColor:"var(--red-soft)"}} onClick={()=>{eliminarContacto(cEdit.id);setCEdit(null);}}>✕ Eliminar</button>}<button className="btn btn-out" onClick={()=>setCEdit(null)}>Cancelar</button></div>
    </div></div>}

    {mFicha && fForm && <div className="modal-bg" onClick={()=>setMFicha(null)}><div className="modal" style={{width:"min(940px,96vw)"}} onClick={e=>e.stopPropagation()}>
      <div className="modal-head"><h3>Ficha completa — {fForm.alias||mFicha.name}</h3><p>Completa todos los antecedentes de la propiedad. Puedes <b>previsualizar</b> antes de compartir y <b>exportar</b> a PDF, Word, Excel o HTML, o compartir por WhatsApp, correo o SMS. Los datos se guardan al tocar <b>Guardar</b>.</p></div>
      <div className="modal-body">
        {FICHA_SECS.map(s=>(<div key={s.t}>
          <div className="sub-title green" style={{marginTop:10}}>{s.ico} {s.t}</div>
          <div className="grid" style={{gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
            {s.f.map(ff=>(<div className="field" key={ff[0]}><label className="label">{ff[1]}</label><input className="input" type={ff[2]==="date"?"date":"text"} value={fForm[ff[0]]||""} onChange={e=>fset(ff[0],e.target.value)} style={{padding:"7px 9px"}}/></div>))}
          </div>
        </div>))}

        <div className="sub-title green" style={{marginTop:12}}>Arrendatarios anteriores</div>
        <div className="help" style={{marginBottom:8}}>Sin límite: agrega o elimina las filas que necesites.</div>
        {(fForm.arrendatariosAnteriores||[]).map((r,i)=>(<div key={i} style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center",marginBottom:6}}>
          <input className="input" placeholder="Nombre" value={r.nombre||""} onChange={e=>setFilaAnt(i,"nombre",e.target.value)} style={{flex:"2 1 140px",padding:"6px 8px"}}/>
          <input className="input" placeholder="RUT" value={r.rut||""} onChange={e=>setFilaAnt(i,"rut",e.target.value)} style={{flex:"1 1 90px",padding:"6px 8px"}}/>
          <input className="input" type="date" title="Desde" value={r.desde||""} onChange={e=>setFilaAnt(i,"desde",e.target.value)} style={{flex:"1 1 120px",padding:"6px 8px"}}/>
          <input className="input" type="date" title="Hasta" value={r.hasta||""} onChange={e=>setFilaAnt(i,"hasta",e.target.value)} style={{flex:"1 1 120px",padding:"6px 8px"}}/>
          <input className="input" placeholder="Arriendo" value={r.arriendo||""} onChange={e=>setFilaAnt(i,"arriendo",e.target.value)} style={{flex:"1 1 90px",padding:"6px 8px"}}/>
          <input className="input" placeholder="Motivo de término" value={r.motivo||""} onChange={e=>setFilaAnt(i,"motivo",e.target.value)} style={{flex:"2 1 140px",padding:"6px 8px"}}/>
          <button className="btn btn-ghost btn-sm" title="Eliminar fila" onClick={()=>delFilaAnt(i)}>✕</button>
        </div>))}
        <button className="btn btn-out btn-sm" onClick={addFilaAnt}>+ Agregar arrendatario anterior</button>

        <div className="sub-title green" style={{marginTop:14}}>Propietarios anteriores (cadena de dominio)</div>
        <div className="help" style={{marginBottom:8}}>Sin límite: agrega o elimina las filas que necesites.</div>
        {(fForm.duenosAnteriores||[]).map((r,i)=>(<div key={i} style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center",marginBottom:6}}>
          <input className="input" placeholder="Propietario" value={r.propietario||""} onChange={e=>setFilaDue(i,"propietario",e.target.value)} style={{flex:"2 1 140px",padding:"6px 8px"}}/>
          <input className="input" placeholder="RUT" value={r.rut||""} onChange={e=>setFilaDue(i,"rut",e.target.value)} style={{flex:"1 1 90px",padding:"6px 8px"}}/>
          <input className="input" type="date" title="Desde" value={r.desde||""} onChange={e=>setFilaDue(i,"desde",e.target.value)} style={{flex:"1 1 120px",padding:"6px 8px"}}/>
          <input className="input" type="date" title="Hasta" value={r.hasta||""} onChange={e=>setFilaDue(i,"hasta",e.target.value)} style={{flex:"1 1 120px",padding:"6px 8px"}}/>
          <input className="input" placeholder="Forma de adquisición" value={r.forma||""} onChange={e=>setFilaDue(i,"forma",e.target.value)} style={{flex:"2 1 140px",padding:"6px 8px"}}/>
          <input className="input" placeholder="Fojas / N° / Año" value={r.fojas||""} onChange={e=>setFilaDue(i,"fojas",e.target.value)} style={{flex:"1 1 110px",padding:"6px 8px"}}/>
          <button className="btn btn-ghost btn-sm" title="Eliminar fila" onClick={()=>delFilaDue(i)}>✕</button>
        </div>))}
        <button className="btn btn-out btn-sm" onClick={addFilaDue}>+ Agregar propietario anterior</button>

        <div className="field" style={{marginTop:14}}><label className="label">Observaciones</label><textarea className="input" rows="3" value={fForm.observaciones||""} onChange={e=>fset("observaciones",e.target.value)} placeholder="Comentarios, pendientes, particularidades de la propiedad…"></textarea></div>
        <AdjuntosEditor items={fForm.archivos||[]} onChange={list=>fset("archivos",list)}/>

        <div className="sub-title green" style={{marginTop:14}}>Enlace interactivo (para llenar desde fuera)</div>
        <div className="help" style={{marginBottom:8}}>Genera un enlace para que otra persona (un corredor, el dueño, etc.) complete esta ficha desde su navegador, con <b>casillas ilimitadas</b> y <b>archivos adjuntos</b>. Cuando guarde, puedes <b>traer sus cambios</b> aquí. El enlace funciona en el sitio publicado (<b>adminpropiedadescgvd.com</b>), no en la vista previa.</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <button className="btn btn-out btn-sm" onClick={publicarFichaPublica}>{fForm.fichaPublicId?"Actualizar enlace":"Generar enlace"}</button>
          {fForm.fichaPublicId&&<button className="btn btn-out btn-sm" onClick={traerFichaPublica}>Traer lo que completaron</button>}
        </div>
        {!!fichaPubURL && <div style={{marginTop:8}}>
          <input className="input" readOnly value={fichaPubURL} onFocus={e=>e.target.select()} style={{fontSize:13,background:"var(--panel2)"}}/>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:6}}>
            <button className="btn btn-ghost btn-sm" onClick={()=>{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(fichaPubURL).then(()=>notify("Enlace copiado")).catch(()=>notify("No se pudo copiar",true)); } else notify("Copia el enlace manualmente",true); }}>Copiar enlace</button>
            <a className="btn btn-ghost btn-sm" href={"https://wa.me/?text="+encodeURIComponent("Completa la ficha de la propiedad aquí: "+fichaPubURL)} target="_blank" rel="noreferrer">WhatsApp</a>
            <a className="btn btn-ghost btn-sm" href={"mailto:?subject="+encodeURIComponent("Ficha de propiedad")+"&body="+encodeURIComponent("Completa la ficha aquí: "+fichaPubURL)}>Correo</a>
            <a className="btn btn-ghost btn-sm" href={"sms:?&body="+encodeURIComponent("Completa la ficha aquí: "+fichaPubURL)}>SMS</a>
          </div>
        </div>}

        {levantamientoBox()}
      </div>
      <div className="modal-foot" style={{flexWrap:"wrap",gap:8}}>
        <button className="btn btn-green btn-sm" onClick={guardarFicha}>Guardar</button>
        <button className="btn btn-red btn-sm" onClick={()=>setFichaPreview(buildFichaCompletaHTML(mFicha,fForm))}>Previsualizar</button>
        <button className="btn btn-out btn-sm" onClick={()=>descargarFichaCompletaPDF(mFicha,fForm)}>PDF</button>
        <button className="btn btn-out btn-sm" onClick={()=>descargarFichaCompletaWord(mFicha,fForm)}>Word</button>
        <button className="btn btn-out btn-sm" onClick={()=>descargarFichaCompletaExcel(mFicha,fForm)}>Excel</button>
        <button className="btn btn-out btn-sm" onClick={()=>descargarFichaCompletaHTML2(mFicha,fForm)}>HTML</button>
        <button className="btn btn-out btn-sm" onClick={()=>compartirFichaCompletaWA(mFicha,fForm)}>WhatsApp</button>
        <button className="btn btn-out btn-sm" onClick={()=>compartirFichaCompletaMail(mFicha,fForm)}>Correo</button>
        <button className="btn btn-out btn-sm" onClick={()=>compartirFichaCompletaSMS(mFicha,fForm)}>SMS</button>
        <button className="btn btn-out btn-sm" onClick={abrirLevantamiento}>Ficha de Levantamiento</button>
        <button className="btn btn-ghost btn-sm" style={{marginLeft:"auto"}} onClick={()=>setMFicha(null)}>Cerrar</button>
      </div>
    </div></div>}

    {fichaPreview!=null && <div className="modal-bg" style={{zIndex:60}} onClick={()=>setFichaPreview(null)}>
      <div className="modal" style={{width:"min(980px,97vw)",height:"94vh",display:"flex",flexDirection:"column"}} onClick={e=>e.stopPropagation()}>
        <div className="modal-head" style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap"}}>
          <div><h3 style={{margin:0}}>Vista previa de la ficha</h3><p style={{margin:0}}>Así se verá al compartirla o exportarla. ¿Quieres cambiar algo? Toca “Seguir editando”.</p></div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            <button className="btn btn-out btn-sm" onClick={()=>setFichaPreview(null)}>Seguir editando</button>
            {mFicha&&<button className="btn btn-red btn-sm" onClick={()=>descargarFichaCompletaPDF(mFicha,fForm)}>PDF</button>}
            {mFicha&&<button className="btn btn-out btn-sm" onClick={()=>descargarFichaCompletaWord(mFicha,fForm)}>Word</button>}
            {mFicha&&<button className="btn btn-out btn-sm" onClick={()=>descargarFichaCompletaExcel(mFicha,fForm)}>Excel</button>}
          </div>
        </div>
        <iframe srcDoc={fichaPreview} title="Vista previa de la ficha" style={{flex:1,width:"100%",border:"none",background:"#fff",borderRadius:"0 0 12px 12px"}}/>
      </div>
    </div>}

    {mDel && <div className="modal-bg" onClick={()=>setMDel(null)}><div className="modal" style={{width:440}} onClick={e=>e.stopPropagation()}>
      <div className="modal-body" style={{textAlign:"center"}}><div style={{fontSize:46,marginBottom:10}}>✕</div><h3 style={{fontSize:20,fontWeight:800,marginBottom:10}}>¿Eliminar propiedad?</h3>
        <p style={{color:"var(--muted)",marginBottom:20}}>Se eliminará <b>{mDel.name}</b> y todo su historial. Esta acción no se puede deshacer.</p>
        <div style={{display:"flex",gap:10}}><button className="btn btn-red" style={{flex:1}} onClick={doDel}>Sí, eliminar</button><button className="btn btn-out" style={{flex:1}} onClick={()=>setMDel(null)}>Cancelar</button></div>
      </div>
    </div></div>}

    {mSoc && <div className="modal-bg" onClick={()=>setMSoc(false)}><div className="modal" onClick={e=>e.stopPropagation()}>
      <div className="modal-head"><h3>{socEditId?"Editar sociedad":"Nueva sociedad"}</h3><p>Datos de la empresa propietaria: identificación, representante legal, contacto y cuenta bancaria.</p></div>
      <div className="modal-body"><SocForm d={socForm} set={setSocForm}/></div>
      <div className="modal-foot">
        <button className="btn btn-red" style={{flex:1}} onClick={saveSoc}>{socEditId?"Guardar cambios":"Agregar y guardar"}</button>
        {socEditId && <button className="btn btn-out" style={{color:"var(--red-d)",borderColor:"var(--red-soft)"}} onClick={()=>{ const s=socById(socEditId); setMSoc(false); setMSocDel(s); }}>✕ Eliminar</button>}
        <button className="btn btn-out" onClick={()=>setMSoc(false)}>Cancelar</button>
      </div>
    </div></div>}

    {mSocDel && <div className="modal-bg" onClick={()=>setMSocDel(null)}><div className="modal" style={{width:460}} onClick={e=>e.stopPropagation()}>
      <div className="modal-body" style={{textAlign:"center"}}><div style={{fontSize:46,marginBottom:10}}>✕</div><h3 style={{fontSize:20,fontWeight:800,marginBottom:10}}>¿Eliminar sociedad?</h3>
        {(()=>{ const usadas=props.filter(p=>(p.sociedad||"")===mSocDel.id).length; return usadas>0
          ? <p style={{color:"var(--red-d)",marginBottom:20}}>No se puede eliminar <b>{mSocDel.name}</b> porque tiene <b>{usadas} propiedad{usadas!==1?"es":""}</b> asociada{usadas!==1?"s":""}. Primero reasigna o elimina esas propiedades.</p>
          : <p style={{color:"var(--muted)",marginBottom:20}}>Se eliminará <b>{mSocDel.name}</b>. Esta acción no se puede deshacer.</p>; })()}
        <div style={{display:"flex",gap:10}}>
          {props.filter(p=>(p.sociedad||"")===mSocDel.id).length===0 && <button className="btn btn-red" style={{flex:1}} onClick={doDelSoc}>Sí, eliminar</button>}
          <button className="btn btn-out" style={{flex:1}} onClick={()=>setMSocDel(null)}>Cancelar</button>
        </div>
      </div>
    </div></div>}

    {mVac && <div className="modal-bg" onClick={()=>setMVac(null)}><div className="modal" style={{width:520}} onClick={e=>e.stopPropagation()}>
      <div className="modal-head"><h3>Registrar laguna de arriendo</h3><p>{mVac.name} — periodo en que la propiedad estuvo sin arrendatario.</p></div>
      <div className="modal-body"><div className="grid c2" style={{gridTemplateColumns:"1fr 1fr",gap:12}}>
        <div className="field"><label className="label">Desde</label><input className="input" type="date" value={vac.desde} onChange={e=>setVac(v=>({...v,desde:e.target.value}))}/></div>
        <div className="field"><label className="label">Hasta</label><input className="input" type="date" value={vac.hasta} onChange={e=>setVac(v=>({...v,hasta:e.target.value}))}/></div>
      </div><div className="field" style={{marginTop:12}}><label className="label">Motivo / notas</label><input className="input" placeholder="Ej: reparaciones, búsqueda de arrendatario" value={vac.notas} onChange={e=>setVac(v=>({...v,notas:e.target.value}))}/></div></div>
      <div className="modal-foot"><button className="btn btn-red" style={{flex:1}} onClick={addVacancia}>Guardar laguna</button><button className="btn btn-out" onClick={()=>setMVac(null)}>Cancelar</button></div>
    </div></div>}

    {mInc && <div className="modal-bg" onClick={()=>setMInc(null)}><div className="modal" style={{width:560}} onClick={e=>e.stopPropagation()}>
      <div className="modal-head"><h3>Nueva incidencia</h3><p>{mInc.name}</p></div>
      <div className="modal-body">
        <div className="field"><label className="label">Título *</label><input className="input" placeholder="Ej: Filtración en baño" value={incForm.titulo} onChange={e=>setIncForm(f=>({...f,titulo:e.target.value}))}/></div>
        <div className="grid c2" style={{gridTemplateColumns:"1fr 1fr",gap:12,marginTop:12}}>
          <div className="field"><label className="label">Prioridad</label><select value={incForm.prioridad} onChange={e=>setIncForm(f=>({...f,prioridad:e.target.value}))}>{PRIORIDADES_INC.map(s=><option key={s}>{s}</option>)}</select></div>
          <div className="field"><label className="label">Categoría</label><select value={incForm.categoria} onChange={e=>setIncForm(f=>({...f,categoria:e.target.value}))}>{CAT_INC.map(s=><option key={s}>{s}</option>)}</select></div>
        </div>
        <div className="field" style={{marginTop:12}}><label className="label">Descripción</label><textarea value={incForm.descripcion} onChange={e=>setIncForm(f=>({...f,descripcion:e.target.value}))}/></div>
        <AdjuntosEditor items={incForm.adjuntos} onChange={list=>setIncForm(f=>({...f,adjuntos:list}))}/>
      </div>
      <div className="modal-foot"><button className="btn btn-red" style={{flex:1}} onClick={guardarIncidencia}>Registrar</button><button className="btn btn-out" onClick={()=>setMInc(null)}>Cancelar</button></div>
    </div></div>}

    {/* COMPARTIR INCIDENCIA — modal */}
    {mIncShare && (()=>{ const p=mIncShare.p, x=mIncShare.inc; const txt=incTexto(p,x); const enc=encodeURIComponent(txt); const asunto=encodeURIComponent("Incidencia: "+x.titulo+" · "+p.name); const slug=(s)=>String(s||"incidencia").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]+/g,"_").slice(0,40);
      return (<div className="modal-bg" onClick={()=>setMIncShare(null)}><div className="modal" style={{width:560}} onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><h3>Compartir incidencia</h3><p>{x.titulo} · {p.name}</p></div>
        <div className="modal-body">
          <div className="help g" style={{marginBottom:12}}>Comparte la incidencia con toda su información por el medio que prefieras, o descárgala como documento.</div>
          <div className="field"><label className="label">Texto a compartir (editable antes de copiar)</label>
            <textarea style={{minHeight:160,fontFamily:"inherit"}} value={txt} readOnly/></div>
          <div style={{display:"flex",flexWrap:"wrap",gap:8,marginTop:6}}>
            <button className="btn btn-out btn-sm" onClick={()=>copiarTexto(txt)}>Copiar texto</button>
            <a className="btn btn-out btn-sm" href={`https://wa.me/?text=${enc}`} target="_blank" rel="noreferrer">WhatsApp</a>
            <a className="btn btn-out btn-sm" href={`mailto:?subject=${asunto}&body=${enc}`}>Correo</a>
            <a className="btn btn-out btn-sm" href={`sms:?&body=${enc}`}>SMS</a>
            <button className="btn btn-out btn-sm" onClick={()=>descargarBlob("incidencia_"+slug(x.titulo)+".doc",incHtml(p,x),"application/msword")}>Word</button>
            <button className="btn btn-out btn-sm" onClick={()=>descargarBlob("incidencia_"+slug(x.titulo)+".xls",htmlDoc("Incidencia","<table>"+incCSV(p,x).split("\r\n").map(r=>"<tr>"+r.split(";").map(c=>"<td>"+esc(c.replace(/^"|"$/g,"").replace(/""/g,'"'))+"</td>").join("")+"</tr>").join("")+"</table>"),"application/vnd.ms-excel")}>Excel</button>
            <button className="btn btn-out btn-sm" onClick={()=>descargarBlob("incidencia_"+slug(x.titulo)+".csv","\ufeff"+incCSV(p,x),"text/csv;charset=utf-8")}>CSV</button>
          </div>
          {!!(x.adjuntos&&x.adjuntos.length)&&<div style={{marginTop:14}}><div className="label" style={{marginBottom:6}}>Archivos adjuntos (enlaces)</div><AdjuntosView items={x.adjuntos}/></div>}
        </div>
        <div className="modal-foot"><button className="btn btn-out" style={{flex:1}} onClick={()=>setMIncShare(null)}>Cerrar</button></div>
      </div></div>); })()}

    {/* COMPARTIR — modal */}
    {mShare && (()=>{ const sp=props.find(x=>x.id===mShare.id)||mShare; return (
      <div className="modal-bg" onClick={()=>setMShare(null)}><div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><h3>Compartir — {sp.name}</h3><p>Genera una ficha pública atractiva y compártela por enlace, WhatsApp o PDF.</p></div>
        <div className="modal-body">{sharePanel({p:sp})}</div>
        <div className="modal-foot"><button className="btn btn-out" style={{flex:1}} onClick={()=>setMShare(null)}>Cerrar</button></div>
      </div></div>
    ); })()}

    {/* GALERÍA — visor a pantalla completa */}
    {lightbox && (()=>{ const fs=lightbox.fotos||[]; const i=lightbox.i||0; const go=(d)=>setLightbox(lb=>({...lb,i:(lb.i+d+fs.length)%fs.length}));
      return (<div className="lbx" onClick={()=>setLightbox(null)}>
        <span className="x" onClick={(e)=>{e.stopPropagation();setLightbox(null);}}>×</span>
        {fs.length>1 && <span className="arr l" onClick={(e)=>{e.stopPropagation();go(-1);}}></span>}
        <img src={fs[i]} alt="" onClick={e=>e.stopPropagation()}/>
        {fs.length>1 && <span className="arr r" onClick={(e)=>{e.stopPropagation();go(1);}}></span>}
        <div style={{color:"#cfd5df",marginTop:12,fontWeight:700}}>{i+1} / {fs.length}</div>
      </div>); })()}

    {/* RECORRIDO 360° — modal */}
    {panoProp && <div className="modal-bg" onClick={()=>setPanoProp(null)}><div className="modal" style={{width:880}} onClick={e=>e.stopPropagation()}>
      <div className="modal-head"><h3>Recorrido virtual 360° — {panoProp.name}</h3><p>Vista inmersiva de cada ambiente.</p></div>
      <div className="modal-body"><PanoViewer panoramas={panoProp.panoramas||[]}/></div>
      <div className="modal-foot"><button className="btn btn-out" style={{flex:1}} onClick={()=>setPanoProp(null)}>Cerrar</button></div>
    </div></div>}

    {mBit && <div className="modal-bg" onClick={()=>setMBit(null)}><div className="modal" style={{width:560}} onClick={e=>e.stopPropagation()}>
      <div className="modal-head"><h3>Nueva entrada de bitácora</h3><p>{mBit.name}</p></div>
      <div className="modal-body">
        <div className="field"><label className="label">Tipo</label><select value={bitForm.tipo} onChange={e=>setBitForm(f=>({...f,tipo:e.target.value}))}>{TIPOS_BIT.map(s=><option key={s}>{s}</option>)}</select></div>
        <div className="field" style={{marginTop:12}}><label className="label">Título *</label><input className="input" placeholder="Ej: Firma de contrato" value={bitForm.titulo} onChange={e=>setBitForm(f=>({...f,titulo:e.target.value}))}/></div>
        <div className="field" style={{marginTop:12}}><label className="label">Detalle</label><textarea value={bitForm.texto} onChange={e=>setBitForm(f=>({...f,texto:e.target.value}))} placeholder="Notas, observaciones, referencia del documento adjunto…"/></div>
        <AdjuntosEditor items={bitForm.adjuntos} onChange={list=>setBitForm(f=>({...f,adjuntos:list}))}/>
      </div>
      <div className="modal-foot"><button className="btn btn-red" style={{flex:1}} onClick={guardarBitacora}>Agregar a la bitácora</button><button className="btn btn-out" onClick={()=>setMBit(null)}>Cancelar</button></div>
    </div></div>}

    {mPay && <div className="modal-bg" onClick={()=>{setMPay(null);setPayStep(1);}}><div className="modal" style={{width:560}} onClick={e=>e.stopPropagation()}>
      <div className="modal-head"><h3>Registrar pago</h3><p>{mPay.name} · {mPay.tenant} · {gw.name}</p></div>
      <div className="modal-body">
        {payStep===1 && <>
          <div style={{color:"var(--muted)",marginBottom:14}}>Elige el método de pago:</div>
          {[["transfer","","Transferencia bancaria",(cuentas[0]?cuentas[0].banco+" · "+cuentas[0].numero:owner.bank+" · "+owner.accountNumber)],["khipu","","Pagar con Khipu","Transferencia automática · se confirma sola"],["debit","","Tarjeta de débito","Redcompra, Visa Débito"],["credit","","Tarjeta de crédito","Visa, Mastercard, Amex"],["prepago","","Tarjeta prepago","CuentaRUT, Mach"]].map(m=>(
            <div key={m[0]} onClick={()=>setPayMethod(m[0])} style={{display:"flex",alignItems:"center",gap:14,padding:14,border:`2px solid ${payMethod===m[0]?"var(--green)":"var(--line)"}`,background:payMethod===m[0]?"var(--green-bg)":"#fff",borderRadius:12,cursor:"pointer",marginBottom:10}}>
              <span style={{fontSize:24}}>{m[1]}</span><div style={{flex:1}}><div style={{fontWeight:700}}>{m[2]}</div><div style={{fontSize:14,color:"var(--muted)"}}>{m[3]}</div></div>
              <div style={{width:20,height:20,borderRadius:"50%",border:`2px solid ${payMethod===m[0]?"var(--green)":"var(--line)"}`,background:payMethod===m[0]?"var(--green)":"#fff",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12}}>{payMethod===m[0]?"✓":""}</div>
            </div>))}
          {payMethod==="khipu" && <div className="help" style={{marginBottom:8}}>Se generará un cobro real en Khipu y se abrirá el link de pago. En cuanto el banco concilia la transferencia, el arriendo se marca <b>pagado</b> automáticamente.</div>}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",borderTop:"1px solid var(--line)",paddingTop:14,marginTop:6}}>
            <div style={{fontSize:16}}>Total: <b style={{fontSize:20,color:"var(--green-d)"}}>{CLP(montoCobro(mPay)+calcMulta(mPay))}</b></div>
            <button className="btn btn-green" disabled={khipuLoading==="pay"+mPay.id} onClick={()=>{ if(payMethod==="transfer"){markPaid(mPay.id);} else if(payMethod==="khipu"){pagarPropConKhipu(mPay);} else {setPayStep(2);} }}>{payMethod==="transfer"?"Confirmar pago":payMethod==="khipu"?(khipuLoading==="pay"+mPay.id?"Generando…":"Pagar con Khipu →"):"Ingresar tarjeta →"}</button>
          </div>
        </>}
        {payStep===2 && <>
          <div className="field"><label className="label">Número de tarjeta</label><input className="input" placeholder="0000 0000 0000 0000" maxLength={19} value={card.n} onChange={e=>{let v=e.target.value.replace(/\D/g,"").slice(0,16).replace(/(.{4})/g,"$1 ").trim();setCard(c=>({...c,n:v}));}}/></div>
          <div className="field" style={{marginTop:10}}><label className="label">Nombre en la tarjeta</label><input className="input" placeholder="NOMBRE APELLIDO" value={card.nm} onChange={e=>setCard(c=>({...c,nm:e.target.value.toUpperCase()}))}/></div>
          <div className="grid c2" style={{gridTemplateColumns:"1fr 1fr",gap:10,marginTop:10}}>
            <div className="field"><label className="label">Vencimiento</label><input className="input" placeholder="MM/AA" maxLength={5} value={card.ex} onChange={e=>{let v=e.target.value.replace(/\D/g,"");if(v.length>=3)v=v.slice(0,2)+"/"+v.slice(2,4);setCard(c=>({...c,ex:v}));}}/></div>
            <div className="field"><label className="label">CVV</label><input className="input" type="password" placeholder="000" maxLength={4} value={card.cv} onChange={e=>setCard(c=>({...c,cv:e.target.value.replace(/\D/g,"").slice(0,4)}))}/></div>
          </div>
          <div className="help g" style={{marginTop:14}}>Conexión segura vía {gw.name}. No se almacena tu tarjeta.</div>
          <div style={{display:"flex",gap:10,marginTop:16}}><button className="btn btn-out" onClick={()=>setPayStep(1)}>← Volver</button><button className="btn btn-green" style={{flex:1}} onClick={()=>{ if(!card.n||!card.nm||!card.ex||!card.cv){notify("Completa los datos de la tarjeta",true);return;} setPayStep(3); setTimeout(()=>markPaid(mPay.id),1400); }}>Pagar {CLP(montoCobro(mPay)+calcMulta(mPay))} →</button></div>
        </>}
        {payStep===3 && <div style={{textAlign:"center",padding:30}}><div style={{fontSize:46,marginBottom:12}}>⏳</div><div style={{fontWeight:700,fontSize:17}}>Procesando con {gw.name}…</div></div>}
      </div>
    </div></div>}

    {mRem && <div className="modal-bg" onClick={()=>setMRem(null)}><div className="modal" style={{width:560}} onClick={e=>e.stopPropagation()}>
      <div className="modal-head"><h3>Enviar recordatorio</h3><p>{mRem.name} · {mRem.tenant}</p></div>
      <div className="modal-body">
        <div className="label" style={{marginBottom:10}}>¿Por dónde lo envías?</div>
        <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}}>
          {[["email","","Correo",remContact.email],["whatsapp","","WhatsApp",remContact.whatsapp],["sms","","SMS",remContact.phone]].map(c=>(
            <div key={c[0]} onClick={()=>setChan(ch=>({...ch,[c[0]]:!ch[c[0]]}))} className="check" style={{cursor:"pointer",background:chan[c[0]]?"var(--green-bg)":"var(--card)",borderColor:chan[c[0]]?"var(--green)":"var(--line)"}}>
              <span style={{fontSize:18}}>{c[1]}</span><div><div style={{fontWeight:700}}>{c[2]}</div><div style={{fontSize:12,color:"var(--muted)"}}>{c[3]||"(sin dato)"}</div></div>{chan[c[0]]&&<span style={{color:"var(--green-d)"}}>✓</span>}
            </div>))}
        </div>
        <div className="card pad" style={{background:"var(--panel2)",border:"1px solid var(--line)",marginBottom:14}}>
          <div style={{fontWeight:800,fontSize:14,marginBottom:8}}>Datos de contacto del arrendatario (editables, se guardan)</div>
          <div className="grid c3" style={{gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
            <div className="field"><label className="label" style={{fontSize:12}}>Correo</label><input className="input" value={remContact.email} onChange={e=>setRemContact(c=>({...c,email:e.target.value}))}/></div>
            <div className="field"><label className="label" style={{fontSize:12}}>WhatsApp</label><input className="input" value={remContact.whatsapp} onChange={e=>setRemContact(c=>({...c,whatsapp:e.target.value}))}/></div>
            <div className="field"><label className="label" style={{fontSize:12}}>Teléfono (SMS)</label><input className="input" value={remContact.phone} onChange={e=>setRemContact(c=>({...c,phone:e.target.value}))}/></div>
          </div>
        </div>
        <div className="field"><label className="label">Mensaje (lo puedes editar)</label><textarea value={remMsg} onChange={e=>setRemMsg(e.target.value)} style={{minHeight:160}}/></div>
        <AdjuntosEditor items={remAdjuntos} onChange={setRemAdjuntos}/>
      </div>
      <div className="modal-foot"><button className="btn btn-red" style={{flex:1}} onClick={sendRem}>Enviar recordatorio</button><button className="btn btn-out" onClick={()=>setMRem(null)}>Cancelar</button></div>
    </div></div>}

    {/* Firma electrónica integrada: contrato → firma → cobro */}
    {mFirma && (()=>{ const f=mFirma.firma||{}; const stage=f.estado==="firmado"?3:f.estado==="enviado"?2:1; const vstep=Math.max(firmaStep,stage);
      const PROV=[{id:"GoFirmeX",url:"https://gofirmex.com/"},{id:"FirmaVirtual",url:"https://www.firmavirtual.legal/"},{id:"E-Sign Chile",url:"https://www.e-sign.cl/"}];
      const provUrl=(PROV.find(x=>x.id===(f.proveedor||firmaProv))||PROV[0]).url;
      const pasos=[["Contrato","Datos y proveedor"],["Firma","Envío y firma de las partes"],["Cobro","Activar el arriendo"]];
      return (<div className="modal-bg" onClick={()=>setMFirma(null)}><div className="modal" style={{width:600}} onClick={e=>e.stopPropagation()}>
      <div className="modal-head"><h3>Firma electrónica del contrato</h3><p>Cierra el ciclo <b>contrato → firma → cobro</b> con validez jurídica, sin ir a la notaría.</p></div>
      <div className="modal-body">
        <div className="stepper" style={{marginBottom:18}}>{pasos.map((t,i)=>{ const n=i+1; const st=vstep===n?"on":vstep>n?"done":"";
          return (<React.Fragment key={t[0]}><div className={"step "+st} style={{flex:"none"}}><div className="num">{vstep>n?"✓":n}</div><div className="tl">{t[0]}</div></div>{n<3&&<div className="ln" style={{flex:1,minWidth:18}}></div>}</React.Fragment>); })}</div>

        {vstep===1 && <>
          <div className="field"><label className="label">Propiedad</label><select onChange={e=>setMFirma(props.find(p=>p.id===parseInt(e.target.value)))} value={mFirma.id}>{props.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
          <div className="grid c2" style={{gridTemplateColumns:"1fr 1fr",gap:12,marginTop:12}}>
            <Data label="Arrendatario" value={mFirma.tenant||"(definir)"}/><Data label="RUT" value={mFirma.tenantRut||"—"}/>
            <Data label="Arriendo" value={<>{num(mFirma.rentUF)>0?UFf(mFirma.rentUF)+" ":""}<span style={{fontWeight:600,color:"var(--faint)",fontSize:13}}>({CLP(mFirma.rent)})</span></>}/><Data label="Reajuste" value={mFirma.adjustment||"—"}/>
            <Data label="Inicio" value={mFirma.contractStart||"—"}/><Data label="Término" value={mFirma.contractEnd||"—"}/>
          </div>
          <div className="field" style={{marginTop:14}}><label className="label">Proveedor de firma electrónica</label>
            <select value={firmaProv} onChange={e=>setFirmaProv(e.target.value)}>{PROV.map(x=><option key={x.id} value={x.id}>{x.id}</option>)}</select></div>
          <div className="help g" style={{marginTop:14}}>El proveedor genera el contrato con estos datos y envía la solicitud de firma al arrendatario y al propietario. Cuando ambos firmen, quedará con validez jurídica y podrás activar el cobro.</div>
          <button className="btn btn-green" style={{marginTop:16,width:"100%"}} onClick={()=>enviarFirma(mFirma)} disabled={!mFirma.tenant}>Enviar solicitud de firma →</button>
          {!mFirma.tenant && <div className="help" style={{marginTop:8,marginBottom:0}}>Asigna un arrendatario a la propiedad antes de enviar a firma.</div>}
        </>}

        {vstep===2 && <>
          <div className="help g" style={{marginBottom:12}}>Solicitud enviada por <b>{f.proveedor||firmaProv}</b> el {f.fechaEnvio||todayISO()}. Estas son las partes que deben firmar:</div>
          {(f.signers||[]).map((s,i)=>(<div key={i} className="databox" style={{marginBottom:8}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
              <div><b>{s.rol}</b> · {s.nombre}<div style={{fontSize:12,color:"var(--muted)"}}>{s.email||"sin correo"}</div></div>
              <span className={"pill "+(s.estado==="firmado"?"green":"amber")}>{s.estado==="firmado"?"Firmado":"Pendiente"}</span>
            </div>
          </div>))}
          <div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:14}}>
            <button className="btn btn-green" onClick={()=>marcarFirmado(mFirma)}>Marcar como firmado por ambas partes</button>
            <a className="btn btn-out" href={provUrl} target="_blank" rel="noopener">Abrir {f.proveedor||firmaProv} ↗</a>
          </div>
        </>}

        {vstep===3 && <div style={{textAlign:"center",padding:14}}>
          <div style={{fontSize:44,marginBottom:10}}>✓</div>
          <div style={{fontWeight:800,fontSize:18,marginBottom:6}}>Contrato firmado con validez jurídica</div>
          <p style={{color:"var(--muted)",marginBottom:16}}>Firmado el {f.fechaFirma||todayISO()} por {f.proveedor||firmaProv}. Ya puedes activar el cobro del arriendo para cerrar el ciclo.</p>
          <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
            <button className="btn btn-green" onClick={()=>activarCobro(mFirma)}>Activar cobro →</button>
            <a className="btn btn-out" href={provUrl} target="_blank" rel="noopener">Ver documento firmado ↗</a>
          </div>
        </div>}
      </div>
      <div className="modal-foot"><button className="btn btn-out" style={{flex:1}} onClick={()=>setMFirma(null)}>Cerrar</button></div>
    </div></div>); })()}

    {/* ============ ASISTENTE DE CONTRATO (4 pasos) ============ */}
    {mContract && (()=>{ const soc=socById(mContract.sociedad); const arrSel=contacts.find(c=>c.id===contract.arrendatarioId); const avalSel=contacts.find(c=>c.id===contract.avalId);
      const steps=["Arrendatario","Valor del contrato","Detalles del contrato","Detalles de administración"];
      const montoUF = contract.moneda==="UF" ? num(contract.monto) : Math.round(num(contract.monto)/uf*100)/100;
      const next=()=>setCStep(s=>Math.min(4,s+1)); const back=()=>setCStep(s=>Math.max(1,s-1));
      const cardFor=(sel,key,label)=>(<div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
        <div className={"contact-card"+(sel?" on":"")} style={{flex:1,minWidth:260}}>
          <div style={{width:46,height:46,borderRadius:"50%",background:sel?"var(--green-bg)":"var(--panel2)",color:"var(--green-d)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>{sel?"":"＋"}</div>
          <div style={{flex:1}}>
            {sel ? <><div style={{fontWeight:800}}>{contactNombre(sel)}</div><div style={{fontSize:13,color:"var(--muted)"}}>{sel.rut} · {sel.email||"sin correo"}</div></> : <div style={{color:"var(--muted)"}}>Selecciona o crea un {label.toLowerCase()}</div>}
          </div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:6,minWidth:200}}>
          <select value={contract[key]||""} onChange={e=>setC(key, e.target.value?parseInt(e.target.value):"")}>
            <option value="">— Seleccionar contacto —</option>
            {contacts.map(c=><option key={c.id} value={c.id}>{contactNombre(c)}</option>)}
          </select>
          <button className="btn btn-out btn-sm" onClick={()=>openCrearContacto(key)}>＋ Crear contacto</button>
          {sel && <button className="btn btn-ghost btn-sm" style={{alignSelf:"flex-start"}} onClick={()=>setC(key,"")}>Quitar</button>}
        </div>
      </div>);
      return (<div className="modal-bg" onClick={()=>setMContract(null)}><div className="modal" style={{width:900}} onClick={e=>e.stopPropagation()}>
        <div className="modal-head" style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12,flexWrap:"wrap"}}>
          <div><h3>Contrato — {mContract.name}</h3><p>{soc.name} · Aquí defines los detalles del contrato y las reglas para generar los vouchers.</p></div>
          <div style={{display:"flex",gap:8}}>
            <button className="btn btn-out btn-sm" onClick={()=>setMContract(null)}>Volver a propiedad</button>
            <button className="btn btn-green btn-sm" onClick={saveContract}>Guardar</button>
          </div>
        </div>
        <div className="modal-body">
          <div className="stepper">{steps.map((t,i)=>{ const n=i+1; const st=cStep===n?"on":cStep>n?"done":"";
            return (<React.Fragment key={t}><div className={"step "+st} onClick={()=>setCStep(n)} style={{cursor:"pointer",flex:"none"}}><div className="num">{cStep>n?"✓":n}</div><div className="tl">{t}</div></div>{n<4&&<div className="ln" style={{flex:1,minWidth:20}}></div>}</React.Fragment>); })}</div>

          {cStep===1 && <>
            <div className="label" style={{marginBottom:8}}>Arrendatario *</div>
            {cardFor(arrSel,"arrendatarioId","Arrendatario")}
            <div style={{height:18}}></div>
            <div className="label" style={{marginBottom:8}}>Aval (opcional)</div>
            {cardFor(avalSel,"avalId","Aval")}
          </>}

          {cStep===2 && <>
            <div className="label" style={{marginBottom:8}}>El contrato está en:</div>
            <div className="rg" style={{marginBottom:18}}>
              {["UF","Pesos"].map(m=><label key={m} className={contract.moneda===m?"on":""}><input type="radio" name="moneda" checked={contract.moneda===m} onChange={()=>setC("moneda",m)}/>{m}</label>)}
            </div>
            <div className="grid c2" style={{gridTemplateColumns:"1fr 1fr",gap:16}}>
              <div className="field"><label className="label">Monto del arriendo *</label>
                <div style={{display:"flex",alignItems:"center",gap:8}}><input className="input" type="number" step="any" value={contract.monto} onChange={e=>setC("monto",e.target.value)} placeholder={contract.moneda==="UF"?"22":"450000"}/><span className="pill grey">{contract.moneda}</span></div>
                {contract.moneda==="UF" && contract.monto!=="" && <div className="help" style={{marginTop:8}}>Monto aproximado en pesos: <b>{CLP(num(contract.monto)*uf)}</b></div>}
              </div>
              {contract.moneda==="UF" && <div className="field"><label className="label">UF a usar *</label>
                <select value={contract.ufUso} onChange={e=>setC("ufUso",e.target.value)}>{ufUsoOpts.map(o=><option key={o} value={o}>{o}</option>)}</select></div>}
            </div>
          </>}

          {cStep===3 && <div className="grid c2" style={{gridTemplateColumns:"1fr 1fr",gap:16}}>
            <div className="field"><label className="label">Fecha de inicio del contrato</label><input className="input" type="date" value={contract.fechaInicio} onChange={e=>setC("fechaInicio",e.target.value)}/></div>
            <label className="check" style={{alignSelf:"end"}}><input type="checkbox" checked={contract.indefinido} onChange={e=>setC("indefinido",e.target.checked)}/>Contrato indefinido</label>
            {!contract.indefinido && <div className="field"><label className="label">Fecha de término del contrato</label><input className="input" type="date" value={contract.fechaTermino} onChange={e=>setC("fechaTermino",e.target.value)}/></div>}
            <div className="field"><label className="label">Días de aviso antes de renovación o término</label><input className="input" type="number" value={contract.diasAviso} onChange={e=>setC("diasAviso",e.target.value)}/></div>
            <label className="check" style={{gridColumn:"1 / -1"}}><input type="checkbox" checked={contract.renovacionAuto} onChange={e=>setC("renovacionAuto",e.target.checked)}/>Con renovación automática</label>
            <div className="field"><label className="label">Día de generación del voucher</label><input className="input" type="number" value={contract.diaGenVoucher} onChange={e=>setC("diaGenVoucher",e.target.value)}/></div>
            <div className="field"><label className="label">Día del envío del voucher</label><input className="input" type="number" value={contract.diaEnvioVoucher} onChange={e=>setC("diaEnvioVoucher",e.target.value)}/></div>
            <div className="field"><label className="label">Día límite para el pago</label><input className="input" type="number" value={contract.diaLimitePago} onChange={e=>setC("diaLimitePago",e.target.value)} disabled={contract.ultimoDiaMes}/></div>
            <label className="check" style={{alignSelf:"end"}}><input type="checkbox" checked={contract.ultimoDiaMes} onChange={e=>setC("ultimoDiaMes",e.target.checked)}/>Último día del mes</label>
            <label className="check"><input type="checkbox" checked={contract.enviarRecordatorio} onChange={e=>setC("enviarRecordatorio",e.target.checked)}/>Enviar correo recordatorio antes de la expiración</label>
            <div className="field"><label className="label">Días de aviso antes de la expiración</label><input className="input" type="number" value={contract.diasAvisoExp} onChange={e=>setC("diasAvisoExp",e.target.value)}/></div>
            <label className="check" style={{gridColumn:"1 / -1"}}><input type="checkbox" checked={contract.incluyeMultas} onChange={e=>setC("incluyeMultas",e.target.checked)}/>Incluye multas por atraso</label>
            {contract.incluyeMultas && <><div className="field"><label className="label">Tipo de multa</label>
              <div className="rg">{[["monto","Monto"],["%","%"]].map(m=><label key={m[0]} className={contract.tipoMulta===m[0]?"on":""}><input type="radio" name="tipoMulta" checked={contract.tipoMulta===m[0]} onChange={()=>setC("tipoMulta",m[0])}/>{m[1]}</label>)}</div></div>
              <div className="field"><label className="label">Multa diaria</label><div style={{display:"flex",alignItems:"center",gap:8}}><input className="input" type="number" step="any" value={contract.multaDiaria} onChange={e=>setC("multaDiaria",e.target.value)}/><span className="pill grey">{contract.tipoMulta==="%"?"%":contract.moneda}</span></div></div></>}
            <label className="check" style={{gridColumn:"1 / -1"}}><input type="checkbox" checked={contract.existeGarantia} onChange={e=>setC("existeGarantia",e.target.checked)}/>Existe una garantía</label>
            {contract.existeGarantia && <><div className="field"><label className="label">Monto de la garantía</label><div style={{display:"flex",alignItems:"center",gap:8}}><input className="input" type="number" step="any" value={contract.garantiaMonto} onChange={e=>setC("garantiaMonto",e.target.value)} placeholder={String(contract.monto||"")}/><span className="pill grey">{contract.garantiaEn}</span></div></div>
              <div className="field"><label className="label">Garantía en:</label><select value={contract.garantiaEn} onChange={e=>setC("garantiaEn",e.target.value)}><option value="UF">UF</option><option value="Pesos">Pesos</option></select></div></>}
          </div>}

          {cStep===4 && <div className="grid" style={{gridTemplateColumns:"1fr 1fr",gap:18}}>
            <div>
              <div className="field"><label className="label">Tipo de comisión del administrador *</label>
                <select value={contract.tipoComision} onChange={e=>setC("tipoComision",e.target.value)}>{["Sin comisión","Monto fijo","Porcentaje del arriendo"].map(o=><option key={o} value={o}>{o}</option>)}</select></div>
              {contract.tipoComision!=="Sin comisión" && <div className="field" style={{marginTop:12}}><label className="label">{contract.tipoComision==="Porcentaje del arriendo"?"Comisión (%)":"Comisión (monto)"}</label><input className="input" type="number" step="any" value={contract.comisionMonto} onChange={e=>setC("comisionMonto",e.target.value)}/></div>}
              <div className="field" style={{marginTop:12}}><label className="label">Cuenta del dueño *</label>
                <input className="input" value={contract.cuentaDueno} onChange={e=>setC("cuentaDueno",e.target.value)} placeholder={soc.cuentaNombre}/>
                <div className="help" style={{marginTop:8}}>Cuenta de {soc.name}: {soc.banco} · {soc.cuentaTipo} {soc.cuentaNumero}</div></div>
            </div>
            <div className="summary">
              <div style={{textAlign:"center",fontWeight:800,fontSize:16,marginBottom:12}}>Resumen del pago</div>
              <div className="row"><span>ARRIENDO</span><b>{contract.moneda==="UF"?montoUF+" UF":CLP(num(contract.monto))}</b></div>
              <div className="row"><span>DUEÑO</span><b>{contract.tipoComision==="Sin comisión"?(contract.moneda==="UF"?montoUF+" UF":CLP(num(contract.monto))):"según comisión"}</b></div>
              <div className="row"><span>ADMINISTRACIÓN</span><b>{contract.tipoComision==="Sin comisión"?"0":contract.comisionMonto||"—"}</b></div>
              <div className="row"><span>GARANTÍA</span><b>{contract.existeGarantia?((contract.garantiaMonto||contract.monto)+" "+contract.garantiaEn):"—"}</b></div>
              <div className="row"><span>CUENTA</span><b>{contract.cuentaDueno||soc.cuentaNombre}</b></div>
            </div>
          </div>}
        </div>
        <div className="modal-foot" style={{justifyContent:"space-between",flexWrap:"wrap"}}>
          <div style={{display:"flex",gap:10}}>
            {cStep>1 && <button className="btn btn-out" onClick={back}>← Volver</button>}
            {cStep<4 && <button className="btn btn-red" onClick={next}>Siguiente →</button>}
          </div>
          <div style={{display:"flex",gap:10}}>
            <button className="btn btn-red" onClick={verContratoPDF}>Ver / Imprimir (PDF)</button>
            <button className="btn btn-out" onClick={descargarContrato}>Descargar contrato Word</button>
            <button className="btn btn-green" onClick={saveContract}>Guardar contrato</button>
          </div>
        </div>
      </div></div>); })()}

    {/* Crear / asignar contacto */}
    {mContact && <div className="modal-bg" onClick={()=>setMContact(false)}><div className="modal" style={{width:680}} onClick={e=>e.stopPropagation()}>
      <div className="modal-head"><h3>Crear contacto</h3><p>Estos datos se usan para el contrato y los vouchers.</p></div>
      <div className="modal-body">
        <label className="check" style={{marginBottom:14}}><input type="checkbox" checked={newContact.esEmpresa} onChange={e=>setNewContact(c=>({...c,esEmpresa:e.target.checked}))}/>Contacto empresa</label>
        <div className="sub-title green">Datos personales</div>
        <div className="grid c2" style={{gridTemplateColumns:"1fr 1fr",gap:12}}>
          <div className="field" style={{gridColumn:newContact.esEmpresa?"1 / -1":"auto"}}><label className="label">{newContact.esEmpresa?"Razón social *":"Nombre *"}</label><input className="input" value={newContact.nombre} onChange={e=>setNewContact(c=>({...c,nombre:e.target.value}))}/></div>
          {!newContact.esEmpresa && <div className="field"><label className="label">Primer Apellido</label><input className="input" value={newContact.primerApellido} onChange={e=>setNewContact(c=>({...c,primerApellido:e.target.value}))}/></div>}
          {!newContact.esEmpresa && <div className="field"><label className="label">Segundo Apellido</label><input className="input" value={newContact.segundoApellido} onChange={e=>setNewContact(c=>({...c,segundoApellido:e.target.value}))}/></div>}
          <div className="field"><label className="label">Correo Electrónico</label><input className="input" type="email" value={newContact.email} onChange={e=>setNewContact(c=>({...c,email:e.target.value}))}/></div>
          <div className="field"><label className="label">Teléfono</label><input className="input" value={newContact.telefono} onChange={e=>setNewContact(c=>({...c,telefono:e.target.value}))}/></div>
          <div className="field"><label className="label">RUT</label><input className="input" value={newContact.rut} onChange={e=>setNewContact(c=>({...c,rut:e.target.value}))} placeholder="12.345.678-9"/></div>
        </div>
        <div className="sub-title">Datos bancarios (para devoluciones / pagos)</div>
        <div className="grid c2" style={{gridTemplateColumns:"1fr 1fr",gap:12}}>
          <div className="field"><label className="label">Nombre de la Cuenta</label><input className="input" value={newContact.cuentaNombre} onChange={e=>setNewContact(c=>({...c,cuentaNombre:e.target.value}))}/></div>
          <div className="field"><label className="label">Nombre Completo (titular)</label><input className="input" value={newContact.cuentaNombreCompleto} onChange={e=>setNewContact(c=>({...c,cuentaNombreCompleto:e.target.value}))}/></div>
          <div className="field"><label className="label">Correo Electrónico</label><input className="input" value={newContact.cuentaEmail} onChange={e=>setNewContact(c=>({...c,cuentaEmail:e.target.value}))}/></div>
          <div className="field"><label className="label">RUT</label><input className="input" value={newContact.cuentaRut} onChange={e=>setNewContact(c=>({...c,cuentaRut:e.target.value}))}/></div>
          <div className="field"><label className="label">N° de Cuenta</label><input className="input" value={newContact.cuentaNumero} onChange={e=>setNewContact(c=>({...c,cuentaNumero:e.target.value}))}/></div>
