/* Reajuste. Por omisión es UF, que es como están todos los contratos hoy: el
   arriendo se guarda en UF y sube solo con ella. La opción IPC queda
   disponible por contrato o como criterio general. */
const REAJUSTE_MODOS=[{v:"UF",l:"UF (se reajusta solo)"},{v:"IPC",l:"IPC (reajuste periódico)"},{v:"%",l:"Porcentaje fijo"}];
/* Con qué valor de la UF se convierte el arriendo a pesos. Lo normal en Chile
   es cobrar con la UF del día en que se paga; las otras opciones existen
   porque hay contratos que lo pactan distinto. */
const REGLAS_UF=[
  {v:"dia_pago",l:"UF del día en que se paga (lo habitual)"},
  {v:"dia_1",l:"UF del día 1 del mes"},
  {v:"ultimo_mes_anterior",l:"UF del último día del mes anterior"},
  {v:"mas_alta",l:"La UF más alta del mes"},
];
const sumarMeses=(iso,m)=>{ const d=new Date(String(iso).slice(0,10)+"T12:00:00"); if(isNaN(d)) return ""; d.setMonth(d.getMonth()+m); return d.toISOString().slice(0,10); };
const diasEntre=(a,b)=>Math.round((new Date(String(b).slice(0,10)+"T12:00:00")-new Date(String(a).slice(0,10)+"T12:00:00"))/86400000);
const modoReajuste=(p,owner)=>String((p&&p.adjustment)||(owner&&owner.reajusteModo)||"UF").toUpperCase();
/* Cuándo toca el próximo reajuste de una propiedad. */
const reajusteInfo=(p,owner,hoy)=>{
  const H=hoy||todayISO();
  const modo=modoReajuste(p,owner);
  const periodo=parseInt(p&&p.reajustePeriodo)||parseInt(owner&&owner.reajustePeriodo)||12;
  const base=(p&&(p.ultimoReajuste||p.contractStart))||"";
  if(!base) return { modo, periodo, base:"", vence:"", proximo:"", toca:false };
  const vence=sumarMeses(base,periodo);
  let proximo=vence, guarda=0;
  while(proximo && proximo<=H && guarda++<60) proximo=sumarMeses(proximo,periodo);
  return { modo, periodo, base, vence, proximo, toca: !!vence && vence<=H };
};
/* IPC acumulado desde una fecha, con la serie mensual de mindicador.cl. */
const ipcAcumuladoDesde=async(desdeISO)=>{
  const desde=String(desdeISO||"").slice(0,10);
  if(!desde) return null;
  const y0=parseInt(desde.slice(0,4),10), y1=new Date().getFullYear();
  const serie=[];
  for(let y=y0;y<=y1;y++){
    try{
      const r=await fetch("https://mindicador.cl/api/ipc/"+y);
      const j=await r.json();
      (j.serie||[]).forEach(x=>{ const f=String(x.fecha).slice(0,10); const v=Number(x.valor); if(f&&!isNaN(v)) serie.push({f,v}); });
    }catch(_e){}
  }
  const usados=serie.filter(x=>x.f>desde);
  if(!usados.length) return { pct:0, meses:0 };
  const factor=usados.reduce((a,x)=>a*(1+x.v/100),1);
  return { pct:(factor-1)*100, meses:usados.length };
};

/* Alertas: contratos, cobros, contribuciones, seguros, reajustes y datos que
   faltan. Es una función pura para poder probarla. */
const MESES_CONTRIBUCIONES=[3,5,8,10]; // abril, junio, septiembre, noviembre
const URGENCIA_ORDEN={alta:0,media:1,baja:2};
const calcularAlertas=(props,owner,hoy)=>{
  const H=hoy||todayISO();
  const mes=parseInt(H.slice(5,7),10)-1;
  const out=[];
  const add=(a)=>out.push(a);
  (props||[]).forEach(p=>{
    const nom=p.name||p.address||"Propiedad";
    const pid=String(p.id);
    if(p.use==="arriendo"){
      if(p.status==="atrasado")
        add({id:pid+"-atraso",urgencia:"alta",ico:"⏰",titulo:"Arriendo atrasado",
          detalle:nom+" no ha pagado el arriendo de este mes.",pid,ir:"cobros"});
      const fin=p.contractEnd;
      if(fin){
        const d=diasEntre(H,fin);
        if(d<0) add({id:pid+"-contrato",urgencia:"alta",ico:"📄",titulo:"Contrato vencido",
          detalle:"El contrato de "+nom+" venció el "+fin+". Renuévalo o formaliza el término.",pid,ir:"props"});
        else if(d<=90) add({id:pid+"-contrato",urgencia:"media",ico:"📄",titulo:"Contrato por vencer",
          detalle:"Al contrato de "+nom+" le quedan "+d+" días (vence el "+fin+").",pid,ir:"props"});
      }
      // El reajuste en UF es automático (la UF cambia todos los días y el monto
      // se recalcula solo), así que no se avisa nada. Solo se avisa cuando el
      // contrato se reajusta por IPC o por un porcentaje, que sí requieren
      // cambiar el monto a mano.
      const r=reajusteInfo(p,owner,H);
      if(r.toca && r.modo!=="UF"){
        add({id:pid+"-reajuste",urgencia:"media",ico:"📈",titulo:"Toca aplicar el reajuste",
          detalle:"El arriendo de "+nom+" se reajusta por "+r.modo+" y le correspondía el "+r.vence+".",
          pid,ir:"props",accion:"reajuste"});
      }
      if(!num(p.rentUF)&&num(p.rent))
        add({id:pid+"-sinuf",urgencia:"media",ico:"📐",titulo:"Arriendo sin UF",
          detalle:"El arriendo de "+nom+" está solo en pesos, así que no se reajusta solo. Cárgalo en UF.",pid,ir:"props"});
      if(fin && diasEntre(H,fin)<0 && p.garantia && p.garantia.estado==="retenida")
        add({id:pid+"-garantia",urgencia:"media",ico:"🔐",titulo:"Garantía por devolver",
          detalle:"El contrato de "+nom+" terminó y la garantía sigue retenida.",pid,ir:"props"});
      if(!String(p.tenant||"").trim() && p.vacDesde){
        const meses=Math.floor(diasEntre(p.vacDesde,H)/30);
        if(meses>=2) add({id:pid+"-vacante",urgencia:"media",ico:"🏚️",titulo:"Sin arrendar hace "+meses+" meses",
          detalle:nom+" está disponible desde el "+p.vacDesde+". Cada mes vacío es plata que no entra.",pid,ir:"props"});
      }
    }
    if(MESES_CONTRIBUCIONES.indexOf(mes)>=0 && num(p.contribucionesAnuales)){
      const pagada=(p.contribuciones||[]).some(c=>String(c.fecha||"").slice(0,7)===H.slice(0,7));
      if(!pagada) add({id:pid+"-contrib",urgencia:"media",ico:"🧾",titulo:"Cuota de contribuciones",
        detalle:"Este mes vence una cuota de contribuciones de "+nom+" (≈ "+CLP(num(p.contribucionesAnuales)/4)+"). No hay pago registrado.",pid,ir:"props"});
    }
    (p.seguros||[]).forEach(s=>{
      if(s && s.activo!==false && s.termino && s.termino<H)
        add({id:pid+"-seg-"+s.id,urgencia:"alta",ico:"🔥",titulo:"Seguro vencido",
          detalle:"El seguro "+(s.tipo||"")+" de "+nom+" venció el "+s.termino+".",pid,ir:"props"});
    });
    if(!String(p.rolSII||"").trim())
      add({id:pid+"-rol",urgencia:"baja",ico:"🏛️",titulo:"Falta el rol del SII",
        detalle:"Sin el rol de "+nom+" no se pueden pedir certificados ni revisar contribuciones.",pid,ir:"props"});
  });
  return out.sort((a,b)=>(URGENCIA_ORDEN[a.urgencia]-URGENCIA_ORDEN[b.urgencia]));
};

const asDisponible=(p)=> p.use==="arriendo" && !String(p.tenant||"").trim();
const asPrecio=(p,op)=> op==="venta" ? num(p.tasacion) : num(p.rent);
const asFoto=(p)=>{ const f=(p.fotos||[])[0]; return (f&&(f.url||f))||""; };

/* Ficha compacta: es a la vez lo que lee el modelo y lo que dibuja la tarjeta. */
const asFicha=(p,op)=>{
  const precio=asPrecio(p,op), libre=asDisponible(p);
  return { id:String(p.id), nombre:p.name||"Propiedad", tipo:p.type||"", operacion:op||"arriendo",
    comuna:p.comuna||"", region:p.region||"", direccion:p.address||"",
    precio, precio_texto: precio?CLP(precio):"A consultar",
    dormitorios:num(p.bedrooms), banos:num(p.bathrooms),
    estacionamientos:num(p.parking), bodegas:num(p.bodega),
    superficie:num(p.surfaceBuilt), superficie_terreno:num(p.surfaceTerrain),
    gasto_comun:num(p.gastoComun), orientacion:p.orientation||"", piso:p.floor||"",
    anio:p.constructionYear||"", estado_conservacion:p.condition||"",
    disponible:libre, disponible_desde: libre?"ahora":(p.contractEnd||"por confirmar"),
    foto:asFoto(p) };
};

/* Búsqueda. Devuelve también las ocupadas (con la fecha en que se liberan)
   porque en una cartera en administración casi todo está arrendado: filtrar
   solo lo disponible dejaría al asesor sin nada que mostrar. Lo disponible
   va primero. */
const asBuscar=(props,f)=>{
  f=f||{};
  const op = f.operacion==="venta" ? "venta" : "arriendo";
  const comunas=String(f.comuna||"").toLowerCase().split(",").map(s=>s.trim()).filter(Boolean);
  const tipo=String(f.tipo||"").toLowerCase().trim();
  const base=props.filter(p=> op==="venta" ? true : p.use==="arriendo");
  const out=base.filter(p=>{
    const precio=asPrecio(p,op);
    if(comunas.length && !comunas.some(c=>String(p.comuna||"").toLowerCase().includes(c))) return false;
    if(f.region && !String(p.region||"").toLowerCase().includes(String(f.region).toLowerCase())) return false;
    if(tipo && !String(p.type||"").toLowerCase().includes(tipo)) return false;
    if(f.precio_max && precio && precio>num(f.precio_max)) return false;
    if(f.precio_min && precio && precio<num(f.precio_min)) return false;
    if(f.dormitorios_min && num(p.bedrooms)<num(f.dormitorios_min)) return false;
    if(f.banos_min && num(p.bathrooms)<num(f.banos_min)) return false;
    if(f.estacionamiento && num(p.parking)<1) return false;
    if(f.bodega && num(p.bodega)<1) return false;
    if(f.superficie_min && num(p.surfaceBuilt)<num(f.superficie_min)) return false;
    if(f.solo_disponibles && !asDisponible(p)) return false;
    return true;
  }).sort((a,b)=>{ const d=(asDisponible(b)?1:0)-(asDisponible(a)?1:0); return d || (asPrecio(a,op)-asPrecio(b,op)); });
  const lim=Math.max(1,Math.min(6,num(f.limite)||4));
  return { total_encontradas:out.length, disponibles_ahora:out.filter(asDisponible).length,
    resultados:out.slice(0,lim).map(p=>asFicha(p,op)) };
};

/* Similares: cercanía por comuna, tipo, dormitorios y distancia de precio. */
const asSimilares=(props,id,masBarata)=>{
  const base=props.find(p=>String(p.id)===String(id));
  if(!base) return { error:"No encontré esa propiedad en el catálogo." };
  const op = base.use==="arriendo" ? "arriendo" : "venta";
  const pBase=asPrecio(base,op);
  const cand=props.filter(p=>String(p.id)!==String(id) && p.use===base.use)
    .filter(p=> masBarata ? (asPrecio(p,op)>0 && asPrecio(p,op)<pBase) : true)
    .map(p=>({ p, d:
      Math.abs(num(p.bedrooms)-num(base.bedrooms))*2 +
      (String(p.comuna||"")===String(base.comuna||"") ? 0 : 3) +
      (String(p.type||"")===String(base.type||"") ? 0 : 2) +
      (pBase ? Math.abs(asPrecio(p,op)-pBase)/Math.max(pBase,1)*4 : 0) }))
    .sort((a,b)=>a.d-b.d).slice(0,4).map(x=>asFicha(x.p,op));
  return { referencia:asFicha(base,op), resultados:cand };
};

const asComparar=(props,ids)=>{
  const sel=(ids||[]).map(id=>props.find(p=>String(p.id)===String(id))).filter(Boolean);
  if(sel.length<2) return { error:"Necesito al menos dos propiedades válidas para comparar." };
  return { comparacion: sel.slice(0,3).map(p=>asFicha(p, p.use==="arriendo"?"arriendo":"venta")) };
};

/* Cuánto cuesta entrar: primer mes, garantía y renta líquida sugerida. */
const asCostos=(props,id,montoManual)=>{
  const p = id ? props.find(x=>String(x.id)===String(id)) : null;
  const arriendo = p ? num(p.rent) : num(montoManual);
  if(!arriendo) return { error:"Necesito el arriendo mensual o el id de una propiedad." };
  const gc = p ? num(p.gastoComun) : 0;
  const garantia = p ? (num(p.deposit)||arriendo) : arriendo;
  const inicial = arriendo+garantia+gc, mensual = arriendo+gc;
  return { propiedad: p?p.name:null,
    arriendo_mensual:arriendo, arriendo_texto:CLP(arriendo),
    gasto_comun:gc, gasto_comun_texto: gc?CLP(gc):"no informado",
    garantia, garantia_texto:CLP(garantia),
    total_primer_mes:inicial, total_primer_mes_texto:CLP(inicial),
    costo_mensual_total:mensual, costo_mensual_texto:CLP(mensual),
    renta_liquida_sugerida:arriendo*3, renta_liquida_texto:CLP(arriendo*3) };
};

/* Resumen liviano del catálogo: le da criterio al asesor sin que tenga que
   buscar en cada turno. El detalle exacto siempre sale de las herramientas. */
/* El modelo escribe en negrita con **asteriscos**. Los convertimos a <b> sin
   inyectar HTML: se parte el texto y se devuelven nodos de React. */
const asTexto=(t)=>String(t||"").split(/(\*\*[^*]+\*\*)/g).map((p,i)=>
  (p.startsWith("**")&&p.endsWith("**")&&p.length>4)
    ? React.createElement("b",{key:i},p.slice(2,-2))
    : p);

/* La API exige que cada bloque de herramienta viaje con su resultado. Si una
   búsqueda en internet queda a medias (se corta el tiempo, se acaba el tope de
   texto), el turno queda con una llamada suelta y TODAS las respuestas
   siguientes fallan con "tool use ... without a corresponding tool_result".
   Como el historial se guarda en el navegador, ese turno roto se arrastra
   entre sesiones, así que lo limpiamos antes de enviar. */
const asEsResultado=(b)=>typeof b.type==="string"&&/_tool_result$/.test(b.type);
const asSanearBloques=(lista)=>{
  const bl=(Array.isArray(lista)?lista:[]).filter(b=>b&&typeof b.type==="string");
  const conResultado=new Set(bl.filter(asEsResultado).map(b=>b.tool_use_id));
  const llamadas=new Set(bl.filter(b=>b.type==="server_tool_use").map(b=>b.id));
  return bl.filter(b=>{
    if(b.type==="server_tool_use") return conResultado.has(b.id);
    if(asEsResultado(b)&&b.type!=="tool_result") return llamadas.has(b.tool_use_id);
    return true;
  });
};
const asSanearHistorial=(hist)=>{
  const out=[]; const pendientes=new Set();
  (Array.isArray(hist)?hist:[]).forEach(m=>{
    if(!m||!m.content) return;
    let bl=typeof m.content==="string"
      ? (m.content.trim()?[{type:"text",text:m.content}]:[])
      : (Array.isArray(m.content)?m.content:[]);
    if(m.role==="assistant"){
      bl=asSanearBloques(bl);
      bl.filter(b=>b.type==="tool_use").forEach(b=>pendientes.add(b.id));
    }else{
      // Un resultado sin su llamada también invalida la conversación.
      bl=bl.filter(b=>b&&(b.type!=="tool_result"||pendientes.has(b.tool_use_id)));
      bl.forEach(b=>pendientes.delete(b.tool_use_id));
    }
    if(!bl.length) return;
    // Si al limpiar quedaron dos turnos seguidos del mismo lado, se juntan:
    // la API espera que se vayan alternando.
    const prev=out[out.length-1];
    if(prev&&prev.role===m.role){
      const enBloques=(c)=>Array.isArray(c)?c:[{type:"text",text:String(c)}];
      prev.content=[...enBloques(prev.content),...bl];
      return;
    }
    out.push({role:m.role,content:bl});
  });
  // No puede quedar una llamada del asistente esperando respuesta al final.
  while(out.length){
    const u=out[out.length-1];
    const abierta=u.role==="assistant"&&Array.isArray(u.content)&&
      u.content.some(b=>b.type==="tool_use"&&pendientes.has(b.id));
    if(!abierta) break;
    out.pop();
  }
  while(out.length&&out[0].role!=="user") out.shift();
  return out;
};

      {!prox && tarea && <div className="mt" style={{color: tarea.vence<=hoyISO?"var(--red-d)":"var(--muted)"}}>✓ {tarea.titulo} ({fmtF(tarea.vence)})</div>}
      {!prox && !tarea && ult && <div className="mt" style={{fontStyle:"italic"}}>“{ult.texto.slice(0,60)}{ult.texto.length>60?"…":""}”</div>}
      <div className="crm-mini" style={{justifyContent:"space-between",alignItems:"center"}}>
        <span style={{display:"flex",gap:6}}>
          <button className="btn btn-ghost btn-xs" title="Etapa anterior" onClick={ev=>{ev.stopPropagation();moveEstado(l,-1);}}>◀</button>
          <button className="btn btn-ghost btn-xs" title="Siguiente etapa" onClick={ev=>{ev.stopPropagation();moveEstado(l,1);}}>▶</button>
        </span>
        {l.telefono && <button className="btn btn-ghost btn-xs" title="WhatsApp" onClick={ev=>{ev.stopPropagation();waLead(l,"");}}></button>}
      </div>
    </div>);
  };

  return (<div>
    <div className="help g" style={{marginBottom:12}}>Tu <b>CRM</b>: captura cada prospecto (WhatsApp, Instagram, portales…), muévelo por el <b>embudo</b>, agenda <b>visitas</b>, deja <b>seguimientos</b>, responde al instante con <b>respuestas rápidas</b> y mide tu <b>conversión</b>. Pensado para arrendar y vender más rápido.</div>

    <div className="crm-tabs">
      {TABS.map(([id,lab])=><button key={id} className={"crm-tab"+(view===id?" on":"")} onClick={()=>setView(id)}>{lab}</button>)}
      <div style={{flex:1}}/>
      <button className="btn btn-primary btn-sm" onClick={()=>setNuevoOpen(true)}>+ Nuevo lead</button>
    </div>

    {(view==="embudo"||view==="lista") && <div className="field" style={{maxWidth:420,marginBottom:12}}>
      <input className="input" placeholder="Buscar por nombre, teléfono, comuna, nota…" value={q} onChange={e=>setQ(e.target.value)}/>
    </div>}

    {view==="embudo" && <div className="crm-board">
      {CRM_ESTADOS.map(e=>{ const col=leadsFiltrados.filter(l=>l.estado===e.id); return (
        <div key={e.id} className="crm-col">
          <h4 style={{color:e.color}}>{e.label}<span className="n">{col.length}</span></h4>
          {col.map(l=><Card key={l.id} l={l}/>)}
          {!col.length && <div style={{fontSize:12,color:"var(--faint)",textAlign:"center",padding:"8px 0"}}>—</div>}
        </div>
      ); })}
    </div>}

    {view==="lista" && <div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>
        <select className="input" style={{maxWidth:200}} value={fEstado} onChange={e=>setFEstado(e.target.value)}><option value="todos">Todas las etapas</option>{CRM_ESTADOS.map(e=><option key={e.id} value={e.id}>{e.label}</option>)}</select>
        <select className="input" style={{maxWidth:200}} value={fFuente} onChange={e=>setFFuente(e.target.value)}><option value="todos">Todas las fuentes</option>{CRM_FUENTES.map(f=><option key={f} value={f}>{f}</option>)}</select>
      </div>
      {leadsFiltrados.length? leadsFiltrados.map(l=>{ const e=est(l.estado); return (
        <div key={l.id} className="crm-card" style={{borderLeftColor:e.color,display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}} onClick={()=>setSelId(l.id)}>
          <div style={{minWidth:0}}>
            <div className="nm">{l.nombre} <span className="crm-chip" style={{background:e.color+"22",color:e.color}}>{e.label}</span></div>
            <div className="mt">{[l.fuente, propName(l.propInteres)||l.comuna, l.telefono].filter(Boolean).join(" · ")}</div>
          </div>
          <div style={{display:"flex",gap:6,flexShrink:0}}>
            {l.telefono&&<button className="btn btn-ghost btn-xs" onClick={ev=>{ev.stopPropagation();waLead(l,"");}}></button>}
            {l.telefono&&<a className="btn btn-ghost btn-xs" href={"tel:"+l.telefono} onClick={ev=>ev.stopPropagation()}></a>}
            {l.email&&<a className="btn btn-ghost btn-xs" href={"mailto:"+l.email} onClick={ev=>ev.stopPropagation()}></a>}
          </div>
        </div>
      ); }) : <div className="help">No hay leads con esos filtros. Agrega uno con “+ Nuevo lead”.</div>}
    </div>}

    {view==="agenda" && <div>
      {visitasTodas.length? visitasTodas.map((v,idx)=>{ const e=est(v.lead.estado); const pasada=v.fecha<hoyISO; return (
        <div key={idx} className="crm-card" style={{borderLeftColor:v.estado==="realizada"?"#101012":(v.estado==="cancelada"?"#C7C7CC":"#8E8E93")}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <div onClick={()=>setSelId(v.lead.id)} style={{cursor:"pointer",minWidth:0}}>
              <div className="nm">{fmtF(v.fecha)} · {v.hora} — {v.lead.nombre}</div>
              <div className="mt">{[propName(v.propId)||v.lead.comuna, "Estado: "+v.estado, v.notas].filter(Boolean).join(" · ")}</div>
            </div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {v.lead.telefono&&<button className="btn btn-ghost btn-xs" onClick={()=>waLead(v.lead,"Hola "+(v.lead.nombre||"").split(" ")[0]+", te confirmo tu visita el "+fmtF(v.fecha)+" a las "+v.hora+". ¡Te espero!")}>Confirmar</button>}
              {v.estado==="agendada"&&<button className="btn btn-ghost btn-xs" onClick={()=>{setSelId(v.lead.id);setVisitaEstado(v.id,"realizada");}}>✓ Realizada</button>}
            </div>
          </div>
          {pasada&&v.estado==="agendada"&&<div className="mt" style={{color:"var(--red-d)"}}>Visita vencida sin marcar</div>}
        </div>
      ); }) : <div className="help">No hay visitas agendadas. Abre un lead y agéndale una visita.</div>}
    </div>}

    {view==="tareas" && <div>
      {tareasTodas.length? tareasTodas.map((t,idx)=>{ const vence=t.vence<=hoyISO; return (
        <div key={idx} className="crm-card" style={{borderLeftColor:vence?"#101012":"#C7C7CC",display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
          <div onClick={()=>setSelId(t.lead.id)} style={{cursor:"pointer",minWidth:0}}>
            <div className="nm">{t.titulo}</div>
            <div className="mt" style={{color:vence?"var(--red-d)":"var(--muted)"}}>{t.lead.nombre} · vence {fmtF(t.vence)}{vence?" (atrasada)":""}</div>
          </div>
          <button className="btn btn-out btn-xs" onClick={()=>{setSelId(t.lead.id);toggleTarea(t.id);}}>✓ Hecha</button>
        </div>
      ); }) : <div className="help">Sin seguimientos pendientes. Abre un lead para agregar una tarea.</div>}
    </div>}

    {view==="respuestas" && <div>
      <div className="help" style={{marginBottom:10}}>Mensajes listos para responder al instante. Variables: <code>{"{nombre}"}</code>, <code>{"{empresa}"}</code>, <code>{"{propiedad}"}</code>, <code>{"{monto}"}</code>, <code>{"{comuna}"}</code>, <code>{"{dia}"}</code>, <code>{"{hora}"}</code> (se completan al usarlas desde un lead).</div>
      {(qreplies||[]).map(r=>(
        <div key={r.id} className="card" style={{padding:12,marginBottom:10}}>
          <input className="input" value={r.titulo} onChange={e=>setQreplies(qs=>qs.map(x=>x.id===r.id?{...x,titulo:e.target.value}:x))} style={{fontWeight:700,marginBottom:6}}/>
          <textarea className="input" value={r.texto} onChange={e=>setQreplies(qs=>qs.map(x=>x.id===r.id?{...x,texto:e.target.value}:x))} style={{minHeight:70}}/>
          <div style={{display:"flex",gap:8,marginTop:8,flexWrap:"wrap"}}>
            <button className="btn btn-ghost btn-sm" onClick={()=>{ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(r.texto).then(()=>notify&&notify("Copiado")); }}>Copiar</button>
            <button className="btn btn-ghost btn-sm" onClick={()=>waEnviar("",r.texto)}>WhatsApp</button>
            <div style={{flex:1}}/>
            <button className="btn btn-ghost btn-sm" style={{color:"var(--red-d)"}} onClick={()=>setQreplies(qs=>qs.filter(x=>x.id!==r.id))}>✕ Eliminar</button>
          </div>
        </div>
      ))}
      <button className="btn btn-out btn-sm" onClick={()=>setQreplies(qs=>[...qs,{id:"qr"+Date.now().toString(36),titulo:"Nueva respuesta",texto:"Escribe aquí tu mensaje para {nombre}."}])}>+ Nueva respuesta</button>
    </div>}

    {view==="metricas" && <div>
      <div className="grid c4" style={{gridTemplateColumns:"repeat(4,1fr)",gap:10}}>
        <div className="stat" style={{borderTopColor:"#1F3A5C"}}><div className="lab">Leads totales</div><div className="val">{totalLeads}</div><div className="sub" style={{color:"var(--muted)"}}>{activos} activos</div></div>
        <div className="stat" style={{borderTopColor:"var(--line)"}}><div className="lab">Visitas próximas</div><div className="val">{visitasTodas.filter(v=>v.estado==="agendada"&&v.fecha>=hoyISO).length}</div><div className="sub" style={{color:"var(--muted)"}}>agendadas</div></div>
        <div className="stat" style={{borderTopColor:"var(--line)"}}><div className="lab">✓ Seguimientos</div><div className="val">{tareasTodas.length}</div><div className="sub" style={{color:"var(--muted)"}}>pendientes</div></div>
        <div className="stat" style={{borderTopColor:"var(--line)"}}><div className="lab">Tasa de cierre</div><div className="val">{winRate}%</div><div className="sub" style={{color:"var(--muted)"}}>{ganados} ganados · {perdidos} perdidos</div></div>
      </div>
      <div className="card" style={{padding:14,marginTop:12}}>
        <div style={{fontWeight:800,marginBottom:10}}>Embudo de conversión</div>
        {CRM_ESTADOS.map(e=>{ const n=leads.filter(l=>l.estado===e.id).length; const pct=totalLeads?Math.round(n/totalLeads*100):0; return (
          <div key={e.id} style={{marginBottom:8}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:3}}><span>{e.label}</span><span style={{color:"var(--muted)"}}>{n}</span></div>
            <div className="crm-bar"><span style={{width:Math.max(pct,n?4:0)+"%",background:e.color}}/></div>
          </div>
        ); })}
      </div>
      {!!porFuente.length && <div className="card" style={{padding:14,marginTop:12}}>
        <div style={{fontWeight:800,marginBottom:10}}>Leads por fuente</div>
        {porFuente.map(x=>(
          <div key={x.f} style={{marginBottom:8}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:3}}><span>{x.f}</span><span style={{color:"var(--muted)"}}>{x.n}</span></div>
            <div className="crm-bar"><span style={{width:Math.round(x.n/maxFuente*100)+"%",background:"#1F3A5C"}}/></div>
          </div>
        ))}
      </div>}
    </div>}

    {/* ---- Modal nuevo lead ---- */}
    {nuevoOpen && <div className="modal-bg" onClick={()=>setNuevoOpen(false)}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><b>+ Nuevo lead</b><button className="btn btn-ghost btn-sm" onClick={()=>setNuevoOpen(false)}>✕</button></div>
        <div className="modal-body">
          <div className="grid c2" style={{gridTemplateColumns:"1fr 1fr",gap:10}}>
            <div className="field"><label className="label">Nombre</label><input className="input" value={nl.nombre} onChange={e=>setNl({...nl,nombre:e.target.value})}/></div>
            <div className="field"><label className="label">Teléfono / WhatsApp</label><input className="input" value={nl.telefono} onChange={e=>setNl({...nl,telefono:e.target.value})}/></div>
            <div className="field"><label className="label">Correo</label><input className="input" value={nl.email} onChange={e=>setNl({...nl,email:e.target.value})}/></div>
            <div className="field"><label className="label">Fuente</label><select className="input" value={nl.fuente} onChange={e=>setNl({...nl,fuente:e.target.value})}>{CRM_FUENTES.map(f=><option key={f}>{f}</option>)}</select></div>
            <div className="field"><label className="label">Busca</label><select className="input" value={nl.tipoBusqueda} onChange={e=>setNl({...nl,tipoBusqueda:e.target.value})}><option value="arriendo">Arriendo</option><option value="compra">Compra</option></select></div>
            <div className="field"><label className="label">Propiedad de interés</label><select className="input" value={nl.propInteres} onChange={e=>setNl({...nl,propInteres:e.target.value})}><option value="">— Sin asignar —</option>{propiedades.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
            <div className="field"><label className="label">Comuna / sector</label><input className="input" value={nl.comuna} onChange={e=>setNl({...nl,comuna:e.target.value})}/></div>
            <div className="field"><label className="label">Presupuesto ({nl.tipoBusqueda==="compra"?"UF o $":"$"}/mes)</label><input className="input" value={nl.presupuesto} onChange={e=>setNl({...nl,presupuesto:e.target.value})}/></div>
            <div className="field"><label className="label">Dormitorios</label><input className="input" value={nl.dorms} onChange={e=>setNl({...nl,dorms:e.target.value})}/></div>
          </div>
          <div className="field" style={{marginTop:10}}><label className="label">Notas</label><textarea className="input" value={nl.notas} onChange={e=>setNl({...nl,notas:e.target.value})} style={{minHeight:70}}/></div>
        </div>
        <div className="modal-foot"><button className="btn btn-primary" onClick={()=>addLead(nl)}>Agregar lead</button><button className="btn btn-ghost" onClick={()=>setNuevoOpen(false)}>Cancelar</button></div>
      </div>
    </div>}

    {/* ---- Modal detalle lead ---- */}
    {sel && <div className="modal-bg" onClick={()=>setSelId(null)}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><b>{sel.nombre}</b> <span className="crm-chip" style={{background:est(sel.estado).color+"22",color:est(sel.estado).color}}>{est(sel.estado).label}</span><div style={{flex:1}}/><button className="btn btn-ghost btn-sm" onClick={()=>setSelId(null)}>✕</button></div>
        <div className="modal-body">
          {/* etapa */}
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
            {CRM_ESTADOS.map(e=><button key={e.id} onClick={()=>patch(sel.id,{estado:e.id})} className="crm-tab" style={sel.estado===e.id?{background:e.color,borderColor:e.color,color:"#fff"}:{}}>{e.label}</button>)}
          </div>
          {/* acciones rápidas */}
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
            {sel.telefono&&<button className="btn btn-out btn-sm" onClick={()=>waLead(sel,"")}>WhatsApp</button>}
            {sel.telefono&&<a className="btn btn-out btn-sm" href={"tel:"+sel.telefono}>Llamar</a>}
            {sel.email&&<a className="btn btn-out btn-sm" href={"mailto:"+sel.email}>Correo</a>}
          </div>
          {/* respuesta rápida */}
          <div className="card" style={{padding:12,marginBottom:14}}>
            <div style={{fontWeight:700,marginBottom:6,fontSize:13.5}}>Enviar respuesta rápida</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <select className="input" style={{flex:1,minWidth:180}} value={qrSel} onChange={e=>setQrSel(e.target.value)}><option value="">Elige un mensaje…</option>{(qreplies||[]).map(r=><option key={r.id} value={r.id}>{r.titulo}</option>)}</select>
              <button className="btn btn-ghost btn-sm" disabled={!qrSel} onClick={()=>{ const r=(qreplies||[]).find(x=>x.id===qrSel); if(r) waLead(sel,tok(r.texto,sel)); }}>Enviar</button>
              <button className="btn btn-ghost btn-sm" disabled={!qrSel} onClick={()=>{ const r=(qreplies||[]).find(x=>x.id===qrSel); if(r&&navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(tok(r.texto,sel)).then(()=>notify&&notify("Copiado")); }}>Copiar</button>
            </div>
          </div>
          {/* datos */}
          <div className="grid c2" style={{gridTemplateColumns:"1fr 1fr",gap:10}}>
            <div className="field"><label className="label">Nombre</label><input className="input" value={sel.nombre} onChange={e=>patch(sel.id,{nombre:e.target.value})}/></div>
            <div className="field"><label className="label">Teléfono / WhatsApp</label><input className="input" value={sel.telefono} onChange={e=>patch(sel.id,{telefono:e.target.value})}/></div>
            <div className="field"><label className="label">Correo</label><input className="input" value={sel.email||""} onChange={e=>patch(sel.id,{email:e.target.value})}/></div>
            <div className="field"><label className="label">Fuente</label><select className="input" value={sel.fuente} onChange={e=>patch(sel.id,{fuente:e.target.value})}>{CRM_FUENTES.map(f=><option key={f}>{f}</option>)}</select></div>
            <div className="field"><label className="label">Busca</label><select className="input" value={sel.tipoBusqueda} onChange={e=>patch(sel.id,{tipoBusqueda:e.target.value})}><option value="arriendo">Arriendo</option><option value="compra">Compra</option></select></div>
            <div className="field"><label className="label">Propiedad de interés</label><select className="input" value={sel.propInteres||""} onChange={e=>patch(sel.id,{propInteres:e.target.value})}><option value="">— Sin asignar —</option>{propiedades.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
            <div className="field"><label className="label">Comuna / sector</label><input className="input" value={sel.comuna||""} onChange={e=>patch(sel.id,{comuna:e.target.value})}/></div>
            <div className="field"><label className="label">Presupuesto</label><input className="input" value={sel.presupuesto||""} onChange={e=>patch(sel.id,{presupuesto:e.target.value})}/></div>
            <div className="field"><label className="label">Dormitorios</label><input className="input" value={sel.dorms||""} onChange={e=>patch(sel.id,{dorms:e.target.value})}/></div>
          </div>
          <div className="field" style={{marginTop:10}}><label className="label">Notas</label><textarea className="input" value={sel.notas||""} onChange={e=>patch(sel.id,{notas:e.target.value})} style={{minHeight:60}}/></div>

          {/* interacciones */}
          <div className="sub-title" style={{marginTop:16}}>Interacciones</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>
            <select className="input" style={{maxWidth:150}} value={iCanal} onChange={e=>setICanal(e.target.value)}>{CRM_CANALES.map(c=><option key={c}>{c}</option>)}</select>
            <input className="input" style={{flex:1,minWidth:180}} placeholder="¿Qué conversaron? (ej: pidió ficha, agendó visita…)" value={iText} onChange={e=>setIText(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addInter();}}/>
            <button className="btn btn-out btn-sm" onClick={addInter}>Registrar</button>
          </div>
          {(sel.interacciones||[]).length? <div className="crm-time">{(sel.interacciones||[]).map(it=>(
            <div key={it.id} className="it"><div style={{fontSize:12,color:"var(--muted)"}}>{fmtF(it.fecha)} · {it.canal} <button className="btn btn-ghost btn-xs" style={{marginLeft:6}} onClick={()=>delInter(it.id)}>✕</button></div><div style={{fontSize:14}}>{it.texto}</div></div>
          ))}</div> : <div className="help" style={{margin:0}}>Aún sin interacciones registradas.</div>}

          {/* visitas */}
          <div className="sub-title" style={{marginTop:16}}>Visitas</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10,alignItems:"flex-end"}}>
            <div className="field" style={{margin:0}}><label className="label">Fecha</label><input className="input" type="date" value={vFecha} onChange={e=>setVFecha(e.target.value)}/></div>
            <div className="field" style={{margin:0}}><label className="label">Hora</label><input className="input" type="time" value={vHora} onChange={e=>setVHora(e.target.value)}/></div>
            <div className="field" style={{margin:0,minWidth:160}}><label className="label">Propiedad</label><select className="input" value={vProp} onChange={e=>setVProp(e.target.value)}><option value="">{sel.comuna||"— Elegir —"}</option>{propiedades.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
            <button className="btn btn-out btn-sm" onClick={addVisita}>Agendar</button>
          </div>
          {(sel.visitas||[]).length? (sel.visitas||[]).map(v=>(
            <div key={v.id} className="crm-card" style={{borderLeftColor:v.estado==="realizada"?"#101012":(v.estado==="cancelada"?"#C7C7CC":"#8E8E93"),cursor:"default"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                <div><b>{fmtF(v.fecha)} · {v.hora}</b> — {propName(v.propId)||sel.comuna||"Visita"} <span className="crm-chip">{v.estado}</span></div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  {sel.telefono&&<button className="btn btn-ghost btn-xs" onClick={()=>waLead(sel,"Hola "+(sel.nombre||"").split(" ")[0]+", te confirmo la visita el "+fmtF(v.fecha)+" a las "+v.hora+". ¡Te espero!")}></button>}
                  {v.estado!=="realizada"&&<button className="btn btn-ghost btn-xs" onClick={()=>setVisitaEstado(v.id,"realizada")}>✓</button>}
                  {v.estado!=="cancelada"&&<button className="btn btn-ghost btn-xs" onClick={()=>setVisitaEstado(v.id,"cancelada")}>✕</button>}
                  <button className="btn btn-ghost btn-xs" onClick={()=>delVisita(v.id)}>✕</button>
                </div>
              </div>
            </div>
          )) : <div className="help" style={{margin:0}}>Sin visitas agendadas.</div>}

          {/* tareas */}
          <div className="sub-title" style={{marginTop:16}}>✓ Seguimientos / tareas</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10,alignItems:"flex-end"}}>
            <input className="input" style={{flex:1,minWidth:180}} placeholder="Tarea (ej: llamar mañana, enviar contrato…)" value={tTit} onChange={e=>setTTit(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addTarea();}}/>
            <div className="field" style={{margin:0}}><label className="label">Vence</label><input className="input" type="date" value={tVen} onChange={e=>setTVen(e.target.value)}/></div>
            <button className="btn btn-out btn-sm" onClick={addTarea}>Agregar</button>
          </div>
          {(sel.tareas||[]).length? (sel.tareas||[]).map(t=>(
            <div key={t.id} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:"1px solid var(--line)"}}>
              <input type="checkbox" checked={!!t.hecha} onChange={()=>toggleTarea(t.id)}/>
              <span style={{flex:1,textDecoration:t.hecha?"line-through":"none",color:t.hecha?"var(--faint)":(t.vence<=hoyISO?"var(--red-d)":"inherit")}}>{t.titulo} <span style={{fontSize:12,color:"var(--muted)"}}>· {fmtF(t.vence)}</span></span>
              <button className="btn btn-ghost btn-xs" onClick={()=>delTarea(t.id)}>✕</button>
            </div>
          )) : <div className="help" style={{margin:0}}>Sin seguimientos pendientes.</div>}
        </div>
        <div className="modal-foot" style={{justifyContent:"space-between"}}>
          <button className="btn btn-ghost" style={{color:"var(--red-d)"}} onClick={()=>{ if(window.confirm("¿Eliminar este lead?")) delLead(sel.id); }}>✕ Eliminar lead</button>
          <button className="btn btn-primary" onClick={()=>setSelId(null)}>Listo</button>
        </div>
      </div>
    </div>}
  </div>);
};

const ROLES_INFO={
  propietario:{label:"Propietario",desc:"Acceso total: propiedades, finanzas, contratos, equipo y configuración."},
  colaborador:{label:"Colaborador",desc:"Opera toda la plataforma (cobros, contratos, informes), sin gestionar el equipo ni la configuración."},
  invitado:{label:"Invitado",desc:"Solo lectura: ve el inicio, las propiedades, el historial y los informes."},
  arrendatario:{label:"Arrendatario",desc:"Entra a un portal propio donde ve su arriendo y puede pagarlo en línea."}
};
async function hashClave(clave,salt){ const data=new TextEncoder().encode(salt+"·"+clave); const buf=await crypto.subtle.digest("SHA-256",data); return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join(""); }
const claveFuerte=(s)=>({ largo:(s||"").length>=8, minus:/[a-z]/.test(s||""), mayus:/[A-Z]/.test(s||""), numero:/[0-9]/.test(s||""), especial:/[^A-Za-z0-9]/.test(s||"") });
const claveOk=(s)=>Object.values(claveFuerte(s)).every(Boolean);
const REQ_TXT={largo:"Mínimo 8 caracteres",minus:"Una letra minúscula",mayus:"Al menos 1 letra mayúscula",numero:"Al menos 1 número",especial:"Un carácter especial (!@#$%…)"};
const PERMISOS_TABS={ invitado:["inicio","props","historial","informes","faq"], colaborador:null, propietario:null };

function AuthScreen({usuarios,setUsuarios,onLogin}){
  const [modo,setModo]=useState(usuarios.length?"login":"registro");
  const [paso,setPaso]=useState(1);
  const [nombre,setNombre]=useState(""); const [email,setEmail]=useState(""); const [clave,setClave]=useState(""); const [clave2,setClave2]=useState("");
  const [codigo,setCodigo]=useState(""); const [codigoDemo,setCodigoDemo]=useState(null); const [modoCodigo,setModoCodigo]=useState("servidor");
  const [err,setErr]=useState(""); const [info,setInfo]=useState(""); const [busy,setBusy]=useState(false);
  const mail=(email||"").trim().toLowerCase();
  const invitacion = usuarios.find(u=>(u.email||"").toLowerCase()===mail);

  const entrar=async()=>{ setErr(""); if(!mail||!clave){setErr("Escribe tu correo y tu contraseña.");return;}
    const u=usuarios.find(x=>(x.email||"").toLowerCase()===mail);
    if(!u){setErr("No existe una cuenta con ese correo. Si te invitaron, usa \u201cCrear cuenta\u201d con el mismo correo de la invitación.");return;}
    if(!u.passHash){setErr("Tu cuenta aún no está activada. Usa \u201cCrear cuenta\u201d para validar tu correo y crear tu contraseña.");return;}
    setBusy(true); const hh=await hashClave(clave,u.salt||""); setBusy(false);
    if(hh!==u.passHash){setErr("Contraseña incorrecta.");return;}
    onLogin(u);
  };
  const enviarCodigo=async()=>{ setErr(""); setInfo("");
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){setErr("Escribe un correo válido.");return;}
    if(usuarios.length && !invitacion){ setErr("Este correo no tiene una invitación. Pide al propietario que te agregue en \u201cEquipo y accesos\u201d y vuelve a intentarlo."); return; }
    if(invitacion && invitacion.passHash){ setErr("Ese correo ya tiene una cuenta activa. Usa \u201cIngresar\u201d."); return; }
    setBusy(true);
    try{
      const r=await fetch("/api/codigo",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"enviar",email:mail})});
      const j=await r.json();
      if(j&&j.ok){ if(j.demo&&j.codigo){ setModoCodigo("demo"); setCodigoDemo(String(j.codigo)); setInfo("Todavía no hay servicio de correo configurado en el servidor (variable RESEND_API_KEY), así que tu código es: "+j.codigo); } else { setModoCodigo("servidor"); setInfo("Te enviamos un código de 6 dígitos a "+mail+". Revisa tu bandeja de entrada y la carpeta de spam."); } setPaso(2); }
      else throw new Error((j&&j.error)||"error");
    }catch(e){ const c=String(Math.floor(100000+Math.random()*900000)); setModoCodigo("demo"); setCodigoDemo(c); setInfo("Sin conexión con el servidor de correo (vista previa local). Usa este código: "+c); setPaso(2); }
    setBusy(false);
  };
  const verificar=async()=>{ setErr("");
    const c=(codigo||"").trim(); if(c.length!==6){setErr("El código tiene 6 dígitos.");return;}
    if(modoCodigo==="demo"){ if(c!==codigoDemo){setErr("Código incorrecto.");return;} setPaso(3); setInfo(""); return; }
    setBusy(true);
    try{ const r=await fetch("/api/codigo",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"verificar",email:mail,codigo:c})}); const j=await r.json(); setBusy(false);
      if(j&&j.ok&&j.valido){ setPaso(3); setInfo(""); } else setErr((j&&j.error)||"Código incorrecto o vencido. Pide uno nuevo.");
    }catch(e){ setBusy(false); setErr("No se pudo verificar el código. Intenta de nuevo."); }
  };
  const crearCuenta=async()=>{ setErr("");
    if(!claveOk(clave)){setErr("La contraseña no cumple todos los requisitos.");return;}
    if(clave!==clave2){setErr("Las contraseñas no coinciden.");return;}
    setBusy(true);
    const salt=String(Date.now())+Math.random().toString(36).slice(2);
    const hh=await hashClave(clave,salt);
    let cuenta;
    if(invitacion){ cuenta={...invitacion, nombre:invitacion.nombre||nombre||mail.split("@")[0], salt, passHash:hh, verificado:true, activadoEl:todayISO()};
      setUsuarios(us=>us.map(u=>u.id===invitacion.id?cuenta:u));
    } else { cuenta={ id:Date.now(), nombre:nombre||mail.split("@")[0], email:mail, rol:"propietario", salt, passHash:hh, verificado:true, creadoEl:todayISO() };
      setUsuarios(us=>[...us,cuenta]); }
    setBusy(false); onLogin(cuenta);
  };
  const reqs=claveFuerte(clave);
  return (<div className="auth-wrap"><div className="auth-card">
    <div className="auth-logo">A</div>
    <h1>ArriendoPro</h1>
    <div className="sub">Administración profesional de propiedades en Chile. Ingresa con tu correo y contraseña, o crea tu cuenta validando tu correo electrónico.</div>
    <div className="auth-tabs">
      <button className={modo==="login"?"on":""} onClick={()=>{setModo("login");setErr("");setInfo("");setPaso(1);}}>Ingresar</button>
      <button className={modo==="registro"?"on":""} onClick={()=>{setModo("registro");setErr("");setInfo("");setPaso(1);}}>Crear cuenta</button>
    </div>
    {err&&<div className="auth-err">{err}</div>}
    {info&&<div className="auth-info">{info}</div>}
    {modo==="login"&&<>
      <div className="field"><label className="label">Correo electrónico</label><input className="input" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="tucorreo@ejemplo.cl" autoComplete="email"/></div>
      <div className="field" style={{marginTop:10}}><label className="label">Contraseña</label><input className="input" type="password" value={clave} onChange={e=>setClave(e.target.value)} onKeyDown={e=>e.key==="Enter"&&entrar()} autoComplete="current-password"/></div>
      <button className="btn btn-red" style={{width:"100%",marginTop:16}} disabled={busy} onClick={entrar}>{busy?"Verificando…":"Ingresar a la plataforma"}</button>
    </>}
    {modo==="registro"&&paso===1&&<>
      {usuarios.length===0&&<div className="auth-info">Bienvenido. Esta será la <b>cuenta del propietario principal</b>, con acceso total. Luego podrás invitar a más propietarios, colaboradores, invitados y arrendatarios desde \u201cEquipo y accesos\u201d.</div>}
      <div className="field"><label className="label">Nombre completo</label><input className="input" value={nombre} onChange={e=>setNombre(e.target.value)} placeholder="Ej: Javier Contreras"/></div>
      <div className="field" style={{marginTop:10}}><label className="label">Correo electrónico</label><input className="input" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="tucorreo@ejemplo.cl"/></div>
      <button className="btn btn-red" style={{width:"100%",marginTop:16}} disabled={busy} onClick={enviarCodigo}>{busy?"Enviando…":"Enviarme el código de verificación"}</button>
    </>}
    {modo==="registro"&&paso===2&&<>
      <div className="field"><label className="label">Código de 6 dígitos enviado a {mail}</label><input className="input cod-input" inputMode="numeric" maxLength={6} value={codigo} onChange={e=>setCodigo(e.target.value.replace(/[^0-9]/g,""))} onKeyDown={e=>e.key==="Enter"&&verificar()}/></div>
      <button className="btn btn-red" style={{width:"100%",marginTop:16}} disabled={busy} onClick={verificar}>{busy?"Verificando…":"Validar mi correo"}</button>
      <button className="btn btn-ghost" style={{width:"100%",marginTop:8}} onClick={enviarCodigo}>Reenviar código</button>
    </>}
    {modo==="registro"&&paso===3&&<>
      <div className="auth-info">Correo validado ✓ — ahora crea una contraseña segura.</div>
      <div className="field"><label className="label">Contraseña</label><input className="input" type="password" value={clave} onChange={e=>setClave(e.target.value)} autoComplete="new-password"/></div>
      <div className="clave-req">{Object.keys(REQ_TXT).map(k=><span key={k} className={reqs[k]?"ok":""}>{reqs[k]?"✓":"○"} {REQ_TXT[k]}</span>)}</div>
      <div className="field"><label className="label">Repite la contraseña</label><input className="input" type="password" value={clave2} onChange={e=>setClave2(e.target.value)} autoComplete="new-password"/></div>
      <button className="btn btn-red" style={{width:"100%",marginTop:16}} disabled={busy||!claveOk(clave)||clave!==clave2} onClick={crearCuenta}>{busy?"Creando cuenta…":"Crear mi cuenta y entrar"}</button>
    </>}
    <div style={{marginTop:18,fontSize:12.5,color:"var(--faint)",lineHeight:1.55}}>Las contraseñas se guardan con hash irreversible (SHA-256 + salt). Los arrendatarios solo ven su propio arriendo.</div>
  </div></div>);
}

/* Puerta de entrada: la primera vez se crea la clave, después se pide.
   Sin esto, cualquiera que llegara a la dirección del sitio podía leer y
   sobrescribir todos los datos. */
function Puerta({ modo, onEntrar }){
  const [clave,setClave]=useState("");
  const [clave2,setClave2]=useState("");
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const crear = modo==="crear";
  const corta = clave.length<6;
  const noCalza = crear && clave!==clave2;
  const entrar=async()=>{
    if(busy||corta||noCalza) return;
    setBusy(true); setErr("");
    try{
      const r=await apiJSON("/api/acceso", crear?{accion:"crear",clave}:{accion:"entrar",clave});
      const j=await r.json().catch(()=>({}));
      if(!r.ok||!j.token){ setErr(j.error||"No se pudo entrar"); setBusy(false); return; }
      guardarToken(j.token);
      onEntrar({rol:j.rol,nombre:j.nombre});
    }catch(e){ setErr("Sin conexión con el servidor"); }
    setBusy(false);
  };
  return (<div className="puerta">
    <div className="puerta-caja">
      <div className="brand-logo" style={{width:64,height:64,marginBottom:14}}><img src="/logo.png" alt="ArriendoPro"/></div>
      <h2>{crear?"Protege tu plataforma":"ArriendoPro"}</h2>
      <p>{crear
        ? "Crea la clave con la que entrarás desde ahora. Sin ella, nadie puede ver ni cambiar tus datos."
        : "Ingresa tu clave para entrar."}</p>
      <input className="input" type="password" value={clave} autoFocus
        placeholder={crear?"Clave nueva (mínimo 6 caracteres)":"Tu clave"}
        onChange={e=>setClave(e.target.value)}
        onKeyDown={e=>{ if(e.key==="Enter"&&!crear) entrar(); }}/>
      {crear && <input className="input" type="password" value={clave2} placeholder="Repite la clave"
        style={{marginTop:10}} onChange={e=>setClave2(e.target.value)}
        onKeyDown={e=>{ if(e.key==="Enter") entrar(); }}/>}
      {err && <div className="puerta-err">{err}</div>}
      <button className="btn btn-red" style={{width:"100%",marginTop:14,padding:"14px"}}
        disabled={busy||corta||noCalza} onClick={entrar}>
        {busy?"Entrando…":(crear?"Crear clave y entrar":"Entrar")}</button>
      {crear && <div className="puerta-nota">Anótala en un lugar seguro: no hay forma de recuperarla desde acá.</div>}
      {!crear && <div className="puerta-nota">Si alguien más administra contigo, pídele su propio acceso al dueño de la cuenta.</div>}
    </div>
  </div>);
}

/* ============ INTERFAZ MÓVIL ============
   Bajo 900 px la app se reemplaza por MobileApp: 5 pestañas fijas abajo, una
   tarjeta dominante por pantalla, tokens propios (blanco, negro y grises). El
   escritorio no se toca; se oculta por CSS mientras esté visible el móvil.
   Ver design_handoff_arriendopro_mobile/README.md para los tokens exactos. */

// Media query bajo 900 px, con re-render al girar el teléfono o cambiar el ancho.
// Se calcula perezoso para el harness sin `window`.
const useMovil = ()=>{
  const [m,setM] = React.useState(()=> {
    try { return window.matchMedia("(max-width:900px)").matches; } catch(_){ return false; }
  });
  React.useEffect(()=>{
    try{
      const mq = window.matchMedia("(max-width:900px)");
      const h = e=> setM(e.matches);
      if(mq.addEventListener) mq.addEventListener("change",h);
      else if(mq.addListener) mq.addListener(h);
      return ()=>{
        if(mq.removeEventListener) mq.removeEventListener("change",h);
        else if(mq.removeListener) mq.removeListener(h);
      };
    }catch(_){}
  },[]);
  return m;
};

    <path d="M3 10h18M7 15h4"/>

    <polyline points="15 7 21 7 21 13"/>

  check: <polyline points="5 12 10 17 20 7"/>,
  alerta: (<React.Fragment>
    <path d="M12 3 2 20h20L12 3z"/>
    <path d="M12 10v4M12 17v.5"/>
  </React.Fragment>),
  doc: (<React.Fragment>
    <path d="M6 3h9l3 3v15H6z"/>
    <path d="M15 3v3h3M9 12h6M9 16h6"/>
  </React.Fragment>),
  lupa: (<React.Fragment>
    <circle cx="11" cy="11" r="7"/>
    <path d="m20 20-3.5-3.5"/>
  </React.Fragment>),

    <path d="M5 12h14"/>

  casita: <path d="M4 11 12 5l8 6v9h-5v-6H9v6H4z"/>,
};

// Iniciales para avatares cuadrados.
const mobIni = (n)=> String(n||"").trim().split(/\s+/).filter(Boolean).slice(0,2).map(x=>(x[0]||"").toUpperCase()).join("") || "?";

// Sacar el "número" identificador de una propiedad (7A, 12, 3B, …) para el cuadro.
const mobEtiq = (name, i=1)=>{
  const s = String(name||"");
  const m = s.match(/\b(\d+[A-Z]?)\b/);
  return (m && m[1]) || String(i);
};

// Días desde una fecha ISO, positivo si ya pasó.
const mobDiasDesde = (iso)=> {
  try{ return Math.max(0, Math.round((Date.now() - new Date(iso).getTime())/86400000)); }
  catch(_){ return 0; }
};

function MobileApp(props){
  const {
    props: propiedades, socs, uf, owner, soloLectura,
    setMPay, setMContract, notify, openRem,
    setMFicha, abrirIncidencia,
    buscar, secciones, abrirSeccion,
    utm, dolar, ipc, indLoading, indRecien, refrescarIndicadores,
    alertas, irAlerta, usuarioActual, rolActual,
    acciones = {},
  } = props;
  const AC = acciones;

  const [tab, setTab] = React.useState("inicio");
  const [subtab, setSubtab] = React.useState("sociedades");
  const [pila, setPila] = React.useState([]);
  const [socSel, setSocSel] = React.useState("todas");
  const [finSeg, setFinSeg] = React.useState("utilidad");
  const [busca, setBusca] = React.useState("");
  const [mostrarBusca, setMostrarBusca] = React.useState(false);
  const [chatMsg, setChatMsg] = React.useState("");
  const [contrPaso, setContrPaso] = React.useState(2);

  const push = (v)=> setPila(p=>[...p, v]);
  const pop  = ()=> setPila(p=>p.slice(0,-1));
  const irA  = (t)=>{ setPila([]); setTab(t); };
  const top  = pila[pila.length-1] || null;

  // Datos derivados.
  const rentals    = propiedades.filter(p=>p.use==="arriendo");
  const personales = propiedades.filter(p=>p.use==="personal");
  const atrasados  = rentals.filter(p=>p.status==="atrasado");
  const pendientes = rentals.filter(p=>p.status==="pendiente");
  const pagados    = rentals.filter(p=>p.status==="pagado");

  // Los cálculos de dinero SIEMPRE salen del estado real, nunca escritos a mano.
  const montoCob   = (p)=> num(p.rent) + calcMultaSafe(p);
  function calcMultaSafe(p){
    if(p.status!=="atrasado" || !p.lastPaid) return 0;
    const d = mobDiasDesde(p.lastPaid) - 30;
    return Math.max(0, Math.round(num(p.rent) * (num(p.penalty)/100) * (d/30)));
  }
  const porCobrarHoy = atrasados.concat(pendientes).reduce((s,p)=>s+montoCob(p), 0);
  const totalMulta   = atrasados.reduce((s,p)=>s+calcMultaSafe(p), 0);
  const totalEsper   = rentals.reduce((s,p)=>s+num(p.rent), 0);
  const totalCobrado = pagados.reduce((s,p)=>s+num(p.rent), 0);
  const pctCob       = totalEsper ? Math.round(100*totalCobrado/totalEsper) : 0;
  const atrasadoMasGrave = atrasados.slice().sort((a,b)=> mobDiasDesde(b.lastPaid) - mobDiasDesde(a.lastPaid))[0] || null;

  // Contratos por firmar (mock del NAV real: firma en estado enviado/pendiente).
  const contratosPorFirmar = propiedades.filter(p=>{
    const f = p.firma||{}; return f.estado==="enviado" || f.estado==="pendiente";
  });

  // Sociedades a mostrar en el segmentado.
  const socOpciones = (socs||[]).slice(0,2).concat([{id:"todas", name:"Todas"}]);
  const socActual = socs.find(s=>s.id===socSel) || null;
  const porSoc = (id)=> id==="todas" ? propiedades : propiedades.filter(p=>(p.sociedad||"beta")===id);

  // Header genérico (etiqueta mono + título + avatar).
  /* La lupa va en todos los encabezados: es el atajo para llegar a cualquier
     sección, propiedad o arrendatario sin recorrer las pestañas. Abre el mismo
     buscador de la plataforma, que ya sabe navegar a cada destino. */
  const BotonBuscar = ()=> (
    <button className="mob-back" onClick={buscar} title="Buscar en la plataforma" aria-label="Buscar en la plataforma">
      <MobIco w={19}>{MI.lupa}</MobIco>
    </button>
  );
  const HeaderMob = ({ eyebrow, title, sub, right })=> (
    <div className="mob-header">
      <div style={{minWidth:0, flex:1}}>
        <div className="mob-mono" style={{marginBottom:6}}>{eyebrow}</div>
        <h1 className="mob-hero-h">{title}</h1>
        {sub && <div className="mob-hero-sub">{sub}</div>}
      </div>
      <div style={{display:"flex", alignItems:"center", gap:10, flexShrink:0}}>
        <BotonBuscar/>
        {right !== undefined
          ? right
          : <div className="mob-avatar">{mobIni(owner.name||"Javier")}</div>}
      </div>
    </div>
  );

  const abrirCobrar = (p)=>{
    if(!p) return;
    (AC.registrarPago || setMPay)(p);
  };
  const abrirRecord = (p)=> openRem && openRem(p);
  const abrirChat   = (p)=> push({ tipo:"chat", p });
  const abrirFicha  = (p)=> push({ tipo:"ficha", p });
  const abrirContrato = (p)=> push({ tipo:"contrato", p });

  /* ---------- Pantalla 1a · Inicio (enfoque) ---------- */
  const pantallaInicio = ()=>{
    const hoy = new Date();
    const dias = ["DOMINGO","LUNES","MARTES","MIÉRCOLES","JUEVES","VIERNES","SÁBADO"];
    const eyebrow = dias[hoy.getDay()] + " " + hoy.getDate();
    const nombre = (owner.name||"").trim().split(/\s+/)[0] || "Javier";
    const porCobrarLista = atrasados.concat(pendientes);
    const lineas = porCobrarLista.slice(0,2);
    const restoPagados = pagados.length;
    return (<div className="mob-scr">
      <HeaderMob
        eyebrow={eyebrow}
        title={"Hola, " + nombre}
        sub={rentals.length + personales.length + " propiedades · " + socs.length + " sociedades"}/>

      {/* Indicadores en vivo: estaban en el escritorio y faltaban en el móvil.
          Se desplazan de lado para no comerse el alto de la pantalla. */}
      <div className="mob-inds">
        <span className="mob-ind"><b>UF</b> {CLP(uf)}</span>
        <span className="mob-ind"><b>UTM</b> {CLP(utm)}</span>
        <span className="mob-ind"><b>UTA</b> {CLP(utm*12)}</span>
        <span className="mob-ind"><b>Dólar</b> {CLP(dolar)}</span>
        <span className="mob-ind"><b>IPC</b> {(ipc||0).toFixed(1)}%</span>
        <button className="mob-ind act" onClick={refrescarIndicadores} disabled={indLoading}>
          {indLoading ? "Actualizando…" : (indRecien ? "✓ Actualizado" : "↻ Actualizar")}
        </button>
      </div>

      {/* Alertas: contratos por vencer, cobros, contribuciones, seguros. */}
      {!!(alertas && alertas.length) && (
        <div>
          <div className="mob-eyebrow">REQUIERE ATENCIÓN</div>
          <div style={{display:"flex", flexDirection:"column", gap:8}}>
            {alertas.slice(0,3).map((a,i)=>(
              <button key={a.id||i} className={"mob-row"+(a.urgencia==="alta"?" mark":"")}
                style={{width:"100%", textAlign:"left", cursor:"pointer", font:"inherit"}}
                onClick={()=>irAlerta(a)}>
                <div className="mob-quad-ic" style={{fontSize:17}}>{a.ico||"⚠️"}</div>
                <div style={{flex:1, minWidth:0}}>
                  <div style={{fontSize:14.5, fontWeight:700, color:"var(--mib)"}}>{a.titulo}</div>
                  {a.detalle && <div style={{fontSize:13, color:"var(--mtm)", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{a.detalle}</div>}
                </div>
                <MobIco w={19} sw={2.4}>{MI.chevron}</MobIco>
              </button>
            ))}
            {alertas.length>3 && (
              <button className="mob-btn link" style={{textAlign:"left", color:"var(--mtm)", fontWeight:600}}
                onClick={()=>abrirSeccion("inicio")}>y {alertas.length-3} alerta{alertas.length-3!==1?"s":""} más →</button>
            )}
          </div>
        </div>
      )}

      {/* Tarjeta dominante: por cobrar hoy. */}
      <div className="mob-card dom">
        <div className="mob-eyebrow"><span className="mob-pt"></span>POR COBRAR HOY</div>
        <div className="mob-num-big">{CLP(porCobrarHoy)}</div>
        <div style={{fontSize:15, color:"var(--mtm2)", marginTop:-6}}>
          {atrasados.length} atrasado{atrasados.length!==1?"s":""} y {pendientes.length} que vence{pendientes.length!==1?"n":""} hoy
        </div>

        <div className="mob-metrics">
          <div className="m"><span className="v">{rentals.length}</span><span className="k">Arriendos</span></div>
          <div className="m"><span className="v">{pctCob}%</span><span className="k">Cobrado</span></div>
          <div className="m"><span className="v">{CLP(totalMulta)}</span><span className="k">Multas</span></div>
        </div>

        <div style={{display:"flex", flexDirection:"column", gap:12}}>
          {lineas.map((p,i)=>(
            <div key={p.id} style={{display:"flex", alignItems:"center", gap:12}}>
              <div className="mob-quad-idx">{i+1}</div>
              <div style={{flex:1, minWidth:0, fontSize:15, fontWeight:600, color:"var(--mtx)", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{p.name}</div>
              <div style={{fontSize:14, color:"var(--mtm)", flexShrink:0}}>
                {p.status==="atrasado" ? (mobDiasDesde(p.lastPaid) + " días") : "vence hoy"}
              </div>
            </div>
          ))}
          {lineas.length===0 && <div style={{fontSize:14, color:"var(--mtm2)"}}>Todo cobrado este mes.</div>}
          {/* Se listan los 2 más urgentes; con la cartera real hay más, y
              ocultarlos en silencio haría creer que solo faltan esos dos. */}
          {porCobrarLista.length>2 && (
            <button className="mob-btn link" style={{paddingLeft:38, textAlign:"left", fontWeight:600, color:"var(--mtm)"}} onClick={()=>irA("cobros")}>
              y {porCobrarLista.length-2} más por cobrar →
            </button>
          )}
          {restoPagados>0 && <div style={{fontSize:14, color:"var(--mtm)", paddingLeft:38}}>{restoPagados} arriendo{restoPagados!==1?"s":""} ya pagado{restoPagados!==1?"s":""}</div>}
        </div>

        <button className="mob-btn pri" onClick={()=>{ if(atrasadoMasGrave) abrirCobrar(atrasadoMasGrave); else irA("cobros"); }}>
          Cobrar ahora <MobIco sw={2.4}>{MI.chevron}</MobIco>
        </button>
      </div>

      {/* TAMBIÉN HOY */}
      <div>
        <div className="mob-eyebrow">TAMBIÉN HOY</div>
        <div style={{display:"flex", flexDirection:"column", gap:10}}>
          {contratosPorFirmar.slice(0,1).map(p=>(
            <div key={"cf"+p.id} className="mob-row">
              <div className="mob-quad-ic"><MobIco>{MI.doc}</MobIco></div>
              <div style={{flex:1}}>
                <div style={{fontSize:15, fontWeight:700, color:"var(--mib)"}}>Contrato por firmar</div>
                <div style={{fontSize:13, color:"var(--mtm)", marginTop:2}}>{p.name} · falta el arrendatario</div>
              </div>
              <button className="mob-btn link" onClick={()=> abrirContrato(p)}>Enviar</button>
            </div>
          ))}
          {atrasados.slice(0,1).map(p=>(
            <div key={"cm"+p.id} className="mob-row" onClick={()=>abrirChat(p)} role="button">
              <div className="mob-quad-ic"><MobIco>{MI.chat}</MobIco></div>
              <div style={{flex:1}}>
                <div style={{fontSize:15, fontWeight:700, color:"var(--mib)"}}>Mensaje de {(p.tenant||"").split(" ")[0]||"arrendatario"}.</div>
                <div style={{fontSize:13, color:"var(--mtm)", marginTop:2}}>"Transferí ayer {CLP(num(p.rent))}"</div>
              </div>
              <div style={{width:9, height:9, borderRadius:"50%", background:"var(--mib)", flexShrink:0}}></div>
            </div>
          ))}
          {contratosPorFirmar.length===0 && atrasados.length===0 &&
            <div style={{fontSize:14, color:"var(--mtm2)"}}>No hay avisos para hoy.</div>}
        </div>
      </div>
    </div>);
  };

  /* ---------- Pantalla 2a · Cobros ---------- */
  const pantallaCobros = ()=>{
    const mesNombre = ["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];
    const now = new Date();
    const mesTxt = mesNombre[now.getMonth()] + " " + now.getFullYear();
    const dominante = atrasadoMasGrave;
    const domDias = dominante ? mobDiasDesde(dominante.lastPaid) : 0;
    const domMulta = dominante ? calcMultaSafe(dominante) : 0;
    const domTotal = dominante ? montoCob(dominante) : 0;
    const restoOrden = pendientes.concat(pagados);
    const rentBusca = busca.trim().toLowerCase();
    const filtro = (p)=> !rentBusca || (p.name||"").toLowerCase().includes(rentBusca)
      || (p.comuna||"").toLowerCase().includes(rentBusca)
      || (p.tenant||"").toLowerCase().includes(rentBusca);
    const dominanteVista = dominante && filtro(dominante) ? dominante : null;
    const resto = restoOrden.filter(filtro);
    return (<div className="mob-scr g14 con-pie">
      <div className="mob-header">
        <div style={{minWidth:0, flex:1}}>
          <div className="mob-mono" style={{marginBottom:6}}>{mesTxt}</div>
          <h1 className="mob-hero-h">Cobros</h1>
        </div>
        <button className="mob-btn out" onClick={()=>setMostrarBusca(v=>!v)} style={{minHeight:44}}>
          <MobIco w={16}>{MI.lupa}</MobIco> Buscar
        </button>
      </div>
      {mostrarBusca && <input className="mob-composer-input" value={busca} onChange={e=>setBusca(e.target.value)}
        placeholder="Buscar por propiedad, comuna o arrendatario…"
        style={{background:"var(--mfl)", border:"none", borderRadius:12, padding:"12px 14px", fontSize:15, fontFamily:"inherit", outline:"none"}}/>}

      {/* Barra de progreso segmentada */}
      <div style={{marginTop:4}}>
        <div className="mob-prog-seg">
          <i className="on" style={{flex: Math.max(0.4, pagados.length)}}></i>
          <i className="mid" style={{flex: Math.max(0.4, pendientes.length)}}></i>
          <i style={{flex: Math.max(0.4, atrasados.length)}}></i>
        </div>
        <div className="mob-prog-lbls">
          <span>{pagados.length} al día</span>
          <span>{pendientes.length} pendiente{pendientes.length!==1?"s":""}</span>
          <span>{atrasados.length} atrasado{atrasados.length!==1?"s":""}</span>
        </div>
      </div>

      {dominanteVista ? (
        <div className="mob-card dom" style={{marginTop:8, gap:16}}>
          <div className="mob-eyebrow"><span className="mob-pt"></span>ATRASADO · {domDias} DÍAS</div>
          <h2 style={{fontSize:27, lineHeight:1.05, fontWeight:700, letterSpacing:"-.02em", color:"var(--mib)", margin:0}}>{dominanteVista.name}</h2>
          <div style={{fontSize:14, color:"var(--mtm)"}}>{dominanteVista.tenant||"—"} · {dominanteVista.address||""}</div>

          <div style={{borderTop:"1px solid var(--mli)", paddingTop:14, display:"flex", flexDirection:"column", gap:10}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"baseline"}}>
              <span style={{fontSize:14, color:"var(--mtx)"}}>Arriendo {mesNombre[now.getMonth()].toLowerCase()}</span>
              <span style={{fontSize:17, fontWeight:700, color:"var(--mib)"}}>{CLP(num(dominanteVista.rent))}</span>
            </div>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"baseline"}}>
              <span style={{fontSize:14, color:"var(--mtx)"}}>Multa {num(dominanteVista.penalty)}% · {domDias} días</span>
              <span style={{fontSize:17, fontWeight:700, color:"var(--mib)"}}>{CLP(domMulta)}</span>
            </div>
          </div>

          <div style={{borderTop:"1px solid var(--mli)", paddingTop:14, display:"flex", justifyContent:"space-between", alignItems:"baseline"}}>
            <span className="mob-mono">TOTAL A COBRAR</span>
            <span className="mob-num-med">{CLP(domTotal)}</span>
          </div>

          <div style={{display:"flex", gap:12}}>
            <button className="mob-btn sec" style={{flex:1}} onClick={()=>abrirRecord(dominanteVista)}>Recordatorio</button>
            <button className="mob-btn pri" style={{flex:1, padding:16}} onClick={()=>abrirCobrar(dominanteVista)}>Registrar<br/>pago</button>
          </div>
        </div>
      ) : (
        <div className="mob-card" style={{marginTop:8}}>
          <div className="mob-eyebrow">TODO AL DÍA</div>
          <div className="mob-num-big">{CLP(totalCobrado)}</div>
          <div style={{fontSize:14, color:"var(--mtm2)"}}>No hay cobros pendientes este mes.</div>
        </div>
      )}

      {resto.length>0 && (<>
        <div className="mob-eyebrow" style={{marginTop:6}}>RESTO DEL MES</div>
        <div style={{display:"flex", flexDirection:"column", gap:10}}>
          {resto.map((p,i)=>{
            const est = p.status;
            const dia = (p.diaPago||num(p.diaPago)||5);
            const rowCls = "mob-row" + (est==="pendiente" ? " mark" : "");
            const izq = est==="pagado"
              ? <div className="mob-quad-idx paid mob-g"><MobIco w={16} sw={2.4}>{MI.check}</MobIco></div>
              : <div className="mob-quad-idx mob-g">{String(dia).padStart(2,"0")}</div>;
            const sub = est==="pagado"
              ? ((p.tenant||"") + " · pagado el " + dia)
              : ((p.tenant||"") + " · vence hoy");
            return (<div key={p.id} className={rowCls} onClick={()=>abrirCobrar(p)} role="button">
              {izq}
              <div style={{flex:1, minWidth:0}}>
                <div style={{fontSize:15, fontWeight:700, color:"var(--mib)"}}>{p.name}</div>
                <div style={{fontSize:13, color:"var(--mtm)", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{sub}</div>
              </div>
              <div style={{fontSize:16, fontWeight:700, color: est==="pagado" ? "var(--mtm2)" : "var(--mib)"}}>{CLP(num(p.rent))}</div>
            </div>);
          })}
        </div>
      </>)}

      <div className="mob-footbar">
        <div>
          <div className="mob-mono">COBRADO / ESPERADO</div>
          <div style={{fontSize:15, fontWeight:700, color:"var(--mib)"}}>{CLP(totalCobrado)} de {CLP(totalEsper)}</div>
        </div>
        <button className="mob-btn out" onClick={()=>abrirSeccion("informes")}>Cartola</button>
      </div>
    </div>);
  };

  /* ---------- Pantalla 2b · Ficha de propiedad ---------- */
  const pantallaFicha = (p)=>{
    const div = divCLP(p, uf);
    const contribMes = Math.round(num(p.contribucionesAnuales)/12);
    const seguroMes = p.seguroUF ? Math.round(num(p.seguroUF)*uf/12) : Math.round(num(p.seguroIncendioSismo)/12);
    const util = utilidadMes(p, uf);
    const sociedad = socs.find(s=>s.id===p.sociedad) || socs[0] || {name:""};
    // Metros y dormitorios en un solo chip; queda vacío si la ficha no los trae.
    const sup = num(p.mBuilt) || num(p.metros) || num(p.surfaceBuilt);
    const medidas = [ sup ? sup+" m²" : "", num(p.dorms)||num(p.bedrooms) ? (num(p.dorms)||num(p.bedrooms))+"D" : "",
      num(p.banios)||num(p.bathrooms) ? (num(p.banios)||num(p.bathrooms))+"B" : "" ].filter(Boolean).join(" · ");
    // Últimos 6 meses de pagos, agrupados desde histPagos.
    const hoy = new Date();
    const barras = [];
    for(let k=5; k>=0; k--){
      const d = new Date(hoy.getFullYear(), hoy.getMonth()-k, 1);
      const clave = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
      const total = ((p.histPagos||[])
        .filter(x=> (x.fecha||"").startsWith(clave))
        .reduce((s,x)=>s+num(x.monto), 0)) || (k===0 && p.status==="pagado" ? num(p.rent) : 0);
      barras.push({ mes:d.getMonth(), total });
    }
    const maxB = Math.max(1, ...barras.map(b=>b.total));
    return (<div className="mob-scr g14 con-pie">
      <div className="mob-topbar">
        <button className="mob-back" onClick={pop} aria-label="Volver"><MobIco w={19} sw={2.4}>{MI.chevronL}</MobIco></button>
        <span className="mob-mono">MIS PROPIEDADES</span>
      </div>

      <div className="mob-photo-ph">
        <MobIco w={28}>{MI.casita}</MobIco>
        <div className="lb">foto de la propiedad</div>
      </div>

      <div>
        <h1 style={{fontSize:26, lineHeight:1.1, fontWeight:700, letterSpacing:"-.02em", color:"var(--mib)", margin:"6px 0 12px"}}>{p.name}</h1>
        <div className="mob-chip-row">
          {/* El estado va primero: es lo que se busca de un vistazo. Los chips
              sin dato no se dibujan (antes salía uno con solo un guion), y el
              nombre de la sociedad se corta si es muy largo en vez de comerse
              la fila entera. */}
          <span className="mob-chip ink">{p.status==="pagado"?"Al día":p.status==="pendiente"?"Vence hoy":p.status==="atrasado"?"Atrasado":"Disponible"}</span>
          {!!sociedad.name && <span className="mob-chip out" title={sociedad.name} style={{maxWidth:"58%"}}>{sociedad.name.replace(/\s*SPA$/i," SPA")}</span>}
          {!!p.tipo && <span className="mob-chip out">{p.tipo}</span>}
          {!!medidas && <span className="mob-chip out">{medidas}</span>}
        </div>
        <div style={{marginTop:12, fontSize:14, color:"var(--mtm)"}}>{p.address}{p.tenant?" · "+p.tenant:""}{p.contratoInicio?" desde "+p.contratoInicio:""}</div>
      </div>

      <div className="mob-card">
        <div className="mob-eyebrow">UTILIDAD DEL MES</div>
        <div><span className="mob-num-big">{CLP(util)}</span> <span style={{fontSize:15, color:"var(--mtm2)", marginLeft:6}}>neto</span></div>
        <div style={{display:"flex", flexDirection:"column", gap:0}}>
          <div style={{display:"flex", justifyContent:"space-between", padding:"12px 0", borderBottom:"1px solid var(--mli)"}}>
            <span style={{fontSize:15, color:"var(--mtx)"}}>Arriendo</span>
            <span style={{fontSize:16, fontWeight:700, color:"var(--mib)"}}>{CLP(num(p.rent))}</span>
          </div>
          <div style={{display:"flex", justifyContent:"space-between", padding:"12px 0", borderBottom:"1px solid var(--mli)"}}>
            <span style={{fontSize:15, color:"var(--mtx)"}}>Dividendo{p.dividendoUF?(" · "+p.dividendoUF+" UF"):""}</span>
            <span style={{fontSize:16, fontWeight:700, color:"var(--mib)"}}>−{CLP(div)}</span>
          </div>
          <div style={{display:"flex", justifyContent:"space-between", padding:"12px 0"}}>
            <span style={{fontSize:15, color:"var(--mtx)"}}>Contribuciones y seguros</span>
            <span style={{fontSize:16, fontWeight:700, color:"var(--mib)"}}>−{CLP(contribMes + seguroMes)}</span>
          </div>
        </div>
      </div>

      <div className="mob-card">
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"baseline"}}>
          <div className="mob-eyebrow">PAGOS RECIBIDOS</div>

        <div style={{display:"flex", justifyContent:"space-between", paddingTop:8, borderTop:"1px solid var(--mli)"}}>

          <span style={{fontSize:15, fontWeight:700, color:"var(--mib)"}}>{CLP(num(p.garantia&&p.garantia.monto))}</span>
        </div>
      </div>

      {/* Todo lo que se puede hacer con una propiedad en el escritorio. Cada
          botón llama a la misma función de la plataforma, no a una copia. */}
      <div className="mob-eyebrow" style={{marginTop:2}}>ACCIONES DE ESTA PROPIEDAD</div>
      <div className="mob-acciones">
        {[
          ["Editar",        MI.doc,   ()=>AC.editarPropiedad && AC.editarPropiedad(p)],
          ["Ficha completa",MI.doc,   ()=>AC.fichaCompleta   && AC.fichaCompleta(p)],
          ["Incidencia",    MI.alerta,()=>AC.incidencia      && AC.incidencia(p)],
          ["Bitácora",      MI.doc,   ()=>AC.bitacora        && AC.bitacora(p)],
          ["Compartir",     MI.flecha,()=>AC.compartir       && AC.compartir(p)],
          ["Firma",         MI.check, ()=>AC.firma           && AC.firma(p)],
          ["Recordatorio",  MI.chat,  ()=>AC.recordatorio    && AC.recordatorio(p)],
          ["Mover de lugar",MI.edif,  ()=>AC.moverPropiedad  && AC.moverPropiedad(p)],
          ["Marcar vacante",MI.casita,()=>AC.vacancia        && AC.vacancia(p)],
        ].map(([lb,ic,fn])=>(
          <button key={lb} className="mob-accion" onClick={fn}>
            <MobIco w={19}>{ic}</MobIco><span>{lb}</span>
          </button>

      </div>
      {/* Aparte de la rejilla y en último lugar: borra la propiedad. */}
      {!soloLectura && (
        <button className="mob-btn link" style={{alignSelf:"flex-start", color:"var(--mtm2)", fontWeight:600, fontSize:13.5, minHeight:44}}
