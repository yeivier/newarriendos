<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ArriendoPro — Administración de Propiedades</title>
<!-- PWA / instalación como aplicación en el celular -->
<meta name="theme-color" content="#C6A25B" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="ArriendoPro" />
<meta name="application-name" content="ArriendoPro" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#F4F6F9; --card:#FFFFFF; --panel2:#F3F6FB; --line:#E3E6EC; --line2:#EDEFF3;
    --text:#1B1E25; --muted:#5C636E; --faint:#8B909A;
    --ink:#141419;
    /* Acento oro sobre blanco */
    --brand:#C6A25B; --brand-d:#9A7A31; --brand-bg:#FBF5E7; --brand-soft:#E7D3A4;
    --gold:#C6A25B;
    --green:#3E9B63; --green-d:#237A46; --green-bg:#E8F4EC; --green-soft:#B9E0C7;
    --red:#D95C50; --red-d:#B23A2F; --red-bg:#FBEBE9; --red-soft:#F0C6C0;
    --amber:#B07D12; --amber-bg:#FBF2DA;
    /* Barra lateral clara */
    --side:#FFFFFF; --side-tx:#3C4048; --side-mut:#8B909A;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.07);
    --radius:10px;
    --font:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-head:'Libre Baskerville',Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{font-family:var(--font);color:var(--text);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased;max-width:100%}
  #root{min-height:100vh;min-height:100dvh}
  img,svg,video{max-width:100%}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-thumb{background:#C4C8D0;border-radius:6px;border:3px solid var(--bg)}
  a{color:inherit;text-decoration:none}

  /* Layout */
  .app{display:flex;min-height:100vh}
  .sidebar{width:250px;background:var(--side);color:var(--side-tx);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0;border-right:1px solid var(--line)}
  .brand{padding:18px 16px;border-bottom:1px solid rgba(0,0,0,.08);display:flex;align-items:center;gap:11px}
  .brand-logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#E6C98A,#A07E33);color:#141419;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex-shrink:0}
  .brand h1{font-size:18px;font-weight:800;color:#141419;letter-spacing:-.2px}
  .brand p{font-size:12.5px;color:#8A8A93}
  .drawer-x{display:none;background:transparent;border:none;color:#8A8A93;font-size:20px;cursor:pointer;padding:4px 8px;margin-left:auto}
  .nav{padding:11px 9px;flex:1;overflow:auto;display:flex;flex-direction:column;gap:3px}
  .nav-group{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--side-mut);padding:14px 11px 5px}
  .nav-group:first-child{padding-top:3px}
  .nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:9px;cursor:pointer;font-size:14.5px;font-weight:600;color:var(--side-tx);transition:.12s}
  .nav-item .ico{font-size:18px;width:24px;text-align:center;flex-shrink:0;opacity:.95}
  .nav-item:hover{background:rgba(0,0,0,.05);color:#141419}
  .nav-item.on{background:var(--brand-bg);color:#141419;box-shadow:inset 3px 0 0 var(--gold)}
  .nav-foot{border-top:1px solid rgba(0,0,0,.08);padding:13px;display:flex;align-items:center;gap:10px}
  .nav-foot .av{width:37px;height:37px;border-radius:10px;background:rgba(198,162,91,.16);color:#E6C98A;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
  .nav-overlay{position:fixed;inset:0;background:rgba(10,16,28,.5);z-index:55}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{background:var(--card);border-bottom:1px solid var(--line);padding:13px 26px;position:sticky;top:0;z-index:20}
  .menu-btn{display:none;background:var(--card);border:2px solid var(--line);border-radius:10px;width:44px;height:44px;font-size:20px;cursor:pointer;color:var(--ink);align-items:center;justify-content:center;flex-shrink:0}
  .topbar h2{font-family:var(--font-head);font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-.2px}
  .topbar .desc{font-size:13.5px;color:var(--muted);margin-top:2px;max-width:760px;line-height:1.45}
  .topbar-row{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
  .content{padding:20px 26px;display:flex;flex-direction:column;gap:14px;max-width:1240px;margin:0 auto;width:100%}

  /* Tarjetas */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pad{padding:18px}
  .grid{display:grid;gap:14px}
  .sec-title{font-family:var(--font-head);font-size:17.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:9px;margin-bottom:4px}
  .sub-title{font-size:13px;font-weight:800;color:#141419;background:var(--brand);padding:8px 13px;border-radius:8px;display:inline-flex;align-items:center;gap:8px;margin:16px 0 11px}
  .sub-title.green{background:var(--green);color:#0D1A13}
  .sub-title.dark{background:#26262E;color:#EDEDEF}
  .help{background:#FBF7EC;border:1px solid var(--brand-soft);border-left:4px solid var(--brand);border-radius:9px;padding:12px 15px;font-size:14px;color:#6B5A2E;line-height:1.6}
  .help.g{background:var(--green-bg);border-color:var(--green-soft);border-left-color:var(--green)}

  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:17px;border-top:4px solid var(--line);box-shadow:var(--shadow)}
  .stat .lab{font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;display:flex;align-items:center;gap:7px}
  .stat .val{font-family:var(--font-head);font-size:26px;font-weight:700;color:var(--ink);margin:6px 0 2px;letter-spacing:-.3px}
  .stat .sub{font-size:12.5px;font-weight:600}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:30px;font-size:12px;font-weight:800;white-space:nowrap}
  .pill.green{background:var(--green-bg);color:var(--green-d)}
  .pill.red{background:var(--red-bg);color:var(--red-d)}
  .pill.amber{background:var(--amber-bg);color:var(--amber)}
  .pill.grey{background:var(--panel2);color:#A0A1A9}
  .pill.blue{background:var(--brand-bg);color:var(--brand-d)}

  .btn{cursor:pointer;border:none;border-radius:10px;font-family:inherit;font-weight:700;font-size:14.5px;padding:10px 16px;transition:.12s;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:43px}
  .btn:hover{filter:brightness(.96)}
  .btn:active{transform:translateY(1px)}
  .btn-red{background:var(--brand);color:#141419}
  .btn-green{background:var(--green);color:#fff}
  .btn-out{background:var(--card);border:1px solid var(--line);color:#3A3D44}
  .btn-out:hover{border-color:#6C6E76;filter:none;background:var(--panel2)}
  .btn-ghost{background:transparent;color:var(--brand-d);font-weight:800;padding:7px 6px;min-height:0}
  .btn-sm{padding:8px 13px;font-size:13.5px;border-radius:8px;min-height:0}
  .btn-danger{background:var(--red);color:#fff}

  .field{display:flex;flex-direction:column;gap:6px}
  .label{font-size:13px;font-weight:700;color:#3A3D44}
  .input,select,textarea{width:100%;font-family:inherit;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;outline:none;transition:.12s;min-height:43px}
  .input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-bg)}
  textarea{resize:vertical;min-height:106px;line-height:1.55}
  .check{display:flex;align-items:center;gap:11px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;font-weight:600;font-size:14.5px}
  .check input{width:20px;height:20px;accent-color:var(--brand)}

  .databox{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .databox .dl{font-size:12px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.3px;margin-bottom:5px}
  .databox .dv{font-size:15.5px;font-weight:700;color:var(--ink);word-break:break-word}
  .databox.big .dv{font-size:20px}

  .prop{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:13px;cursor:pointer;background:var(--card);transition:.12s}
  .prop:hover{border-color:var(--brand-soft);background:var(--panel2);box-shadow:var(--shadow)}
  .prop.on{border-color:var(--brand);background:var(--card)}
  .dot{width:13px;height:13px;border-radius:50%;flex-shrink:0}

  table{width:100%;border-collapse:collapse}
  th{text-align:left;padding:11px 11px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.35px;border-bottom:2px solid var(--line);font-weight:800}
  td{padding:12px 11px;font-size:14.5px;border-bottom:1px solid var(--line2)}
  tr:last-child td{border-bottom:none}

  .bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
  .bar>div{height:100%;border-radius:6px;transition:width .6s}

  /* Secciones desplegables (tarjetas que se abren) */
  .collapse{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
  .collapse + .collapse{margin-top:12px}
  .collapse>.chead{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 18px;background:var(--card);border:none;cursor:pointer;font-family:inherit}
  .collapse>.chead:hover{background:var(--panel2)}
  .collapse>.chead .cico{font-size:20px;width:30px;text-align:center;flex-shrink:0}
  .collapse>.chead .ctxt{flex:1;min-width:0}
  .collapse>.chead .ctitle{display:block;font-family:var(--font-head);font-size:16.5px;font-weight:700;color:var(--ink);line-height:1.25}
  .collapse>.chead .csub{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
  .collapse>.chead .chev{margin-left:auto;font-size:13px;color:var(--brand-d);background:var(--brand-bg);width:29px;height:29px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:.18s;flex-shrink:0}
  .collapse.open>.chead .chev{transform:rotate(180deg)}
  .collapse>.cbody{padding:2px 18px 18px;border-top:1px solid var(--line2)}
  .collapse.flush>.cbody{padding-left:0;padding-right:0}

  .modal-bg{position:fixed;inset:0;background:rgba(12,16,24,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:200;padding:18px}
  .modal{background:var(--card);border-radius:16px;width:640px;max-width:97vw;max-height:92vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.3)}
  .modal-head{padding:20px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
  .modal-head h3{font-family:var(--font-head);font-size:20px;font-weight:700;color:var(--ink)}
  .modal-head p{font-size:13.5px;color:var(--muted);margin-top:3px}
  .modal-body{padding:20px 24px}
  .modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:11px;position:sticky;bottom:0;background:var(--card)}
  .cmdk-card{background:var(--card);border-radius:16px;width:680px;max-width:96vw;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 26px 80px rgba(0,0,0,.4)}
  .cmdk-top{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .cmdk-top input{flex:1;border:none;outline:none;font-size:16px;background:transparent;color:var(--ink,#EDEDEF)}
  .cmdk-list{overflow:auto;padding:6px 6px 8px}
  .cmdk-grp{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--faint,#83848D);padding:11px 12px 4px}
  .cmdk-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;cursor:pointer}
  .cmdk-item .ic{font-size:18px;width:24px;text-align:center;flex-shrink:0}
  .cmdk-item .tt{font-weight:650;font-size:14.5px;color:var(--ink,#EDEDEF);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cmdk-item .sb{font-size:12.5px;color:var(--muted,#9C9DA6);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cmdk-item.on,.cmdk-item:hover{background:var(--blue-bg,#eef3fb)}
  .cmdk-empty{padding:28px 16px;text-align:center;color:var(--muted,#9C9DA6)}
  .cmdk-foot{border-top:1px solid var(--line);padding:9px 14px;font-size:12px;color:var(--faint,#83848D);display:flex;gap:16px;flex-wrap:wrap}
  .kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;font-size:11px;color:var(--muted,#9C9DA6);background:var(--panel2);font-weight:700;line-height:18px}
  .btn-busca{display:inline-flex;align-items:center;gap:7px;color:var(--muted,#9C9DA6)}
  /* CRM */
  .btn-xs{padding:3px 8px;font-size:12px;border-radius:8px;line-height:1.1}
  .crm-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  .crm-tab{border:1px solid var(--line,var(--line));background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--muted,#9C9DA6)}
  .crm-tab.on{background:#1F3A5C;border-color:#1F3A5C;color:#fff}
  .crm-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:12px;align-items:start}
  .crm-col{background:var(--panel2,#f3f6fb);border-radius:12px;padding:10px;min-height:70px}
  .crm-col h4{font-size:12.5px;font-weight:800;margin:0 0 8px;display:flex;align-items:center;justify-content:space-between}
  .crm-col h4 .n{background:var(--card);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted,#9C9DA6)}
  .crm-card{background:var(--card);border:1px solid var(--line,var(--line));border-left-width:4px;border-radius:10px;padding:9px 11px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .crm-card .nm{font-weight:700;font-size:14px}
  .crm-card .mt{font-size:12px;color:var(--muted,#9C9DA6);margin-top:2px}
  .crm-chip{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 7px;background:var(--blue-bg,#eef3fb);color:#1F3A5C;margin-top:4px}
  .crm-mini{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .crm-bar{height:9px;border-radius:6px;background:var(--line);overflow:hidden}
  .crm-bar>span{display:block;height:100%}
  .crm-time{border-left:2px solid var(--line,var(--line));padding-left:12px;margin-left:4px}
  .crm-time .it{position:relative;margin-bottom:10px}
  .crm-time .it::before{content:"";position:absolute;left:-17px;top:5px;width:9px;height:9px;border-radius:50%;background:#1F3A5C}

  .notif{position:fixed;top:20px;right:20px;z-index:400;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--green);border-radius:11px;padding:14px 18px;font-size:14.5px;font-weight:700;box-shadow:0 12px 40px rgba(0,0,0,.18);max-width:380px;color:var(--ink)}
  .notif.err{border-left-color:var(--red)}

  .seg{display:inline-flex;background:var(--line);border-radius:10px;padding:4px;gap:4px;flex-wrap:wrap}
  .seg button{border:none;background:transparent;font-family:inherit;font-size:14px;font-weight:700;padding:9px 15px;border-radius:8px;cursor:pointer;color:#A0A1A9}
  .seg button.on{background:var(--card);color:var(--brand-d);box-shadow:0 1px 3px rgba(0,0,0,.1)}

  .integ{display:flex;gap:15px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--radius);padding:18px;background:var(--card)}
  .integ .lg{width:54px;height:54px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;font-weight:800;color:#fff}
  .feat{display:flex;gap:9px;align-items:flex-start;font-size:14px;color:#3A3D44;padding:5px 0}
  .feat .ck{color:var(--green);font-weight:800;flex-shrink:0}

  .chat-msg{padding:13px 16px;border-radius:13px;max-width:84%;font-size:14.5px;line-height:1.6;white-space:pre-wrap}

  /* Asistente de contrato */
  .stepper{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:20px}
  .step{display:flex;align-items:center;gap:9px;flex:1;min-width:148px}
  .step .num{width:30px;height:30px;border-radius:50%;background:#5A5B63;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
  .step.on .num{background:var(--brand)}
  .step.done .num{background:var(--green)}
  .step .tl{font-size:13.5px;font-weight:700;color:#83848D}
  .step.on .tl,.step.done .tl{color:var(--ink)}
  .step .ln{flex:1;height:2px;background:var(--line);min-width:18px}
  .contact-card{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:13px;padding:15px;cursor:pointer;background:var(--card)}
  .contact-card:hover{border-color:var(--green)}
  .contact-card.on{border-color:var(--green);background:var(--green-bg)}
  .summary{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:18px}
  .summary .row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line2);font-size:14.5px}
  .summary .row:last-child{border-bottom:none}
  .rg{display:flex;gap:9px;flex-wrap:wrap}
  .rg label{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:11px 16px;font-size:14.5px}
  .rg label.on{border-color:var(--green);background:var(--green-bg)}

  /* Acciones rápidas en Inicio */
  .qa-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
  .qa{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:13px;padding:15px 17px;background:var(--card);cursor:pointer;transition:.12s;text-align:left;font-family:inherit;box-shadow:var(--shadow)}
  .qa:hover{border-color:var(--brand);background:var(--brand-bg);transform:translateY(-1px)}
  .qa .qico{width:46px;height:46px;border-radius:12px;background:var(--brand-bg);color:var(--brand-d);display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0}
  .qa .qt{font-size:15.5px;font-weight:800;color:var(--ink)}
  .qa .qd{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:1px}

  /* ============ RESPONSIVO: tablet / celular (≤900px) ============ */
  @media(max-width:900px){
    .sidebar{position:fixed;left:0;top:0;height:100vh;width:284px;transform:translateX(-100%);transition:transform .25s ease;z-index:60;box-shadow:0 0 50px rgba(0,0,0,.45);display:flex}
    .sidebar.open{transform:translateX(0)}
    .drawer-x{display:inline-flex}
    .menu-btn{display:inline-flex}
    .content{padding:14px 12px;gap:12px}
    .topbar{padding:11px 13px}
    .topbar h2{font-size:18px}
    .topbar .desc{font-size:12.5px}
    .topbar-row{gap:9px}
    /* Muchas tarjetas fijan gridTemplateColumns en línea (4 y 3 columnas, o
       anchos en píxeles). En tablet las bajamos a 2 columnas; el !important es
       necesario para ganarle al estilo en línea, y minmax(0,...) permite que
       las columnas se encojan en vez de desbordarse y cortar el contenido. */
    .grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
    .grid>*{min-width:0}
    .pad{padding:15px}
    .stat{padding:14px}
    .stat .val{font-size:22px;margin:5px 0 2px}
    .stat .lab{font-size:12px}
    .sec-title{font-size:15.5px}
    .sub-title{font-size:12.5px;padding:7px 11px;margin:13px 0 10px}
    .help{font-size:13.5px;padding:11px 13px}
    .btn{font-size:14px;padding:10px 15px;gap:7px;min-height:43px}
    .btn-sm{font-size:13px;padding:8px 12px;min-height:0}
    .pill{font-size:11.5px;padding:4px 10px}
    .databox{padding:11px 12px}
    .databox .dv{font-size:14.5px}
    .databox.big .dv{font-size:18px}
    .collapse>.chead{padding:14px 14px;gap:11px}
    .collapse>.chead .cico{font-size:19px;width:27px}
    .collapse>.chead .ctitle{font-size:15.5px}
    .collapse>.cbody{padding:2px 14px 15px}
    .modal-head,.modal-body,.modal-foot{padding-left:17px;padding-right:17px}
    .modal-head{padding-top:16px;padding-bottom:13px}
    .modal-head h3{font-size:18px}
    .modal-body{padding-top:14px;padding-bottom:14px}
    .modal-foot{padding-top:13px;padding-bottom:13px;gap:8px}
    th{padding:9px 8px;font-size:11px}
    td{padding:10px 8px;font-size:14px}
    .prop{padding:13px 14px;gap:11px}
    .integ{padding:15px;gap:12px}
    .integ .lg{width:48px;height:48px;font-size:23px;border-radius:12px}
    .field{gap:5px}
    .label{font-size:13px}
    .input,select,textarea{font-size:16px;padding:10px 12px;min-height:44px}
    .qa{padding:14px}
    .qa .qico{width:42px;height:42px;font-size:21px}
    iframe{height:200px !important}
  }

  /* ============ RESPONSIVO: celular (≤560px) ============ */
  @media(max-width:560px){
    body{font-size:15px}
    /* En el celular todo va en una sola columna para que nada quede cortado. */
    .grid{grid-template-columns:minmax(0,1fr) !important}
    .content{padding:11px 10px;gap:11px}
    .topbar{padding:10px 12px}
    .topbar h2{font-size:17px}
    .topbar .desc{display:none}
    .card{border-radius:13px}
    .pad{padding:14px}
    .stat{padding:14px;border-top-width:4px}
    .stat .val{font-size:21px}
    .sec-title{font-size:15px}
    .sub-title{font-size:12px;padding:6px 10px}
    .btn{font-size:14px;padding:10px 14px;min-height:43px}
    .btn-sm{font-size:13px;padding:8px 12px;min-height:0}
    .modal{border-radius:15px}
    .modal-head h3{font-size:17px}
    .collapse>.chead{padding:13px 13px;gap:10px}
    .collapse>.chead .cico{font-size:18px;width:25px}
    .collapse>.chead .ctitle{font-size:14.5px}
    .collapse>.chead .csub{font-size:12.5px}
    .collapse>.chead .chev{width:27px;height:27px}
    .collapse>.cbody{padding:2px 13px 14px}
    .prop{padding:12px 13px;gap:10px;border-radius:12px}
    .dot{width:12px;height:12px}
    table{font-size:13.5px}
    .bar{height:9px}
    .stepper{gap:4px}
    .step{min-width:0}
    .step .tl{display:none}
    .qa-grid{grid-template-columns:1fr}
  }

  /* ============ Instalada como app (PWA) + notch / áreas seguras ============ */
  @supports (padding:max(0px)){
    @media(max-width:900px){
      .topbar{padding-left:max(13px,env(safe-area-inset-left));padding-right:max(13px,env(safe-area-inset-right));padding-top:max(11px,env(safe-area-inset-top))}
      .content{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));padding-bottom:max(16px,env(safe-area-inset-bottom))}
      .indbar{padding-left:max(13px,env(safe-area-inset-left));padding-right:max(13px,env(safe-area-inset-right))}
      .sidebar{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
    }
  }
  /* En modo aplicación (standalone) evitamos el resaltado azul al tocar y el rebote horizontal */
  @media all and (display-mode:standalone){
    body{overscroll-behavior-x:none}
    a,button,.nav-item,.qa,.collapse>.chead{-webkit-tap-highlight-color:transparent}
  }

  /* ---- Indicadores en vivo ---- */
  .indbar{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:9px 26px;background:var(--card);border-bottom:1px solid var(--line)}
  .indbar .pill{white-space:nowrap;cursor:default;font-size:12px;padding:5px 11px;background:var(--panel2);color:#A0A1A9}
  .indbar .pill.editable{cursor:pointer}
  @media(max-width:900px){ .indbar{padding:8px 13px;gap:6px} .indbar .pill{font-size:11px;padding:4px 10px} }

  /* ---- Plantillas de comunicación ---- */
  .tpl-list{display:flex;flex-direction:column;gap:6px}
  .tpl-item{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px 13px;cursor:pointer;background:var(--card);text-align:left}
  .tpl-item:hover{border-color:var(--brand-soft)}
  .tpl-item.on{border-color:var(--brand);background:var(--brand-bg)}
  .tpl-item .ic{width:34px;height:34px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
  .tpl-item.on .ic{background:var(--brand);color:#fff}
  .seg-chan{display:inline-flex;background:var(--line);border-radius:11px;padding:4px;gap:4px}
  .seg-chan button{border:none;background:transparent;font-family:inherit;font-size:14px;font-weight:700;padding:8px 15px;border-radius:8px;cursor:pointer;color:#A0A1A9}
  .seg-chan button.on{background:var(--card);color:var(--brand-d);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .mail-prev{border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(20,35,59,.10);background:var(--card)}
  .mail-prev .hd{background:linear-gradient(135deg,#152A44,#1F3A5C);color:#fff;padding:18px 20px;display:flex;align-items:center;gap:12px}
  .mail-prev .hd .lg{background:var(--card);color:#152A44;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
  .mail-prev .hd .bn{font-weight:800;font-size:17px;line-height:1.1}
  .mail-prev .hd .tg{opacity:.85;font-size:12px;margin-top:2px}
  .mail-prev .meta{padding:12px 20px;border-bottom:1px solid var(--line2);background:var(--panel2);font-size:13.5px;color:var(--muted)}
  .mail-prev .bd{padding:22px 22px 6px;font-size:15px;line-height:1.75;color:#3A3D44;white-space:pre-wrap}
  .mail-prev .ft{padding:14px 22px 20px;font-size:12px;color:var(--faint);border-top:1px solid var(--line2);margin-top:10px;display:flex;align-items:center;gap:8px}
  .mail-prev .ft .dot{width:6px;height:6px;border-radius:50%;background:#1F3A5C;display:inline-block}
  .wa-wrap{border-radius:16px;padding:22px 16px;background:#ECE5DD;background-image:radial-gradient(rgba(0,0,0,.025) 1px,transparent 1px);background-size:18px 18px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
  .wa-bubble{max-width:90%;margin-left:auto;border-radius:14px 14px 4px 14px;padding:12px 14px;background:#dcf8c6;font-size:14.5px;white-space:pre-wrap;line-height:1.55;box-shadow:0 2px 6px rgba(0,0,0,.12);position:relative}
  .sms-wrap{border-radius:16px;padding:18px;background:var(--panel2)}
  .sms-bubble{max-width:80%;border-radius:18px 18px 18px 5px;padding:12px 14px;background:var(--card);border:1px solid var(--line);font-size:14.5px;white-space:pre-wrap;line-height:1.55;box-shadow:0 2px 6px rgba(0,0,0,.06)}
  .ib-card{border:1px solid var(--line);border-radius:13px;padding:14px 16px;background:var(--card)}
  .ib-card.on{border-color:var(--brand)}

  /* Fotos, portada, galería y recorrido 360° */
  .media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:4px}
  .media-thumb{position:relative;aspect-ratio:4/3;border-radius:12px;background:var(--line) center/cover no-repeat;border:1px solid var(--line);overflow:hidden}
  .media-thumb.cover{border:3px solid var(--green);grid-column:span 2}
  .cover-tag{position:absolute;top:7px;left:7px;background:var(--green);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:20px}
  .media-acts{position:absolute;bottom:6px;right:6px;display:flex;gap:5px;opacity:0;transition:.15s}
  .media-thumb:hover .media-acts{opacity:1}
  .media-acts button{border:none;background:rgba(12,16,24,.82);color:#fff;border-radius:8px;width:31px;height:31px;cursor:pointer;font-size:14px}
  .cover-thumb{width:62px;height:62px;border-radius:12px;background:var(--line) center/cover no-repeat;flex-shrink:0;border:1px solid var(--line)}
  .hero-cover{position:relative;border-radius:var(--radius);overflow:hidden;height:280px;background:#1a1f2b center/cover no-repeat;margin-bottom:12px;display:flex;align-items:flex-end}
  .hero-cover::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(8,10,15,.55),transparent 55%)}
  .hero-cover .badge{position:absolute;top:12px;left:12px;background:var(--green);color:#fff;font-size:12px;font-weight:800;padding:5px 11px;border-radius:20px;z-index:2}
  .hero-cover .count{position:absolute;top:12px;right:12px;background:rgba(12,16,24,.7);color:#fff;font-size:12px;font-weight:700;padding:5px 11px;border-radius:20px;z-index:2}
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
  .gal .g{aspect-ratio:4/3;border-radius:10px;background:var(--line) center/cover no-repeat;cursor:pointer;border:none;transition:.15s}
  .gal .g:hover{filter:brightness(1.06);transform:scale(1.02)}
  .lbx{position:fixed;inset:0;background:rgba(6,8,12,.93);display:flex;align-items:center;justify-content:center;z-index:300;flex-direction:column}
  .lbx img{max-width:92vw;max-height:80vh;border-radius:10px}
  .lbx .x{position:absolute;top:16px;right:22px;color:#fff;font-size:36px;cursor:pointer}
  .lbx .arr{position:fixed;top:0;bottom:0;width:42%;cursor:pointer}
  .lbx .arr.l{left:0}.lbx .arr.r{right:0}
  .pano-box{width:100%;height:60vh;min-height:360px;border-radius:14px;overflow:hidden;background:#0c1018}
  .pano-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .pano-tabs button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}
  .pano-tabs button.on{border-color:var(--brand);color:var(--brand-d);background:var(--brand-bg)}

  @media(max-width:560px){
    .tpl-item{padding:10px 11px}
    .tpl-item .ic{width:30px;height:30px;font-size:15px}
    .mail-prev .bd{padding:15px}
    .wa-wrap,.sms-wrap{padding:14px}
    .media-thumb.cover{grid-column:span 1}
  }

  .gs-top{width:40px;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--brand);color:#141419;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.35);flex-shrink:0;padding:0}
  .gs-top:hover{background:var(--brand-d);}
  @media(max-width:760px){.gs-top{width:38px;height:38px;}}
  #gSearchOv{position:fixed;inset:0;z-index:1000;background:rgba(20,22,26,.55);backdrop-filter:blur(3px);display:none;justify-content:center;align-items:flex-start;padding:50px 12px 20px;}
  #gSearchOv.on{display:flex;}
  .gs-box{width:100%;max-width:620px;background:var(--card);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.3);overflow:hidden;display:flex;flex-direction:column;max-height:80vh;font-family:var(--font);}
  .gs-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);}
  .gs-head input{flex:1;border:none;outline:none;font-size:16px;background:transparent;font-family:inherit;color:var(--text);}
  .gs-esc{border:1px solid var(--line);border-radius:6px;padding:3px 7px;font-size:10px;color:var(--muted);font-weight:600;cursor:pointer;}
  .gs-res{overflow-y:auto;padding:6px;}
  .gs-note{padding:20px 14px;text-align:center;color:var(--muted);font-size:12.5px;}
  .gs-item{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-radius:8px;}
  .gs-item:hover{background:var(--brand-bg);}
  .gs-lbl{font-size:13px;font-weight:600;color:var(--text);}
  .gs-sec{font-size:11px;color:var(--muted);}
  .gs-val{font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .gs-fuzzy{padding:6px 12px;font-size:11.5px;color:var(--amber);font-weight:600;}

  /* ====== Acceso, equipo, portal del arrendatario y lector IA ====== */
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1100px 560px at 75% -10%,rgba(198,162,91,.13),transparent 60%),var(--bg);padding:22px}
  .auth-card{width:100%;max-width:450px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 26px}
  .auth-logo{width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,#E6C98A,#A07E33);color:#141419;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:25px;font-family:var(--font-head);margin-bottom:14px}
  .auth-card h1{font-family:var(--font-head);font-size:24px;color:var(--ink);margin-bottom:5px}
  .auth-card .sub{color:var(--muted);font-size:14px;margin-bottom:18px;line-height:1.55}
  .auth-tabs{display:flex;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:4px;margin-bottom:18px}
  .auth-tabs button{flex:1;border:none;background:transparent;color:var(--muted);font-weight:700;font-size:14px;padding:9px;border-radius:8px;cursor:pointer;font-family:inherit}
  .auth-tabs button.on{background:var(--brand);color:#141419}
  .auth-err{background:var(--red-bg);border:1px solid var(--red-soft);color:var(--red-d);border-radius:9px;padding:10px 13px;font-size:13.5px;margin-bottom:12px;line-height:1.5}
  .auth-info{background:var(--brand-bg);border:1px solid var(--brand-soft);color:var(--brand-d);border-radius:9px;padding:10px 13px;font-size:13.5px;margin-bottom:12px;line-height:1.55}
  .clave-req{display:flex;flex-direction:column;gap:5px;margin:10px 0 14px;font-size:13px}
  .clave-req span{display:flex;align-items:center;gap:8px;color:var(--faint)}
  .clave-req span.ok{color:var(--green-d)}
  .cod-input{letter-spacing:9px;text-align:center;font-size:22px;font-weight:800}
  .rol-pill{display:inline-flex;padding:3px 10px;border-radius:30px;font-size:11.5px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
  .rol-propietario{background:var(--brand-bg);color:var(--brand-d)}
  .rol-colaborador{background:#E3F0F7;color:#2A6C8F}
  .rol-invitado{background:#EDEEF2;color:var(--muted)}
  .rol-arrendatario{background:var(--green-bg);color:var(--green-d)}
  .portal{min-height:100vh;background:var(--bg);color:var(--text)}
  .portal-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
  .portal-main{max-width:780px;margin:0 auto;padding:20px 16px 70px;display:flex;flex-direction:column;gap:14px;width:100%}
  .portal-monto{font-family:var(--font-head);font-size:38px;color:var(--ink);line-height:1.15}
  .readonly-note{background:var(--amber-bg);border:1px solid #E8D08A;color:var(--amber);border-radius:9px;padding:9px 14px;font-size:13.5px;margin:10px 26px 0}
  .menu-btn svg{display:block}
  .ai-doc-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:var(--panel2)}
  .eq-user{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:13px 15px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}

  .app.solo-lectura .btn-red,.app.solo-lectura .btn-danger{display:none!important}

  /* ===== Chatbot IA flotante ===== */
  .ai-fab{position:fixed;right:22px;bottom:22px;z-index:180;width:60px;height:60px;border:none;border-radius:19px;background:linear-gradient(135deg,#E6C98A,#A07E33);color:#141419;box-shadow:0 16px 40px rgba(34,28,15,.28);cursor:pointer;font-size:27px;display:flex;align-items:center;justify-content:center;transition:.18s}
  .ai-fab:hover{transform:translateY(-2px) scale(1.02)}
  .ai-fab .ai-dot{position:absolute;right:5px;top:5px;width:12px;height:12px;border:2px solid #fff;border-radius:50%;background:var(--green)}
  .ai-float{position:fixed;right:22px;bottom:94px;z-index:179;width:min(410px,calc(100vw - 24px));height:min(650px,calc(100vh - 125px));background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 80px rgba(16,24,40,.24);display:flex;flex-direction:column;overflow:hidden;transform-origin:bottom right;animation:aiPop .18s ease-out}
  @keyframes aiPop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
  .ai-float-head{padding:15px 16px;background:linear-gradient(135deg,#17171d,#29272a);color:#fff;display:flex;align-items:center;gap:11px}
  .ai-avatar{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#E6C98A,#A07E33);color:#141419;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;flex-shrink:0}
  .ai-float-head .title{font-weight:800;font-size:15.5px}.ai-float-head .sub{font-size:11.5px;opacity:.72;margin-top:1px}
  .ai-close{margin-left:auto;border:none;background:rgba(255,255,255,.1);color:#fff;width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:18px}
  .ai-quick{display:flex;gap:7px;padding:10px 12px;border-bottom:1px solid var(--line2);overflow-x:auto;background:var(--panel2)}
  .ai-quick button{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 10px;font:700 11.5px var(--font);cursor:pointer;color:var(--muted)}
  .ai-quick button:hover{border-color:var(--brand);color:var(--brand-d)}
  .ai-messages{flex:1;overflow:auto;padding:15px 13px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,#fff,#fafbfc)}
  .ai-empty{margin:auto;text-align:center;padding:20px;color:var(--muted)}
  .ai-empty .big{font-size:34px;margin-bottom:7px}.ai-empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:5px}
  .ai-row{display:flex}.ai-row.user{justify-content:flex-end}
  .ai-bubble{max-width:88%;border-radius:15px;padding:10px 12px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .ai-row.user .ai-bubble{background:#1f2937;color:#fff;border-bottom-right-radius:5px}
  .ai-row.bot .ai-bubble{background:var(--panel2);color:var(--text);border:1px solid var(--line2);border-bottom-left-radius:5px}
  .ai-compose{padding:11px;border-top:1px solid var(--line);background:var(--card)}
  .ai-compose-row{display:flex;align-items:flex-end;gap:7px}
  .ai-compose textarea{min-height:44px;max-height:110px;resize:none;padding:10px 11px;font-size:13.5px}
  .ai-send{width:44px;height:44px;min-height:44px;padding:0;border-radius:12px;flex-shrink:0}
  .ai-disclaimer{font-size:10.5px;color:var(--faint);text-align:center;margin-top:6px}

  /* ---- Asesor inmobiliario: tarjetas, comparación y estados ---- */
  .ai-online{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4ade80;margin-right:6px;vertical-align:middle}
  .ai-bubble.err{background:var(--red-bg);border-color:var(--red-soft);color:var(--red-d)}
  .ai-empty .ai-ejemplos{display:flex;flex-direction:column;gap:6px;margin-top:14px}
  .ai-empty .ai-ejemplos button{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 11px;font:600 12.5px var(--font);color:var(--muted);cursor:pointer;text-align:left;line-height:1.4}
  .ai-empty .ai-ejemplos button:hover{border-color:var(--brand);color:var(--brand-d);background:var(--brand-bg)}

};

const CLP = (n)=> new Intl.NumberFormat("es-CL",{style:"currency",currency:"CLP",maximumFractionDigits:0}).format(Math.round(n||0));

// se convierte todo a su equivalente por mes. "única" (fecha exacta, una sola vez)

  {v:"unica",l:"Fecha exacta (una vez)"}
];
const factorMensual = (periodo)=> ({mes:1, bimestral:1/2, trimestral:1/3, cuatrimestral:1/4, semestral:1/6, "año":1/12, anual:1/12, unica:0})[periodo] ?? 1;

const movMontoCLP = (m,uf)=>{
  const base = String(m.moneda)==="UF" ? num(m.montoUF!=null&&m.montoUF!==""?m.montoUF:m.monto)*uf : num(m.monto);
  const subs = (m.subitems||[]).reduce((s,si)=> s + (String(si.moneda)==="UF" ? num(si.montoUF!=null&&si.montoUF!==""?si.montoUF:si.monto)*uf : num(si.monto)), 0);
  return base + subs;
};
const movMensualCLP = (m,uf)=> movMontoCLP(m,uf) * factorMensual(m.periodo||"mes");

// terminar de pagar el crédito hay que contratar uno aparte. Las propiedades
// antiguas pueden no tener seguro. Todo es editable (lista de pólizas contratadas).
const creditoVigente = (p)=> !!p.hasMortgage && num(p.dividendosPagados) < num(p.dividendosTotales);
const seguroEnDividendo = (p)=> creditoVigente(p) && p.seguroEnDividendo!==false;
const segurosLista = (p)=> (p.seguros||[]).filter(s=>s && s.activo!==false);
const seguroContratadoMes = (p,uf)=> segurosLista(p).reduce((s,sg)=> s + movMensualCLP(sg,uf), 0);

const seguroMes = (p,uf)=>{
  uf = uf||window.__UF__||0;
  if(seguroEnDividendo(p)) return 0;                 // incluido en el dividendo
  const lista = p.seguros||[];

const diffArrDiv = (p,uf)=> ingresoMes(p)-divCLP(p,uf);

function mergeTrinidadSeed(list){
  try{ if(store.get("ap_trinidad_seed_v1", false)) return list; }catch(e){}
  const arr = Array.isArray(list)? list.slice() : [];
  const ids = new Set(arr.map(p=>String(p.id)));
  const names = new Set(arr.map(p=>(p.name||"").toLowerCase().trim()));
  TRINIDAD_SEED.forEach(s=>{ if(!ids.has(String(s.id)) && !names.has(s.name.toLowerCase().trim())) arr.push({...s}); });
  return arr;
}

/* ---------- Fotos y recorrido 360°: optimización en el navegador + subida a Netlify Blobs ---------- */
// El navegador reduce y comprime las imágenes antes de enviarlas, así cargan rápido
// y no saturan el almacenamiento. Luego se guardan en el servidor (Netlify Blobs) y
// quedan disponibles desde cualquier dispositivo y para quien abra la ficha pública.
const readFileDataURL = (file)=> new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
function optimizeImage(file, maxDim, quality){
  return new Promise(async (resolve)=>{
    try{
      const dataUrl = await readFileDataURL(file);
      const img = new Image();
      img.onload = ()=>{ try{
        let w=img.naturalWidth, h=img.naturalHeight;
        if(Math.max(w,h)>maxDim){ const s=maxDim/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
        const c=document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        resolve(c.toDataURL("image/jpeg",quality));
      }catch(e){ resolve(dataUrl); } };
      img.onerror=()=>resolve(dataUrl);
      img.src=dataUrl;
    }catch(e){ resolve(null); }
  });
}
async function uploadMedia(dataUrl, kind){
  const r = await fetch("/api/media/subir",{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({dataUrl,kind}) });
  if(!r.ok){ const j=await r.json().catch(()=>({})); throw new Error(j.error||"No se pudo subir la imagen"); }
  const j = await r.json(); return j.url;
}
// Sube un archivo adjunto de cualquier tipo (video, PDF, foto, Word, Excel…) al
// servidor y devuelve {url,name,contentType}. Queda guardado en la plataforma,
// disponible desde cualquier dispositivo.
async function uploadArchivo(file){
  const dataUrl = await readFileDataURL(file);
  const r = await fetch("/api/archivo/subir",{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({dataUrl, name:file.name}) });
  if(!r.ok){ const j=await r.json().catch(()=>({})); throw new Error(j.error||"No se pudo subir el archivo"); }
  return await r.json();
}

// Visor de panorámicas 360° (pannellum) cargado solo cuando se necesita.
let __pnnmLoad=null;
function loadPannellum(){
  if(window.pannellum) return Promise.resolve();
  if(__pnnmLoad) return __pnnmLoad;
  __pnnmLoad=new Promise((res,rej)=>{
    const css=document.createElement("link"); css.rel="stylesheet"; css.href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"; document.head.appendChild(css);
    const s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"; s.onload=()=>res(); s.onerror=()=>rej(new Error("pannellum")); document.head.appendChild(s);
  });
  return __pnnmLoad;
}

// Reemplaza las variables de una plantilla con los datos reales de la propiedad.
function aplicarPlantilla(texto, p, owner, gw, cuentas){
  if(!texto) return "";
  const primer = (p.tenant||"arrendatario(a)").split(" ")[0] || "arrendatario(a)";
  const periodo = new Date().toLocaleDateString("es-CL",{month:"long",year:"numeric"});
  const banco = (cuentas&&cuentas.length) ? cuentas.map(c=>cuentaLinea(c)).join(" / ")
    : `${owner.bank||"—"}, ${owner.accountType||""} ${owner.accountNumber||""}, RUT ${owner.rut||""}`;
  const map = {
    "{nombre}":primer, "{propiedad}":p.name||"", "{direccion}":p.address||p.name||"", "{comuna}":p.comuna||"",
    "{monto}":CLP(num(p.rent)), "{periodo}":periodo, "{vence}":`día ${p.dueDay||5}`, "{banco}":banco,
    "{pasarela}":(gw&&gw.name)||"la pasarela", "{email_admin}":owner.email||"—",
  };
  return String(texto).replace(/\{[a-z_]+\}/g, k=> map[k]!=null ? map[k] : k);
}


/* ---------- Componentes base ---------- */
function Inp({f, value, onChange}){
  if(f.type==="select") return (
    <div className="field"><label className="label">{f.label}</label>
      <select value={value??""} onChange={e=>onChange(f.k, e.target.value)}>{f.opts.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}</select>
    </div>);
  return (
    <div className="field"><label className="label">{f.label}</label>
      <input className="input" type={f.t||"text"} step={f.step} placeholder={f.ph} value={value??""} onChange={e=>onChange(f.k, e.target.value)} />
    </div>);
}
function Data({label, value, color, span, big}){
  return (<div className={"databox"+(big?" big":"")} style={span?{gridColumn:`span ${span}`}:null}>
    <div className="dl">{label}</div><div className="dv" style={color?{color}:null}>{(value===""||value==null)?"—":value}</div>
  </div>);
}

function descargarContratoWord(p, c, soc, arr, aval, uf){
  const html = contratoHTML(p, c, soc, arr, aval, uf, "word");
  const arrNombre = contactNombre(arr) || "arrendatario";
  const blob = new Blob(["\ufeff"+html], { type:"application/msword" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `Contrato ${arrNombre} - ${p.name}.doc`.replace(/[\\/:*?"<>|]/g,"-");
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

function abrirContratoPDF(p, c, soc, arr, aval, uf){
  const w=window.open("","_blank");
  if(!w){ if(window.__notify) window.__notify("Permite ventanas emergentes para ver el contrato",true); return; }
  w.document.write(contratoHTML(p,c,soc,arr,aval,uf,"print")); w.document.close();
  setTimeout(()=>{ try{ w.focus(); w.print(); }catch(e){} },700);
}

/* ---------- Fotos y recorrido 360°: edición dentro del formulario ---------- */
function MediaSection({ d, set }){
  const fotos = d.fotos||[], panoramas = d.panoramas||[];
  const [busy,setBusy]=useState(false);
  const note = (m,e)=> window.__notify && window.__notify(m,e);
  const addFiles = async (files, kind)=>{
    if(!files || !files.length) return;
    setBusy(true);
    try{
      const added=[];
      for(const file of Array.from(files)){
        if(!/^image\//.test(file.type)){ continue; }
        const opt = await optimizeImage(file, kind==="pano"?4096:1600, kind==="pano"?0.82:0.8);
        if(!opt){ continue; }
        try{ const url = await uploadMedia(opt, kind); added.push({url, name:file.name.replace(/\.[^.]+$/,"")}); }
        catch(err){ note("No se pudo subir "+file.name, true); }
      }
      if(added.length){
        if(kind==="pano") set(p=>({...p, panoramas:[...(p.panoramas||[]), ...added]}));
        else set(p=>({...p, fotos:[...(p.fotos||[]), ...added]}));
        note((kind==="pano"?"":"")+added.length+(kind==="pano"?" panorámica(s) subida(s)":" foto(s) subida(s)"));
      }
    } finally { setBusy(false); }
  };
  const remFoto=(i)=> set(p=>({...p, fotos:(p.fotos||[]).filter((_,j)=>j!==i)}));
  const moveFotoFirst=(i)=> set(p=>{ const a=[...(p.fotos||[])]; const [x]=a.splice(i,1); a.unshift(x); return {...p, fotos:a}; });
  const remPano=(i)=> set(p=>({...p, panoramas:(p.panoramas||[]).filter((_,j)=>j!==i)}));
  const renPano=(i,name)=> set(p=>({...p, panoramas:(p.panoramas||[]).map((x,j)=>j===i?{...x,name}:x)}));
  return (<>
    <div className="sub-title dark">⑧ Fotos y recorrido virtual 360°</div>
    <div className="help" style={{marginBottom:12}}>Sube todas las fotos que quieras: el navegador las optimiza y se guardan en la plataforma (no en el dispositivo), por lo que quedan disponibles desde cualquier teléfono o computador y viajan con el enlace al compartir. La <b>primera foto</b> es la portada.</div>
    <label className="btn btn-out btn-sm" style={{marginBottom:10,opacity:busy?0.6:1,pointerEvents:busy?"none":"auto"}}>
      {busy?"Subiendo…":"Agregar fotos"}
      <input type="file" accept="image/*" multiple style={{display:"none"}} onChange={e=>{ addFiles(e.target.files,"foto"); e.target.value=""; }}/>
    </label>
    {!!fotos.length && <div className="media-grid">
      {fotos.map((f,i)=>(<div key={i} className={"media-thumb"+(i===0?" cover":"")} style={{backgroundImage:`url('${f.url}')`}}>
        {i===0 && <span className="cover-tag">Portada</span>}
        <div className="media-acts">
          {i!==0 && <button title="Usar como portada" onClick={()=>moveFotoFirst(i)}></button>}
          <button title="Quitar" onClick={()=>remFoto(i)}>✕</button>
        </div>
      </div>))}
    </div>}

    <div style={{marginTop:16}}>
      <div style={{fontWeight:800,fontSize:14.5,marginBottom:4}}>Recorrido virtual 360° (tipo Matterport)</div>
      <div className="help" style={{marginBottom:10}}>Sube fotos <b>panorámicas equirectangulares</b> (cámara 360° o la app del teléfono), una por ambiente. Quien reciba la ficha podrá mirar en todas las direcciones, como si estuviera dentro de la propiedad.</div>
      <label className="btn btn-out btn-sm" style={{marginBottom:10,opacity:busy?0.6:1,pointerEvents:busy?"none":"auto"}}>
        {busy?"Subiendo…":"Agregar panorámica 360°"}
        <input type="file" accept="image/*" multiple style={{display:"none"}} onChange={e=>{ addFiles(e.target.files,"pano"); e.target.value=""; }}/>
      </label>
      {!!panoramas.length && <div className="grid" style={{gap:8}}>
        {panoramas.map((pn,i)=>(<div key={i} style={{display:"flex",alignItems:"center",gap:10,background:"var(--panel2)",border:"1px solid var(--line)",borderRadius:10,padding:"8px 10px"}}>
          <div style={{width:64,height:40,borderRadius:6,background:`#1a1f2b center/cover no-repeat url('${pn.url}')`,flexShrink:0}}></div>
          <input className="input" style={{flex:1,padding:"7px 10px"}} value={pn.name||""} placeholder={"Ambiente "+(i+1)} onChange={e=>renPano(i,e.target.value)}/>
          <button className="btn btn-out btn-sm" onClick={()=>remPano(i)}>✕</button>
        </div>))}
      </div>}
    </div>

    <div className="field" style={{marginTop:14}}>
      <Inp f={{k:"virtualTour",label:"O pega un enlace de recorrido externo (Matterport, Kuula, etc.)",ph:"https://kuula.co/..."}} value={d.virtualTour} onChange={(k,v)=>set(p=>({...p,[k]:v}))}/>
    </div>
  </>);
}

/* ---------- Visor de recorrido virtual 360° (pannellum) ---------- */
function PanoViewer({ panoramas }){
  const [i,setI]=useState(0);
  const ref=useRef(null), viewerRef=useRef(null);
  useEffect(()=>{
    let alive=true;
    loadPannellum().then(()=>{
      if(!alive||!ref.current||!window.pannellum||!panoramas[i]) return;
      if(viewerRef.current){ try{viewerRef.current.destroy();}catch(e){} viewerRef.current=null; }
      viewerRef.current=window.pannellum.viewer(ref.current,{ type:"equirectangular", panorama:panoramas[i].url, autoLoad:true, autoRotate:-2, showControls:true });
    }).catch(()=>{});
    return ()=>{ alive=false; if(viewerRef.current){ try{viewerRef.current.destroy();}catch(e){} viewerRef.current=null; } };
  },[i,panoramas]);
  if(!panoramas || !panoramas.length) return null;
  return (<div>
    {panoramas.length>1 && <div className="pano-tabs">{panoramas.map((p,j)=>(<button key={j} className={j===i?"on":""} onClick={()=>setI(j)}>{p.name||("Ambiente "+(j+1))}</button>))}</div>}
    <div className="pano-box" ref={ref}></div>
    <div className="help" style={{marginTop:10}}>Arrastra para mirar en todas las direcciones y salta entre ambientes con los botones, como si estuvieras dentro de la propiedad.</div>
  </div>);
}

/* ---------- Notas rápidas (editable por propiedad) ---------- */
function NotasBox({ p, onSave }){
  const [val,setVal]=useState(p.notas||"");
  const dirty = val !== (p.notas||"");
  return (<div className="card pad" style={{background:"var(--amber-bg)",border:"none"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,flexWrap:"wrap",gap:8}}>
      <div style={{fontWeight:800,color:"var(--amber)"}}>Notas y comentarios</div>
      {dirty && <button className="btn btn-green btn-sm" onClick={()=>onSave(val)}>Guardar</button>}
    </div>
    <textarea value={val} onChange={e=>setVal(e.target.value)} onBlur={()=>{ if(dirty) onSave(val); }}
      placeholder="Anota detalles internos de esta propiedad: estacionamiento, bodega, observaciones, acuerdos con el arrendatario…" style={{minHeight:90}}/>
    <div style={{fontSize:13,color:"var(--muted)",marginTop:6}}>Visible solo para ti. No se comparte en la ficha pública.</div>
  </div>);
}

/* ---------- Comunicaciones: plantillas editables + adjuntos ---------- */
function ComunicacionesPanel({ p, owner, gw, cuentas, plantillas, onSave, onAdd, onDelete }){
  const _seeds = seedPlantillas();
  const list = (plantillas && plantillas.length ? plantillas : _seeds).map(t=>{
    if(t && t.builtin && (!t.cuerpoWA || !t.cuerpoCorreo)){ const s=_seeds.find(x=>x.id===t.id); if(s) return {...t, cuerpoWA:t.cuerpoWA||s.cuerpoWA, cuerpoCorreo:t.cuerpoCorreo||s.cuerpoCorreo}; }
    return t;
  });
  const [selId,setSelId]=useState(list[0]?.id||"");
  const sel = list.find(t=>t.id===selId) || list[0];
  const [canal,setCanal]=useState("correo");
  // Borrador editable de la plantilla seleccionada (se sincroniza al cambiar de plantilla).
  const [draft,setDraft]=useState(sel||{});
  const lastId=useRef(selId);
  useEffect(()=>{ if(sel && sel.id!==lastId.current){ setDraft(sel); lastId.current=sel.id; } },[selId]);
  useEffect(()=>{ if(sel) setDraft(d=>d.id===sel.id?d:sel); },[plantillas]);
  if(!sel) return <div className="help">Crea tu primera plantilla.</div>;

  const dirty = JSON.stringify(draft)!==JSON.stringify(sel);
  const note = (m,e)=> window.__notify && window.__notify(m,e);
  const asuntoR = aplicarPlantilla(draft.asunto, p, owner, gw, cuentas);
  const cuerpoR = aplicarPlantilla(draft.cuerpo, p, owner, gw, cuentas);
  const waR = aplicarPlantilla(draft.cuerpoWA||draft.cuerpo, p, owner, gw, cuentas);
  const correoR = aplicarPlantilla(draft.cuerpoCorreo||draft.cuerpo, p, owner, gw, cuentas);
  // Renderiza el formato de WhatsApp (*negrita* e _itálica_) en la vista previa.
  const renderWA = (txt)=> String(txt||"").split("\n").map((line,i)=>{
    const out=[]; const re=/(\*[^*\n]+\*|_[^_\n]+_)/g; let last=0,m,k=0;
    while((m=re.exec(line))){ if(m.index>last) out.push(line.slice(last,m.index)); const tok=m[0]; if(tok[0]==="*") out.push(<strong key={k++}>{tok.slice(1,-1)}</strong>); else out.push(<em key={k++}>{tok.slice(1,-1)}</em>); last=m.index+tok.length; }
    if(last<line.length) out.push(line.slice(last));
    return <div key={i}>{out.length?out:"\u00A0"}</div>;
  });
  const guardar = ()=>{ onSave({...draft}); lastId.current=draft.id; note("Plantilla guardada"); };
  const restaurar = ()=>{ const base=seedPlantillas().find(t=>t.id===draft.id); if(base){ setDraft({...base,adjuntos:draft.adjuntos||[]}); onSave({...base,adjuntos:draft.adjuntos||[]}); note("↩ Plantilla restaurada"); } };
  const nueva = ()=>{ const id="tpl"+Date.now().toString(36); const t={id,label:"Nueva plantilla",ico:"✉️",builtin:false,adjuntos:[],asunto:"Asunto — {propiedad}",cuerpo:"Hola {nombre}, escribe aquí tu mensaje para {propiedad}.",cuerpoWA:"*ArriendoPro*\n━━━━━━━━━━━━━\n¡Hola {nombre}! \n\nEscribe aquí tu mensaje para {propiedad}.\n━━━━━━━━━━━━━\n_Equipo ArriendoPro_",cuerpoCorreo:"Hola {nombre}:\n\nEscribe aquí tu mensaje para {propiedad}.\n\nSaludos cordiales,\nEquipo ArriendoPro"}; onAdd(t); setSelId(id); setDraft(t); lastId.current=id; };
  const eliminar = ()=>{ if(!confirm("¿Eliminar esta plantilla?")) return; const rest=list.filter(t=>t.id!==draft.id); onDelete(draft.id); const next=rest[0]; if(next){ setSelId(next.id); setDraft(next); lastId.current=next.id; } note("✕ Plantilla eliminada"); };
  const copiar = ()=>{
    const txt = canal==="correo" ? `Asunto: ${asuntoR}\n\n${correoR}` : (canal==="whatsapp" ? waR : cuerpoR);
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(()=>note("Plantilla copiada")).catch(()=>{});
  };
  const insertarVar = (v)=> setDraft(d=>({...d, cuerpo:(d.cuerpo||"")+ (d.cuerpo&&!/\s$/.test(d.cuerpo)?" ":"") + v}));
  const hora = new Date().toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});

  return (<div>
    <div className="grid" style={{gridTemplateColumns:"260px 1fr",gap:16}}>
      <div>
        <div className="tpl-list">
          {list.map(t=>(<div key={t.id} className={"tpl-item"+(selId===t.id?" on":"")} onClick={()=>setSelId(t.id)}>
            <div className="ic">{t.ico||""}</div>
            <div style={{fontWeight:700,fontSize:14.5,flex:1}}>{t.label}{!t.builtin&&<span className="pill blue" style={{marginLeft:6,fontSize:11}}>propia</span>}</div>
          </div>))}
        </div>
        <button className="btn btn-out btn-sm" style={{marginTop:10,width:"100%"}} onClick={nueva}>＋ Nueva plantilla</button>
      </div>

      <div>
        {/* Editor de la plantilla */}
        <div className="card pad" style={{background:"var(--panel2)",border:"1px solid var(--line)",marginBottom:14}}>
          <div className="grid c2" style={{gridTemplateColumns:"90px 1fr",gap:10}}>
            <div className="field"><label className="label">Ícono</label><input className="input" value={draft.ico||""} maxLength={2} onChange={e=>setDraft(d=>({...d,ico:e.target.value}))}/></div>
            <div className="field"><label className="label">Nombre de la plantilla</label><input className="input" value={draft.label||""} onChange={e=>setDraft(d=>({...d,label:e.target.value}))}/></div>
          </div>
          <div className="field" style={{marginTop:10}}><label className="label">Asunto (correo)</label><input className="input" value={draft.asunto||""} onChange={e=>setDraft(d=>({...d,asunto:e.target.value}))}/></div>
          <div className="field" style={{marginTop:10}}><label className="label">Texto para WhatsApp <span style={{fontWeight:400,color:"var(--faint)"}}>(usa *negrita* y _itálica_)</span></label><textarea value={draft.cuerpoWA||""} onChange={e=>setDraft(d=>({...d,cuerpoWA:e.target.value}))} placeholder="Si lo dejas vacío, se usa el texto base." style={{minHeight:150}}/></div>
          <div className="field" style={{marginTop:10}}><label className="label">Texto para correo</label><textarea value={draft.cuerpoCorreo||""} onChange={e=>setDraft(d=>({...d,cuerpoCorreo:e.target.value}))} placeholder="Si lo dejas vacío, se usa el texto base." style={{minHeight:150}}/></div>
          <div className="field" style={{marginTop:10}}><label className="label">Texto base (SMS y respaldo)</label><textarea value={draft.cuerpo||""} onChange={e=>setDraft(d=>({...d,cuerpo:e.target.value}))} style={{minHeight:90}}/></div>
          <div style={{marginTop:8}}>
            <div style={{fontSize:12.5,color:"var(--muted)",marginBottom:6}}>Inserta una variable en el <b>texto base</b> (también puedes escribirlas a mano en los textos de WhatsApp y correo). Se reemplazan solas al previsualizar:</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>{TPL_VARS.map(v=><button key={v} className="btn btn-ghost btn-sm" onClick={()=>insertarVar(v)}>{v}</button>)}</div>
          </div>
          <AdjuntosEditor items={draft.adjuntos} onChange={listA=>setDraft(d=>({...d,adjuntos:listA}))}/>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:12}}>
            <button className="btn btn-green btn-sm" disabled={!dirty} onClick={guardar}>{dirty?"Guardar cambios":"✓ Guardado"}</button>
            {draft.builtin && <button className="btn btn-out btn-sm" onClick={restaurar}>↩ Restaurar original</button>}
            <button className="btn btn-out btn-sm" style={{color:"var(--red-d)",borderColor:"var(--red-soft)"}} onClick={eliminar}>✕ Eliminar plantilla</button>
          </div>
        </div>

        {/* Vista previa con variables aplicadas */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div className="seg-chan">{CANALES_COBRO.map(c=>(<button key={c.id} className={canal===c.id?"on":""} onClick={()=>setCanal(c.id)}>{c.ico} {c.label}</button>))}</div>
          <button className="btn btn-out btn-sm" onClick={copiar}>Copiar</button>
        </div>
        {canal==="correo" && (<div className="mail-prev">
          <div className="hd"><div className="lg">A</div><div><div className="bn">ArriendoPro</div><div className="tg">Administración de propiedades</div></div></div>
          <div className="meta"><b>Para:</b> {p.tenant||"arrendatario"} {p.tenantEmail?`‹${p.tenantEmail}›`:""}<br/><b>Asunto:</b> {asuntoR}</div>
          <div className="bd">{correoR.split("\n").map((par,i)=><p key={i} style={{margin:"0 0 10px"}}>{par||" "}</p>)}
            {!!(draft.adjuntos||[]).length && <div style={{marginTop:8}}><AdjuntosView items={draft.adjuntos}/></div>}
          </div>
          <div className="ft"><span className="dot"></span> ArriendoPro · Administración de propiedades{owner&&owner.email?(" · "+owner.email):""}</div>
        </div>)}
        {canal==="whatsapp" && (<div className="wa-wrap"><div className="wa-bubble">{renderWA(waR)}<div style={{textAlign:"right",fontSize:11,color:"#6b7d63",marginTop:4}}>{hora} ✓✓</div></div>{!!(draft.adjuntos||[]).length && <div style={{marginTop:8}}><AdjuntosView items={draft.adjuntos}/></div>}</div>)}
        {canal==="sms" && (<div className="sms-wrap"><div className="sms-bubble">{cuerpoR}</div><div style={{fontSize:12,color:"var(--muted)",marginTop:8}}>{cuerpoR.length} caracteres · {Math.ceil(cuerpoR.length/160)} SMS</div></div>)}
      </div>
    </div>
    <div className="help" style={{marginTop:14}}>Las plantillas, su texto y los archivos adjuntos quedan <b>guardados en la plataforma</b>, disponibles desde cualquier dispositivo. El envío real por correo, WhatsApp o SMS requiere conectar un servicio de mensajería desde el backend.</div>
  </div>);
}

/* ---------- Adjuntos (videos, PDF, fotos, Word, etc.) en incidencias y bitácora ---------- */
function AdjuntosEditor({ items, onChange }){
  const list = items||[];
  const [busy,setBusy]=useState(false);
  const note = (m,e)=> window.__notify && window.__notify(m,e);
  const add = async (files)=>{
    if(!files || !files.length) return; setBusy(true);
    const added=[];
    for(const file of Array.from(files)){
      try{ const r=await uploadArchivo(file); added.push({ url:r.url, name:r.name||file.name, contentType:r.contentType||file.type, size:file.size }); }
      catch(err){ note(err.message||("No se pudo subir "+file.name), true); }
    }
    if(added.length){ onChange([...(list), ...added]); note(""+added.length+" archivo(s) adjuntado(s)"); }
    setBusy(false);
  };
  return (<div className="field" style={{marginTop:12}}>
    <label className="label">Adjuntos (fotos, videos, PDF, Word, Excel…)</label>
    <label className="btn btn-out btn-sm" style={{opacity:busy?0.6:1,pointerEvents:busy?"none":"auto"}}>
      {busy?"Subiendo…":"Adjuntar archivos"}
      <input type="file" multiple style={{display:"none"}} onChange={e=>{ add(e.target.files); e.target.value=""; }}/>
    </label>
    <div className="help" style={{marginTop:6}}>Se guardan en la plataforma (no en el dispositivo). Máximo 4 MB por archivo.</div>
    {!!list.length && <div style={{display:"flex",flexDirection:"column",gap:6,marginTop:10}}>
      {list.map((a,i)=>(<div key={i} style={{display:"flex",alignItems:"center",gap:8,border:"1px solid var(--line2)",borderRadius:8,padding:"6px 10px"}}>
        <span style={{fontSize:18}}>{fileIcon(a.contentType)}</span>
        <a href={a.url} target="_blank" rel="noopener" style={{flex:1,color:"var(--ink)",textDecoration:"none",fontWeight:600,fontSize:14,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.name}</a>
        <button className="btn btn-ghost btn-sm" title="Quitar" onClick={()=>onChange(list.filter((_,j)=>j!==i))}>✕</button>
      </div>))}

/* ---------- Editor de movimientos (gastos e ingresos) ----------
   Cada movimiento admite: monto en CLP o UF, periodicidad (cada 1/2/3/4/6 meses,
   anual o fecha exacta), mes/año, nota, archivos adjuntos de todo tipo y subítems
   (cada subítem con su propia nota y adjuntos). Todo es editable. */
function MovItem({ m, onChange, onDelete, uf, tipo }){
  const [open,setOpen]=useState(false);
  const set=(k,v)=>onChange({...m,[k]:v});
  const moneda=m.moneda||"CLP";
  const subs=m.subitems||[]; const adj=m.adjuntos||[];
  const mensual=movMensualCLP(m,uf);
  const addSub=()=>onChange({...m, subitems:[...subs,{ id:"s"+Date.now().toString(36)+Math.random().toString(36).slice(2,5), concepto:"", monto:"", montoUF:"", moneda:"CLP", nota:"", adjuntos:[] }]});
  const updSub=(sid,k,v)=>onChange({...m, subitems:subs.map(s=>s.id===sid?{...s,[k]:v}:s)});
  const delSub=(sid)=>onChange({...m, subitems:subs.filter(s=>s.id!==sid)});
  const color = tipo==="ingreso" ? "var(--green-d)" : "var(--red-d)";
  return (<div style={{border:"1px solid var(--line2)",borderRadius:10,padding:"8px 10px",background:"var(--card)"}}>
    <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
      <input className="input" style={{flex:"2 1 130px",minWidth:110}} placeholder={tipo==="ingreso"?"Concepto (ej: estacionamiento)":"Concepto"} value={m.concepto||""} onChange={e=>set("concepto",e.target.value)}/>
      <input className="input" style={{flex:"1 1 80px",minWidth:70}} type="number" min="0" step="any" placeholder="0" value={moneda==="UF"?(m.montoUF??""):(m.monto??"")} onChange={e=>set(moneda==="UF"?"montoUF":"monto",e.target.value)}/>
      <select value={moneda} onChange={e=>set("moneda",e.target.value)} title="Moneda"><option value="CLP">CLP $</option><option value="UF">UF</option></select>
      <select value={m.periodo||"mes"} onChange={e=>set("periodo",e.target.value)} title="Periodicidad">{PERIODOS.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}</select>
      <button className={"btn btn-sm "+(open?"btn-red":"btn-out")} title="Más opciones (fecha, nota, archivos, subítems)" onClick={()=>setOpen(o=>!o)}>{(adj.length+subs.length)>0?` ${adj.length+subs.length}`:""}</button>
      <button className="btn btn-ghost btn-sm" title="Eliminar" onClick={onDelete}>✕</button>
    </div>
    <div style={{fontSize:12,color:"var(--faint)",fontWeight:600,marginTop:4}}>
      {moneda==="UF" && <span>≈ {CLP(movMontoCLP({...m,subitems:[]},uf))} · </span>}
      {m.periodo==="unica" ? <span>Movimiento único{m.fecha?` · ${m.fecha}`:""} (no se prorratea al mes)</span> : <span style={{color}}>Equivale a {CLP(mensual)}/mes</span>}
    </div>
    {open && <div style={{marginTop:10,borderTop:"1px dashed var(--line)",paddingTop:10}}>
      <div className="grid" style={{gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
        <div className="field"><label className="label" style={{fontSize:12}}>{m.periodo==="unica"?"Fecha exacta":"Fecha / vencimiento"}</label><input className="input" type="date" value={m.fecha||""} onChange={e=>set("fecha",e.target.value)}/></div>
        <div className="field"><label className="label" style={{fontSize:12}}>Mes</label><select value={m.mes??""} onChange={e=>set("mes",e.target.value===""?"":parseInt(e.target.value))}><option value="">—</option>{MESES_L.map((mn,i)=><option key={i} value={i}>{mn}</option>)}</select></div>
        <div className="field"><label className="label" style={{fontSize:12}}>Año</label><input className="input" type="number" placeholder="2026" value={m.anio??""} onChange={e=>set("anio",e.target.value)}/></div>
      </div>
      <div className="field" style={{marginTop:8}}><label className="label" style={{fontSize:12}}>Nota / comentario</label><textarea value={m.nota||""} onChange={e=>set("nota",e.target.value)} style={{minHeight:54}} placeholder="Observaciones, referencia de la boleta, etc."/></div>
      <AdjuntosEditor items={adj} onChange={list=>set("adjuntos",list)}/>
      <div style={{marginTop:10,background:"var(--panel2)",border:"1px solid var(--line)",borderRadius:8,padding:10}}>
        <div style={{fontWeight:800,fontSize:13,marginBottom:6}}>Subítems {subs.length>0?`(${subs.length})`:""}</div>
        {subs.length===0 && <div style={{color:"var(--muted)",fontSize:13,marginBottom:6}}>Divide este movimiento en partes (ej: Div. · Gas. · Útil.). Cada subítem admite nota y archivos.</div>}
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {subs.map(s=>{ const sm=s.moneda||"CLP"; return (<div key={s.id} style={{border:"1px solid var(--line2)",borderRadius:8,padding:8,background:"var(--card)"}}>
            <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
              <input className="input" style={{flex:"2 1 110px",minWidth:90}} placeholder="Concepto del subítem" value={s.concepto||""} onChange={e=>updSub(s.id,"concepto",e.target.value)}/>
              <input className="input" style={{flex:"1 1 70px",minWidth:60}} type="number" min="0" step="any" placeholder="0" value={sm==="UF"?(s.montoUF??""):(s.monto??"")} onChange={e=>updSub(s.id,sm==="UF"?"montoUF":"monto",e.target.value)}/>
              <select value={sm} onChange={e=>updSub(s.id,"moneda",e.target.value)}><option value="CLP">CLP $</option><option value="UF">UF</option></select>
              <button className="btn btn-ghost btn-sm" title="Eliminar subítem" onClick={()=>delSub(s.id)}>✕</button>
            </div>
            <input className="input" style={{marginTop:6}} placeholder="Nota del subítem" value={s.nota||""} onChange={e=>updSub(s.id,"nota",e.target.value)}/>
            <AdjuntosEditor items={s.adjuntos||[]} onChange={list=>updSub(s.id,"adjuntos",list)}/>
          </div>); })}
        </div>
        <button className="btn btn-out btn-sm" style={{marginTop:8}} onClick={addSub}>＋ Agregar subítem</button>
      </div>
    </div>}
  </div>);
}
function MovList({ items, onChange, uf, tipo }){
  const list=items||[];
  const add=()=>onChange([...list,{ id:(tipo==="ingreso"?"i":"g")+Date.now().toString(36)+Math.random().toString(36).slice(2,6), concepto:"", monto:"", montoUF:"", moneda:"CLP", periodo:"mes", fecha:"", mes:"", anio:"", nota:"", adjuntos:[], subitems:[] }]);

/* ==================== ASESOR INMOBILIARIO DIGITAL ====================
   Motor que consultan las herramientas del asesor. Trabaja siempre sobre el
   estado vivo de la aplicación, así que nunca entrega precios ni
   disponibilidad desactualizados. */

const ASESOR_CHAT_KEY="ap_asesor_chat", ASESOR_MET_KEY="ap_asesor_metricas";

/* Se puede arrendar ahora: está en el catálogo de arriendo y sin arrendatario. */
const asDisponible=(p)=> p.use==="arriendo" && !String(p.tenant||"").trim();
const asPrecio=(p,op)=> op==="venta" ? num(p.tasacion) : num(p.rent);
const asFoto=(p)=>{ const f=(p.fotos||[])[0]; return (f&&(f.url||f))||""; };

/* Ficha compacta: es a la vez lo que lee el modelo y lo que dibuja la tarjeta. */
const asFicha=(p,op)=>{
  const precio=asPrecio(p,op), libre=asDisponible(p);
  return { id:String(p.id), nombre:p.name||"Propiedad", tipo:p.type||"", operacion:op||"arriendo",
    comuna:p.comuna||"", region:p.region||"", direccion:p.address||"",
    precio, precio_texto: precio?CLP(precio):"A consultar",
    dormitorios:num(p.bedrooms), banos:num(p.bathrooms),
    estacionamientos:num(p.parking), bodegas:num(p.bodega),
    superficie:num(p.surfaceBuilt), superficie_terreno:num(p.surfaceTerrain),
    gasto_comun:num(p.gastoComun), orientacion:p.orientation||"", piso:p.floor||"",
    anio:p.constructionYear||"", estado_conservacion:p.condition||"",
    disponible:libre, disponible_desde: libre?"ahora":(p.contractEnd||"por confirmar"),
    foto:asFoto(p) };
};

/* Búsqueda. Devuelve también las ocupadas (con la fecha en que se liberan)
   porque en una cartera en administración casi todo está arrendado: filtrar
   solo lo disponible dejaría al asesor sin nada que mostrar. Lo disponible
   va primero. */
const asBuscar=(props,f)=>{
  f=f||{};
  const op = f.operacion==="venta" ? "venta" : "arriendo";
  const comunas=String(f.comuna||"").toLowerCase().split(",").map(s=>s.trim()).filter(Boolean);
  const tipo=String(f.tipo||"").toLowerCase().trim();
  const base=props.filter(p=> op==="venta" ? true : p.use==="arriendo");
  const out=base.filter(p=>{
    const precio=asPrecio(p,op);
    if(comunas.length && !comunas.some(c=>String(p.comuna||"").toLowerCase().includes(c))) return false;
    if(f.region && !String(p.region||"").toLowerCase().includes(String(f.region).toLowerCase())) return false;
    if(tipo && !String(p.type||"").toLowerCase().includes(tipo)) return false;
    if(f.precio_max && precio && precio>num(f.precio_max)) return false;
    if(f.precio_min && precio && precio<num(f.precio_min)) return false;
    if(f.dormitorios_min && num(p.bedrooms)<num(f.dormitorios_min)) return false;
    if(f.banos_min && num(p.bathrooms)<num(f.banos_min)) return false;
    if(f.estacionamiento && num(p.parking)<1) return false;
    if(f.bodega && num(p.bodega)<1) return false;
    if(f.superficie_min && num(p.surfaceBuilt)<num(f.superficie_min)) return false;
    if(f.solo_disponibles && !asDisponible(p)) return false;
    return true;
  }).sort((a,b)=>{ const d=(asDisponible(b)?1:0)-(asDisponible(a)?1:0); return d || (asPrecio(a,op)-asPrecio(b,op)); });
  const lim=Math.max(1,Math.min(6,num(f.limite)||4));
  return { total_encontradas:out.length, disponibles_ahora:out.filter(asDisponible).length,
    resultados:out.slice(0,lim).map(p=>asFicha(p,op)) };
};

/* Similares: cercanía por comuna, tipo, dormitorios y distancia de precio. */
const asSimilares=(props,id,masBarata)=>{
  const base=props.find(p=>String(p.id)===String(id));
  if(!base) return { error:"No encontré esa propiedad en el catálogo." };
  const op = base.use==="arriendo" ? "arriendo" : "venta";
  const pBase=asPrecio(base,op);
  const cand=props.filter(p=>String(p.id)!==String(id) && p.use===base.use)
    .filter(p=> masBarata ? (asPrecio(p,op)>0 && asPrecio(p,op)<pBase) : true)
    .map(p=>({ p, d:
      Math.abs(num(p.bedrooms)-num(base.bedrooms))*2 +
      (String(p.comuna||"")===String(base.comuna||"") ? 0 : 3) +
      (String(p.type||"")===String(base.type||"") ? 0 : 2) +
      (pBase ? Math.abs(asPrecio(p,op)-pBase)/Math.max(pBase,1)*4 : 0) }))
    .sort((a,b)=>a.d-b.d).slice(0,4).map(x=>asFicha(x.p,op));
  return { referencia:asFicha(base,op), resultados:cand };
};

const asComparar=(props,ids)=>{
  const sel=(ids||[]).map(id=>props.find(p=>String(p.id)===String(id))).filter(Boolean);
  if(sel.length<2) return { error:"Necesito al menos dos propiedades válidas para comparar." };
  return { comparacion: sel.slice(0,3).map(p=>asFicha(p, p.use==="arriendo"?"arriendo":"venta")) };
};

/* Cuánto cuesta entrar: primer mes, garantía y renta líquida sugerida. */
const asCostos=(props,id,montoManual)=>{
  const p = id ? props.find(x=>String(x.id)===String(id)) : null;
  const arriendo = p ? num(p.rent) : num(montoManual);
  if(!arriendo) return { error:"Necesito el arriendo mensual o el id de una propiedad." };
  const gc = p ? num(p.gastoComun) : 0;
  const garantia = p ? (num(p.deposit)||arriendo) : arriendo;
  const inicial = arriendo+garantia+gc, mensual = arriendo+gc;
  return { propiedad: p?p.name:null,
    arriendo_mensual:arriendo, arriendo_texto:CLP(arriendo),
    gasto_comun:gc, gasto_comun_texto: gc?CLP(gc):"no informado",
    garantia, garantia_texto:CLP(garantia),
    total_primer_mes:inicial, total_primer_mes_texto:CLP(inicial),
    costo_mensual_total:mensual, costo_mensual_texto:CLP(mensual),
    renta_liquida_sugerida:arriendo*3, renta_liquida_texto:CLP(arriendo*3) };
};

/* Resumen liviano del catálogo: le da criterio al asesor sin que tenga que
   buscar en cada turno. El detalle exacto siempre sale de las herramientas. */
const asResumenCatalogo=(props,uf,empresa,contacto,lead)=>{
  const arr=props.filter(p=>p.use==="arriendo");
  const precios=arr.map(p=>num(p.rent)).filter(n=>n>0);
  return { fecha:new Date().toLocaleDateString("es-CL"), empresa, contacto, uf:Math.round(num(uf)),
    total:props.length, disponibles:arr.filter(asDisponible).length,
    comunas:[...new Set(props.map(p=>p.comuna).filter(Boolean))].slice(0,20),
    tipos:[...new Set(props.map(p=>p.type).filter(Boolean))],
    rango: precios.length ? { min:Math.min(...precios), max:Math.max(...precios) } : null,
    lead: lead || null };
};

  const sel = leads.find(l=>l.id===selId)||null;
