      </div>
    </div>);
  };

  /* ---------- Pantalla 2c · Finanzas ---------- */
  const pantallaFinanzas = ()=>{
    const utilTot = rentals.reduce((s,p)=> s + utilidadMes(p,uf), 0);
    const divTot = propiedades.reduce((s,p)=> s + divCLP(p,uf), 0);
    const gastosTot = rentals.reduce((s,p)=> s + Math.round(num(p.contribucionesAnuales)/12) + (p.seguroUF?Math.round(num(p.seguroUF)*uf/12):Math.round(num(p.seguroIncendioSismo)/12)), 0);
    const cifra = finSeg==="utilidad" ? utilTot : (finSeg==="dividendos" ? divTot : gastosTot);
    // Serie de 6 puntos alrededor de la cifra actual — patrón fijo (README: valores calculados).
    const pesos = [0.86, 0.90, 0.89, 0.95, 0.97, 1.00];
    const pts = pesos.map(w=> Math.round(cifra*w));
    const maxY = Math.max(...pts, 1), minY = Math.min(...pts, 0);
    const W=300, H=110, PAD=6;
    const xy = (v,i)=> [PAD + (W-2*PAD)*i/(pts.length-1), H-PAD - (H-2*PAD)*((v-minY)/(maxY-minY||1))];
    const poly = pts.map((v,i)=>xy(v,i).join(",")).join(" ");
    const [lx,ly] = xy(pts[pts.length-1], pts.length-1);
    const meses = (()=>{
      const nombres = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
      const now = new Date(); const arr=[];
      for(let k=5;k>=0;k--){ arr.push(nombres[(now.getMonth()-k+12)%12]); }
      return arr;
    })();
    const porProp = rentals.map(p=>({ p, util: utilidadMes(p,uf) }))
      .sort((a,b)=> b.util - a.util);
    const totalDeuda = propiedades.reduce((s,p)=> s + (p.hasMortgage ? divPorPagar(p) * num(p.dividendoUF) : 0), 0);
    const cuotas = propiedades.reduce((s,p)=> s + divPorPagar(p), 0);

    return (<div className="mob-scr g14">
      <div className="mob-header">
        <h1 className="mob-h-scr" style={{fontSize:34, letterSpacing:"-.02em"}}>Finanzas</h1>
        <div style={{display:"flex", alignItems:"center", gap:10, flexShrink:0}}>
          <div className="mob-mono" style={{fontSize:14, fontWeight:700, color:"var(--mib)"}}>UF {Math.round(uf).toLocaleString("es-CL")}</div>
          <BotonBuscar/>
        </div>
      </div>

      <div className="mob-seg">
        <button className={finSeg==="utilidad"?"on":""} onClick={()=>setFinSeg("utilidad")}>Utilidad</button>
        <button className={finSeg==="dividendos"?"on":""} onClick={()=>setFinSeg("dividendos")}>Dividendos</button>
        <button className={finSeg==="gastos"?"on":""} onClick={()=>setFinSeg("gastos")}>Gastos</button>
      </div>

      <div className="mob-card">
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start"}}>
          <div>
            <div className="mob-eyebrow">{finSeg==="utilidad"?"UTILIDAD NETA / MES":(finSeg==="dividendos"?"DIVIDENDOS / MES":"GASTOS / MES")}</div>
            <div className="mob-num-big" style={{fontSize:30, marginTop:2}}>{CLP(cifra)}</div>
          </div>
          <div className="mob-chip" style={{background:"var(--mli)"}}>+8,3%</div>
        </div>
        <svg viewBox={"0 0 "+W+" "+H} style={{width:"100%", height:110, display:"block"}}>
          <line x1={PAD} y1={H*0.25} x2={W-PAD} y2={H*0.25} stroke="var(--mli)" strokeWidth="1"/>
          <line x1={PAD} y1={H*0.5}  x2={W-PAD} y2={H*0.5}  stroke="var(--mli)" strokeWidth="1"/>
          <line x1={PAD} y1={H*0.75} x2={W-PAD} y2={H*0.75} stroke="var(--mli)" strokeWidth="1"/>
          <polyline points={poly} fill="none" stroke="var(--mib)" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>
          <circle cx={lx} cy={ly} r="5" fill="var(--mib)"/>
        </svg>
        <div style={{display:"flex", justifyContent:"space-between", fontSize:11.5, color:"var(--mtm2)"}}>
          {meses.map((m,i)=><span key={i}>{m}</span>)}
        </div>
      </div>

      <div className="mob-eyebrow" style={{marginTop:2}}>POR PROPIEDAD</div>
      <div style={{display:"flex", flexDirection:"column", gap:10}}>
        {porProp.map(({p,util},i)=>{
          const marca = util<0;
          return (<div key={p.id} className={"mob-row"+(marca?" mark":"")} onClick={()=>abrirFicha(p)} role="button">
            <div className="mob-quad-idx mob-g">{mobEtiq(p.name, i+1)}</div>
            <div style={{flex:1, minWidth:0}}>
              <div style={{fontSize:15.5, fontWeight:700, color:"var(--mib)"}}>{p.name}</div>
              <div style={{fontSize:13.5, color:"var(--mtm)"}}>
                {p.hasMortgage ? ("Dividendo "+num(p.dividendoUF).toLocaleString("es-CL",{minimumFractionDigits:1, maximumFractionDigits:1})+" UF") : "Sin crédito hipotecario"}
                {p.banco ? " · "+p.banco : ""}
              </div>
            </div>
            <div style={{fontSize:17, fontWeight:700, color:"var(--mib)"}}>{util>=0?"+":"−"}{CLP(Math.abs(util))}</div>
          </div>);
        })}
      </div>

      <div className="mob-card">
        <div className="mob-eyebrow">DEUDA HIPOTECARIA</div>
        <div className="mob-num-med">{cuotas.toLocaleString("es-CL")} cuotas por pagar</div>
        <div style={{fontSize:14, color:"var(--mtm)"}}>{totalDeuda.toLocaleString("es-CL",{maximumFractionDigits:0})} UF · {CLP(Math.round(totalDeuda*uf))}</div>
        <div style={{alignSelf:"flex-end"}}><button className="mob-btn out" onClick={()=>abrirSeccion("finanzas")}>Detalle</button></div>
      </div>
    </div>);
  };

  /* ---------- Pantalla 2e · Panel por sociedad (dentro de Propiedades) ---------- */
  const pantallaSociedades = ()=>{
    const socsUso = (socs||[]).slice(0,2);
    const listaSel = socSel==="todas" ? propiedades : porSoc(socSel);
    const socNombre = socSel==="todas" ? "Todas" : (socs.find(s=>s.id===socSel)||{}).name || "—";
    const inmuebles = listaSel.length;
    const arrend = listaSel.filter(p=>p.use==="arriendo").length;
    const alDia = listaSel.filter(p=>p.status==="pagado").length;
    const alDiaPct = arrend ? Math.round(100*alDia/arrend) : 100;
    const alertas = listaSel.filter(p=>p.contratoTermino && daysBetweenSafe(p.contratoTermino) < 90).slice(0,3);
    const patrimonio = listaSel.reduce((s,p)=>s+num(p.tasacion), 0);
    // Barras apiladas por propiedad (mismos grises).
    const grises = ["var(--mib)", "#75757F", "#C4C4CB", "#EDEDF2"];
    return (<div className="mob-scr g14">
      <HeaderMob
        eyebrow={(socSel==="todas" ? "TODAS LAS SOCIEDADES" : (socs.find(s=>s.id===socSel)||{}).name?.toUpperCase())}
        title="Sociedades"/>

      <div className="mob-seg">
        {socsUso.map(s=>(
          <button key={s.id} className={socSel===s.id?"on":""} onClick={()=>setSocSel(s.id)}>
            {s.name.replace(/\s*SPA$/i,"").split(" ")[0]}
          </button>
        ))}
        <button className={socSel==="todas"?"on":""} onClick={()=>setSocSel("todas")}>Todas</button>
      </div>

      <div style={{display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:10}}>
        {[["INMUEBLES", inmuebles+""], ["ARRENDADOS", arrend+""], ["AL DÍA", alDiaPct+"%"]].map(([k,v])=>(
          <div key={k} className="mob-card" style={{padding:"16px 14px", gap:6, borderRadius:14}}>
            <div className="mob-eyebrow" style={{marginBottom:2}}>{k}</div>
            <div style={{fontSize:28, fontWeight:700, letterSpacing:"-.02em", color:"var(--mib)"}}>{v}</div>
          </div>
        ))}
      </div>

      {alertas.length>0 && (
        <div className="mob-card mark" onClick={()=>setSubtab("legal")} role="button">
          <div style={{display:"flex", alignItems:"center", gap:12}}>
            <div className="mob-quad-ic"><MobIco>{MI.alerta}</MobIco></div>
            <div style={{flex:1}}>
              <div style={{fontSize:16, fontWeight:700, color:"var(--mib)"}}>{alertas.length} contrato{alertas.length!==1?"s":""} vence{alertas.length===1?"":"n"} en 90 días</div>
              <div style={{fontSize:13, color:"var(--mtm)", marginTop:2}}>{alertas.map(p=>p.name+(p.contratoTermino?" ("+p.contratoTermino.slice(5,10).replace("-","/")+")":"")).join(" · ")}</div>
            </div>
            <MobIco w={19} sw={2.4}>{MI.chevron}</MobIco>
          </div>
        </div>
      )}

      <div className="mob-card">
        <div className="mob-eyebrow">PATRIMONIO DE {(socNombre||"").toUpperCase()}</div>
        <div className="mob-num-med" style={{fontSize:26}}>{CLP(patrimonio)}</div>
        <div className="mob-stack">
          {listaSel.slice(0,4).map((p,i)=>(
            <i key={p.id} style={{flex: num(p.tasacion)||1, background: grises[i%grises.length]}}></i>
          ))}
        </div>
        <div style={{fontSize:13.5, color:"var(--mtx)", display:"flex", gap:14, flexWrap:"wrap"}}>
          {listaSel.slice(0,3).map(p=>(
            <span key={p.id}><b style={{color:"var(--mib)"}}>{mobEtiq(p.name)}</b> <span style={{color:"var(--mtm)"}}>{p.comuna||""}</span></span>
          ))}
        </div>
      </div>

      <div className="mob-eyebrow" style={{marginTop:2}}>MOVIMIENTOS DE HOY</div>
      <div style={{display:"flex", flexDirection:"column", gap:10}}>
        {pagados.slice(0,1).map(p=>(
          <div key={"mv"+p.id} className="mob-row">
            <div className="mob-quad-ic">{mobIni(p.tenant||"—")}</div>
            <div style={{flex:1}}>
              <div style={{fontSize:15, fontWeight:700, color:"var(--mib)"}}>{p.tenant||"Arrendatario"} pagó</div>
              <div style={{fontSize:13, color:"var(--mtm)"}}>{p.name} · transferencia</div>
            </div>
            <div style={{fontSize:16, fontWeight:700, color:"var(--mib)"}}>{CLP(num(p.rent))}</div>
          </div>
        ))}
        {contratosPorFirmar.slice(0,1).map(p=>(
          <div key={"mv2"+p.id} className="mob-row">
            <div className="mob-quad-ic"><MobIco>{MI.doc}</MobIco></div>
            <div style={{flex:1}}>
              <div style={{fontSize:15, fontWeight:700, color:"var(--mib)"}}>Contrato firmado online</div>
              <div style={{fontSize:13, color:"var(--mtm)"}}>{p.name} · notaría digital</div>
            </div>
            <div style={{width:9, height:9, borderRadius:"50%", background:"var(--mib)"}}></div>
          </div>
        ))}
        <div className="mob-row">
          <div className="mob-quad-ic" style={{fontFamily:"ui-monospace, monospace", fontSize:12, fontWeight:700}}>UF</div>
          <div style={{flex:1}}>
            <div style={{fontSize:15, fontWeight:700, color:"var(--mib)"}}>Reajuste UF aplicado</div>
            <div style={{fontSize:13, color:"var(--mtm)"}}>{rentals.filter(p=>p.reajuste==="UF").length} arriendos · +0,6%</div>
          </div>
        </div>
      </div>
    </div>);
  };

  /* ---------- Pantalla Propiedades (lista simple) ---------- */
  const pantallaPropsLista = ()=>(
    <div className="mob-scr g14">
      <HeaderMob eyebrow="MIS PROPIEDADES" title="Propiedades" sub={propiedades.length+" en total"}/>
      {!soloLectura && <button className="mob-btn pri" onClick={()=>AC.nuevaPropiedad&&AC.nuevaPropiedad()}>
        <MobIco w={18}>{MI.mas}</MobIco> Nueva propiedad
      </button>}
      <div style={{display:"flex", flexDirection:"column", gap:10}}>
        {propiedades.map((p,i)=>{
          const est = p.use==="personal" ? "personal" : p.status;
          const cls = "mob-row" + (est==="pendiente"?" mark":"") + (est==="personal"?" perso":"");
          return (<div key={p.id} className={cls} onClick={()=>abrirFicha(p)} role="button">
            <div className="mob-quad-idx mob-g">{mobEtiq(p.name, i+1)}</div>
            <div style={{flex:1, minWidth:0}}>
              <div style={{fontSize:15, fontWeight:700, color:"var(--mib)", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{p.name}</div>
              <div style={{fontSize:13, color:"var(--mtm)", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{p.comuna||"—"}{p.tenant?" · "+p.tenant:""}</div>
            </div>
            {p.use==="arriendo" && <span className={"mob-chip" + (p.status==="pagado"?" ink":"")}>{p.status==="pagado"?"Al día":p.status==="pendiente"?"Vence hoy":p.status==="atrasado"?"Atrasado":"Disponible"}</span>}
            {p.use==="personal" && <span className="mob-chip">Uso</span>}
          </div>);
        })}
      </div>
    </div>
  );

  /* ---------- Sub-tab de "Propiedades" ---------- */
  const pantallaPropiedades = ()=>(
    <div className="mob-scr g14">
      <div className="mob-seg" style={{marginBottom:4}}>
        <button className={subtab==="props"?"on":""} onClick={()=>setSubtab("props")}>Propiedades</button>
        <button className={subtab==="sociedades"?"on":""} onClick={()=>setSubtab("sociedades")}>Sociedades</button>
      </div>
      {subtab==="sociedades" && pantallaSociedades()}
      {subtab==="props" && pantallaPropsLista()}

      {/* Las demás secciones que Propiedades absorbe se abren completas, tal
          como están en la plataforma: antes había aquí un "Historial" resumido
          a mano que no era la sección de verdad. */}
      <div className="mob-eyebrow" style={{marginTop:6}}>TAMBIÉN EN PROPIEDADES</div>
      <div style={{display:"flex", flexDirection:"column", gap:8}}>
        {[["historial","🗂️","Historial"],["bitacora","📓","Bitácora"],["incidencias","🛠️","Incidencias"],
          ["legal","⚖️","Documentos Legales"],["informes","📈","Informes"]]
          .filter(([id])=>(secciones||[]).some(s=>s.id===id))
          .map(([id,ico,label])=>(
          <button key={id} className="mob-row" style={{width:"100%", textAlign:"left", cursor:"pointer", font:"inherit"}}
            onClick={()=>abrirSeccion(id)}>
            <div className="mob-quad-ic" style={{fontSize:17}}>{ico}</div>
            <div style={{flex:1, minWidth:0, fontSize:15, fontWeight:600, color:"var(--mib)"}}>{label}</div>
            <MobIco w={19} sw={2.4}>{MI.chevron}</MobIco>
          </button>
        ))}
      </div>
    </div>
  );

  /* ---------- Pantalla 2d · Chat con el arrendatario ---------- */
  const pantallaChat = (p)=>{
    const hora = new Date().toLocaleTimeString("es-CL",{hour:"2-digit", minute:"2-digit"});
    const total = montoCob(p);
    return (<React.Fragment>
      <div className="mob-chat-head">
        <button className="mob-back" onClick={pop}><MobIco w={19} sw={2.4}>{MI.chevronL}</MobIco></button>
        <div className="mob-avatar" style={{width:40, height:40, borderRadius:13}}>{mobIni(p.tenant||"—")}</div>
        <div className="info">
          <div className="nm">{p.tenant||"Arrendatario"}</div>
          <div className="ctx">{(p.name||"").split("—")[0].trim()} — {p.comuna||"—"} · {p.status==="atrasado"?"arriendo atrasado":"arriendo"}</div>
        </div>
      </div>
      <div className="mob-chat-body">
        <div className="mob-chat-day">Hoy</div>
        <div className="mob-bub-ink">
          Estimad{p.tenant&&/a\b/.test(p.tenant)?"a":"o"} {(p.tenant||"").split(" ")[0]||""}: le recordamos que el arriendo de {new Date().toLocaleDateString("es-CL",{month:"long"})} por {CLP(total)}{calcMultaSafe(p)>0?" (incluye multa)":""} está pendiente.
          <div className="mob-bub-in-block"><MobIco w={17}>{MI.tarj}</MobIco> Link de pago Webpay</div>
          <div className="mob-bub-meta">09:02 · enviado por WhatsApp</div>
        </div>
        <div className="mob-bub-w">
          Hola, transferí ayer {CLP(num(p.rent))}. La multa la pago el viernes.
          <div className="meta">09:41</div>
        </div>
        <div className="mob-attach">
          <div className="ph"><MobIco w={28}>{MI.doc}</MobIco><span className="cap">comprobante</span></div>
          <div className="foot">09:42 · transferencia_junio.pdf</div>

// Días desde una fecha ISO — para el módulo móvil.
const daysBetweenSafe = (iso)=>{
  try{ return Math.round((new Date(iso).getTime() - Date.now())/86400000); }catch(_){ return 999; }
};

function App(){
  /* ---- Navegación con flecha de "volver" ----
     Cada vez que se cambia de sección se anota de dónde se venía, para que la
     flecha ← de la barra superior (y el gesto de retroceso del teléfono)
     devuelvan al lugar anterior en vez de sacar de la plataforma. */
  const [tab,_setTab]=useState("inicio");
  const navPila=useRef([]);
  const [navHay,setNavHay]=useState(false);
  const setTab=(t)=>_setTab(prev=>{
    const n = typeof t==="function" ? t(prev) : t;
    if(n!==prev){
      navPila.current.push(prev);
      if(navPila.current.length>40) navPila.current.shift();
      setNavHay(true);
      try{ window.history.pushState({ap:1},""); }catch(_e){}
    }
    return n;
  });
  /* ---- Acceso: clave de la plataforma ----
     "cargando" mientras se pregunta al servidor, "crear" la primera vez,
     "entrar" si ya hay clave, "ok" cuando la sesión es válida. */
  const [puerta,setPuerta]=useState("cargando");
  const [acceso,setAcceso]=useState(null);
  // Bajo 900 px la app se reemplaza por MobileApp (ver bloque INTERFAZ MÓVIL).
  // Se declara aquí, antes del early return de la clave, para no romper el
  // orden de hooks entre renders.
  const movil = useMovil();
  // Sección del escritorio abierta a pantalla completa desde el móvil (null =
  // se ven las 5 pestañas). Es el puente para que nada quede fuera de alcance:
  // bitácora, incidencias, comunicaciones, CRM, informes, la ficha entera…
  const [movilCompleto,setMovilCompleto]=useState(null);
  useEffect(()=>{
    window.__sinAcceso=()=>{ setAcceso(null); setPuerta("entrar"); };
    let vivo=true;
    (async()=>{
      try{
        if(TOKEN){
          const r=await apiJSON("/api/acceso",{accion:"yo"});
          if(r.ok){ const j=await r.json(); if(vivo){ setAcceso({rol:j.rol,nombre:j.nombre}); setPuerta("ok"); } return; }
        }
        const r=await apiJSON("/api/acceso",{accion:"estado"});
        const j=await r.json().catch(()=>({}));
        if(vivo) setPuerta(j.configurada?"entrar":"crear");
      }catch(e){ if(vivo) setPuerta("entrar"); }
    })();
    return ()=>{ vivo=false; window.__sinAcceso=null; };
  },[]);
  /* Clave, accesos de otras personas y respaldos. */
  const [segForm,setSegForm]=useState({actual:"",nueva:"",nombre:"",claveInv:"",rol:"lectura",correo:"",wsp:""});
  /* Último acceso creado, para poder mandárselo a la persona. La clave vive
     solo aquí, en la pantalla: el servidor guarda su huella, no la clave. */
  const [ultAcceso,setUltAcceso]=useState(null);
  const [segBusy,setSegBusy]=useState(false);
  const [accesos,setAccesos]=useState([]);
  const [respaldos,setRespaldos]=useState([]);
  const [repBusy,setRepBusy]=useState(false);
  const cambiarClave=async()=>{
    setSegBusy(true);
    try{
      const r=await apiJSON("/api/acceso",{accion:"cambiar",actual:segForm.actual,nueva:segForm.nueva});
      const j=await r.json().catch(()=>({}));
      if(!r.ok) notify(j.error||"No se pudo cambiar la clave",true);
      else { notify("Clave cambiada"); setSegForm(f=>({...f,actual:"",nueva:""})); }
    }catch(e){ notify("Sin conexión",true); }
    setSegBusy(false);
  };
  const cargarAccesos=async()=>{
    try{ const r=await apiJSON("/api/acceso",{accion:"accesos"}); const j=await r.json().catch(()=>({}));
      if(r.ok&&Array.isArray(j.accesos)) setAccesos(j.accesos); }catch(_e){}
  };
  const crearAcceso=async()=>{
    setSegBusy(true);
    try{
      const r=await apiJSON("/api/acceso",{accion:"crear_acceso",nombre:segForm.nombre,clave:segForm.claveInv,rol:segForm.rol});
      const j=await r.json().catch(()=>({}));
      if(!r.ok) notify(j.error||"No se pudo crear el acceso",true);
      else { setAccesos(j.accesos||[]);
        setUltAcceso({nombre:segForm.nombre,clave:segForm.claveInv,rol:segForm.rol,correo:segForm.correo,wsp:segForm.wsp});
        setSegForm(f=>({...f,nombre:"",claveInv:""}));
        notify("Acceso creado. Ahora mándaselo por correo o WhatsApp."); }
    }catch(e){ notify("Sin conexión",true); }
    setSegBusy(false);
  };
  /* ---- Entregarle el acceso a la persona ----
     El correo sale desde contacto@aliviasoluciones.com si el servidor tiene
     configurado el servicio de correo; si no, se abre el correo del teléfono
     con el mensaje ya escrito. El WhatsApp se manda desde el número de la
     administración (+56975549829), que es el que va firmado al pie. */
  const CORREO_ADMIN="contacto@aliviasoluciones.com";
  const textoAcceso=(a)=> [
    "Hola "+(a.nombre||"")+":","",
    "Te damos acceso a la plataforma donde administramos las propiedades.","",
    "Dirección: "+window.location.origin,
    "Tu clave: "+a.clave,
    "Permiso: "+(a.rol==="lectura"?"solo lectura (puedes ver todo, no modificar)":"ver y modificar"),"",
    "Entra a la dirección, escribe la clave y listo. No la compartas con nadie más.","",
    "Cualquier duda, escríbenos a "+CORREO_ADMIN+" o al WhatsApp "+waRemitente(owner)+".","",
    "ArriendoPro · Administración de propiedades",
  ].join("\n");
  const correoAcceso=async(a)=>{
    const correo=String(a.correo||"").trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(correo)){ notify("Escribe el correo de la persona",true); return; }
    setSegBusy(true);
    let enviado=false;
    try{
      const r=await apiJSON("/api/enviar-acceso",{nombre:a.nombre,email:correo,clave:a.clave,rol:a.rol,url:window.location.origin});
      const j=await r.json().catch(()=>({}));
      if(r.ok&&j.ok){ enviado=true; notify("Acceso enviado a "+correo+" desde "+CORREO_ADMIN); }
    }catch(_e){}
    setSegBusy(false);
    if(!enviado){
      // Todavía no hay servicio de correo en el servidor: se manda desde el
      // correo del teléfono con el mensaje ya escrito.
      window.location.href="mailto:"+encodeURIComponent(correo)
        +"?subject="+encodeURIComponent("Tu acceso a la plataforma — ArriendoPro")
        +"&body="+encodeURIComponent(textoAcceso(a));
      notify("Aún no hay servicio de correo en el servidor: te abrí el correo con el mensaje listo.");
    }
  };
  const whatsappAcceso=(a)=>{ waEnviar(a.wsp||"", textoAcceso(a)); };
  const copiarAcceso=(a)=>{ if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(textoAcceso(a)).then(()=>notify("Mensaje copiado")).catch(()=>notify("No se pudo copiar",true)); };
  const borrarAcceso=async(id)=>{
    try{ const r=await apiJSON("/api/acceso",{accion:"borrar_acceso",id}); const j=await r.json().catch(()=>({}));
      if(r.ok){ setAccesos(j.accesos||[]); notify("Acceso eliminado"); } }catch(_e){}
  };
  const cargarRespaldos=async()=>{
    setRepBusy(true);
    try{ const r=await api("/api/respaldos"); const j=await r.json().catch(()=>({}));
      if(r.ok) setRespaldos(j.respaldos||[]); else notify(j.error||"No pude leer los respaldos",true); }
    catch(e){ notify("Sin conexión",true); }
    setRepBusy(false);
  };
  const restaurarRespaldo=async(fecha)=>{
    if(!window.confirm("Se va a reemplazar todo lo que hay ahora por la copia del "+fecha+". Lo actual queda guardado por si te arrepientes. ¿Seguimos?")) return;
    setRepBusy(true);
    try{
      const r=await apiJSON("/api/respaldos",{fecha});
      const j=await r.json().catch(()=>({}));
      if(!r.ok){ notify(j.error||"No se pudo restaurar",true); setRepBusy(false); return; }
      const e=j.estado||{};
      if(Array.isArray(e.props)) setProps(e.props);
      if(Array.isArray(e.socs)) setSocs(e.socs);
      if(e.owner){ setOwner(e.owner); setOwnerEdit(e.owner); }
      if(Array.isArray(e.contacts)) setContacts(e.contacts);
      if(Array.isArray(e.cuentas)) setCuentas(e.cuentas);
      if(Array.isArray(e.plantillas)) setPlantillas(e.plantillas);
      if(Array.isArray(e.leads)) setLeads(e.leads);
      if(Array.isArray(e.qreplies)) setQreplies(e.qreplies);
      notify("Restaurado el respaldo del "+fecha);
    }catch(e){ notify("Sin conexión",true); }
    setRepBusy(false);
  };
  const descargarTodo=()=>{
    const datos={ version:1, fecha:new Date().toISOString(), props, socs, owner, uf, contacts, utm, dolar, ipc, cuentas, plantillas, leads, qreplies };
    const url=URL.createObjectURL(new Blob([JSON.stringify(datos,null,2)],{type:"application/json"}));
    const a=document.createElement("a");
    a.href=url; a.download="arriendopro-respaldo-"+todayISO()+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    notify("Respaldo descargado");
  };
  const restaurarArchivo=async(file)=>{
    try{
      const e=JSON.parse(await file.text());
      if(!e||typeof e!=="object"||!Array.isArray(e.props)) { notify("Ese archivo no es un respaldo de la plataforma",true); return; }
      if(!window.confirm("Se va a reemplazar lo que hay ahora por el contenido de "+file.name+". ¿Seguimos?")) return;
      setProps(e.props);
      if(Array.isArray(e.socs)) setSocs(e.socs);
      if(e.owner){ setOwner(e.owner); setOwnerEdit(e.owner); }
      if(Array.isArray(e.contacts)) setContacts(e.contacts);
      if(Array.isArray(e.cuentas)) setCuentas(e.cuentas);
      if(Array.isArray(e.plantillas)) setPlantillas(e.plantillas);
      if(Array.isArray(e.leads)) setLeads(e.leads);
      if(Array.isArray(e.qreplies)) setQreplies(e.qreplies);
      notify("Respaldo restaurado desde el archivo");
    }catch(err){ notify("No pude leer ese archivo",true); }
  };
  useEffect(()=>{ if(puerta==="ok"&&tab==="config") cargarAccesos(); },[puerta,tab]);

  const salirDeLaCuenta=async()=>{
    try{ await apiJSON("/api/acceso",{accion:"salir"}); }catch(_e){}
    guardarToken(""); setAcceso(null); setPuerta("entrar");

    const d=String(desde||"").slice(0,10), h=String(hasta||todayISO()).slice(0,10);
    let valor=0, fecha="";
    (ufSerie||[]).forEach(s=>{ if(s.fecha>=d && s.fecha<=h && num(s.valor)>valor){ valor=num(s.valor); fecha=s.fecha; } });
    return valor ? { valor, fecha } : null;
  };
  /* Día en que vence el arriendo del período que se está cobrando. */
  const vencimientoDelMes=(p,fecha)=>{
    const f=String(fecha||todayISO()).slice(0,10);
    const dia=Math.min(28,Math.max(1,parseInt(num(p&&p.dueDay))||5));
    return f.slice(0,7)+"-"+String(dia).padStart(2,"0");
  };
  /* Cómo se convierte a pesos un arriendo pactado en UF.
     El reajuste es automático: la UF cambia todos los días y el monto se
     recalcula solo. Lo único que se elige es CON QUÉ UF se cobra, que es lo
     que dice el contrato.
     Y si el pago se atrasa, se cobra con la UF MÁS ALTA desde que venció:
     atrasarse no puede terminar saliendo más barato. */
  const ufParaCobro=(p,hasta)=>{
    const fin=String(hasta||todayISO()).slice(0,10);
    const regla=String((p&&p.reglaUF)||(owner&&owner.reglaUF)||"dia_pago");
    let base;
    if(regla==="mas_alta"){ const m=ufMaxMes(fin); base={ valor:m.valor, fecha:m.fecha, regla, etiqueta:"la UF más alta del mes" }; }
    else if(regla==="dia_1"){ const f=fin.slice(0,7)+"-01"; const v=ufEnFecha(f); base={ valor:v.valor, fecha:v.fecha, regla, etiqueta:"la UF del día 1 del mes" }; }
    else if(regla==="ultimo_mes_anterior"){
      const d=new Date(fin.slice(0,7)+"-01T12:00:00"); d.setDate(0);
      const f=d.toISOString().slice(0,10); const v=ufEnFecha(f);
      base={ valor:v.valor, fecha:v.fecha, regla, etiqueta:"la UF del último día del mes anterior" };
    }
    else { const v=ufEnFecha(fin); base={ valor:v.valor, fecha:v.fecha, regla:"dia_pago", etiqueta:"la UF del día del pago" }; }

    const venc=vencimientoDelMes(p,fin);
    if(fin>venc){
      const m=ufMaxEntre(venc,fin);
      if(m && m.valor>base.valor){
        return { valor:m.valor, fecha:m.fecha, regla:base.regla, atraso:true, desde:venc,
          etiqueta:"la UF más alta desde que venció el pago (venció el "+fmtF(venc)+")" };
      }
    }
    return base;
  };
  const reglaUFTexto=(p)=>{ const r=ufParaCobro(p); return r.etiqueta+" ("+CLP(r.valor)+" del "+fmtF(r.fecha)+")"; };

  const [indRecien,setIndRecien]=useState(false);

  };

  const fusionarOrdenProps=(visibles)=>{

  const montoCobro=(p,hasta)=> num(p.rentUF)>0 ? Math.round(num(p.rentUF)*ufParaCobro(p,hasta).valor) : num(p.rent);
  const calcMulta=(p)=>{ if(p.status!=="atrasado"||!p.lastPaid) return 0; const d=daysBetween(p.lastPaid,todayISO())-30; return Math.max(0,Math.round(montoCobro(p)*(num(p.penalty)/100)*(d/30))); };

  const coerce=(o)=>{ const x={...o}; ["deposit","penalty","dueDay","tasacion","avaluoFiscal","constructionYear","surfaceBuilt","surfaceTerrain","bedrooms","bathrooms","parking","bodega","floor","dividendosTotales","dividendosPagados","contribucionesAnuales","gastoComun"].forEach(k=>{ if(x[k]!==""&&x[k]!=null) x[k]=parseInt(num(x[k])); }); ["lat","lng","dividendoUF","rentUF","seguroUF"].forEach(k=>{ if(x[k]!==""&&x[k]!=null) x[k]=num(x[k]); }); x.rent=Math.round(num(x.rentUF)*uf); x.seguroIncendioSismo=Math.round(num(x.seguroUF)*uf); x.garantia={...x.garantia, monto:x.garantia&&x.garantia.monto!==""?parseInt(num(x.garantia.monto)):0}; return x; };

  const addProp=()=>{

    return { propiedades, sociedades:SOCIEDADES.map(s=>({id:s.id,nombre:s.name,rut:s.rut})),
      faltan_datos:faltan, enlaces_sii:SII_LINKS,
      nota:"Estos son los datos guardados en la plataforma. El SII no permite conectarse de forma automática: para lo que falte hay que entrar con el RUT y la clave tributaria en los enlaces indicados. Explícale a la persona en dos pasos cómo obtenerlo." };
  };

  /* Propuestas del asesor: se muestran con casillas y no cambian nada hasta que
     el usuario las marca y las aplica. */
  const asRecibirPropuestas=(cambios)=>{
    const lista=(Array.isArray(cambios)?cambios:[]).slice(0,6).filter(c=>c&&c.accion);
    if(!lista.length) return { error:"No llegaron cambios que proponer." };
    return { propuestas:lista, nota:"Se le mostraron al usuario con casillas para que elija cuáles aplicar. No están guardados todavía." };
  };
  /* Traduce los nombres de la ficha que usa la IA a los campos internos. */
  const asCamposAProp=(campos)=>{
    const m={ nombre:"name", direccion:"address", comuna:"comuna", region:"region", tipo:"type",
      rolSII:"rolSII", rol:"rolSII", avaluoFiscal:"avaluoFiscal", tasacion:"tasacion",
      dormitorios:"bedrooms", banos:"bathrooms", estacionamientos:"parking", bodega:"bodega",
      superficieConstruida:"surfaceBuilt", superficieTerreno:"surfaceTerrain",
      anoConstruccion:"constructionYear", inscripcion:"inscripcion", orientacion:"orientation",
      piso:"floor", estado:"condition", arrendatario:"tenant" };
    const out={};
    Object.keys(campos||{}).forEach(k=>{
      const destino=m[k]||(Object.prototype.hasOwnProperty.call(blank,k)?k:null);
      const v=campos[k];
      if(destino && v!==undefined && v!==null && String(v).trim()!=="") out[destino]=v;
    });
    return out;
  };
  const aplicarPropuesta=(c,i)=>{
    if(c.accion==="actualizar_propiedad"){
      const p=props.find(x=>String(x.id)===String(c.propiedad_id));
      const campos=asCamposAProp(c.campos);
      if(!p||!Object.keys(campos).length) return false;
      patchProp(p.id, x=>({...x, ...campos}));
      return true;
    }
    if(c.accion==="crear_propiedad"){
      const campos=asCamposAProp(c.campos);
      if(!Object.keys(campos).length) return false;
      const nueva={...blank, id:Date.now()+i, use:"arriendo", status:"pendiente", rentedNow:!!campos.tenant,
        gastosExtra:SEED_GASTOS(), ...campos};
      if(!nueva.name) nueva.name = campos.address || ("Propiedad "+todayISO());
      setProps(l=>[...l,nueva]);
      return true;
    }
    // Gastos, bitácora e incidencias reutilizan el mismo camino que el lector.
    return aplicarSugerencia({ accion:c.accion, propiedadId:c.propiedad_id, titulo:c.titulo,
      detalle:c.detalle, monto:c.monto, periodo:c.periodo }, "as"+i);
  };
  const aplicarPropuestas=(lista)=>{
    if(!lista.length){ notify("Marca al menos un cambio",true); return; }
    let hechos=0, fallidos=0;
    lista.forEach((c,i)=>{ if(aplicarPropuesta(c,i)) hechos++; else fallidos++; });
    if(!hechos){ notify("No pude aplicar los cambios: falta indicar la propiedad o los datos",true); return; }
    notify(hechos===1?"Cambio aplicado":(hechos+" cambios aplicados")+(fallidos?" ("+fallidos+" quedaron pendientes)":""));
  };

  const asEjecutar=(nombre,input)=>{
    const i=input||{};
    try{
      if(nombre==="buscar_propiedades"){
        const r=asBuscar(props,i); asMetrica("busquedas");
        (r.resultados||[]).forEach(f=>asMetrica(null,f.id));
        return r;
      }
      if(nombre==="ver_propiedad"){
        const p=props.find(x=>String(x.id)===String(i.id));
        if(!p) return { error:"No encontré esa propiedad en el catálogo." };
        asMetrica(null,String(p.id));
        return { propiedad: asFicha(p, p.use==="arriendo"?"arriendo":"venta") };
      }
      if(nombre==="propiedades_similares"){ const r=asSimilares(props,i.id,!!i.mas_barata); asMetrica("busquedas"); return r; }
      if(nombre==="comparar_propiedades") return asComparar(props,i.ids);
      if(nombre==="calcular_costos") return asCostos(props,i.id,i.monto_arriendo);
      if(nombre==="registrar_lead") return asGuardarLead(i);
      if(nombre==="agendar_visita") return asAgendar(i);
      if(nombre==="explicar_concepto") return asExplicar(i.termino);
      if(nombre==="consultar_sii") return asDatosSII(i);
      if(nombre==="proponer_cambios") return asRecibirPropuestas(i.cambios);
      if(nombre==="derivar_asesor") return asDerivar(i.motivo||"Solicitud del usuario");
      return { error:"Herramienta desconocida: "+nombre };
    }catch(e){ return { error:"No pude ejecutar esa acción: "+((e&&e.message)||"error") }; }
  };

  /* ---- Hablarle al asesor ----
     Usa el reconocimiento de voz del navegador (el mismo del dictado del
     teclado). En iPhone y Android funciona en Safari y Chrome; si el navegador
     no lo trae, el micrófono simplemente no aparece. Al terminar de hablar, el
     texto queda escrito y se envía solo. */
  const vozRef=useRef(null);
  const [oyendo,setOyendo]=useState(false);
  const hayVoz = typeof window!=="undefined" && !!(window.SpeechRecognition||window.webkitSpeechRecognition);
  const detenerVoz=()=>{ try{ vozRef.current&&vozRef.current.stop(); }catch(_e){} setOyendo(false); };
  const escuchar=()=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ notify("Este navegador no permite dictar por voz",true); return; }
    try{
      const rec=new SR();
      rec.lang="es-CL"; rec.interimResults=true; rec.continuous=false; rec.maxAlternatives=1;
      let final="";
      rec.onresult=(ev)=>{
        let parcial="";
        for(let i=ev.resultIndex;i<ev.results.length;i++){
          const t=ev.results[i][0].transcript;
          if(ev.results[i].isFinal) final+=t; else parcial+=t;
        }
        setAsIn((final+" "+parcial).trim());
      };
      rec.onerror=(ev)=>{ setOyendo(false);
        notify(ev&&ev.error==="not-allowed"
          ? "Tienes que permitir el micrófono para hablarle al asesor"
          : "No pude escucharte, inténtalo de nuevo", true); };
      rec.onend=()=>{
        setOyendo(false);
        const dicho=final.trim();
        if(dicho){ setAsIn(dicho); setTimeout(()=>asEnviar(dicho),120); }
      };
      vozRef.current=rec; setOyendo(true); setAsOpen(true); rec.start();
    }catch(e){ setOyendo(false); notify("No se pudo iniciar el micrófono",true); }
  };

  /* Bucle de conversación: el modelo puede pedir varias herramientas seguidas
     (buscar, luego comparar, luego registrar) antes de dar su respuesta final. */
  const asEnviar=async(textoUsuario)=>{
    const q=String(textoUsuario||"").trim();
    const adj=asAdj;
    if((!q&&!adj.length)||asBusy) return;
    setAsIn(""); setAsAdj([]); setAsBusy(true); asMetrica("consultas");
    const texto=q||"Revisa los archivos que te adjunto y dime qué son.";
    setAsChat(c=>[...c,{r:"user",c:texto+(adj.length?"\n📎 "+adj.map(f=>f.name).join(", "):"")}]);
    // Los adjuntos van en el primer turno: imágenes y PDF nativos, el resto como
    // texto ya extraído en el navegador.
    const contenido = adj.length
      ? [...adj.map(f=>f.texto
          ? { type:"text", text:'--- Contenido de "'+f.name+'" ---\n'+f.texto }
          : (f.media==="application/pdf"
              ? { type:"document", source:{ type:"base64", media_type:"application/pdf", data:f.b64 } }
              : { type:"image", source:{ type:"base64", media_type:f.media, data:f.b64 } })),
         { type:"text", text:texto }]
      : texto;
    let msgs=[...asSanearHistorial(asMsgs),{role:"user",content:contenido}];
    const l=asLeadActual();
    const contexto=asResumenCatalogo(props,uf,asEmpresa(),asContacto(),
      l?(l.nombre+(l.telefono?" · "+l.telefono:"")+(l.email?" · "+l.email:"")):null);
    try{
      for(let paso=0; paso<6; paso++){
        const r=await api("/api/asesor",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({messages:msgs,contexto})});
        const d=await r.json().catch(()=>null);
        if(!r.ok){
          const agotado=r.status===504||r.status===502||r.status===408;
          setAsChat(c=>[...c,{r:"ai",err:true,c:(d&&d.error)?d.error
            :(agotado?"Se me alargó la búsqueda y no alcancé a responder 😅 Pídemelo otra vez acotando la comuna o el presupuesto y lo reviso al tiro."
                    :("No pude responder (error "+r.status+")."))}]);
          break;
        }
        // Los resultados de internet vienen cifrados y modificarlos hace fallar
        // la siguiente llamada, así que solo sacamos las llamadas que quedaron
        // sin su resultado (una búsqueda cortada envenena todo el historial).
        const bloques=asSanearBloques(d.content||[]);
        if(!bloques.length){
          setAsChat(c=>[...c,{r:"ai",err:true,c:"La búsqueda quedó a medias. Vuelve a pedírmela, si puede ser más acotada, y la retomo."}]);
          break;
        }
        msgs=[...msgs,{role:"assistant",content:bloques}];
        const usos=bloques.filter(b=>b.type==="tool_use");
        const textos=bloques.filter(b=>b.type==="text");
        const dicho=textos.map(b=>b.text).join("\n").trim();
        // Al mostrar información sacada de internet hay que citar la fuente.
        const fuentes=[];
        textos.forEach(b=>(b.citations||[]).forEach(ci=>{
          if(ci&&ci.url&&!fuentes.some(f=>f.url===ci.url)) fuentes.push({url:ci.url,titulo:ci.title||ci.url});
        }));
        // Avisamos cuando está mirando internet, para que no parezca congelado.
        bloques.filter(b=>b.type==="server_tool_use"&&b.name==="web_search")
          .map(b=>(b.input&&b.input.query)||"").filter(Boolean)
          .forEach(q=>setAsChat(c=>[...c,{r:"ai",buscando:q}]));
        if(dicho||fuentes.length) setAsChat(c=>[...c,{r:"ai",c:dicho,fuentes:fuentes.length?fuentes:null}]);
        // Una búsqueda larga pausa el turno: se continúa reenviando la respuesta
        // tal cual, sin agregar un mensaje nuevo del usuario.
        if(d.stop_reason==="pause_turn"){ setAsMsgs(msgs); continue; }
        if(!usos.length){ setAsMsgs(msgs); break; }
        const resultados=usos.map(u=>{
          const salida=asEjecutar(u.name,u.input);
          // Lo que se puede mostrar visualmente se dibuja como tarjeta o tabla.
          if(salida&&salida.resultados&&salida.resultados.length) setAsChat(c=>[...c,{r:"ai",fichas:salida.resultados}]);
          else if(salida&&salida.propiedad) setAsChat(c=>[...c,{r:"ai",fichas:[salida.propiedad]}]);
          else if(salida&&salida.comparacion) setAsChat(c=>[...c,{r:"ai",comparacion:salida.comparacion}]);
          else if(salida&&salida.propuestas) setAsChat(c=>[...c,{r:"ai",propuestas:salida.propuestas}]);
          else if(salida&&salida.whatsapp!==undefined) setAsChat(c=>[...c,{r:"ai",derivacion:salida}]);
          return { type:"tool_result", tool_use_id:u.id, content:JSON.stringify(salida).slice(0,12000) };
        });
        msgs=[...msgs,{role:"user",content:resultados}];
        setAsMsgs(msgs);
      }
    }catch(e){
      setAsChat(c=>[...c,{r:"ai",c:"No pude conectar con el asesor ("+((e&&e.message)||"error de red")+"). Revisa tu conexión.",err:true}]);
    }
    setAsBusy(false);
  };

  const asReiniciar=()=>{ setAsChat([]); setAsMsgs([]); setAsLeadId(""); asLeadRef.current=""; };

  const runQuickCmd=(cmd)=>{ setAi(a=>[...a,{r:"user",c:cmd.label.replace(/^[^ ]+ /,"")},{r:"ai",c:cmd.run()}]); };

  /* ================== LECTOR DE DOCUMENTOS CON IA ================== */
  /* Combina las lecturas de varios archivos en un solo resultado. Los primeros
     archivos mandan: los siguientes solo rellenan lo que quedó vacío. */
  const fusionarLecturas=(partes)=>{
    const datos={}, resumenes=[], sugerencias=[];
    partes.forEach(({nombre,j})=>{
      if(j.text) resumenes.push((partes.length>1?"• "+nombre+": ":"")+j.text);
      const d=j.datos||{};
      Object.keys(d).forEach(k=>{
        if(k==="sugerencias"){ (d[k]||[]).forEach(s=>sugerencias.push({...s, _archivoNombre:nombre})); return; }
        const v=d[k];
        if(v&&typeof v==="object"&&!Array.isArray(v)){
          datos[k]=datos[k]||{};
          Object.keys(v).forEach(kk=>{
            const val=v[kk];
            const vacio = datos[k][kk]===undefined||datos[k][kk]===null||String(datos[k][kk]).trim()===""||datos[k][kk]===0;
            if(vacio && val!==undefined && val!==null && String(val).trim()!=="") datos[k][kk]=val;
          });
        } else if(datos[k]===undefined||datos[k]===null||String(datos[k]||"").trim()===""){
          datos[k]=v;
        }
      });
    });
    if(sugerencias.length) datos.sugerencias=sugerencias.slice(0,6);
    return { text:resumenes.join("\n\n"), datos };
  };

  /* Lo que hay ahora en el formulario abierto: le sirve a la IA para corregir
     o completar cuando la instrucción viene sin archivo ("la comuna es Vicuña,

  const formActual=()=>{
    const d=(mEdit&&eP)?eP:nP; if(!d) return null;
    const campos=["name","address","comuna","region","type","use","rolSII","inscripcion","avaluoFiscal","tasacion",
      "surfaceBuilt","surfaceTerrain","bedrooms","bathrooms","parking","bodega","constructionYear","tenant","rentUF"];
    const out={}; campos.forEach(k=>{ if(d[k]!==undefined&&d[k]!==""&&d[k]!==null) out[k]=d[k]; });
    return out;
  };

  const analizarDocs=async()=>{
    const soloOrden=!aiDocs.length;
    if(soloOrden && !String(aiOrden||"").trim()){
      notify("Adjunta un archivo o escríbele a la IA qué quieres que haga",true); return;
    }
    setAiDocBusy(true); setAiDocRes(null);
    const hint=props.map(p=>({id:p.id,nombre:p.name,direccion:[p.address,p.comuna].filter(Boolean).join(", ")}));
    // Sin archivos: una sola llamada con la instrucción, el formulario actual y
    // el contexto de la cartera (para poder responder preguntas con datos reales).
    if(soloOrden){
      setAiDocPaso("Pensando…");
      try{
        const r=await api("/api/asistente",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({mode:"extraer", instruccion:aiOrden, propiedades:hint, formulario:formActual(), contexto:ctxIA(), files:[]})});
        const j=await r.json().catch(()=>({}));
        if(!r.ok||j.error) throw new Error(j.error||("HTTP "+r.status));
        setAiDocRes(j);
        const co=j.datos&&j.datos.coincidenciaId;
        setAiDocDest(co&&props.some(p=>String(p.id)===String(co))?String(co):"nueva");
      }catch(e){ notify("No pude procesar la instrucción: "+((e&&e.message)||"error"),true); }
      setAiDocPaso(""); setAiDocBusy(false); return;
    }
    const partes=[], fallidos=[];
    // De a un archivo por llamada: las funciones de Netlify se cortan a los ~10
    // segundos y varios PDF juntos no alcanzan a procesarse (error 504).
    for(let i=0;i<aiDocs.length;i++){
      const f=aiDocs[i];
      setAiDocPaso(aiDocs.length>1?("Leyendo "+(i+1)+" de "+aiDocs.length+"…"):"Leyendo…");
      try{
        // Word/Excel viajan como texto ya extraído; fotos y PDF como adjunto nativo.
        const cuerpo={ mode:"extraer", instruccion:aiOrden, propiedades:hint, contexto:ctxIA(),
          files:[ f.texto?({name:f.name,texto:f.texto}):({media_type:f.media,data:f.b64,name:f.name}) ] };
        const r=await api("/api/asistente",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(cuerpo)});
        const j=await r.json().catch(()=>({}));
        if(r.status===504||r.status===502&&!j.error) throw new Error("tardó demasiado");
        if(!r.ok||j.error) throw new Error(j.error||("HTTP "+r.status));
        partes.push({nombre:f.name,j});
      }catch(e){ fallidos.push({nombre:f.name,motivo:(e&&e.message)||"error"}); }
    }
    setAiDocPaso("");
    if(partes.length){
      const j=fusionarLecturas(partes);
      setAiDocRes(j);
      const co=j.datos&&j.datos.coincidenciaId;
      setAiDocDest(co&&props.some(p=>String(p.id)===String(co))?String(co):"nueva");
      if(fallidos.length) notify("No pude leer: "+fallidos.map(x=>x.nombre).join(", "),true);
    } else {
      const t=fallidos[0]&&fallidos[0].motivo||"error";
      notify(/demasiado|504|timeout/i.test(t)
        ? "El documento es muy pesado y la lectura se agotó. Prueba con un archivo más liviano, o súbelo por partes."
        : ("No se pudo analizar el documento: "+t), true);
    }
    setAiDocBusy(false); };
  /* Traduce lo que leyó la IA a los campos de una propiedad. Se usa tanto para
     crear la propiedad de una vez como para rellenar el formulario abierto. */
  const datosACampos=()=>{ const d=(aiDocRes&&aiDocRes.datos)||{}; const P=d.propiedad||{}, A=d.arriendo||{}, T=d.arrendatario||{}, G=d.garantia||{};
    const pon=(o,k,v)=>{ if(v!==undefined&&v!==null&&String(v).trim()!==""){ o[k]=v; } };
    const c={};
    pon(c,"name",P.nombre); pon(c,"address",P.direccion); pon(c,"comuna",P.comuna); pon(c,"region",P.region);
    if(P.tipo){ const t=String(P.tipo).toLowerCase(); c.type = t.includes("depart")?"Departamento" : t.includes("casa")?"Casa" : t.includes("parcela")||t.includes("terreno")?"Terreno" : t.includes("local")||t.includes("oficina")||t.includes("bodega")?"Comercial" : "Otro"; if(c.type==="Otro") c.typeOtro=P.tipo; }
    pon(c,"rolSII",P.rolSII); pon(c,"inscripcion",P.inscripcion); pon(c,"surfaceBuilt",P.superficieConstruida); pon(c,"surfaceTerrain",P.superficieTerreno);
    pon(c,"bedrooms",P.dormitorios); pon(c,"bathrooms",P.banos); pon(c,"parking",P.estacionamientos); pon(c,"bodega",P.bodega); pon(c,"constructionYear",P.anoConstruccion); pon(c,"avaluoFiscal",P.avaluoFiscal);
    pon(c,"tenant",T.nombre); pon(c,"tenantRut",T.rut); pon(c,"tenantEmail",T.email); pon(c,"tenantPhone",T.telefono);
    const rUF=num(A.rentaUF), rCLP=num(A.rentaCLP)||(rUF>0?Math.round(rUF*uf):0);
    if(rUF>0){ c.rentUF=rUF; c.adjustment="UF"; } if(rCLP>0) c.rent=rCLP;
    if(num(A.diaPago)>0) c.dueDay=num(A.diaPago); if(num(A.multaPct)>0) c.penalty=num(A.multaPct);
    pon(c,"contractStart",A.fechaInicio); pon(c,"contractEnd",A.fechaTermino);
    const g={}; const gM=num(G.montoCLP)||(num(G.montoUF)>0?Math.round(num(G.montoUF)*uf):0);
    if(gM>0) g.monto=gM; if(G.fecha) g.fechaRecibida=G.fecha;
    return { c, g, nCampos:Object.keys(c).length+Object.keys(g).length };
  };

  /* Rellena el formulario de "Nueva propiedad" que está abierto, para que el
     usuario revise y corrija antes de guardar. */
  const rellenarFormNueva=()=>{
    const { c, g, nCampos }=datosACampos();
    if(!nCampos){ notify("Este documento no trae datos de propiedad. Mira las acciones que te propone la IA más abajo.",true); return; }
    setNP(prev=>({ ...prev, ...c, rentedNow: c.tenant?true:prev.rentedNow,
      garantia:{ ...(prev.garantia||blank.garantia), ...g } }));
    setAiDocRes(null); setAiDocs([]); setAiOrden("");
    notify(nCampos+" campos completados. Revísalos antes de guardar.");
  };

  /* Igual que la anterior, pero sobre la propiedad que se está editando: la IA
     corrige o completa lo que ya existe sin borrar el resto. */
  const rellenarFormEdicion=()=>{
    const { c, g, nCampos }=datosACampos();
    if(!nCampos){ notify("Este documento no trae datos de propiedad. Mira las acciones que te propone la IA más abajo.",true); return; }
    setEP(prev=>({ ...prev, ...c, garantia:{ ...(prev.garantia||blank.garantia), ...g } }));
    setAiDocRes(null); setAiDocs([]); setAiOrden("");
    notify(nCampos+" campos actualizados. Revísalos y guarda los cambios.");
  };

  /* El bloque del lector se usa igual en crear y en editar.
     Ojo: esto se INVOCA como función — lectorIA({...}) — y no como <LectorIA/>.
     Si se usara como componente, React lo trataría como un tipo nuevo en cada
     render del formulario y volvería a montar el cuadro de texto: en el celular

  const lectorIA=({ titulo, ayuda, onAplicar })=>(
    <div className="lector-ia">
      <div className="lector-t">✨ {titulo}</div>
      <div className="lector-d">{ayuda}</div>
      <textarea className="input lector-orden" value={aiOrden} onChange={e=>setAiOrden(e.target.value)}
        placeholder="Escríbele con o sin archivo: pídele algo (“la dirección correcta es Av. Balmaceda 480, Vicuña”) o pregúntale (“¿cuánto es la UF hoy?”, “¿cuándo se pagan las contribuciones?”)." />
      <div className="lector-btns">
        <label className="btn btn-out" style={{cursor:"pointer"}}>
          {aiDocs.length?("Agregar más ("+aiDocs.length+")"):"Elegir archivos"}
          <input type="file" multiple style={{display:"none"}}
            accept="image/*,.pdf,.docx,.xlsx,.xlsm,.txt,.csv,.md,.json,.xml,.html,.rtf"
            onChange={async e=>{ const fs=[...e.target.files]; e.target.value="";
              const ok=[]; for(const f of fs){ try{ ok.push(await leerArchivoParaIA(f)); }catch(err){ notify(err.message,true); } }
              if(ok.length) setAiDocs(d=>[...d,...ok]); }}/>
        </label>
        <button className="btn btn-red" disabled={aiDocBusy||(!aiDocs.length&&!String(aiOrden||"").trim())} onClick={analizarDocs}>
          {aiDocBusy?(aiDocPaso||"Leyendo…"):(aiDocs.length?"Leer y completar":"Pedirle a la IA")}</button>
        {aiDocs.length>0&&<button className="btn btn-out btn-sm" onClick={()=>{setAiDocs([]);setAiDocRes(null);}}>Limpiar</button>}
      </div>
      {aiDocs.length>0&&<div className="lector-files">{aiDocs.map((f,i)=>(<span key={i} className="lector-chip">{f.texto?"📄":"🖼"} {f.name}<button onClick={()=>setAiDocs(d=>d.filter((_,j)=>j!==i))} aria-label="Quitar">×</button></span>))}</div>}
      {aiDocRes&&<div className="lector-res">
        <div className="lector-resumen">{aiDocRes.text||"Documento leído."}</div>
        {aiDocRes.datos&&datosACampos().nCampos>0&&<button className="btn btn-red" style={{width:"100%",marginTop:10}} onClick={onAplicar}>Aplicar estos datos al formulario</button>}
        <Sugerencias res={aiDocRes} props={props} onEjecutar={ejecutarSugerencias}/>
      </div>}
    </div>
  );

  /* Ejecuta una de las acciones que propuso la IA cuando el documento no
     encaja en los campos de una propiedad (una declaración de impuestos, una
     boleta, un certificado). Así el usuario nunca queda sin salida. */
  /* Aplica una acción sin avisar ni limpiar: así se pueden encadenar varias y
     dar un solo aviso al final. Devuelve si alcanzó a hacer algo. */
  /* Sube a la plataforma un archivo que ya se leyó con la IA (aiDocs, en base64
     en memoria) para dejarlo adjunto en el registro que crea la sugerencia,
     sin que el usuario tenga que volver a buscarlo y subirlo a mano. */
  const subirAiDocComoAdjunto=async(nombreArchivo)=>{
    const f=nombreArchivo && aiDocs.find(x=>x.name===nombreArchivo);
    if(!f||!f.b64) return null;
    try{
      const dataUrl=`data:${f.media||"application/octet-stream"};base64,${f.b64}`;
      const r=await fetch("/api/archivo/subir",{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({dataUrl,name:f.name}) });
      if(!r.ok) return null;
      const j=await r.json();
      return { url:j.url, name:j.name||f.name, contentType:j.contentType||f.media };
    }catch(e){ return null; }
  };
  const aplicarSugerencia=(s,i)=>{
    const pid=s.propiedadId&&props.some(p=>String(p.id)===String(s.propiedadId))?s.propiedadId:null;
    const titulo=s.titulo||"Documento leído con IA";
    const detalle=s.detalle||s.porque||"";
    // El sufijo evita que dos acciones creadas en el mismo milisegundo choquen.
    const uid=Date.now().toString(36)+"-"+i;
    if(s.accion==="gasto"){
      if(!pid) return false;
      patchProp(pid, x=>({...x, gastosExtra:[...(x.gastosExtra||[]),
        { id:"g"+uid, concepto:titulo, monto:String(Math.round(num(s.monto))||""), periodo: s.periodo==="año"?"año":"mes" }]}));
      return true;
    }
    if(s.accion==="incidencia"){
      if(!pid) return false;
      patchProp(pid, x=>({...x, incidencias:[{ id:"inc-"+uid, fecha:todayISO(), titulo,
        descripcion:detalle, prioridad:"Media", categoria:"Mantención", adjuntos:[] }, ...(x.incidencias||[])]}));
      return true;
    }
    if(s.accion==="bitacora"){
      // Sin propiedad indicada, la nota va a la primera: es preferible a perderla.
      const destino = pid || (props[0]&&props[0].id);
      if(!destino) return false;
      patchProp(destino, x=>({...x, bitacora:[{ id:"bit-"+uid, fecha:todayISO(),
        tipo:"Nota", titulo, texto:detalle, adjuntos:[] }, ...(x.bitacora||[])]}));
      return true;
    }
    if(s.accion==="recep_presupuesto"){
      if(!pid) return false;
      const rid="rp-"+uid;
      patchProp(pid, x=>({...x, recepPresupuestos:[{ id:rid, contratista:s.contratista||"", trabajo:titulo,
        monto:num(s.monto)?String(Math.round(num(s.monto))):"", moneda:s.moneda==="UF"?"UF":"CLP", fecha:todayISO(),
        estado:"Por revisar", nota:detalle, adjuntos:[] }, ...(x.recepPresupuestos||[])]}));
      if(s._archivoNombre) subirAiDocComoAdjunto(s._archivoNombre).then(adj=>{ if(!adj) return;
        patchProp(pid, x=>({...x, recepPresupuestos:(x.recepPresupuestos||[]).map(d=>d.id===rid?{...d,adjuntos:[...(d.adjuntos||[]),adj]}:d)})); });
      return true;
    }
    if(s.accion==="recep_doc"){
      if(!pid) return false;
      const rid="rd-"+uid, nombreDoc=titulo.trim().toLowerCase();
      patchProp(pid, x=>{
        const list=x.recepDocs||[];
        const ix=list.findIndex(d=>(d.nombre||"").trim().toLowerCase()===nombreDoc);
        if(ix>=0){ const copia=list.slice(); copia[ix]={...copia[ix], estado:"Listo", nota:copia[ix].nota||detalle}; return {...x, recepDocs:copia}; }
        return {...x, recepDocs:[...list,{ id:rid, nombre:titulo, estado:"Listo", nota:detalle, adjuntos:[] }]};
      });
      if(s._archivoNombre) subirAiDocComoAdjunto(s._archivoNombre).then(adj=>{ if(!adj) return;
        patchProp(pid, x=>({...x, recepDocs:(x.recepDocs||[]).map(d=>(d.id===rid||(d.nombre||"").trim().toLowerCase()===nombreDoc)?{...d,adjuntos:[...(d.adjuntos||[]),adj]}:d)})); });
      return true;
    }
    return false;
  };

  /* Ejecuta de una vez todas las acciones que el usuario dejó marcadas. */
  const ejecutarSugerencias=(lista)=>{
    if(!lista.length){ notify("Marca al menos una acción",true); return; }
    let hechas=0, sinPropiedad=0;
    lista.forEach((s,i)=>{ if(aplicarSugerencia(s,i)) hechas++; else sinPropiedad++; });
    if(!hechas){ notify("No se pudo realizar ninguna acción: falta indicar la propiedad",true); return; }
    notify(hechas===1 ? "Acción realizada" : (hechas+" acciones realizadas")
      + (sinPropiedad?" ("+sinPropiedad+" sin propiedad asociada)":""));
    setAiDocRes(null); setAiDocs([]); setAiOrden("");
  };

  const aplicarDatos=()=>{
    const { c, g, nCampos }=datosACampos();
    if(!nCampos){ notify("Este documento no trae datos de propiedad. Mira las acciones que te propone la IA más abajo.",true); return; }
    if(aiDocDest==="nueva"){
      const nueva={...blank, id:Date.now(), use:"arriendo", status:"pendiente", rentedNow:!!c.tenant, gastosExtra:SEED_GASTOS(), ...c, garantia:{...blank.garantia,...g}};
      if(!nueva.name) nueva.name = c.address || ("Propiedad "+todayISO());
      setProps(ps=>[...ps,nueva]); setTab("props");
      notify("Propiedad creada con "+nCampos+" campos leídos del documento");
    } else {
      patchProp(aiDocDest, x=>({ ...x, ...c, garantia:{...(x.garantia||blank.garantia), ...g} }));
      notify(nCampos+" campos ingresados en la propiedad");
    }
    setAiDocRes(null); setAiDocs([]); };

  /* ================== INFORMES PROFESIONALES (por propiedad y general) ================== */
  const abrirImprimir=(html)=>{ const w=window.open("","_blank"); if(!w){ notify("Permite ventanas emergentes para ver el PDF",true); return; } w.document.write(html); w.document.close(); setTimeout(()=>{ try{ w.focus(); w.print(); }catch(e){} },700); };
  const docPro=(titulo,subtitulo,bodyHtml)=>`<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>${esc(titulo)}</title><style>

  </style></head><body>
  <div class="band"><div class="brand">ARRIENDOPRO · ADMINISTRACIÓN DE PROPIEDADES</div><h1>${esc(titulo)}</h1><div class="sub">${esc(subtitulo)}</div></div>
  <div class="wrap">${bodyHtml}
  <div class="foot"><span>Preparado por ${esc(owner.name||"la administración")}${owner.email?" · "+esc(owner.email):""}</span><span>ArriendoPro · ${esc(todayISO())}</span></div>
  </div></body></html>`;
  const filaDL=(pares)=>`<table class="dl">${pares.filter(x=>x&&String(x[1]||"").trim()!=="").map(x=>`<tr><td>${esc(x[0])}</td><td><b>${esc(x[1])}</b></td></tr>`).join("")}</table>`;
  const kpiBox=(l,v,cls)=>`<div class="kpi"><div class="l">${esc(l)}</div><div class="v ${cls||""}">${esc(v)}</div></div>`;

  const informePropHTML=(p)=>{
    const soc=socById(p.sociedad)||{}; const uMes=utilidadMes(p,uf); const uAno=utilidadAnual(p,uf);
    const yieldNeto = num(p.tasacion)>0 ? (uAno/num(p.tasacion)*100) : null;
    const yieldBruto = num(p.tasacion)>0 && p.use==="arriendo" ? (num(p.rent)*12/num(p.tasacion)*100) : null;
    const gastos=(p.gastosExtra||[]); const ingExtra=(p.ingresosExtra||[]);
    const pagos=(p.histPagos||[]).slice(0,14);
    const inc=(p.incidencias||[]);
    const seg=(p.seguros||[]);
    const eq=p.tenantEquifax||{}; const ic=p.tenantInfocheck||{};
    const deudaUF = p.hasMortgage ? divPorPagar(p)*num(p.dividendoUF) : 0;
    return docPro("Informe de propiedad — "+(p.name||""),
      `${[p.address,p.comuna].filter(Boolean).join(", ")||"Sin dirección registrada"} · Generado el ${todayISO()} · 1 UF = ${CLP(uf)}`,
      `<h2>1 · Resumen ejecutivo</h2>
       <div class="kpis">
         ${kpiBox("Arriendo mensual", p.use==="arriendo" ? (num(p.rentUF)>0?UFf(p.rentUF)+" ≈ "+CLP(num(p.rent)):CLP(num(p.rent))) : "Uso personal")}
         ${kpiBox("Utilidad neta / mes", CLP(uMes), uMes>=0?"pos":"neg")}
         ${kpiBox("Utilidad proyectada / año", CLP(uAno), uAno>=0?"pos":"neg")}
         ${kpiBox("Estado de cobro", (ST[p.status]||{}).t||p.status||"—")}
         ${yieldNeto!=null?kpiBox("Rentabilidad neta anual", yieldNeto.toFixed(2).replace(".",",")+" %", yieldNeto>=0?"pos":"neg"):""}
         ${yieldBruto!=null?kpiBox("Rentabilidad bruta anual", yieldBruto.toFixed(2).replace(".",",")+" %"):""}
       </div>

  const informeGeneralHTML=()=>{

  const leerArchivoB64=(file)=>new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const s=String(r.result||""); const b64=s.split(",")[1]||""; const media=file.type||(/\.pdf$/i.test(file.name)?"application/pdf":"image/jpeg"); res({name:file.name,media,b64,size:file.size}); }; r.onerror=()=>rej(new Error("No se pudo leer "+file.name)); r.readAsDataURL(file); });

  /* ---------- Gastos editables por propiedad (utilidades) ---------- */
  const addGastoExtra=(pid, concepto="")=> patchProp(pid, x=>({...x, gastosExtra:[...(x.gastosExtra||[]), { id:"g"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), concepto, monto:"", periodo:"mes" }]}));
  const updGastoExtra=(pid, gid, campo, val)=> patchProp(pid, x=>({...x, gastosExtra:(x.gastosExtra||[]).map(g=>g.id===gid?{...g,[campo]:val}:g)}));
  const delGastoExtra=(pid, gid)=> patchProp(pid, x=>({...x, gastosExtra:(x.gastosExtra||[]).filter(g=>g.id!==gid)}));

  /* ---------- Ingresos editables por propiedad (además del arriendo) ---------- */
  const addIngresoExtra=(pid, concepto="")=> patchProp(pid, x=>({...x, ingresosExtra:[...(x.ingresosExtra||[]), { id:"i"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), concepto, monto:"", periodo:"mes" }]}));
  const updIngresoExtra=(pid, gid, campo, val)=> patchProp(pid, x=>({...x, ingresosExtra:(x.ingresosExtra||[]).map(g=>g.id===gid?{...g,[campo]:val}:g)}));
  const delIngresoExtra=(pid, gid)=> patchProp(pid, x=>({...x, ingresosExtra:(x.ingresosExtra||[]).filter(g=>g.id!==gid)}));

  /* ---------- Arriendo del mes editable (Cobros) ---------- */
  const setRentInline=(pid,val)=> patchProp(pid, x=>{ const r=parseInt(num(val))||0; return {...x, rent:r, rentUF: uf?Math.round(r/uf*100)/100:x.rentUF}; });

  /* ---------- Cuentas bancarias para transferencias (varias) ---------- */
  const addCuenta=()=> setCuentas(cs=>[...cs, {...blankCuenta, id:"c"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}]);
  const updCuenta=(cid,campo,val)=> setCuentas(cs=>cs.map(c=>c.id===cid?{...c,[campo]:val}:c));
  const delCuenta=(cid)=> setCuentas(cs=>cs.filter(c=>c.id!==cid));

  /* ---------- Plantillas de comunicación editables ---------- */
  const savePlantilla=(t)=> setPlantillas(ts=> ts.some(x=>x.id===t.id) ? ts.map(x=>x.id===t.id?t:x) : [...ts,t]);
  const addPlantilla=(t)=> setPlantillas(ts=>[...ts,t]);
  const delPlantilla=(id)=> setPlantillas(ts=>ts.filter(x=>x.id!==id));

  /* ---------- Cobro automático: canales, recordatorios, pasarelas, vouchers ---------- */
  const toggleCanal=(pid,cid)=> patchProp(pid, x=>({...x, canales:{...getCanales(x), [cid]:!getCanales(x)[cid]}}));
  const togglePasarela=(pid,gid)=> patchProp(pid, x=>{ const cur=getPasarelas(x); const next=cur.includes(gid)?cur.filter(g=>g!==gid):[...cur,gid]; return {...x, pasarelas:next}; });
  const setRecordatorio=(pid,patch)=> patchProp(pid, x=>({...x, recordatorios:{...getRecord(x), ...patch}}));
  const setDiaCobro=(pid,v)=> patchProp(pid, x=>({...x, diaCobro:parseInt(num(v))||1}));
  const setDiaVenc=(pid,v)=> patchProp(pid, x=>({...x, dueDay:parseInt(num(v))||1}));

  const generarVoucher=(pid)=>{
    patchProp(pid, x=>{
      const hoy=new Date(); let m=hoy.getMonth(), y=hoy.getFullYear();
      for(let i=0;i<24;i++){ const existe=(x.vouchers||[]).some(v=>v.mes===m&&v.anio===y); if(!existe) break; m++; if(m>11){m=0;y++;} }
      const vence=`${y}-${String(m+1).padStart(2,"0")}-${String(x.dueDay||5).padStart(2,"0")}`;
      const emite=`${y}-${String(m+1).padStart(2,"0")}-${String(x.diaCobro||1).padStart(2,"0")}`;
      const canales=getCanales(x); const canal=canales.correo?"correo":canales.whatsapp?"whatsapp":canales.sms?"sms":"correo";
      const nuevo={ id:Date.now(), mes:m, anio:y, monto:num(x.rent), emite, vence, estado:"pendiente", canal };
      return {...x, vouchers:[nuevo, ...(x.vouchers||[])]};
    });
    notify("Voucher generado");
  };
  const marcarVoucherPagado=(pid,vid,opts={})=>{
    const metodo = opts.metodo || "Transferencia";
    patchProp(pid, x=>{
      const v=(x.vouchers||[]).find(vv=>vv.id===vid);
      const pago={ fecha:todayISO(), monto:num(x.rent), metodo, concepto:"Arriendo "+(v?mesNombre(v.mes,v.anio):""), estado:"ok" };
      return {...x, status:"pagado", lastPaid:todayISO(), histPagos:[pago, ...(x.histPagos||[])], vouchers:(x.vouchers||[]).map(vv=>vv.id===vid?{...vv,estado:"pagado",pagadoEl:todayISO(),khipuEstado:vv.khipuPaymentId?"confirmado":vv.khipuEstado}:vv)};
    });
    if(!opts.silent) notify(opts.auto?"Khipu confirmó este pago — voucher actualizado automáticamente":"✓ Voucher marcado como pagado y registrado en el historial");
  };
  const borrarVoucher=(pid,vid)=> patchProp(pid, x=>({...x, vouchers:(x.vouchers||[]).filter(v=>v.id!==vid)}));

  /* ---------- Khipu: cobro real vía transferencia bancaria automatizada ---------- */
  const [khipuLoading,setKhipuLoading]=useState(null); // id del voucher en proceso
  const [khipuTest,setKhipuTest]=useState(null), [khipuTestLoading,setKhipuTestLoading]=useState(false);
  const probarKhipu=async()=>{
    setKhipuTestLoading(true); setKhipuTest(null);
    try{
      const r=await fetch("/api/khipu/consultar?check=1"); const j=await r.json();
      setKhipuTest(j&&j.ok?{ok:true}:{ok:false,msg:(j&&j.error)||"No se pudo validar la clave"});
    }catch(e){ setKhipuTest({ok:false,msg:"No se pudo contactar la función de Khipu"}); }
    setKhipuTestLoading(false);
  };
  const pagarConKhipu=async(pid,vid)=>{
    const prop=props.find(x=>x.id===pid); const v=prop&&(prop.vouchers||[]).find(vv=>vv.id===vid);
    if(!prop||!v) return;
    if(v.khipuPaymentUrl){ window.open(v.khipuPaymentUrl,"_blank"); return; }
    setKhipuLoading(vid);
    try{
      const tx=`v${pid}_${vid}`;
      const r=await fetch("/api/khipu/crear-pago",{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({
        transaction_id:tx, amount:Math.round(num(v.monto)), subject:`Arriendo ${mesNombre(v.mes,v.anio)} — ${prop.name}`,
        body:prop.address||prop.name, payer_email:prop.tenantEmail||undefined
      })});
      const j=await r.json();
      if(!r.ok||!j.payment_url) throw new Error(j.error||"No se pudo generar el cobro en Khipu");
      patchProp(pid, x=>({...x, vouchers:(x.vouchers||[]).map(vv=>vv.id===vid?{...vv,khipuPaymentId:j.payment_id,khipuPaymentUrl:j.payment_url,khipuTx:tx,khipuEstado:"esperando"}:vv)}));
      notify("Cobro Khipu generado — se abrió el link de pago");
      window.open(j.payment_url,"_blank");
    }catch(e){ notify(""+(e.message||"No se pudo generar el cobro con Khipu"), true); }
    finally{ setKhipuLoading(null); }
  };

  // Cobro Khipu directo del arriendo del mes desde "Registrar pago". Se crea el
  // cobro real, se abre el link y queda pendiente; el chequeo en segundo plano lo
  // marca pagado automáticamente cuando Khipu confirma la transferencia.
  const pagarPropConKhipu=async(p)=>{
    if(!p) return;
    if(p.khipuPendiente && p.khipuPendiente.paymentUrl){ window.open(p.khipuPendiente.paymentUrl,"_blank"); return; }
    setKhipuLoading("pay"+p.id);
    try{
      const monto=Math.round(montoCobro(p)+calcMulta(p));
      const tx=`p${p.id}_${Date.now().toString(36)}`;
      const r=await fetch("/api/khipu/crear-pago",{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({
        transaction_id:tx, amount:monto, subject:`Arriendo — ${p.name}`, body:p.address||p.name, payer_email:p.tenantEmail||undefined
      })});
      const j=await r.json();
      if(!r.ok||!j.payment_url) throw new Error(j.error||"No se pudo generar el cobro en Khipu");
      patchProp(p.id, x=>({...x, khipuPendiente:{paymentId:j.payment_id, paymentUrl:j.payment_url, tx, monto, creado:todayISO()}}));
      notify("Cobro Khipu generado — se abrió el link de pago. Se marcará pagado al confirmar.");
      window.open(j.payment_url,"_blank");
      setMPay(null); setPayStep(1);
    }catch(e){ notify(""+(e.message||"No se pudo generar el cobro con Khipu"), true); }
    finally{ setKhipuLoading(null); }
  };

  // Revisa en segundo plano los vouchers con cobro Khipu pendiente y los marca pagados solos cuando Khipu confirma (webhook).
  const propsRef=useRef(props); useEffect(()=>{ propsRef.current=props; },[props]);
  useEffect(()=>{
    const tick=async()=>{
      const pendientes=[]; const pendientesProp=[];
      (propsRef.current||[]).forEach(p=>{
        (p.vouchers||[]).forEach(v=>{ if(v.khipuPaymentId && v.estado!=="pagado") pendientes.push({pid:p.id,vid:v.id,tx:v.khipuTx,id:v.khipuPaymentId}); });
        if(p.khipuPendiente && p.khipuPendiente.paymentId && p.status!=="pagado") pendientesProp.push({pid:p.id, tx:p.khipuPendiente.tx, id:p.khipuPendiente.paymentId});
      });
      for(const it of pendientes){
        try{
          const r=await fetch(`/api/khipu/consultar?tx=${encodeURIComponent(it.tx)}&id=${encodeURIComponent(it.id)}`);
          const j=await r.json();
          if(j&&j.pagado) marcarVoucherPagado(it.pid,it.vid,{metodo:"Khipu",auto:true});
        }catch(e){ /* se reintenta en el próximo ciclo */ }
      }
      for(const it of pendientesProp){
        try{
          const r=await fetch(`/api/khipu/consultar?tx=${encodeURIComponent(it.tx||"")}&id=${encodeURIComponent(it.id)}`);
          const j=await r.json();
          if(j&&j.pagado){
            patchProp(it.pid, x=>{ const pago={fecha:todayISO(), monto:Math.round(montoCobro(x)+calcMulta(x)), metodo:"Khipu", concepto:"Arriendo "+new Date().toLocaleDateString("es-CL",{month:"long"}), estado:"ok"}; return {...x, status:"pagado", lastPaid:todayISO(), histPagos:[pago, ...(x.histPagos||[])], khipuPendiente:null}; });
            notify("Khipu confirmó el pago — arriendo marcado como pagado automáticamente");
          }
        }catch(e){ /* se reintenta en el próximo ciclo */ }
      }
    };
    const iv=setInterval(tick,40000);
    tick();
    return ()=>clearInterval(iv);
  },[]);

  /* ---------- Liquidación de garantía ---------- */
  const addDescuentoGarantia=(pid)=>{ if(!descForm.concepto.trim()||descForm.monto===""){ notify("Completa concepto y monto",true); return; }
    patchProp(pid, x=>({...x, garantia:{...x.garantia, descuentos:[...((x.garantia&&x.garantia.descuentos)||[]), {id:Date.now(),concepto:descForm.concepto,monto:parseInt(num(descForm.monto))}]}}));
    setDescForm({concepto:"",monto:""}); };
  const delDescuentoGarantia=(pid,did)=> patchProp(pid, x=>({...x, garantia:{...x.garantia, descuentos:((x.garantia&&x.garantia.descuentos)||[]).filter(d=>d.id!==did)}}));
  const generarLiquidacionTexto=(p)=>{ const desc=(p.garantia&&p.garantia.descuentos)||[]; const total=desc.reduce((a,d)=>a+num(d.monto),0); const saldo=num(p.garantia&&p.garantia.monto)-total;
    const lineas=desc.map(d=>` • ${d.concepto}: ${CLP(d.monto)}`).join("\n") || " • Sin descuentos";
    return `LIQUIDACIÓN DE GARANTÍA — ${p.name}\nArrendatario: ${p.tenant||"—"}\nGarantía recibida: ${CLP(p.garantia&&p.garantia.monto)}\nDescuentos:\n${lineas}\nTotal descuentos: ${CLP(total)}\nSALDO A DEVOLVER: ${CLP(saldo)}\nEstado: ${(p.garantia&&p.garantia.estado)||"—"}\nEmitido: ${new Date().toLocaleDateString("es-CL")} · ArriendoPro`; };
  const copiarLiquidacion=(p)=>{ const t=generarLiquidacionTexto(p); if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(()=>notify("Liquidación copiada")).catch(()=>notify("No se pudo copiar",true)); };
  /* La liquidación de garantía como documento formal: se ve e imprime (o se
     guarda como PDF) y también se descarga en Word para editarla. Es el papel
     que se le entrega al arrendatario cuando entrega la propiedad, y deja por
     escrito cuánto se le devuelve y por qué. */
  const liquidacionGarantiaHTML=(p)=>{
    const g=p.garantia||{}; const desc=g.descuentos||[];
    const total=desc.reduce((a,d)=>a+num(d.monto),0);
    const recibida=num(g.monto); const saldo=recibida-total;
    const soc=socById(p.sociedad);
    const filas = desc.length
      ? desc.map(d=>`<tr><td>${esc(d.concepto)}</td><td style="text-align:right">${esc(CLP(num(d.monto)))}</td></tr>`).join("")
        + `<tr class="tot"><td>Total descuentos</td><td style="text-align:right">${esc(CLP(total))}</td></tr>`
      : `<tr><td colspan="2" class="muted">Sin descuentos: la garantía se devuelve completa.</td></tr>`;
    return docPro("Liquidación de garantía", p.name+(p.address?" · "+p.address+(p.comuna?", "+p.comuna:""):""),
      `<div class="kpis">
         ${kpiBox("Garantía recibida",CLP(recibida))}
         ${kpiBox("Total descuentos",CLP(total),total>0?"neg":"")}
         ${kpiBox("Saldo a devolver",CLP(saldo),saldo>=0?"pos":"neg")}
       </div>
       <h2>1 · Antecedentes</h2>
       ${filaDL([
         ["Propiedad",p.name],["Dirección",[p.address,p.comuna].filter(Boolean).join(", ")],
         ["Arrendatario",p.tenant||"—"],["RUT arrendatario",p.tenantRut||""],
         ["Propietario",soc?soc.name:""],["RUT propietario",soc?soc.rut:""],
         ["Garantía recibida",CLP(recibida)],["Fecha en que se recibió",(g.fechaRecibida||g.fecha||"")],
         ["Estado",g.estado||"—"],["Notas",g.notas||""],
       ])}
       <h2>2 · Descuentos aplicados</h2>
       <table><thead><tr><th>Concepto</th><th style="text-align:right">Monto</th></tr></thead><tbody>${filas}</tbody></table>
       <div class="nota"><b>Qué es este documento.</b> La garantía es el dinero que el arrendatario entregó al firmar
       (en Chile, normalmente un mes de arriendo) y que queda guardado para responder por lo que pueda quedar pendiente
       al final: arriendos o cuentas impagas y daños que no sean por el uso normal. Al terminar el contrato se revisa la
       propiedad, se descuenta de la garantía lo que corresponda y se devuelve el resto. Eso es esta liquidación: el
       detalle, en un papel, de cuánto se recibió, cuánto se descuenta, por qué, y cuánto se devuelve.</div>
       <h2>3 · Resultado</h2>
       <p style="font-size:15px"><b>Saldo a devolver al arrendatario: ${esc(CLP(saldo))}</b>${saldo<0?" (los descuentos superan la garantía; la diferencia queda como deuda del arrendatario)":""}.</p>
       <p class="muted">La devolución se realiza por transferencia a la cuenta que indique el arrendatario, una vez
       entregada la propiedad y firmada esta liquidación por ambas partes.</p>
       <h2>4 · Firmas</h2>
       <table><tr><td style="height:70px">Arrendatario<br><span class="muted">${esc(p.tenant||"")}</span></td><td style="height:70px">Propietario o administrador<br><span class="muted">${esc(soc?soc.name:(owner.name||""))}</span></td></tr></table>`);
  };
  const verLiquidacionGarantia=(p)=>abrirImprimir(liquidacionGarantiaHTML(p));
  const descargarLiquidacionGarantiaWord=(p)=>descargarBlob(
    "Liquidacion-garantia-"+String(p.name||"propiedad").replace(/[^a-z0-9]+/gi,"-")+".doc",
    liquidacionGarantiaHTML(p), "application/msword");

  /* ---------- Compartir propiedad ---------- */
  const setCompartir=(pid,patch)=> patchProp(pid, x=>({...x, compartir:{...getCompartir(x), ...patch}}));
  const fichaLink=(p)=>{ const s=getCompartir(p); return s.publicId ? `${portalURL()}/p/${s.publicId}` : ""; };

  // Arma los datos públicos de la ficha (sin nombre, RUT ni contacto del arrendatario
  // o propietario), respetando lo que el usuario decidió mostrar.
  const buildFichaPublica=(p)=>{
    const s=getCompartir(p); const soc=socById(p.sociedad);
    const showInfo=s.mostrarInfo;
    return {
      name:p.name, use:p.use,
      address:showInfo?p.address:"", comuna:p.comuna, region:p.region, lat:p.lat, lng:p.lng,
      type:showInfo?tipoTxt(p):"", bedrooms:showInfo?p.bedrooms:"", bathrooms:showInfo?p.bathrooms:"",
      surfaceBuilt:showInfo?p.surfaceBuilt:"", surfaceTerrain:showInfo?p.surfaceTerrain:"",
      parking:showInfo?p.parking:"", bodega:showInfo?p.bodega:"", constructionYear:showInfo?p.constructionYear:"",
      mostrarInfo:s.mostrarInfo, mostrarValor:s.mostrarValor, mostrarDeudas:s.mostrarDeudas,
      rent:s.mostrarValor?num(p.rent):0, rentUF:s.mostrarValor?p.rentUF:"", gastoComun:s.mostrarDeudas?num(p.gastoComun):0,
      descripcion:s.descripcionPublica||"",
      fotos:(p.fotos||[]).map(f=>f.url), panoramas:(p.panoramas||[]).map(x=>({url:x.url,name:x.name||""})), virtualTour:p.virtualTour||"",
      sociedad:{ name:soc.name, telefono:soc.telefono, email:soc.email, whatsapp:soc.telefono }
    };
  };
  const publicarFicha=async(p)=>{
    setShareBusy(true);
    try{
      const publicId = getCompartir(p).publicId || (Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4));
      let r;
      try{
        r = await fetch("/api/ficha/publicar",{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({publicId, ficha:buildFichaPublica(p)}) });
      }catch(netErr){
        notify("El enlace público se genera en el sitio publicado (adminpropiedadescgvd.com), no en la vista previa.", true); return "";
      }
      const ct = (r.headers.get("content-type")||"").toLowerCase();
      if(r.status===404 || !ct.includes("application/json")){
        // En la vista previa /api no existe (devuelve HTML); en el sitio real, faltarían las funciones.
        notify("El enlace público se genera en el sitio publicado. Si ya estás en adminpropiedadescgvd.com y ves esto, revisa que la carpeta netlify/ esté subida al proyecto arriendosclaudia.", true); return "";
      }
      const j = await r.json().catch(()=>({}));
      if(!r.ok || !j.publicId){ throw new Error(j.error || ("Error "+r.status+" del servidor")); }
      setCompartir(p.id,{publicado:true, publicId:j.publicId});
      notify("Enlace público generado y actualizado");
      return j.url || `${portalURL()}/p/${j.publicId}`;
    }catch(e){ notify(e.message||"No se pudo generar el enlace", true); return ""; }
    finally{ setShareBusy(false); }
  };
  const compartirWhatsApp=async(p)=>{
    const url=await publicarFicha(p); if(!url) return;
    waEnviar("",`🏠 Mira esta propiedad: ${p.name}\n${url}`);
  };
  const verFichaPDF=async(p)=>{
    const url=await publicarFicha(p); if(!url) return;
    window.open(url+"?print=1","_blank","noopener");
  };
  const copiarFichaLink=async(p)=>{
    const url=await publicarFicha(p); if(!url) return;
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(()=>notify("Enlace copiado"));
  };

  /* ---------- Ficha de marketing (PDF/HTML) + compartir al instante, sin backend ---------- */
  const soloDigitos=(s)=>String(s||"").replace(/[^0-9]/g,"");
  const waNumero=(tel)=>{ let d=soloDigitos(tel); if(!d) return ""; if(d.length<=9) d="56"+d; return d; };
  const slugFicha=(s)=>String(s||"ficha").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]+/g,"_").replace(/^_+|_+$/g,"").slice(0,50)||"ficha";
  const fichaResumenTexto=(p)=>{ const s=getCompartir(p); const soc=socById(p.sociedad);
    const specs=[]; if(s.mostrarInfo!==false){ if(p.bedrooms)specs.push(p.bedrooms+" dorm."); if(p.bathrooms)specs.push(p.bathrooms+" baños"); if(p.surfaceBuilt)specs.push(p.surfaceBuilt+" m²"); if(p.parking&&num(p.parking))specs.push(p.parking+" estac."); }
    const precio = s.mostrarValor!==false ? ("Arriendo: "+CLP(p.rent)+(p.rentUF?(" ("+UFf(p.rentUF)+")"):"")+"/mes") : "";
    const link=fichaLink(p);
    return [ ""+p.name, ""+[p.comuna,p.region].filter(Boolean).join(", "), specs.length?(""+specs.join(" · ")):"", precio, (s.descripcionPublica&&s.descripcionPublica.trim())?("\n"+s.descripcionPublica.trim()):"", "\n"+(soc.name||"")+(soc.telefono?(" · "+soc.telefono):""), link?("\n"+link):"" ].filter(Boolean).join("\n");
  };
  const mailtoFicha=(p)=> "mailto:?subject="+encodeURIComponent("Propiedad en arriendo: "+p.name)+"&body="+encodeURIComponent(fichaResumenTexto(p));
  const compartirFichaWhatsApp=(p)=>waEnviar("",fichaResumenTexto(p));
  const copiarFichaResumen=(p)=>{ const t=fichaResumenTexto(p); if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(()=>notify("Texto de la ficha copiado")).catch(()=>notify("No se pudo copiar",true)); } else notify("No se pudo copiar",true); };
  const buildFichaMarketingHTML=(p)=>{
    const s=getCompartir(p); const soc=socById(p.sociedad);
    const fotos=(p.fotos||[]).map(f=>f.url).filter(Boolean);
    const cover=fotos[0]||""; const gal=fotos.slice(1,10);
    const showInfo=s.mostrarInfo!==false, showVal=s.mostrarValor!==false, showGC=s.mostrarDeudas===true;

      <div className="grid c3" style={{gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:14}}>

            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontWeight:700,fontSize:14}}>{label}</span><span style={{color:on?"var(--green-d)":"var(--faint)"}}>{on?"✓":"—"}</span></div>
