  const [menuOpen,setMenuOpen]=useState(false);
  const [mBusca,setMBusca]=useState(false), [busca,setBusca]=useState(""), [busSel,setBusSel]=useState(0);

  /* ---- Volver ----
     Una sola función para toda la plataforma: primero cierra lo que esté
     abierto encima, después la propiedad desplegada y, por último, devuelve a
     la sección anterior. La usan la flecha ← de la barra superior, la flecha
     flotante de las ventanas y el gesto de retroceso del teléfono. */
  const PANELES=[
    [mAdd,()=>setMAdd(false)], [mEdit,()=>setMEdit(null)], [mNewTenant,()=>setMNewTenant(false)],
    [mDel,()=>setMDel(null)], [mSoc,()=>setMSoc(false)], [mSocDel,()=>setMSocDel(null)],
    [mPay,()=>setMPay(null)], [mRem,()=>setMRem(null)], [mVac,()=>setMVac(null)],
    [mInfo,()=>setMInfo(false)], [mFirma,()=>setMFirma(null)], [mContract,()=>setMContract(null)],
    [mContact,()=>setMContact(false)], [mFicha,()=>setMFicha(null)], [mover,()=>setMover(null)],
    [mInc,()=>setMInc(null)], [mBit,()=>setMBit(null)], [mShare,()=>setMShare(null)],
    [mIncShare,()=>setMIncShare(null)], [mBusca,()=>cerrarBusca()], [menuOpen,()=>setMenuOpen(false)],
  ];
  const panelAbierto = PANELES.some(([v])=>!!v);
  const cerrarPaneles = ()=>{ PANELES.forEach(([v,cerrar])=>{ if(v) cerrar(); }); };
  const hayVolver = panelAbierto || !!sel || navHay || tab!=="inicio";
  const volverAtras = ()=>{
    if(panelAbierto){ cerrarPaneles(); return; }
    if(sel){ setSel(null); return; }
    const anterior = navPila.current.pop();
    setNavHay(navPila.current.length>0);
    _setTab(anterior!==undefined ? anterior : "inicio");
    try{ window.scrollTo({top:0,behavior:"smooth"}); }catch(_e){ window.scrollTo(0,0); }
  };
  /* El gesto de retroceso del teléfono hace lo mismo que la flecha. */
  useEffect(()=>{
    const alVolver=()=>{ if(hayVolver) volverAtras(); };
    window.addEventListener("popstate",alVolver);
    return ()=>window.removeEventListener("popstate",alVolver);
  });
  useEffect(()=>{ const h=(e)=>{ const k=e.key; const tn=((e.target&&e.target.tagName)||"").toLowerCase(); const editing=tn==="input"||tn==="textarea"||tn==="select"||(e.target&&e.target.isContentEditable);
      if((k==="k"||k==="K")&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); setMBusca(v=>!v); }
      else if(k==="/"&&!editing&&!mBusca){ e.preventDefault(); setMBusca(true); }
      else if(k==="Escape"&&mBusca){ setMBusca(false); } };
    window.addEventListener("keydown",h); return ()=>window.removeEventListener("keydown",h); },[mBusca]);

  const normTxt=(x)=> String(x||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();

  const BUSCABLE=(()=>{

    const F=[
      {t:"Ficha completa de la propiedad",kw:"ficha levantamiento campos llenar pdf word excel",tab:"props",sub:"Abrir Ficha completa de una propiedad",run:_abrirFichaB},
      {t:"Enlace interactivo para llenar la ficha desde fuera",kw:"enlace publico llenar formulario compartir link",tab:"props",sub:"En la Ficha completa › Enlace interactivo",run:_abrirFichaB},
      {t:"Ficha de Levantamiento (formulario completo)",kw:"levantamiento formulario completo levantar propiedad word pdf zip documentacion aval arrendatario",tab:"props",sub:"Abrir el formulario de levantamiento de propiedad",run:abrirLevantamiento},
      {t:"Plantillas de WhatsApp, correo y SMS",kw:"plantillas mensajes whatsapp correo sms recordatorio",tab:"comunicaciones"},
      {t:"CRM y leads (embudo, prospectos, conversión)",kw:"crm lead prospecto pipeline embudo conversion venta cliente captacion",tab:"crm"},
      {t:"Agendar visitas a propiedades",kw:"visita agenda agendar mostrar propiedad cliente cita",tab:"crm",sub:"En CRM › Visitas"},
      {t:"Seguimientos y tareas de clientes",kw:"seguimiento tarea recordatorio cliente lead pendiente",tab:"crm",sub:"En CRM › Seguimientos"},
      {t:"Respuestas rápidas para WhatsApp",kw:"respuesta rapida canned mensaje plantilla whatsapp lead consulta",tab:"crm",sub:"En CRM › Respuestas rápidas"},
      {t:"Cobrar arriendo / recordatorio de pago",kw:"cobro recordatorio pago khipu voucher vencimiento atraso",tab:"cobros"},
      {t:"Datos bancarios y cuentas para transferencia",kw:"banco cuenta transferencia datos bancarios",tab:"config"},
      {t:"Valor de la UF e indicadores",kw:"uf utm uta dolar ipc indicadores valor",tab:"config"},
      {t:"Dividendos hipotecarios",kw:"dividendo hipoteca credito cuota banco",tab:"finanzas"},
      {t:"Gastos y utilidad de la propiedad",kw:"gastos utilidad gasto comun internet luz agua reparaciones asesora",tab:"finanzas"},
      {t:"Contribuciones y seguros",kw:"contribuciones seguro incendio sismo poliza",tab:"finanzas"},
      {t:"Garantías de arriendo",kw:"garantia deposito mes",tab:"historial"},
      {t:"Lagunas / períodos sin arriendo",kw:"laguna vacancia desocupada sin arriendo",tab:"historial"},
      {t:"Arrendatarios anteriores",kw:"arrendatarios anteriores historico inquilino",tab:"historial"},
      {t:"Crear contrato con firma online (GoFirmeX)",kw:"contrato firma notarial gofirmex documento legal",tab:"legal"},
      {t:"Antecedentes de arrendatario (InfoCheck / Equifax)",kw:"infocheck equifax boletin comercial antecedentes dicom evaluar arrendatario deuda protestos",tab:"legal"},
      {t:"Compartir ficha de marketing de la propiedad",kw:"compartir marketing publicar aviso publica portada",tab:"props",sub:"Abrir una propiedad › Compartir",run:()=>{ if(props.length===1){setSel(props[0]);setTab("props");} else setTab("props"); }},
      {t:"Incidencias y reparaciones",kw:"incidencia reclamo reparacion evento",tab:"incidencias"},
      {t:"Bitácora y notas",kw:"bitacora nota registro cronologico",tab:"bitacora"},
      {t:"Informes para contador o dueños",kw:"informe reporte cartera excel csv pdf",tab:"informes"},
      {t:"Asistente con IA",kw:"asistente ia chat preguntar",tab:"ai"},
      {t:"Configuración de la cuenta",kw:"configuracion ajustes datos propietario pasarela",tab:"config"},
    ];
    F.forEach(f=> out.push({cat:"En la plataforma",ico:f.ico||"➡️",title:f.t,sub:f.sub||("Ir a "+((HEAD[f.tab]&&HEAD[f.tab][0])||f.tab)),kw:(f.kw||"")+" "+f.t,run:goB(f.run||(()=>{setTab(f.tab);setSel(null);}))}));
    props.forEach(p=> out.push({cat:"Propiedades",ico:"🏘️",title:p.name,sub:[p.address,p.comuna].filter(Boolean).join(", ")||"Propiedad",kw:[p.name,p.address,p.comuna,p.tenant].filter(Boolean).join(" "),run:goB(()=>{setSel(p);setTab("props");setFilter("todas");})}));
    props.filter(p=>p.tenant).forEach(p=> out.push({cat:"Arrendatarios",ico:"👤",title:p.tenant,sub:"Arrendatario · "+p.name,kw:[p.tenant,p.tenantEmail,p.tenantPhone,p.tenantWhatsapp].filter(Boolean).join(" "),run:goB(()=>{setTab("arrendatarios");})}));
    (contacts||[]).forEach(c=> out.push({cat:"Arrendatarios",ico:"👤",title:(c.nombre||c.name||"Contacto"),sub:"Contacto guardado",kw:[c.nombre,c.name,c.email,c.telefono,c.rut].filter(Boolean).join(" "),run:goB(()=>{setTab("arrendatarios");})}));
    (leads||[]).forEach(l=>{ var e=CRM_ESTADOS.find(x=>x.id===l.estado); out.push({cat:"Leads (CRM)",ico:"🎯",title:l.nombre,sub:"Lead · "+((e&&e.label)||l.estado)+(l.comuna?(" · "+l.comuna):""),kw:[l.nombre,l.telefono,l.email,l.comuna,l.fuente,l.notas].filter(Boolean).join(" "),run:goB(()=>{setTab("crm");})}); });
    socs.forEach(so=> out.push({cat:"Sociedades",ico:"🏢",title:so.name,sub:"Sociedad"+(so.rut?(" · "+so.rut):""),kw:[so.name,so.rut].filter(Boolean).join(" "),run:goB(()=>{setTab("sociedades");})}));
    _tpls.forEach(t=> out.push({cat:"Plantillas",ico:t.ico||"",title:t.label,sub:"Plantilla de comunicación",kw:[t.label,t.asunto].filter(Boolean).join(" "),run:goB(()=>{setComProp(props[0]||null);setTab("comunicaciones");})}));
    FICHA_SECS.forEach(sec=>{ out.push({cat:"Ficha: secciones",ico:sec.ico,title:sec.t,sub:"Sección de la Ficha completa",kw:"ficha "+sec.t,run:goB(()=>_verFichaSec(sec.t))});
      sec.f.forEach(f=> out.push({cat:"Ficha: campos",ico:sec.ico,title:f[1],sub:"Ficha completa › "+sec.t,kw:"ficha "+f[1]+" "+sec.t,run:goB(()=>_verFichaSec(sec.t))})); });
    return out;
  })();
  const CATORD=["Secciones","En la plataforma","Propiedades","Leads (CRM)","Arrendatarios","Sociedades","Plantillas","Ficha: secciones","Ficha: campos"];
  const _q=normTxt(busca).trim(); const _toks=_q?_q.split(/\s+/).filter(Boolean):[];
  const _match=(it)=>{ const hay=normTxt(it.title+" "+(it.sub||"")+" "+(it.kw||"")); return _toks.every(t=>hay.includes(t)); };
  let buscaRes = _q ? BUSCABLE.filter(_match) : BUSCABLE.filter(it=>it.cat==="Secciones"||it.cat==="En la plataforma");
  buscaRes = buscaRes.slice().sort((a,b)=>CATORD.indexOf(a.cat)-CATORD.indexOf(b.cat)).slice(0,50);
  /* ---- Sin clave no se entra: los datos del panel son privados. ---- */
  if(puerta==="cargando") return (<div className="puerta"><div className="puerta-caja"><p style={{margin:0}}>Abriendo…</p></div></div>);
  if(puerta!=="ok") return (<Puerta modo={puerta} onEntrar={(a)=>{ setAcceso(a); setPuerta("ok"); }}/>);

  /* Solo el rol arrendatario ve su portal propio. */
  if(sesion && rolActual==="arrendatario") return (<PortalArrendatario u={usuarioActual} propiedades={props} uf={uf} owner={owner} cuentas={cuentas} montoCobro={montoCobro} calcMulta={calcMulta} onSalir={cerrarSesion}/>);

  return (<div className={"app"+(soloLectura?" solo-lectura":"")+(movil?" en-movil":"")+(movil&&movilCompleto?" modo-completo":"")}>
    {/* Bajo 900 px, MobileApp reemplaza a todo el layout de escritorio. El
        árbol del escritorio sigue montado detrás (de ahí vienen los modales y
        las secciones completas que el móvil abre) pero se oculta por CSS. */}
    {movil && <MobileApp
      props={props} socs={socs} contacts={contacts} uf={uf} owner={owner} gw={gw}
      soloLectura={soloLectura}
      setMPay={setMPay} setMContract={setMContract} setMFicha={setMFicha}
      abrirIncidencia={abrirIncidencia}
      notify={notify} openRem={openRem}
      buscar={()=>setMBusca(true)}
      utm={utm} dolar={dolar} ipc={ipc}
      indLoading={indLoading} indRecien={indRecien} refrescarIndicadores={refrescarIndicadores}
      alertas={alertas} irAlerta={(a)=>{ irAlerta(a); setMovilCompleto(a.ir==="cobros"?"cobros":"props"); }}
      usuarioActual={usuarioActual} rolActual={rolActual}
      /* Todas las acciones del escritorio, para que ninguna quede sin alcance
         desde el teléfono. Son las mismas funciones, no copias. */
      acciones={{
        nuevaPropiedad:()=>{ setNP({...blank,gastosExtra:SEED_GASTOS()}); setMAdd(true); },
        nuevaSociedad:openNewSoc,
        editarPropiedad:(p)=>{ setEP({...p}); setMEdit(p); },
        eliminarPropiedad:(p)=>setMDel(p),
        fichaCompleta:abrirFicha,
        contrato:openContract,
        firma:(p)=>setMFirma(p),
        compartir:(p)=>setMShare(p),
        incidencia:abrirIncidencia,
        bitacora:abrirBitacora,
        recordatorio:openRem,
        registrarPago:(p)=>setMPay(p),
        vacancia:(p)=>setMVac(p),
        infoCheck:()=>setMInfo(true),
        contacto:()=>setMContact(true),
        moverPropiedad:moverPropiedad,
        salir:()=> sesion ? cerrarSesion() : salirDeLaCuenta(),
      }}
      secciones={NAV.filter(n=>NAV_VIS.some(g=>g.ids.includes(n.id)))}
      abrirSeccion={(id,prop)=>{
        if(prop){ setSel(prop); setFilter("todas"); setSocFilter("todas"); }
        setTab(id); setMovilCompleto(id);
        try{ window.scrollTo(0,0); }catch(_e){}
      }}
    />}
    {/* Barra para salir de la sección completa y volver a las 5 pestañas. */}
    {movil && movilCompleto && (
      <div className="mob-volver-barra">
        <button onClick={()=>setMovilCompleto(null)}>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 6 9 12 15 18"/></svg>
          Volver
        </button>
        <span className="tit">{(HEAD[tab]&&HEAD[tab][0])||"Sección"}</span>
      </div>
    )}
    {/* Flecha flotante: cierra la ventana que esté abierta encima. En el
        teléfono el botón "Cancelar" queda al final de formularios largos. */}
    {!movil && panelAbierto && !mBusca && !menuOpen &&
      <button className="volver-flot" onClick={cerrarPaneles} title="Volver" aria-label="Volver">← Volver</button>}
    {menuOpen && <div className="nav-overlay" onClick={()=>setMenuOpen(false)}></div>}
    <div className={"sidebar"+(menuOpen?" open":"")}>
      <div className="brand"><div className="brand-logo"><img src="/logo.png" alt="ArriendoPro"/></div><div style={{flex:1,minWidth:0}}><h1>ArriendoPro</h1><p>Administración fácil</p></div><button className="drawer-x" onClick={()=>setMenuOpen(false)} aria-label="Cerrar menú">✕</button></div>
      <div className="nav"><div className="nav-item" onClick={()=>{setMBusca(true);setMenuOpen(false);}} style={{marginBottom:4}}><span className="ico">🔍</span>Buscar<span className="kbd" style={{marginLeft:"auto"}}>/</span></div>{NAV_VIS.map(g=>(<React.Fragment key={g.label}>
        <div className="nav-group">{g.label}</div>
        {g.ids.map(id=>{ const n=navItem(id); return n?(<div key={id} className={"nav-item"+(tab===id?" on":"")} onClick={()=>{setTab(id);setSel(null);setMenuOpen(false);}}><span className="ico">{n.ico}</span>{n.label}</div>):null; })}
      </React.Fragment>))}</div>
      <div className="nav-foot"><div className="av">{(usuarioActual.nombre||"U").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase()}</div><div style={{minWidth:0,flex:1}}><div style={{fontWeight:700,color:"var(--side-tx)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{(usuarioActual.nombre||"").split(" ")[0]||usuarioActual.email}</div><div style={{fontSize:12.5,color:"var(--side-mut)"}}>{acceso&&acceso.rol==="lectura"?"Solo lectura":((ROLES_INFO[rolActual]||{}).label||rolActual)}</div></div><button className="btn btn-out btn-sm" style={{padding:"6px 10px",fontSize:12}} onClick={sesion?cerrarSesion:salirDeLaCuenta}>Salir</button></div>
    </div>

    {mBusca && <div className="modal-bg" style={{alignItems:"flex-start",paddingTop:"8vh",zIndex:300}} onClick={cerrarBusca}>
      <div className="cmdk-card" onClick={e=>e.stopPropagation()}>
        <div className="cmdk-top">
          <span style={{fontSize:18}}>🔍</span>
          <input autoFocus value={busca} placeholder="Busca una sección, propiedad, arrendatario, plantilla o campo de la ficha…"
            onChange={e=>{ setBusca(e.target.value); setBusSel(0); }}
            onKeyDown={e=>{ if(e.key==="ArrowDown"){e.preventDefault();setBusSel(x=>Math.min(buscaRes.length-1,x+1));}
              else if(e.key==="ArrowUp"){e.preventDefault();setBusSel(x=>Math.max(0,x-1));}
              else if(e.key==="Enter"){e.preventDefault(); const it=buscaRes[busSel]; if(it&&it.run) it.run(); }
              else if(e.key==="Escape"){ cerrarBusca(); } }}/>
          <span className="kbd">Esc</span>
        </div>
        <div className="cmdk-list">
          {buscaRes.length ? buscaRes.map((it,i)=>{ const grp = i===0 || buscaRes[i-1].cat!==it.cat; return (<React.Fragment key={i}>

            <div className={"cmdk-item"+(i===busSel?" on":"")} onMouseEnter={()=>setBusSel(i)} onClick={it.run}>
              <span className="ic">{it.ico}</span>
              <span style={{minWidth:0,flex:1}}><span className="tt">{it.title}</span>{it.sub&&<span className="sb">{it.sub}</span>}</span>
            </div>
          </React.Fragment>); }) : <div className="cmdk-empty">Sin resultados para “{busca}”. Prueba con otra palabra (por ejemplo: arriendo, garantía, contrato, dividendo, plantilla…).</div>}
        </div>
        <div className="cmdk-foot"><span><span className="kbd">↑</span> <span className="kbd">↓</span> moverse</span><span><span className="kbd">Enter</span> abrir</span><span><span className="kbd">⌘/Ctrl</span>+<span className="kbd">K</span> o <span className="kbd">/</span> para abrir</span></div>
      </div>
    </div>}

    <div className="main">
      {/* TOPBAR */}
      <div className="topbar"><div className="topbar-row">
        <div style={{display:"flex",alignItems:"center",gap:12,minWidth:0}}>

          {/* Flecha para regresar: a la sección anterior o, si hay una
              propiedad desplegada, a la lista. */}
          {hayVolver && <button className="volver-btn" onClick={volverAtras} title="Volver" aria-label="Volver"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M15 19l-7-7 7-7"/></svg></button>}
          {/* Apunta al buscador que navega. El buscador global antiguo listaba
              campos internos de los datos (id, builtin, cuerpoWA…) que no
              llevaban a ninguna parte al tocarlos. */}
          <button className="gs-top" title="Buscar en toda la plataforma" aria-label="Buscar en toda la plataforma" onClick={()=>setMBusca(true)}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></button>
          <div style={{minWidth:0}}><h2>{HEAD[tab][0]}</h2><div className="desc">{HEAD[tab][1]}</div></div>
        </div>
        <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
          <button className="btn btn-ghost btn-sm btn-busca" onClick={()=>setMBusca(true)}>Buscar <span className="kbd">/</span></button>
          {/* Todo se guarda solo en el servidor; esto lo hace visible. */}
          {guardado==="guardando" && <span className="guardado" title="Guardando en el servidor…"><span className="ind-spin"></span> Guardando…</span>}
          {guardado==="ok" && <span className="guardado ok" title="Guardado en el servidor: lo verás igual en cualquier dispositivo">✓ Guardado</span>}
          {guardado==="error" && <span className="guardado mal" title="Revisa tu conexión; volveré a intentarlo con el próximo cambio">⚠ No se pudo guardar</span>}
          <div className="pill grey">1 UF = {CLP(uf)}</div>
          <button className="btn btn-red" onClick={()=>{setNP({...blank,gastosExtra:SEED_GASTOS()});setMAdd(true);}}>＋ Nueva propiedad</button>
        </div>
      </div></div>
      {soloLectura && <div className="readonly-note">Estás en modo <b>invitado (solo lectura)</b>: puedes revisar la información, pero no crear ni modificar registros.</div>}

      {/* INDICADORES EN VIVO — se actualizan solos y dicen de dónde salen. */}

        <span className="pill grey" title={"UF — la fija el "+FUENTES_IND.uf.org+", vía mindicador.cl"+(indInfo.uf?" · valor del "+fmtF(indInfo.uf):"")}>UF {CLP(uf)}{ufManual&&" ✎"}</span>
        <span className="pill grey" title={"UTM — la fija el "+FUENTES_IND.utm.org+", vía mindicador.cl"+(indInfo.utm?" · valor de "+fmtF(indInfo.utm):"")}>UTM {CLP(utm)}</span>
        <span className="pill grey" title="UTA = UTM × 12 (SII)">UTA {CLP(utm*12)}</span>
        <span className="pill grey" title={"Dólar observado — "+FUENTES_IND.dolar.org+", vía mindicador.cl"+(indInfo.dolar?" · valor del "+fmtF(indInfo.dolar):"")}>Dólar {CLP(dolar)}</span>
        <span className="pill grey" title={"IPC, variación mensual — "+FUENTES_IND.ipc.org+", vía mindicador.cl"+(indInfo.ipc?" · dato de "+fmtF(indInfo.ipc):"")}>IPC {pctFmt(ipc)}</span>
        <button className={"btn btn-sm ind-btn"+(indLoading?" cargando":"")} onClick={refrescarIndicadores} disabled={indLoading} style={{marginLeft:"auto"}}>
          {indLoading ? <><span className="ind-spin"></span> Actualizando…</> : (indRecien ? "✓ Actualizado" : "↻ Actualizar")}
        </button>
      </div>
      <div className="indfuente">
        <span className="viva"></span>
        En vivo desde <a href="https://mindicador.cl" target="_blank" rel="noopener">mindicador.cl</a>: UF y UTM del <b>SII</b>, dólar observado del <b>Banco Central</b>, IPC del <b>INE</b>.
        {indLoading ? <> <b>Actualizando…</b></>
          : indInfo.at ? <> Actualizado a las {new Date(indInfo.at).toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"})}{indInfo.uf?<> · UF del {fmtF(indInfo.uf)}</>:null}.</>
          : <> Cargando…</>}
        {ufManual && <> <b>La UF está editada a mano</b>, así que no se actualiza sola (quita el valor manual en Configuración para volver a la automática).</>}
      </div>

      <div className="content">

        <GuiaSeccion tab={tab}/>

        {/* ============ INICIO ============
            Cada ficha se puede mover: se mantiene presionada y se elige el
            lugar donde debe aparecer. El orden queda guardado. */}
        {tab==="inicio" && <>
        <div className="help g">💡 ¿Quieres otro orden? <b>Mantén presionada</b> una ficha y, sin soltar, <b>arrástrala</b> con el dedo (o con el mouse) hasta donde quieras, igual que al mover las aplicaciones del teléfono. Si prefieres elegir la posición de una lista, toca el asa <b>⠿</b> de la ficha.</div>
        {bloquesOrdenados("inicio",[
         {id:"alertas",titulo:"Alertas",node:(
          <Collapsible icon="🔔" title={alertas.length?("Alertas ("+alertas.length+")"):"Alertas"}
            subtitle={alertas.length?"Lo que conviene revisar hoy":"No hay nada pendiente"} defaultOpen={false}>
            {alertas.length===0
              ? <div className="help" style={{margin:0}}>✅ Todo al día: sin arriendos atrasados, contratos por vencer, seguros vencidos ni reajustes pendientes.</div>
              : <>
                <div className="help" style={{marginBottom:10}}>Esto se calcula solo con lo que tienes cargado. Toca <b>Ver</b> para ir a la propiedad.</div>
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  {alertas.map(a=>(<div key={a.id} className={"alerta "+a.urgencia}>
                    <span className="al-ico">{a.ico}</span>
                    <div style={{flex:1,minWidth:0}}>
                      <div className="al-t">{a.titulo}</div>
                      <div className="al-d">{a.detalle}</div>
                    </div>
                    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                      {a.accion==="reajuste" && <button className="btn btn-red btn-sm" disabled={reajBusy===String(a.pid)}
                        onClick={()=>{ const p=props.find(x=>String(x.id)===String(a.pid)); if(p) aplicarReajuste(p); }}>
                        {reajBusy===String(a.pid)?"Calculando…":"Reajustar"}</button>}
                      <button className="btn btn-out btn-sm" onClick={()=>irAlerta(a)}>Ver</button>
                    </div>
                  </div>))}
                </div>
              </>}
          </Collapsible>)},

         {id:"acciones",titulo:"¿Qué quieres hacer hoy?",node:(
          <Collapsible icon="👋" title="¿Qué quieres hacer hoy?" subtitle="Accesos directos — toca para abrir" defaultOpen={false}>
            <div className="help g" style={{marginBottom:16}}>Toca un botón para ir directo a lo que necesitas.</div>
            <div className="qa-grid">
              <button className="qa" onClick={()=>setTab("props")}><span className="qico">🏘️</span><span><span className="qt">Mis propiedades</span><span className="qd">Ver la ficha de cada una</span></span></button>
              <button className="qa" onClick={()=>{ if(props.length===1){abrirFicha(props[0]);} else {setTab("props"); notify("Abre una propiedad y toca Ficha completa");} }}><span className="qico">📄</span><span><span className="qt">Ficha completa</span><span className="qd">Rellenar, previsualizar, exportar y compartir</span></span></button>
              <button className="qa" onClick={abrirLevantamiento}><span className="qico">📝</span><span><span className="qt">Ficha de Levantamiento</span><span className="qd">Formulario completo para levantar una propiedad</span></span></button>
              <button className="qa" onClick={()=>setTab("crm")}><span className="qico">🤝</span><span><span className="qt">CRM y leads</span><span className="qd">Prospectos, visitas, seguimiento y conversión</span></span></button>
              <button className="qa" onClick={()=>setTab("cobros")}><span className="qico">💰</span><span><span className="qt">Cobrar arriendos</span><span className="qd">Registrar pagos y recordatorios</span></span></button>
              <button className="qa" onClick={()=>setTab("arrendatarios")}><span className="qico">👥</span><span><span className="qt">Arrendatarios y contactos</span><span className="qd">Datos, contactos y contratos</span></span></button>
              <button className="qa" onClick={()=>setTab("finanzas")}><span className="qico">📊</span><span><span className="qt">Finanzas y balance</span><span className="qd">Gastos, ingresos y balance de cada propiedad</span></span></button>
              <button className="qa" onClick={()=>setTab("incidencias")}><span className="qico">🛠️</span><span><span className="qt">Incidencias</span><span className="qd">Reparaciones y reclamos</span></span></button>
              <button className="qa" onClick={()=>setTab("informes")}><span className="qico">📈</span><span><span className="qt">Informes</span><span className="qd">Descargar Word, Excel o PDF</span></span></button>
            </div>
            <div className="help" style={{marginTop:10}}>La <b>Ficha completa</b> de cada propiedad reúne toda su información (legal, física, valores, arriendo, arrendatario, crédito, gastos, servicios y contactos). Puedes <b>rellenarla, agregar fotos y archivos, previsualizarla</b> y <b>compartirla o exportarla</b> en PDF, Word, Excel o HTML, o por WhatsApp, correo y SMS.</div>
          </Collapsible>)},

         {id:"resumen",titulo:"Resumen rápido",node:(
          <Collapsible icon="⚡" title="Resumen rápido" subtitle="Ingresos, dividendos, utilidad y patrimonio" defaultOpen={false}>
            <div className="grid c4" style={{gridTemplateColumns:"repeat(4,1fr)"}}>
              <div className="stat" style={{borderTopColor:"var(--green)"}}><div className="lab">Ingresos por arriendo</div><div className="val">{CLP(ingresos)}</div><div className="sub" style={{color:"var(--green-d)"}}>{rentals.length} en arriendo</div></div>
              <div className="stat" style={{borderTopColor:"var(--red)"}}><div className="lab">Dividendos / mes</div><div className="val">{CLP(dividendos)}</div><div className="sub" style={{color:"var(--red-d)"}}>{props.filter(p=>p.hasMortgage).length} con crédito</div></div>
              <div className="stat" style={{borderTopColor:utilidadTotal>=0?"var(--green)":"var(--red)"}}><div className="lab">Utilidad neta / mes</div><div className="val" style={{color:utilidadTotal>=0?"var(--green-d)":"var(--red-d)"}}>{CLP(utilidadTotal)}</div><div className="sub" style={{color:"var(--muted)"}}>arriendo − todos los gastos</div></div>
              <div className="stat" style={{borderTopColor:"var(--line)"}}><div className="lab">Patrimonio</div><div className="val">{CLP(patrimonio)}</div><div className="sub" style={{color:"var(--muted)"}}>{props.length} inmuebles</div></div>
            </div>
            <div style={{marginTop:14,display:"flex",flexDirection:"column",gap:8}}>
              <div className="help" style={{margin:0}}><b>Ingresos por arriendo:</b> la suma de todos los arriendos mensuales que cobras hoy, convertidos a pesos con {reglaUFTexto(null)}. Sube solo cuando sube la UF.</div>
              <div className="help" style={{margin:0}}><b>Dividendos / mes:</b> lo que pagas cada mes a los bancos por las propiedades que tienen crédito hipotecario.</div>
              <div className="help" style={{margin:0}}><b>Utilidad neta / mes:</b> lo que realmente te queda: los arriendos menos todos los gastos (dividendos, contribuciones, gasto común, seguros, etc.).</div>
              <div className="help" style={{margin:0}}><b>Patrimonio:</b> el valor total de tus propiedades, según la tasación comercial que cargaste en cada una.</div>
            </div>
          </Collapsible>)},

         {id:"cobros",titulo:"Estado de cobros",node:(
          <Collapsible icon="💰" title="Estado de cobros" subtitle="Cuántas propiedades están al día, pendientes o atrasadas" defaultOpen={false}>
            {[{l:"Al día",n:paid,c:"var(--green)"},{l:"Pendiente",n:pend,c:"var(--amber)"},{l:"Atrasado",n:late,c:"var(--red)"}].map(s=>(
              <div key={s.l} style={{marginBottom:14}}><div style={{display:"flex",justifyContent:"space-between",fontSize:15,fontWeight:700,marginBottom:6}}><span style={{color:"var(--text)"}}>{s.l}</span><span style={{color:s.c}}>{s.n} propiedad{s.n!==1?"es":""}</span></div><div className="bar"><div style={{width:(rentals.length?(s.n/rentals.length*100):0)+"%",background:s.c}}></div></div></div>
            ))}
            <div className="help" style={{marginTop:6}}>Tienes <b>{rentals.length}</b> propiedades en arriendo y <b>{personals.length}</b> de uso personal. <b>Al día</b> = ya pagaron el mes · <b>Pendiente</b> = aún no pagan · <b>Atrasado</b> = pasó la fecha de pago.</div>
          </Collapsible>)},

         {id:"sociedades",titulo:"Mis sociedades",node:(
          <Collapsible icon="🏢" title="Mis sociedades" subtitle={SOCIEDADES.length+" sociedad(es) propietaria(s)"} defaultOpen={false}>
            <div className="help" style={{marginBottom:10}}>Las empresas o personas dueñas de tus propiedades. Aquí ves un resumen; toca “Ver sociedades” para gestionarlas.</div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {SOCIEDADES.map(s=>{ const list=bySoc(s.id); const arr=list.filter(p=>p.use==="arriendo"); const util=arr.reduce((a,p)=>a+utilidadMes(p,uf),0);
                return (<div key={s.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8,padding:"10px 12px",background:"var(--panel2)",borderRadius:10,borderLeft:"5px solid "+s.color}}>
                  <div><div style={{fontWeight:800}}>{s.name}</div><div style={{fontSize:13,color:"var(--muted)"}}>{list.length} propiedad(es) · {arr.length} en arriendo</div></div>
                  <div style={{textAlign:"right"}}><div style={{fontWeight:800,color:util>=0?"var(--green-d)":"var(--red-d)"}}>{CLP(util)}</div><div style={{fontSize:12,color:"var(--faint)"}}>utilidad / mes</div></div>
                </div>); })}
            </div>
            <button className="btn btn-out" style={{marginTop:12}} onClick={()=>setTab("sociedades")}>Ver y gestionar sociedades →</button>
          </Collapsible>)},

         {id:"bitacora",titulo:"Bitácora",node:(
          (()=>{ const allBit=[]; props.forEach(p=>(p.bitacora||[]).forEach(b=>allBit.push({...b, pid:p.id, pname:p.name}))); allBit.sort((a,b)=>String(b.fecha||"").localeCompare(String(a.fecha||"")));
            return (<Collapsible icon="📓" title="Bitácora" subtitle={allBit.length+" anotación(es) en todas las propiedades"} defaultOpen={false}>
              <div className="help" style={{marginBottom:10}}>Las últimas anotaciones de todas tus propiedades (contratos, servicios, antecedentes, mantenciones, etc.).</div>
              {allBit.length===0 ? <div style={{color:"var(--muted)"}}>Aún no hay anotaciones. Agrégalas desde la pestaña Bitácora o desde cada propiedad.</div> :
                <div style={{display:"flex",flexDirection:"column",gap:8}}>{allBit.slice(0,12).map(b=>(
                  <div key={b.pid+"-"+b.id} style={{borderLeft:"3px solid var(--red)",paddingLeft:12}}>
                    <div style={{fontWeight:700}}>{b.titulo||b.tipo||"Anotación"} <span style={{fontWeight:500,color:"var(--faint)",fontSize:12}}>· {b.fecha}</span></div>
                    <div style={{fontSize:13,color:"var(--muted)"}}>{b.pname}{b.texto?" — "+b.texto:""}</div>
                  </div>))}</div>}
              <button className="btn btn-out" style={{marginTop:12}} onClick={()=>setTab("bitacora")}>Ver bitácora completa →</button>
            </Collapsible>); })()
         )},

         {id:"dividendos",titulo:"Resumen de dividendos",node:(
          <Collapsible icon="🏦" title="Resumen de dividendos" defaultOpen={false}>
            <Data label="Dividendos totales por pagar (todas)" value={props.reduce((s,p)=>s+divPorPagar(p),0)+" cuotas"} color="var(--red-d)" big/>
            <div style={{height:10}}></div>
            <Data label="Deuda hipotecaria restante (aprox.)" value={UFf(deudaHipTotalUF)+" ≈ "+CLP(deudaHipTotalUF*uf)}/>
            <button className="btn btn-out" style={{marginTop:14}} onClick={()=>setTab("finanzas")}>Ver dividendos, gastos y utilidades →</button>
          </Collapsible>)},

         {id:"tusprops",titulo:"Tus propiedades",node:(
          <Collapsible icon="🏘️" title="Tus propiedades" subtitle={props.length+" inmueble(s) — toca para verlas"} defaultOpen={false}>
            <div style={{textAlign:"right",marginBottom:10}}><button className="btn btn-ghost" onClick={()=>setTab("props")}>Ver todas →</button></div>
            <div className="grid" style={{gridTemplateColumns:"1fr 1fr",gap:12}}>
              {propsOrd.map((p,ip)=>(<div key={p.id} className="prop ord-wrap" data-ord-clave="props" onClick={()=>{setSel(p);setTab("props");setFilter("todas");}}
                {...arrastreProp(propsOrd.map(x=>String(x.id)),ip,p)}>
                <span className="asa-fila" title="Mantén presionada y arrástrala para moverla"
                  onClick={(e)=>{ e.stopPropagation(); moverPropiedad(p); }}>⠿</span>
                <span className="dot" style={{background:dotColor(p.status)}}></span>
                <div style={{flex:1}}><div style={{fontWeight:700}}>{p.name} {p.use==="personal" && <span className="pill blue">Uso personal</span>}</div><div style={{fontSize:14,color:"var(--muted)",marginTop:2}}>{p.use==="arriendo"?p.tenant+" · ":""}{p.comuna}</div></div>
                <div style={{textAlign:"right"}}><div style={{fontWeight:800}}>{p.use==="arriendo"?CLP(p.rent):"—"}</div>{p.use==="arriendo"&&<div style={{fontSize:12,color:"var(--faint)",fontWeight:600}}>{UFf(p.rentUF)}</div>}{p.use==="arriendo"?<Pill s={p.status}/>:<span className="pill blue">{p.subtype}</span>}</div>
                <button className="btn btn-ghost btn-sm" title="Abrir ficha completa" onClick={e=>{e.stopPropagation();abrirFicha(p);}}></button>
              </div>))}
            </div>
          </Collapsible>)},
        ])}
        </>}

        {/* ============ SOCIEDADES ============ */}
        {tab==="sociedades" && <>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10,marginBottom:4}}>
            <div className="help" style={{margin:0,flex:1,minWidth:240}}>Tus propiedades están repartidas en <b>{socs.length} sociedad{socs.length!==1?"es":""}</b>. Aquí las ves ordenadas por cada una. Crea, edita o elimina las sociedades propietarias. Haz clic en una propiedad para abrir su ficha o crear su contrato.</div>
            <button className="btn btn-red" onClick={openNewSoc}>＋ Nueva sociedad</button>
          </div>
          {socs.length===0 && <div className="card pad" style={{textAlign:"center",color:"var(--muted)"}}>Aún no tienes sociedades. Crea la primera con <b>＋ Nueva sociedad</b>.</div>}
          {SOCIEDADES.map(s=>{ const list=bySoc(s.id); const arr=list.filter(p=>p.use==="arriendo");
            const ing=arr.reduce((a,p)=>a+num(p.rent),0); const util=arr.reduce((a,p)=>a+utilidadMes(p,uf),0); const pat=list.reduce((a,p)=>a+num(p.tasacion),0);
            return (<Collapsible key={s.id} accent={s.color} icon="🏢" title={s.name} subtitle={"RUT "+s.rut+" · Rep. "+s.rep+" · "+list.length+" propiedad"+(list.length!==1?"es":"")} defaultOpen={false}>
              <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginBottom:12,flexWrap:"wrap"}}>
                <button className="btn btn-out btn-sm" onClick={()=>openEditSoc(s)}>Editar sociedad</button>
                <button className="btn btn-out btn-sm" style={{color:"var(--red-d)",borderColor:"var(--red-soft)"}} onClick={()=>setMSocDel(s)}>✕ Eliminar</button>
              </div>
              <div className="grid c4" style={{gridTemplateColumns:"repeat(4,1fr)",marginBottom:14}}>
                <Data label="En arriendo" value={arr.length+" de "+list.length}/>
                <Data label="Ingresos / mes" value={CLP(ing)} color="var(--green-d)"/>
                <Data label="Utilidad / mes" value={CLP(util)} color={util>=0?"var(--green-d)":"var(--red-d)"}/>
                <Data label="Patrimonio (tasación)" value={CLP(pat)}/>
              </div>
              <div className="grid" style={{gridTemplateColumns:"1fr 1fr",gap:12}}>
                {list.map(p=>(<div key={p.id} className="prop" onClick={()=>{setSel(p);setSocFilter(s.id);setFilter("todas");setTab("props");}}>
                  <span className="dot" style={{background:dotColor(p.status)}}></span>
                  <div style={{flex:1}}><div style={{fontWeight:700}}>{p.name} {p.use==="personal" && <span className="pill blue">Uso personal</span>}</div><div style={{fontSize:14,color:"var(--muted)",marginTop:2}}>{p.use==="arriendo"?p.tenant+" · ":""}{p.comuna}</div></div>
                  <div style={{textAlign:"right"}}><div style={{fontWeight:800}}>{p.use==="arriendo"?CLP(p.rent):"—"}</div>{p.use==="arriendo"&&<div style={{fontSize:12,color:"var(--faint)",fontWeight:600}}>{UFf(p.rentUF)}</div>}{p.use==="arriendo"?<Pill s={p.status}/>:<span className="pill blue">{p.subtype}</span>}</div>
                </div>))}
                {list.length===0 && <div className="help">Esta sociedad aún no tiene propiedades. Agrégalas con <b>＋ Nueva propiedad</b>.</div>}
              </div>

              {/* Servicio de Impuestos Internos, por sociedad. */}
              <div className="sub-title" style={{marginTop:18}}>🏛️ Servicio de Impuestos Internos</div>
              <div className="help" style={{marginBottom:10}}>
                Datos tributarios de <b>{s.name}</b> (RUT <b>{s.rut||"—"}</b>). El SII no permite conectarse solo: se entra con el RUT y la clave tributaria de cada contribuyente. Lo que sí hace la plataforma es guardar aquí el <b>rol</b>, el <b>avalúo</b>, las <b>contribuciones</b> y los <b>certificados</b> de cada propiedad, y dejarte a un toque el trámite en el SII. Al asesor con IA puedes preguntarle “¿cuál es el rol de …?” o “¿cuánto paga de contribuciones …?” y responde con estos datos.
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {list.map(p=>{
                  const falta=!p.rolSII||!num(p.avaluoFiscal);
                  return (<div key={"sii"+p.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8,padding:"9px 12px",background:"var(--panel2)",borderRadius:10}}>
                    <div style={{minWidth:180,flex:1}}>
                      <div style={{fontWeight:700}}>{p.name}</div>
                      <div style={{fontSize:13,color:"var(--muted)"}}>
                        Rol {p.rolSII||"—"} · Avalúo {num(p.avaluoFiscal)?CLP(num(p.avaluoFiscal)):"—"} · Contribuciones {num(p.contribucionesAnuales)?CLP(num(p.contribucionesAnuales))+"/año":"—"}
                        {(p.certAvaluoDocs||[]).length?" · 📄 certificado cargado":""}
                      </div>
                    </div>
                    {falta && <button className="btn btn-out btn-sm" onClick={()=>{setEP({...p}); setMEdit(p);}}>Completar datos</button>}
                  </div>);
                })}
              </div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:12}}>
                <a className="btn btn-out btn-sm" href={SII_LINKS.certificado_avaluo} target="_blank" rel="noopener">Certificado de avalúo fiscal →</a>
                <a className="btn btn-out btn-sm" href={SII_LINKS.servicios_online} target="_blank" rel="noopener">Servicios online SII</a>
                <a className="btn btn-ghost btn-sm" href={SII_LINKS.situacion_tributaria} target="_blank" rel="noopener">Situación tributaria del RUT</a>
              </div>
            </Collapsible>);
          })}
        </>}

        {/* ============ PROPIEDADES ============ */}
        {tab==="props" && <>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
            <div className="seg">
              <button className={filter==="todas"?"on":""} onClick={()=>setFilter("todas")}>Todas ({props.length})</button>
              <button className={filter==="arriendo"?"on":""} onClick={()=>setFilter("arriendo")}>En arriendo ({rentals.length})</button>
              <button className={filter==="personal"?"on":""} onClick={()=>setFilter("personal")}>Uso personal ({personals.length})</button>
            </div>
            <div className="seg">
              <button className={socFilter==="todas"?"on":""} onClick={()=>setSocFilter("todas")}>Todas las sociedades</button>
              {SOCIEDADES.map(s=><button key={s.id} className={socFilter===s.id?"on":""} onClick={()=>setSocFilter(s.id)}>{s.name.replace(/ SPA$/,"")} ({bySoc(s.id).length})</button>)}
            </div>
          </div>
          <div className="help">Haz clic en cualquier propiedad para abrir su <b>ficha completa</b>: ubicación, dividendo, gastos, utilidad, garantía e historial. 💡 Para cambiarlas de lugar, <b>mantén presionada</b> una propiedad y <b>arrástrala</b> con el dedo (o con el mouse) hasta donde quieras. También puedes tocar el asa <b>⠿</b> y elegir la posición de una lista.</div>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {view.map((p,ip)=>{ const on=sel&&sel.id===p.id; const util=utilidadMes(p,uf);
              return (<div key={p.id}>
                <div className={"prop ord-wrap"+(on?" on":"")} data-ord-clave="props" onClick={()=>setSel(on?null:p)}
                  {...arrastreProp(view.map(x=>String(x.id)),ip,p)}>
                  <span className="asa-fila" title="Mantén presionada y arrástrala para moverla"
                    onClick={(e)=>{ e.stopPropagation(); moverPropiedad(p); }}>⠿</span>
                  <span className="dot" style={{background:dotColor(p.status),boxShadow:`0 0 0 4px ${dotColor(p.status)}22`}}></span>
                  {!!(p.fotos&&p.fotos.length) && <div className="cover-thumb" style={{backgroundImage:`url('${p.fotos[0].url}')`}}></div>}
                  <div style={{flex:1}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                      <span style={{fontSize:17,fontWeight:800}}>{p.name}</span>
                      <span className="pill" style={{background:socById(p.sociedad).color+"1a",color:socById(p.sociedad).color}}>{socById(p.sociedad).name.replace(/ SPA$/,"")}</span>
                      {p.use==="personal" ? <span className="pill blue">{p.subtype}</span> : <span className="pill grey">{tipoTxt(p)}</span>}
                      {p.hasMortgage && <span className="pill red">Dividendo {UFf(p.dividendoUF)}</span>}
                    </div>
                    <div style={{fontSize:14,color:"var(--muted)",marginTop:4}}>{p.address}, {p.comuna}{p.use==="arriendo"?" · "+p.tenant:""}</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    {p.use==="arriendo" ? <><div style={{fontSize:19,fontWeight:800}}>{CLP(p.rent)}</div><div style={{fontSize:12,color:"var(--faint)",fontWeight:600}}>{UFf(p.rentUF)}</div><div style={{fontSize:13,color:util>=0?"var(--green-d)":"var(--red-d)",fontWeight:700}}>Utilidad {CLP(util)}</div></> : <div style={{fontSize:13,color:util>=0?"var(--green-d)":"var(--red-d)",fontWeight:700}}>Costo {CLP(util)}/mes</div>}
                  </div>
                  {p.use==="arriendo" && <Pill s={p.status}/>}
                  <button className="btn btn-ghost btn-sm" title="Abrir ficha completa" onClick={e=>{e.stopPropagation();abrirFicha(p);}}></button>
                  {/* Flecha: dice de un vistazo si está abierta y sirve para abrir y cerrar. */}
                  <span className="chev-prop" aria-hidden="true" title={on?"Cerrar":"Abrir"}>▼</span>
                </div>
                {on && <div className="prop-abierta">{detalleProp({p})}</div>}
              </div>);
            })}
          </div>
        </>}

        {/* ============ ARRENDATARIOS ============ */}
        {tab==="arrendatarios" && (()=>{
          const con=rentals.filter(p=>p.tenant&&p.tenant.trim()), sin=rentals.filter(p=>!p.tenant||!p.tenant.trim());
          const fld=(p,k,val,type)=>(<input className="input" type={type||"text"} value={val==null?"":val} onChange={e=>patchProp(p.id,x=>({...x,[k]:e.target.value}))} style={{padding:"7px 9px"}}/>);
          const icf=(p,k,type)=>(<input className="input" type={type||"text"} value={(p.tenantInfocheck&&p.tenantInfocheck[k])||""} onChange={e=>patchProp(p.id,x=>({...x,tenantInfocheck:{...(x.tenantInfocheck||{}),[k]:e.target.value}}))} style={{padding:"7px 9px"}}/>);
          const eqf=(p,k,type)=>(<input className="input" type={type||"text"} value={(p.tenantEquifax&&p.tenantEquifax[k])||""} onChange={e=>patchProp(p.id,x=>({...x,tenantEquifax:{...(x.tenantEquifax||{}),[k]:e.target.value}}))} style={{padding:"7px 9px"}}/>);
          return (<>
          <div className="grid c3" style={{gridTemplateColumns:"repeat(3,1fr)"}}>
            <div className="stat" style={{borderTopColor:"var(--blue)"}}><div className="lab">Arrendatarios activos</div><div className="val" style={{color:"var(--blue)"}}>{con.length}</div></div>
            <div className="stat" style={{borderTopColor:"var(--amber)"}}><div className="lab">Propiedades sin arrendatario</div><div className="val" style={{color:"var(--amber)"}}>{sin.length}</div></div>
            <div className="stat" style={{borderTopColor:"var(--green)"}}><div className="lab">Arriendo total (UF fija)</div><div className="val" style={{color:"var(--green-d)"}}>{UFf(rentals.reduce((s,p)=>s+num(p.rentUF),0))}</div></div>
          </div>
          <div className="help g">Aquí tienes a <b>todos tus arrendatarios</b> en un solo lugar. Puedes editar sus datos de contacto, las fechas de contrato y el arriendo en UF directamente; los cambios se guardan solos. El <b>monto en pesos</b> se calcula solo con {reglaUFTexto(null)}: el reajuste es automático.</div>
          <div style={{margin:"2px 0",display:"flex",gap:8,flexWrap:"wrap"}}>

            <div className="stat" style={{borderTopColor:"var(--red)"}}><div className="lab">Multas por atraso</div><div className="val" style={{color:"var(--red-d)"}}>{CLP(rentals.reduce((s,p)=>s+calcMulta(p),0))}</div></div>
          </div>
          <div className="card pad" style={{borderLeft:"5px solid var(--green)"}}>
            <div className="sec-title">Cómo se convierte el arriendo en UF a pesos</div>

          </div>
          <div className="card pad"><div className="sec-title">Arriendos del mes</div>
            <div className="help" style={{marginBottom:10}}>El <b>arriendo en UF</b> es fijo (edítalo en cada propiedad). El <b>monto a cobrar</b> se recalcula solo cada día con el valor de la UF.</div>
            <div style={{overflowX:"auto"}}><table><thead><tr><th>Propiedad</th><th>Arrendatario</th><th>Arriendo (UF fija)</th><th>UF aplicada</th><th>Monto a cobrar</th><th>Multa</th><th>Total</th><th>Estado</th><th>Acción</th></tr></thead><tbody>
              {cobrables.map(p=>{ const m=calcMulta(p); const cobro=cobroUF(p); return (<tr key={p.id}>

                <td style={{fontSize:13}}><b>{CLP(num(p.rentUF)>0?ufParaCobro(p).valor:uf)}</b><div style={{fontSize:11,color:"var(--faint)"}}>{num(p.rentUF)>0?(fmtF(ufParaCobro(p).fecha)+(ufParaCobro(p).atraso?" · más alta desde el vencimiento":"")):"UF de hoy"}</div></td>

              </tr>); })}

        {/* ============ DIVIDENDOS Y GASTOS ============ */}
        {tab==="finanzas" && <>
          <div className="help g">Aquí ves, por cada propiedad, cuánto pagas de <b>dividendo</b> (reajustado por UF), cuánto de <b>contribuciones</b> y <b>seguro</b>, y si al final del mes <b>ganas o pierdes</b>.</div>

          {/* ====== DASHBOARD FINANCIERO ====== */}
          {(()=>{
            const ingMes=rentals.reduce((s,p)=>s+ingresoMes(p,uf),0);
            const divMes=rentals.reduce((s,p)=>s+divCLP(p,uf),0);
            const contMes=rentals.reduce((s,p)=>s+contribMes(p),0);

            const egrMes=divMes+contMes+segMes+gastMes;
            const utMes=utilidadTotal;
            const margen=ingMes>0?utMes/ingMes*100:0;
            const yNeto=patrimonio>0?utMes*12/patrimonio*100:0;
            const yBruto=patrimonio>0?ingMes*12/patrimonio*100:0;
            const totalArr=rentals.length; const ocupadas=rentals.filter(p=>!estaDisponible(p)).length;
            const ocupacion=totalArr?ocupadas/totalArr*100:0;
            const deudaCLP=deudaHipTotalUF*uf;
            const esperado=rentals.reduce((s,p)=>s+montoCobro(p),0);
            const cobrado=rentals.filter(p=>p.status==="pagado").reduce((s,p)=>s+montoCobro(p),0);
            const morosidad=rentals.filter(p=>p.status==="atrasado").reduce((s,p)=>s+montoCobro(p),0);
            const cobradoPct=esperado>0?cobrado/esperado*100:0;
            const ranking=[...rentals].sort((a,b)=>utilidadMes(b,uf)-utilidadMes(a,uf));
            // Cada categoría ya tiene su propia fila con etiqueta: no necesitan
            // matices distintos, solo una rampa de grises para que la barra se
            // note sobre el fondo.
            const cats=[{l:"Dividendo hipotecario",v:divMes,c:"#101012"},{l:"Contribuciones",v:contMes,c:"#48484A"},{l:"Seguros",v:segMes,c:"#8E8E93"},{l:"Gastos operacionales",v:gastMes,c:"#C7C7CC"}];
            const maxCat=Math.max(1,...cats.map(c=>c.v));
            const pct=(n)=>(n>=0?"":"")+ (n||0).toLocaleString("es-CL",{minimumFractionDigits:1,maximumFractionDigits:1})+"%";
            const kget=(u)=>u>=0?"var(--green-d)":"var(--red-d)";
            return (<>
              <div className="sec-title" style={{fontSize:19,marginTop:4}}>Panel financiero del mes · {MESES_L[new Date().getMonth()]} {new Date().getFullYear()}</div>
              <div className="grid c4" style={{gridTemplateColumns:"repeat(4,1fr)",gap:12}}>
                <div className="stat" style={{borderTopColor:"var(--green)"}}><div className="lab">Ingresos / mes</div><div className="val" style={{color:"var(--green-d)"}}>{CLP(ingMes)}</div><div className="sub" style={{color:"var(--muted)"}}>{totalArr} arriendo(s)</div></div>
                <div className="stat" style={{borderTopColor:"var(--red)"}}><div className="lab">Egresos / mes</div><div className="val" style={{color:"var(--red-d)"}}>{CLP(egrMes)}</div><div className="sub" style={{color:"var(--muted)"}}>Div. + contrib. + seg. + gastos</div></div>
                <div className="stat" style={{borderTopColor:utMes>=0?"var(--green)":"var(--red)"}}><div className="lab">Utilidad neta / mes</div><div className="val" style={{color:kget(utMes)}}>{CLP(utMes)}</div><div className="sub" style={{color:"var(--muted)"}}>Margen {pct(margen)}</div></div>
                <div className="stat" style={{borderTopColor:"var(--line)"}}><div className="lab">Proyección anual</div><div className="val" style={{color:kget(utMes)}}>{CLP(utMes*12)}</div><div className="sub" style={{color:"var(--muted)"}}>Acumulado {CLP(utMes*mesesTranscurridos())}</div></div>
              </div>
              <div className="grid c4" style={{gridTemplateColumns:"repeat(4,1fr)",gap:12}}>
                <div className="stat" style={{borderTopColor:"var(--brand)"}}><div className="lab">Rentabilidad neta anual</div><div className="val" style={{color:kget(yNeto)}}>{pct(yNeto)}</div><div className="sub" style={{color:"var(--muted)"}}>Bruta {pct(yBruto)}</div></div>

          <Collapsible icon="💵" title="Liquidación mensual al propietario" defaultOpen={true}>
            <div className="help">Genera <b>automáticamente</b> la liquidación del mes para cada propietario: arriendos cobrados, comisión de administración, gastos pagados por su cuenta y el <b>líquido a transferir</b>. Descárgala en PDF o Word y envíala por WhatsApp. Es el documento que más valoran los propietarios.</div>
            {/* En palabras simples: es lo que más costaba entender de esta sección. */}
            <Collapsible icon="❓" title="¿Qué significa cada cosa? (explicado simple)" defaultOpen={false}>
              <div className="help" style={{marginBottom:10}}>
                La liquidación mensual es la <b>cuenta del mes</b> que se le entrega al dueño de la propiedad: cuánta plata entró por el arriendo,
                cuánto se descontó y cuánto se le deposita. Nada más que eso.
              </div>
              <div className="expl-lista">
                <div><b>💰 Cobrado</b> — el arriendo que el arrendatario <b>efectivamente pagó</b> ese mes. Si el arriendo está en UF, es la UF convertida a pesos con la regla del contrato. Si no pagó, aparece en $0 y el estado queda como <b>Pendiente</b>.</div>
                <div><b>🧾 Comisión de administración (%)</b> — es <b>tu pago</b> por administrar la propiedad. Se calcula como un porcentaje del arriendo cobrado. Ejemplo: si el arriendo es $600.000 y la comisión es 8%, la comisión es <b>$48.000</b>. En Chile lo habitual es entre <b>5% y 10%</b>. Si tú mismo eres el dueño y no cobras administración, deja el campo en <b>0</b> y no se descuenta nada.</div>
                <div><b>🔧 Gastos</b> — lo que se pagó <b>por cuenta del propietario</b> durante el mes: reparaciones, gasto común, contribuciones, seguros, mantenciones. Son gastos que salieron del arriendo antes de depositarle.</div>
                <div><b>🏦 Líquido a transferir</b> — lo que finalmente se le deposita al propietario: <b>Cobrado − Comisión − Gastos</b>. Si sale en rojo, significa que los gastos del mes fueron mayores que el arriendo cobrado y el propietario tiene que poner la diferencia.</div>
                <div><b>📅 Mes</b> — el período que se está liquidando. <b>Propietario / sociedad</b> — para quién es esta liquidación; puedes hacer una por sociedad o una sola con todas.</div>
              </div>
              <div className="help g" style={{marginTop:10}}>Ejemplo completo: arriendo cobrado $600.000 · comisión 8% = $48.000 · gastos del mes $35.000 → <b>líquido a transferir $517.000</b>. Esa es la cifra que se le deposita al propietario ese mes. La explicación larga está también en <b>Preguntas frecuentes</b>.</div>
            </Collapsible>
            <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"flex-end",margin:"12px 0"}}>
              <div className="field" style={{maxWidth:180}}><label className="label">Mes</label><input className="input" type="month" value={liqMes} onChange={e=>setLiqMes(e.target.value)}/></div>
              <div className="field" style={{maxWidth:260}}><label className="label">Propietario / sociedad</label><select value={liqSoc} onChange={e=>setLiqSoc(e.target.value)}><option value="todas">Todas las sociedades</option>{socs.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select></div>
              <div className="field" style={{maxWidth:230}}>
                <label className="label">Comisión admin. (%)</label>
                <input className="input" type="number" step="any" value={comisionAdmin} onChange={e=>setComisionAdmin(num(e.target.value))}/>
                <div style={{fontSize:12,color:"var(--muted)",marginTop:4}}>Lo que cobras por administrar, como % del arriendo. Si no cobras, deja 0.</div>
              </div>
            </div>
            {(()=>{ const {rows,tot}=liquidacionData(liqSoc,liqMes); return (<>
              <div style={{overflowX:"auto"}}><table><thead><tr><th>Propiedad</th><th>Arrendatario</th><th>Estado</th>
                <th title="El arriendo que el arrendatario efectivamente pagó este mes.">Cobrado</th>
                <th title="Lo que cobras por administrar: el porcentaje de arriba aplicado al arriendo cobrado.">Comisión</th>
                <th title="Lo pagado por cuenta del propietario: reparaciones, gasto común, contribuciones, seguros.">Gastos</th>
                <th title="Cobrado − Comisión − Gastos: lo que se le deposita al propietario.">Líquido a transferir</th></tr></thead><tbody>
                {rows.map(r=>(<tr key={r.p.id}><td style={{fontWeight:700}}>{r.p.name}</td><td>{r.p.tenant||"—"}</td><td>{r.pagado?<span className="pill green">Pagado</span>:<span className="pill amber">Pendiente</span>}</td><td style={{color:"var(--green-d)",fontWeight:700}}>{CLP(r.bruto)}</td><td style={{color:"var(--red-d)"}}>{CLP(r.com)}</td><td style={{color:"var(--red-d)"}}>{CLP(r.gastos)}</td><td style={{fontWeight:800,color:r.liquido>=0?"var(--green-d)":"var(--red-d)"}}>{CLP(r.liquido)}</td></tr>))}
                {rows.length===0 && <tr><td colSpan="7" style={{color:"var(--muted)"}}>Sin propiedades en arriendo para esta selección.</td></tr>}
              </tbody><tfoot><tr style={{borderTop:"2px solid var(--line)"}}><td colSpan="3" style={{fontWeight:800}}>TOTAL</td><td style={{fontWeight:800,color:"var(--green-d)"}}>{CLP(tot.bruto)}</td><td style={{fontWeight:800,color:"var(--red-d)"}}>{CLP(tot.com)}</td><td style={{fontWeight:800,color:"var(--red-d)"}}>{CLP(tot.gastos)}</td><td style={{fontWeight:800,color:tot.liquido>=0?"var(--green-d)":"var(--red-d)"}}>{CLP(tot.liquido)}</td></tr></tfoot></table></div>
              <div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:14}}>
                <button className="btn btn-red btn-sm" onClick={verLiquidacion}>Ver / Imprimir liquidación (PDF)</button>
                <button className="btn btn-out btn-sm" onClick={descargarLiquidacionWord}>Descargar Word</button>
                <button className="btn btn-out btn-sm" onClick={liquidacionWhatsApp}>Enviar por WhatsApp</button>
              </div>
            </>); })()}
          </Collapsible>

          <Collapsible icon="📈" title="Reajuste de arriendo — IPC y UF (contratos en pesos)" defaultOpen={false}>
            <div className="help">Reajusta los <b>contratos pactados en pesos</b> según su índice: <b>IPC</b> o <b>UF</b> (cada uno por separado). Define el índice de cada contrato en su ficha (campo “reajuste”). Abajo ves los contratos, cuánto tiempo llevan desde el último reajuste, la propuesta de nuevo arriendo y aplicas el reajuste con un clic (queda registrado en la bitácora). Los arriendos pactados en UF ya se reajustan solos con el valor diario de la UF.</div>
            <div className="grid c3" style={{gridTemplateColumns:"repeat(3,1fr)",gap:12,margin:"12px 0"}}>
              <div className="field"><label className="label">IPC acumulado del período (%)</label><input className="input" type="number" step="any" value={ipcAcum} onChange={e=>setIpcAcum(num(e.target.value))}/></div>
              <div className="field"><label className="label">Variación UF del período (%)</label><input className="input" type="number" step="any" value={ufVarAnual} onChange={e=>setUfVarAnual(num(e.target.value))}/></div>
              <div className="field"><label className="label">Período de reajuste (meses)</label><input className="input" type="number" value={reajPeriodo} onChange={e=>setReajPeriodo(parseInt(num(e.target.value))||12)}/></div>
            </div>
            {(()=>{ const list=reajustables(); return list.length? (
              <div style={{overflowX:"auto"}}><table><thead><tr><th>Propiedad</th><th>Índice</th><th>Arriendo actual</th><th>Desde último reajuste</th><th>Nuevo arriendo propuesto</th><th>Variación</th><th>Acción</th></tr></thead><tbody>
                {list.map(p=>{ const info=reajusteInfo(p); return (<tr key={p.id}>
                  <td style={{fontWeight:700}}>{p.name}<div style={{fontSize:12,color:"var(--muted)"}}>{p.tenant||"—"}</div></td>
                  <td><span className={"pill "+(info.tipo==="UF"?"blue":"amber")}>{info.tipo}</span></td>
                  <td style={{fontWeight:700}}>{CLP(num(p.rent))}</td>
                  <td>{info.meses==null?"—":info.meses+" mes(es)"} {info.due&&<span className="pill red">Corresponde</span>}</td>
                  <td style={{fontWeight:800}}>{CLP(info.nuevo)}</td>
                  <td style={{color:info.delta>=0?"var(--green-d)":"var(--red-d)",fontWeight:700}}>{info.delta>=0?"+":""}{CLP(info.delta)}<div style={{fontSize:11,color:"var(--faint)"}}>{info.tipo} {info.pct>=0?"+":""}{info.pct}%</div></td>
                  <td><button className={"btn btn-sm "+(info.due?"btn-green":"btn-out")} onClick={()=>applyReajuste(p.id)}>Aplicar</button></td>
                </tr>); })}
              </tbody></table></div>
            ) : <div className="help" style={{marginBottom:0}}>No hay contratos en pesos. Los arriendos en <b>UF</b> se reajustan automáticamente con el valor de la UF.</div>; })()}
          </Collapsible>

          <Collapsible icon="🏦" title="Dividendos hipotecarios" defaultOpen={true}>
            <div style={{overflowX:"auto"}}><table><thead><tr><th>Propiedad</th><th>Banco</th><th>Dividendo UF</th><th>Dividendo CLP hoy</th><th>Pagados</th><th>Por pagar</th><th>Avance</th></tr></thead><tbody>
              {props.filter(p=>p.hasMortgage).map(p=>{ const pct=Math.round(num(p.dividendosPagados)/Math.max(1,num(p.dividendosTotales))*100); return (<tr key={p.id}>
                <td style={{fontWeight:700}}>{p.name}{p.use==="personal"&&<span className="pill blue" style={{marginLeft:6}}>Personal</span>}</td><td>{p.mortgageBank}</td><td style={{fontWeight:700}}>{UFf(p.dividendoUF)}</td>
                <td style={{fontWeight:800,color:"var(--red-d)"}}>{CLP(divCLP(p,uf))}</td><td style={{color:"var(--green-d)",fontWeight:700}}>{p.dividendosPagados}</td><td style={{color:"var(--red-d)",fontWeight:700}}>{divPorPagar(p)}</td>

              </tr>); })}
              {props.filter(p=>p.hasMortgage).length===0 && <tr><td colSpan="7" style={{color:"var(--muted)"}}>No hay propiedades con crédito hipotecario.</td></tr>}
            </tbody></table></div>
          </Collapsible>

          <Collapsible icon="📊" title="Utilidad por propiedad (ingresos − todos los gastos)" defaultOpen={true}>
            <div className="help" style={{marginBottom:12}}>La utilidad usa <b>todos los ingresos</b> (arriendo + ingresos extra) y <b>todos los gastos</b> de cada propiedad. Edita los ingresos y gastos abajo y la utilidad mensual y anual se actualizan solas.</div>
            <div style={{overflowX:"auto"}}><table><thead><tr><th>Propiedad</th><th>Ingreso/mes</th><th>Dividendo</th><th>Contrib./mes</th><th>Seguro/mes</th><th>Otros gastos/mes</th><th>Utilidad / mes</th><th>Utilidad / año</th></tr></thead><tbody>

                <td style={{color:"var(--green-d)",fontWeight:700}}>{CLP(ingresoMes(p))}</td><td style={{color:"var(--red-d)"}}>{CLP(divCLP(p,uf))}</td>
                <td style={{color:"var(--red-d)"}}>{CLP(contribMes(p))}</td><td style={{color:"var(--red-d)"}}>{CLP(seguroMes(p))}</td>

            <div className="grid c3" style={{gridTemplateColumns:"repeat(3,1fr)",gap:12,marginTop:14}}>

          {/* Utilidad por año */}
          <Collapsible icon="📅" title="Utilidad de la propiedad por año" defaultOpen={false}>
            <div className="help" style={{marginBottom:12}}>Elige un año para ver la utilidad de cada propiedad. Se muestran los <b>ingresos realmente cobrados</b> de ese año (según el historial de pagos) y los gastos estimados anuales. Para el año en curso también ves cuánta utilidad llevas <b>acumulada hasta la fecha</b>.</div>
            {(()=>{ const anioActual=new Date().getFullYear();
              const anios=[]; for(let y=anioActual-4;y<=anioActual+1;y++) anios.push(y);
              const esActual = yearUtil===anioActual; const meses = esActual ? mesesTranscurridos() : (yearUtil<anioActual?12:0);
              let totReal=0, totGasto=0, totProy=0;
              return (<>
                <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
                  {anios.map(y=><button key={y} className={"btn btn-sm "+(yearUtil===y?"btn-red":"btn-out")} onClick={()=>setYearUtil(y)}>{y}{y===anioActual?" (actual)":""}</button>)}
                </div>
                <div style={{overflowX:"auto"}}><table><thead><tr><th>Propiedad</th><th>Cobrado real {yearUtil}</th><th>Ingreso estimado/año</th><th>Gastos estimados/año</th><th>Utilidad proyectada/año</th>{esActual&&<th>Acumulado a la fecha</th>}</tr></thead><tbody>
                  {props.map(p=>{ const real=ingresosRealesAnio(p,yearUtil); const ingAnual=ingresoMes(p)*12; const gastoAnual=egresosMes(p,uf)*12; const proy=utilidadAnual(p,uf); const acum=utilidadMes(p,uf)*meses; totReal+=real; totGasto+=gastoAnual; totProy+=proy; const abierto=expUtil===p.id; const gMes=egresosMes(p,uf); const iMes=ingresoMes(p,uf); return (<React.Fragment key={p.id}>
                    <tr style={{cursor:"pointer"}} onClick={()=>setExpUtil(abierto?null:p.id)}>
                    <td style={{fontWeight:700}}><span style={{display:"inline-block",width:16,color:"var(--muted)"}}>{abierto?"▾":"▸"}</span>{p.name}{p.use==="personal"&&<span className="pill blue" style={{marginLeft:6}}>Personal</span>}</td>
                    <td style={{color:"var(--green-d)",fontWeight:700}}>{real>0?CLP(real):"—"}</td>
                    <td style={{color:"var(--muted)"}}>{CLP(ingAnual)}</td>
                    <td style={{color:"var(--red-d)"}}>{CLP(gastoAnual)}</td>
                    <td style={{fontWeight:800,color:proy>=0?"var(--green-d)":"var(--red-d)"}}>{CLP(proy)}</td>
                    {esActual&&<td style={{fontWeight:700,color:acum>=0?"var(--green-d)":"var(--red-d)"}}>{CLP(acum)}</td>}
                  </tr>

            return htmlDoc("Informe ArriendoPro", `<h1>Informe de propiedades · ArriendoPro</h1><div class='muted'>Generado el ${todayISO()} · UF usada hoy: ${CLP(uf)} · Propietario: ${esc(owner.name||"")}</div>`+
              `<table style='margin-top:10px'><tr><th>Ingresos arriendo/mes</th><td>${fmt(ingresos)}</td><th>Dividendos/mes</th><td>${fmt(dividendos)}</td><th>Utilidad neta/mes</th><td>${fmt(utilidadTotal)}</td></tr></table>`+
              sec("Estado de cartera (ingresos, gastos y utilidad)",carteraHead,carteraRows,carteraTot)+
              sec("Dividendos hipotecarios y deuda",divHead,divRows)+
              sec("Contribuciones y seguros",segHead,segRows)); };
          const buildCSV=(h,r,tot)=>{ const all=[h,...r]; if(tot) all.push(tot); return "\ufeff"+all.map(row=>row.map(c=>`"${String(c==null?"":c).replace(/"/g,'""')}"`).join(";")).join("\r\n"); };
          const xlsTable=(h,r,tot)=>htmlDoc("Informe","<table><tr>"+h.map(c=>"<th>"+esc(c)+"</th>").join("")+"</tr>"+r.map(row=>"<tr>"+row.map(c=>"<td>"+esc(c)+"</td>").join("")+"</tr>").join("")+(tot?"<tr>"+tot.map(c=>"<td>"+esc(c)+"</td>").join("")+"</tr>":"")+"</table>");
          return (<>
          <div className="help">Genera informes profesionales y descárgalos en <b>Word</b>, <b>Excel</b>, <b>CSV</b> o <b>PDF</b>. El informe incluye estado de cartera (ingresos, gastos y utilidad), dividendos y deuda, y contribuciones y seguros.</div>

            <Data label="Seguros contratados / año (total)" value={CLP(props.reduce((s,p)=>s+(p.seguros||[]).reduce((a,x)=>a+Math.round(num(x.primaUF)*uf),0),0))}/>
            <Data label="Patrimonio (tasación)" value={CLP(patrimonio)}/>
          </div>
          <div className="card pad"><div className="sec-title">Informe completo (todas las secciones)</div>
            <div className="help" style={{marginBottom:12}}>Documento profesional con portada, resumen ejecutivo, indicadores, estado de la cartera, dividendos y deuda, análisis por sociedad y un detalle por cada propiedad. Ideal para tu contador, el banco o los dueños.</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
              <button className="btn btn-red" onClick={()=>descargarBlob("informe_arriendopro_"+todayISO()+".doc",buildHtml(),"application/msword")}>Descargar Word</button>
              <button className="btn btn-out" onClick={()=>descargarBlob("informe_cartera_"+todayISO()+".xls",xlsTable(carteraHead,carteraRows,carteraTot),"application/vnd.ms-excel")}>Descargar Excel (cartera)</button>
              <button className="btn btn-out" onClick={()=>descargarBlob("informe_cartera_"+todayISO()+".csv",buildCSV(carteraHead,carteraRows,carteraTot),"text/csv;charset=utf-8")}>Descargar CSV (cartera)</button>
              <button className="btn btn-out" onClick={()=>{ const w=window.open("","_blank"); if(w){ w.document.write(buildHtml()); w.document.close(); setTimeout(()=>w.print(),400);} else { notify("Permite ventanas emergentes para PDF",true);} }}>Imprimir / PDF</button>
            </div>
          </div>
          <div className="card pad"><div className="sec-title">Informe por propiedad (detallado)</div>
            <div className="help" style={{marginBottom:12}}>Informe profesional de <b>una propiedad</b>: identificación legal, situación de arriendo, antecedentes del arrendatario (InfoCheck y Equifax), crédito hipotecario, gastos, seguros, incidencias y rentabilidad. Perfecto para el dueño, el banco o tu contador.</div>
            <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
              <select className="input" style={{maxWidth:320}} value={repProp} onChange={e=>setRepProp(e.target.value)}>

                {props.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
              <button className="btn btn-red" disabled={!repProp} onClick={()=>{ const p=props.find(x=>String(x.id)===String(repProp)); if(p) abrirImprimir(informePropHTML(p)); }}>Ver / Imprimir (PDF)</button>
              <button className="btn btn-out" disabled={!repProp} onClick={()=>{ const p=props.find(x=>String(x.id)===String(repProp)); if(p) descargarBlob("informe_"+(p.name||"propiedad").replace(/[^a-z0-9]+/gi,"_")+"_"+todayISO()+".doc",informePropHTML(p),"application/msword"); }}>Descargar Word</button>
            </div>
          </div>
          <div className="card pad"><div className="sec-title">Informes individuales</div>
            <div className="grid c3" style={{gridTemplateColumns:"repeat(3,1fr)"}}>
              {[
                ["","Estado de cartera","Ingresos, gastos y utilidad",carteraHead,carteraRows,carteraTot,"cartera"],
                ["","Dividendos y deuda","Avance del crédito",divHead,divRows,null,"dividendos"],
                ["","Contribuciones y seguros","Pólizas y pagos",segHead,segRows,null,"contrib_seguros"]
              ].map((r,i)=>(
                <div key={i} className="card pad" style={{background:"var(--panel2)",border:"1px solid var(--line)"}}>
                  <div style={{fontSize:22}}>{r[0]}</div><div style={{fontWeight:800,fontSize:15,marginBottom:2}}>{r[1]}</div><div style={{fontSize:13,color:"var(--muted)",marginBottom:10}}>{r[2]}</div>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    <button className="btn btn-out btn-sm" onClick={()=>descargarBlob(r[6]+"_"+todayISO()+".xls",xlsTable(r[3],r[4],r[5]),"application/vnd.ms-excel")}>Excel</button>
                    <button className="btn btn-out btn-sm" onClick={()=>descargarBlob(r[6]+"_"+todayISO()+".csv",buildCSV(r[3],r[4],r[5]),"text/csv;charset=utf-8")}>CSV</button>
                    <button className="btn btn-out btn-sm" onClick={()=>descargarBlob(r[6]+"_"+todayISO()+".doc",htmlDoc(r[1],"<h1>"+esc(r[1])+"</h1><div class='muted'>"+todayISO()+"</div><table><tr>"+r[3].map(c=>"<th>"+esc(c)+"</th>").join("")+"</tr>"+r[4].map(row=>"<tr>"+row.map(c=>"<td>"+esc(c)+"</td>").join("")+"</tr>").join("")+(r[5]?"<tr style='font-weight:bold'>"+r[5].map(c=>"<td>"+esc(c)+"</td>").join("")+"</tr>":"")+"</table>"),"application/msword")}>Word</button>
                  </div>
                </div>))}
            </div>
          </div>
        </>); })()}

        {/* ============ CONFIGURACIÓN ============ */}

            <div style={{fontSize:14.5,color:"var(--muted)",lineHeight:1.55,marginBottom:10}}>Lo que funciona hoy son los <b>accesos con clave</b>: le creas una clave a tu mamá o a tu contador, eliges si pueden solo mirar o también modificar, y entran con esa clave. Lo de más abajo (invitaciones por correo) queda para cuando conectemos el envío de correos.</div>

              <div className="field"><label className="label">Rol en la plataforma</label><select className="input" value={invForm.rol} onChange={e=>setInvForm(f=>({...f,rol:e.target.value}))}>{Object.keys(ROLES_INFO).map(r=><option key={r} value={r}>{ROLES_INFO[r].label}</option>)}</select></div>
              {invForm.rol==="arrendatario"&&<div className="field"><label className="label">Propiedad que arrienda</label><select className="input" value={invForm.propiedadId} onChange={e=>setInvForm(f=>({...f,propiedadId:e.target.value}))}><option value="">— Elegir propiedad —</option>{props.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>}

              }}>Agregar al equipo</button>
              <div style={{fontSize:13,color:"var(--muted)"}}>La persona activa su cuenta validando el correo con un código de 6 dígitos y creando una contraseña segura.</div>
            </div>

                  <div style={{minWidth:0}}>
                    <div style={{fontWeight:700,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>{u.nombre||"(sin nombre)"} <span className={"rol-pill rol-"+u.rol}>{(ROLES_INFO[u.rol]||{}).label||u.rol}</span> {u.passHash?<span className="pill green">Cuenta activa</span>:<span className="pill amber">Invitación pendiente</span>}{u.id===usuarioActual.id&&<span className="pill grey">Tú</span>}</div>

                  {u.rol==="arrendatario"&&<select className="input" style={{padding:"7px 9px",width:"auto",maxWidth:190}} value={u.propiedadId||""} onChange={e=>setUsuarios(us=>us.map(x=>x.id===u.id?{...x,propiedadId:e.target.value}:x))}><option value="">— propiedad —</option>{props.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select>}
                  <button className="btn btn-danger btn-sm" onClick={()=>{ if(confirm("¿Quitar a "+(u.nombre||u.email)+" del equipo? Ya no podrá entrar.")) setUsuarios(us=>us.filter(x=>x.id!==u.id)); }}>Quitar</button>

            <div className="card pad" style={{marginTop:14,background:"var(--green-bg)",border:"none"}}><div style={{fontSize:13,fontWeight:700,color:"var(--muted)",marginBottom:6}}>VISTA PREVIA — lo que ven tus arrendatarios</div>

          </Collapsible>
          <Collapsible icon="📈" title="Reajuste de los arriendos" subtitle="UF o IPC, y cada cuánto se revisa" defaultOpen={false}>

            <div className="grid c2" style={{gridTemplateColumns:"1fr 1fr"}}>
              <div className="field"><label className="label">Con qué UF se cobra</label>
                <select value={ownerEdit.reglaUF||"dia_pago"} onChange={e=>setOwnerEdit(o=>({...o,reglaUF:e.target.value}))}>
                  {REGLAS_UF.map(m=><option key={m.v} value={m.v}>{m.l}</option>)}
                </select>
              </div>
              <div className="field"><label className="label">Reajuste por omisión</label>
                <select value={ownerEdit.reajusteModo||"UF"} onChange={e=>setOwnerEdit(o=>({...o,reajusteModo:e.target.value}))}>
                  {REAJUSTE_MODOS.map(m=><option key={m.v} value={m.v}>{m.l}</option>)}
                </select>
              </div>
              <div className="field"><label className="label">Revisión por omisión (IPC o %)</label>
                <select value={ownerEdit.reajustePeriodo||12} onChange={e=>setOwnerEdit(o=>({...o,reajustePeriodo:parseInt(e.target.value)||12}))}>
